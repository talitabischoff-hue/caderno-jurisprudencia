 deficiência o direito à\njornada de trabalho reduzida, **sem necessidade de compensação de\nhorário ou redução de vencimento**s, nos moldes previstos para os\nservidores públicos federais na Lei nº 8.112/90. (RE 1237867)\n\nArt. 98 (\\...) § 2º Também será concedido horário especial ao servidor\nportador de deficiência, quando comprovada a necessidade por junta\nmédica oficial, independentemente de compensação de horário. § 3º As\ndisposições constantes do § 2º são extensivas ao servidor que tenha\ncônjuge, filho ou dependente com deficiência. **(CAIU NA 2ª FASE\nTJMS/FGV) (FGV-TJSC-JUIZ/2024) (FGV-ENAM-MANAUS/2024)**","refs":["1097"]},{"id":"rg_2022_1199","tema":"1199","texto":"TEMA 1199: 1) É <strong>necessária a comprovação</strong> de\nresponsabilidade <strong>subjetiva</strong> para a tipificação dos atos de\nimprobidade administrativa, exigindo-se - nos artigos 9º, 10 e 11 da\nLIA - a presença do elemento subjetivo - <strong>DOLO</strong>; 2) A norma benéfica\nda Lei 14.230/2021 - revogação da modalidade culposa do ato de\nimprobidade administrativa -, é <strong>IRRETROATIVA</strong>, em virtude do artigo\n5º, inciso XXXVI, da Constituição Federal, [não tendo incidência em\nrelação à eficácia da coisa julgada; nem tampouco durante o processo de\nexecução das penas e seus incidentes;] 3) A nova Lei\n14.230/2021 aplica-se aos atos de improbidade administrativa culposos\npraticados na vigência do texto anterior da lei, [porém sem condenação\ntransitada em julgado,] em virtude da revogação expressa do\ntexto anterior; devendo o juízo competente analisar eventual dolo por\nparte do agente; 4) O novo regime prescricional previsto na Lei\n14.230/2021 é <strong>IRRETROATIVO</strong>, aplicando-se os novos marcos temporais a\npartir da publicação da lei. (ARE 843989) **(FGV/2023 - 2 VEZES)\n(FGV/2024 - 2 VEZES) (FGV-TJSC-JUIZ/2024) (FGV-PREF DE\nGUARAGUATATUBA-SP-PROC/2024) (FGV-ENAM/2024)**\n(**FGV-ALPR-PROCURADOR/2024) (FGV-CMV/2024) (FGV-TJSC-ANALISTA\nJURÍDICO/2024) (FGV-TRF1- JUIZ/2023) (CESPE-DPEAC-DEFENSOR/2024)\n(FGV-TCEGO-ANALISTA/2024)<strong> </strong>(FGV-TCE/PA-AUDITOR/2024)**\n<strong>(FGV-TJSC-JUIZ/2024.2) (VUNESP-PCSP-DELEGADO/2023)</strong>","refs":["1199"]},{"id":"rg_2022_1157","tema":"1157","texto":"TEMA 1157: É <strong>vedado</strong> o reenquadramento, em novo\nPlano de Cargos, Carreiras e Remuneração, de **servidor admitido sem\nconcurso** público antes da promulgação da Constituição Federal de 1988,\nmesmo que beneficiado pela estabilidade excepcional do\nartigo 19 do ADCT, haja vista que esta regra transitória não prevê o\ndireito à efetividade, nos termos do artigo 37, II, da Constituição\nFederal e decisão proferida na ADI 3609 (Rel. Min. DIAS TOFFOLI,\nTribunal Pleno, DJe. 30/10/2014).","refs":["1157"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2022_1238","tema":"1238","texto":"TEMA 1238: São <strong>inadmissíveis</strong>, em processos\nadministrativos de qualquer espécie, provas consideradas <strong>ilícitas</strong>\npelo Poder Judiciário. (ARE 1316369) **(FGV-PCSC-PSICÓLOGO/2024)\n(FGV-ENAM 2/2024) ] [(FGV-PCMG-DELEGADO/2025)**","refs":["1238"]},{"id":"rg_2022_0919","tema":"0919","texto":"TEMA 0919: A instituição de taxa de fiscalização do\nfuncionamento de torres e antenas de transmissão e recepção de dados e\nvoz é de <strong>competência privativa da União</strong>, nos termos do art. 22, IV,\nda Constituição Federal, <strong>não competindo aos Municípios</strong> instituir\nreferida taxa. (RE 776594) **(FGV-TJGO-JUIZ/2023)\n(VUNESP-MPRJ-PROMOTOR/2024)**","refs":["0919"]},{"id":"rg_2022_0970","tema":"0970","texto":"TEMA 0970: É <strong>constitucional</strong> - formal e\nmaterialmente - <strong>lei municipal que obriga</strong> à [substituição de sacos e\nsacolas] plásticos por sacos e sacolas biodegradáveis. (RE\n732686) <strong>(FGV/2024) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)</strong>\n\n<strong>TEMA 0922</strong>: É <strong>inconstitucional</strong> o condicionamento da\ndesfiliação de associado à quitação de débito referente a benefício\nobtido por intermédio da associação ou ao pagamento de multa. (RE\n820823) <strong>(FGV-JUIZ DO TRABALHO/2023)</strong>","refs":["0922","0970"]},{"id":"rg_2022_0548","tema":"0548","texto":"TEMA 0548: 1. A <strong>educação básica</strong> em todas as suas\nfases - educação infantil, ensino fundamental e ensino médio - constitui\ndireito fundamental de todas as crianças e jovens, **[assegurado por\nnormas constitucionais de eficácia plena e aplicabilidade direta e\nimediata]<strong>. 2. A </strong>educação infantil<strong> compreende </strong>creche\n(de zero a 3 anos) e a pré-escola (de 4 a 5 anos)**. Sua oferta pelo\nPoder Público pode ser exigida individualmente, como no caso examinado\nneste processo. 3. O Poder Público tem o **dever jurídico de dar\nefetividade integral** às normas constitucionais sobre acesso à educação\nbásica. (RE 1.008.166) **(FGV-DPERJ-DEFENSOR/2023)\n(VUNESP-MPERO-PROMOTOR/2024) (FGV-TJGO-JUIZ/2023)\n(VUNESP-MPRJ-PROMOTOR/2024) (FGV-TJPE-JUIZ/2024)**\n\n<strong>(ATENÇÃO:</strong> O cespe, na prova do CAPES-ANALISTA/2024 considerou a\nseguinte afirmativa correta: [A norma constitucional que prevê o direito\nà educação como um direito social é uma norma de eficácia limitada do\ntipo programática. Só um alerta para não confundir. Ao que parece, o\ncespe fundamenta no art. 205 da CF)]","refs":["0548"]},{"id":"rg_2022_1235","tema":"1235","texto":"TEMA 1235: É <strong>inconstitucional</strong> a Lei 13.756/2004 do\nMunicípio de São Paulo, por configurar invasão à competência privativa\nda União para legislar sobre telecomunicações e radiodifusão (artigo 22,\nIV, da Constituição Federal). (ARE 1370232) <strong>(FGV-TJPR/2023)</strong>\n\n<strong>TEMA 1063</strong>: Os Advogados da União <strong>não possuem</strong>\ndireito a férias de 60 (sessenta) dias, nos termos da legislação\nconstitucional e infraconstitucional vigentes.","refs":["1235","1063"]},{"id":"rg_2022_1231","tema":"1231","texto":"TEMA 1231:(I) As unidades federadas <strong>podem fixar</strong> os\nlimites das respectivas requisições de **pequeno valor em patamares\ninferiores **aos previstos no artigo 87 do ADCT, [desde\nque] o façam em consonância com sua capacidade econômica.\n(II) A aferição da capacidade econômica, para este fim, deve refletir\nnão somente a receita, mas igualmente os graus de endividamento e de\nlitigiosidade do ente federado. (III) A ausência de demonstração\nconcreta da desproporcionalidade na fixação do teto das requisições de\npequeno valor impõe a deferência do Poder Judiciário ao juízo\npolítico-administrativo externado pela legislação local. (RE 1359139)\n<strong>(FGV-TJMS/2023) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2024)</strong>","refs":["1231"]},{"id":"rg_2022_0900","tema":"0900","texto":"TEMA 0900: É <strong>defeso</strong> o pagamento de remuneração em\nvalor inferior ao salário mínimo ao servidor público, <strong>ainda que</strong>\nlabore em jornada reduzida de trabalho. (RE 964659) (INFO 1062)\n**(FGV/2023 - 02 vezes) (FGV-FHEMIG-ANALISTA/2023)\n(FGV-PCMG-DELEGADO/2025)**","refs":["0900"]},{"id":"rg_2022_0638","tema":"0638","texto":"TEMA 0638: A intervenção sindical prévia é exigência\nprocedimental imprescindível para a dispensa em massa de\ntrabalhadores, que não se confunde com autorização prévia\npor parte da entidade sindical ou celebração de convenção ou acordo\ncoletivo. (RE 999435) (INFO 1058) **(FGV-JUIZ DO TRABALHO/2023)\n(FGV-TRT24-ANALISTA/2025)**","refs":["0638"]},{"id":"rg_2022_1046","tema":"1046","texto":"TEMA 1046: São <strong>constitucionais</strong> os acordos e as\nconvenções coletivos que, ao considerarem a adequação setorial\nnegociada, pactuam limitações ou afastamentos de direitos trabalhistas,\nindependentemente da explicitação especificada de vantagens\ncompensatórias, desde que respeitados os direitos absolutamente\nindisponíveis.","refs":["1046"]},{"id":"rg_2022_1182","tema":"1182","texto":"TEMA 1182: À luz do art. 227 da CF, que confere\nproteção integral da criança com absoluta prioridade e do princípio da\npaternidade responsável, a <strong>licença maternidade,</strong> prevista no art. 7º,\nXVIII, da CF/88 e regulamentada pelo art. 207 da Lei 8.112/1990,\n<strong>estende-se ao pai genitor monoparental. (FGV-TJGO-JUIZ/2023)</strong>","refs":["1182"]},{"id":"rg_2022_0559","tema":"0559","texto":"TEMA 0559: A EC nº 57/08 <strong>não convalidou</strong>\n<strong>desmembramento</strong> municipal realizado s<strong>em consulta plebiscitária</strong> e,\nnesse contexto, não retirou o vício de ilegitimidade ativa\nexistente nas execuções fiscais que haviam sido propostas por município\nao qual fora acrescida, sem tal consulta, área de outro para a [cobrança\ndo IPTU] quanto a imóveis nela localizados. (RE 614384/SE)\n**(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023) (FGV-PREF DE CUIABÁ/MT-\nAUDITOR FISCAL/2024)**","refs":["0559"]},{"id":"rg_2022_1213","tema":"1213","texto":"TEMA 1213: É <strong>inconstitucional</strong> a contagem do tempo\npretérito à investidura no cargo efetivo, exercido **exclusivamente em\ncargo comissionado**, para fins de incorporação de quintos\ncomo VPNI, com fundamento no artigo 1º da Lei 15.138/2010 do Estado de\nSanta Catarina.\n\n<strong>TEMA 1207</strong>: A promoção por acesso de servidor a classe\ndistinta na carreira <strong>não representa ascensão</strong> a cargo diverso daquele\nem que já estava efetivado, de modo que, para fins de aposentadoria, o\nprazo mínimo de cinco anos no cargo efetivo, exigido pelo\nartigo 40, § 1º, inciso III, da Constituição Federal, na redação da\nEmenda Constitucional 20/1998, e pelos artigos 6º da Emenda\nConstitucional 41/2003 e 3º da Emenda Constitucional 47/2005, [não\nrecomeça a contar pela alteração de classe.] (RE 1322195)\n<strong>(FGV-TJSC-JUIZ/2022)</strong>","refs":["1213","1207"]},{"id":"rg_2022_0991","tema":"0991","texto":"TEMA 0991: <strong>Afronta</strong> o princípio da separação dos\npoderes a anulação judicial de cláusula de contrato de concessão firmado\npor Agência Reguladora e prestadora de serviço de telefonia que, em\nobservância aos marcos regulatórios estabelecidos pelo Legislador,\nautoriza a incidência de reajuste de alguns itens\ntarifários em percentual superior ao do índice\ninflacionário fixado, quando este <strong>não é superado</strong> pela média\nponderada de todos os itens. (RE 1059819) <strong>(FGV/2023)</strong>","refs":["0991"]},{"id":"rg_2022_0638","tema":"0638","texto":"TEMA 0638: A <strong>intervenção sindical prévia</strong> é\nexigência procedimental <strong>imprescindível</strong> para a dispensa em massa de\ntrabalhadores, que <strong>não se confunde com autorização prévia</strong> por parte\nda entidade sindical ou celebração de convenção ou acordo coletivo. (RE\n999435) (CESPE-DPEAC-DEFENSOR/2024)","refs":["0638"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2022_1102","tema":"1102","texto":"TEMA 1102: O segurado que implementou as condições\npara o benefício previdenciário após a vigência da Lei 9.876, de\n26.11.1999, e antes da vigência das novas regras constitucionais,\nintroduzidas pela EC 103/2019, tem o direito de optar pela regra\ndefinitiva, caso esta lhe seja mais favorável. (RE 1276977)","refs":["1102"]},{"id":"rg_2022_0465","tema":"0465","texto":"TEMA 0465: A Portaria n. 931/2005 do Ministério da\nDefesa, que alterou a fórmula de cálculo do auxílio-invalidez para os\nservidores militares, está em harmonia com os princípios da legalidade e\nda irredutibilidade de vencimentos. (RE 642890)","refs":["0465"]}]},"2021":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2021_0817","tema":"0817","texto":"TEMA 0817: É <strong>constitucional</strong> a lei estadual ou\ndistrital que, com amparo em convênio do CONFAZ, conceda [remissão de\ncréditos de ICMS] oriundos de benefícios fiscais\n<strong>anteriormente julgados inconstitucionais</strong>. (RE 851421)\n**(FGV-TJMS/2023) (FGV/2022) (FGV-ALTO-PROCURADOR/2024) (FGV-PREF DE\nCUIABÁ/MT-AUDITOR FISCAL/2024)**\n\n<strong>TEMA 0745:</strong> Adotada pelo legislador estadual a técnica\nda <strong>seletividade</strong> em relação ao Imposto sobre Circulação de\nMercadorias e Serviços (<strong>ICMS</strong>), discrepam do figurino constitucional\nalíquotas sobre as operações de energia elétrica e serviços de\ntelecomunicação em <strong>patamar superior</strong> ao das operações em geral,\nconsiderada a essencialidade dos bens e serviços. (RE\n714139) <strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2024)</strong>","refs":["0817","0745"]},{"id":"rg_2021_0988","tema":"0988","texto":"TEMA 0988: É <strong>imune</strong> ao pagamento de <strong>taxas</strong> para\nregistro da regularização migratória o <strong>estrangeiro</strong> que demonstre sua\ncondição de hipossuficiente, nos termos da legislação de\nregência. (RE 1018911)","refs":["0988"]},{"id":"rg_2021_0554","tema":"0554","texto":"TEMA 0554: O Fator Acidentário de Prevenção (FAP),\nprevisto no art. 10 da Lei nº 10.666/2003, nos moldes do regulamento\npromovido pelo Decreto 3.048/99 (RPS) atende ao princípio da legalidade\ntributária (art. 150, I, CRFB/88). (RE 677725)","refs":["0554"]},{"id":"rg_2021_0303","tema":"0303","texto":"TEMA 0303: É <strong>constitucional</strong> a [inclusão do valor\ndo IPI] incidente nas operações de venda feitas por\nfabricantes ou importadores de veículos [na base de cálculo\npresumida] fixada para propiciar, em regime de substituição\ntributária, a cobrança e o recolhimento antecipados, na forma do art. 43\nda Medida Provisória nº 2.158-35/2001, de contribuições para o PIS e da\nCofins devidas pelos comerciantes varejistas. (RE 605506)","refs":["0303"]},{"id":"rg_2021_1130","tema":"1130","texto":"TEMA 1130: **Pertence ao Município, aos Estados e ao\nDistrito Federal<strong> a titularidade das </strong>receitas** arrecadadas a título\nde imposto de renda <strong>retido na fonte</strong> incidente sobre valores pagos\npor eles, suas autarquias e fundações a pessoas físicas ou jurídicas\n<strong>contratadas para a prestação de bens ou serviços</strong>, conforme disposto\nnos arts. 158, I, e 157, I, da Constituição Federal. (RE 1293453)\n**(FGV-CÂMARA DE FORTALEZA-CONSULTOR/2024) (FGV-TJSC-JUIZ/2022)\n(FGV-ENAM 2/2024) (FGV-TRF1-JUIZ/2023) (FGV-PREF DE CANAÃ DOS\nCARAJÁS/PA-PROCURADOR/2025) (FGV-ENAM/2025)**\n\n<strong>TEMA 0962</strong>: É <strong>inconstitucional</strong> a incidência do IRPJ\ne da CSLL sobre os valores atinentes à taxa Selic\nrecebidos em razão de <strong>repetição de indébito tributário.</strong> (RE 1063187)\n**(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023) (FGV-CÂMARA DOS\nDEPUTADOS-CONSULTOR/2024) (FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(FGV-TJSC-JUIZ/2022)**\n\n<strong>TEMA 1135</strong>: É <strong>constitucional</strong> a inclusão do Imposto\nSobre Serviços de Qualquer Natureza -ISS na base de cálculo da\nContribuição Previdenciária sobre a Receita Bruta -- CPRB.\n\n<strong>TEMA 0304</strong>: São <strong>inconstitucionais</strong> os arts. 47 e 48\nda Lei 11.196/2005, que vedam a apuração de créditos de PIS/Cofins na\naquisição de insumos recicláveis.","refs":["1130","1135","0962","0304"]},{"id":"rg_2021_0185","tema":"0185","texto":"TEMA 0185: É <strong>constitucional</strong> o artigo 5º da Lei nº\n9.779/1999, no que <strong>autorizada a cobrança de Imposto de Renda</strong> sobre\nresultados financeiros verificados na liquidação de\ncontratos de swap para fins de hedge.","refs":["0185"]},{"id":"rg_2021_0705","tema":"0705","texto":"TEMA 0705: A inadimplência do usuário <strong>não afasta</strong> a\nincidência ou a exigibilidade do ICMS sobre serviços de\ntelecomunicações.\n\n<strong>TEMA 0364:</strong> É dos <strong>Estados e Distrito Federal</strong> a\n<strong>titularidade</strong> do que arrecadado, considerado Imposto de Renda,\nincidente na fonte, sobre rendimentos pagos, a qualquer título, por si,\nautarquias e fundações que instituírem e mantiverem. (RE\n607886)\n\n<strong>TEMA 0517</strong>: É <strong>constitucional</strong> a imposição tributária\nde <strong>diferencial de alíquota do ICMS</strong> pelo [Estado de destino na\nentrada de mercadoria] em seu território devido por\nsociedade empresária aderente ao <strong>Simples Nacional</strong>,\n<strong>independentemente</strong> da posição desta na cadeia produtiva ou da\npossibilidade de compensação dos créditos. (RE 970821)\n(FGV-TJMT-JUIZ/2024) (FGV-SEFAZ/RS-AUDITOR/2025)\n\n<strong>TEMA 0501</strong>: É <strong>constitucional</strong> a fixação de alíquotas\nde IPI superiores a zero sobre garrafões, garrafas e tampas plásticas,\n<strong>ainda que</strong> utilizados para o acondicionamento de produtos essenciais.\n(RE 606314) <strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2024)</strong>\n\n<strong>TEMA 1140:</strong> As empresas públicas e as sociedades de\neconomia mista delegatárias de serviços públicos <strong>essenciais</strong>, que\n<strong>não distribuam lucros</strong> a acionistas privados <strong>nem ofereçam risco</strong>\nao <strong>equilíbrio</strong> concorrencial, são **beneficiárias da imunidade\ntributária recíproca** prevista no artigo 150, VI, a, da Constituição\nFederal, <strong>independentemente</strong> de cobrança de tarifa como\ncontraprestação do serviço. (RE 1320054) **(FGV-TJSE-ATIVIDADE NOTARIAL\nE DE REGISTRO/2023) (FGV-CÂMARA MUN DE SP-PROCUR. LEGISL/2024)\n(CESPE-PGERN-PROCURADOR/2024) (FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n[(VUNESP-PGESP-PROCURADOR/2024) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)] (FGV-TRF3-JUIZ/2025) (FGV-EBSERGH-ADVOGADO/2024)**","refs":["0364","0705","0517","1140","0501"]},{"id":"rg_2021_0842","tema":"0842","texto":"TEMA 0842: O artigo 42 da Lei 9.430/1996 é\n<strong>constitucional</strong>. (Art. 42. Caracterizam-se também omissão de receita\nou de rendimento os valores creditados em conta de depósito ou de\ninvestimento mantida junto a instituição financeira, em relação aos\nquais o titular, pessoa física ou jurídica, regularmente intimado, não\ncomprove, mediante documentação hábil e idônea, a origem dos recursos\nutilizados nessas operações.) (RE 855649)","refs":["0842"]},{"id":"rg_2021_0328","tema":"0328","texto":"TEMA 0328: A <strong>imunidade</strong> assegurada pelo art. 150,\nVI, 'c', da Constituição da República aos [partidos\npolíticos], inclusive suas fundações, às **entidades\nsindicais dos trabalhadore<strong>s e às instituições de </strong>educação e de\nassistência social,** sem fins lucrativos, que atendam aos requisitos da\nlei, <strong>alcança o IOF,</strong> <strong>inclusive</strong> o incidente sobre **aplicações\nfinanceiras.<strong> (RE 611510) </strong>(FGV-SEFAZ/MT-FISCAL DE TRIBUTOS/2023)\n(FGV-TRF5-JUIZ/2025)**\n\n<strong>TEMA 0495</strong>: É <strong>constitucional</strong> a contribuição de\nintervenção no domínio econômico destinada ao INCRA devida pelas\nempresas urbanas e rurais, inclusive após o advento da EC nº 33/2001.\n(RE 630898)\n\n<strong>TEMA 0808</strong>: <strong>Não incide imposto de renda</strong> sobre os\n[juros de mora devidos pelo atraso no pagamento de\nremuneração] por exercício de emprego, cargo ou função. (RE\n855091) <strong>(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO /2023)</strong>\n\n<strong>TEMA 1020</strong>: É <strong>incompatível</strong> com a Constituição\nFederal disposição normativa a prever a [obrigatoriedade de\ncadastro,] em órgão da Administração municipal, de\np[restador de serviços não estabelecido no território do\nMunicípio] e imposição ao tomador da retenção do Imposto\nSobre Serviços -- ISS quando descumprida a obrigação acessória. (RE\n1167509) **(FGV-TJSC-JUIZ/2024) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["0495","0808","1020","0328"]}],"ATENÇÃO":[{"id":"rg_2021_1124","tema":"1124","texto":"TEMA 1124: O <strong>fato gerador</strong> do imposto sobre\ntransmissão inter vivos de bens imóveis (ITBI) somente ocorre com a\n<strong>efetiva transferência</strong> da propriedade imobiliária, que se dá mediante\no registro. (ARE 1.294.969) **(FGV-PREF DE SÃO JOSÉ DOS CAMPOS-TÉCNICO\nTRIBUTÁRIO/2024) (FGV-SMF/RJ-FISCAL DE RENDAS/2023)**","refs":["1124"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2021_1074","tema":"1074","texto":"TEMA 1074: É <strong>inconstitucional</strong> a exigência de\ninscrição do Defensor Público nos quadros da Ordem dos Advogados do\nBrasil. (RE 1240999) (INFO 1036) **(FGV-ALPR-ANALISTA LEGISL/2024)\n(FGV-DPEPE-DEFENSOR/2025)**","refs":["1074"]},{"id":"rg_2021_1177","tema":"1177","texto":"TEMA 1177: A competência privativa da União para a\nedição de normas gerais sobre inatividades e pensões das polícias\nmilitares e dos corpos de bombeiros militares (artigo 22, XXI, da\nConstituição, na redação da Emenda Constitucional 103/2019) **não exclui\na competência legislativa dos Estados para a fixação das alíquotas da\ncontribuição previdenciária** incidente sobre os proventos de seus\npróprios militares inativos e pensionistas, tendo a Lei Federal\n13.954/2019, no ponto, incorrido em inconstitucionalidade. (RE 1338750)\n<strong>(FGV-TJSC-JUIZ/2022)</strong>","refs":["1177"]},{"id":"rg_2021_0933","tema":"0933","texto":"TEMA 0933: 1. A <strong>ausência de estudo atuarial</strong>\nespecífico e prévio à edição de lei que aumente a contribuição\nprevidenciária dos servidores públicos <strong>não implica</strong> vício de\n<strong>inconstitucionalidade</strong>, mas mera irregularidade que\npode ser sanada pela demonstração do déficit financeiro ou atuarial que\njustificava a medida. 2. A majoração da alíquota da contribuição\nprevidenciária do servidor público para 13,25% <strong>não afronta</strong> os\nprincípios da razoabilidade e da vedação ao confisco. (ARE 875958)\n<strong>(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024) (FGV-TCEPA-AUDITOR/2024)</strong>","refs":["0933"]},{"id":"rg_2021_1161","tema":"1161","texto":"TEMA 1161: <strong>Cabe ao Estado</strong> fornecer, em termos\n<strong>excepcionais</strong>, medicamento que, embora [não possua registro na\nANVISA], tem a sua [importação autorizada pela agência de\nvigilância sanitária], <strong>desde que</strong> comprovada a\n<strong>incapacidade econômica</strong> do paciente, a <strong>imprescindibilidade</strong>\nclínica do tratamento, e a <strong>impossibilidade</strong> de substituição por outro\nsimilar constante das listas oficiais de dispensação de medicamentos e\nos protocolos de intervenção terapêutica do SUS. (RE 1165959)\n<strong>(FGV-PCSC/2024) (FGV-ALPR-ADVOGADO/2024)</strong>","refs":["1161"]},{"id":"rg_2021_1154","tema":"1154","texto":"TEMA 1154: Compete à <strong>Justiça Federal</strong> processar e\njulgar feitos em que se discuta <strong>controvérsia</strong> relativa à **expedição\nde diploma** de conclusão de curso superior realizado em instituição\nprivada de ensino que <strong>integre o Sistema Federal</strong> de Ensino, mesmo que\na pretensão se limite ao pagamento de indenização. (RE 1304964)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["1154"]},{"id":"rg_2021_1095","tema":"1095","texto":"TEMA 1095: No âmbito do Regime Geral de Previdência\nSocial (RGPS), [somente lei pode criar ou ampliar benefícios e\nvantagens] previdenciárias, não havendo, por ora, previsão\nde extensão do auxílio da grande invalidez a todas às espécies de\naposentadoria. (RE 1221446)","refs":["1095"]},{"id":"rg_2021_1150","tema":"1150","texto":"TEMA 1150: O servidor público <strong>aposentado</strong> pelo\nRegime Geral de Previdência Social, com previsão de vacância do cargo em\nlei local, <strong>não tem direito</strong> a ser reintegrado ao mesmo cargo no qual\nse aposentou ou nele manter-se, por violação à regra do concurso público\ne à impossibilidade de acumulação de proventos e remuneração não\nacumuláveis em atividade. (RE 1302501)","refs":["1150"]},{"id":"rg_2021_1120","tema":"1120","texto":"TEMA 1120: Em respeito ao princípio da **separação dos\npoderes,** previsto no art. 2º da Constituição Federal, quando não\ncaracterizado o desrespeito às normas constitucionais pertinentes ao\nprocesso legislativo, é <strong>defeso</strong> ao Poder Judiciário exercer o\n<strong>controle jurisdicional</strong> em relação à interpretação do sentido e do\nalcance de normas meramente regimentais das Casas\nLegislativas, por se tratar de matéria interna corporis. (RE 1297884)\n\n\\[[Decisão: O Tribunal, por maioria, acolheu os embargos de declaração a\nfim de, suprindo a omissão apontada, <strong>retificar a tese fixada</strong> no\npresente tema de repercussão geral, nos seguintes termos: \\\"Em respeito\nao princípio da separação dos poderes, previsto no art. 2º da\nConstituição Federal, quando não caracterizado o desrespeito às normas\nconstitucionais, é defeso ao Poder Judiciário exercer o controle\njurisdicional em relação à interpretação do sentido e do alcance de\nnormas meramente regimentais das Casas Legislativas, por se tratar de\nmatéria interna corporis, nos termos do voto do Ministro Gilmar Mendes,\nRedator para o acórdão, vencidos os Ministros Dias Toffoli (Relator),\nCármen Lúcia e Alexandre de Moraes. Plenário, Sessão Virtual de\n23.6.2023 a 30.6.2023.\\] (]RE 1297884) <strong>(FGV-TRF3-JUIZ/2025)</strong>\n\n<strong>TEMA 1055</strong>: É <strong>objetiva</strong> a Responsabilidade Civil do\nEstado em relação a <strong>profissional da imprensa ferido</strong> por agentes\npoliciais durante cobertura jornalística, em manifestações em que haja\ntumulto ou conflitos entre policiais e manifestantes. **Cabe a\nexcludente** da responsabilidade da culpa exclusiva da vítima, nas\nhipóteses em que o p**rofissional de imprensa descumprir ostensiva e\nclara advertência sobre acesso a áreas delimitadas,** em que haja grave\nrisco à sua integridade física. (RE 1209429) **(FGV-TJSC-JUIZ/2024)\n(FGV-ENAM/2024)**","refs":["1120","1055"]},{"id":"rg_2021_0818","tema":"0818","texto":"TEMA 0818: É <strong>compatível</strong> com a Constituição Federal\n<strong>controle judicial</strong> a tornar obrigatória a observância, tendo em conta\nrecursos orçamentários destinados à saúde, dos [percentuais\nmínimos] previstos no artigo 77 do Ato das Disposições\nConstitucionais Transitórias, considerado período anterior à edição da\nLei Complementar nº 141/2012. (RE 858075)","refs":["0818"]},{"id":"rg_2021_1142","tema":"1142","texto":"TEMA 1142: Os honorários advocatícios constituem\n<strong>crédito único e indivisível,</strong> de modo que o <strong>fracionamento</strong> da\nexecução de honorários advocatícios sucumbenciais fixados em ação\ncoletiva contra a Fazenda Pública, **proporcionalmente às execuções\nindividuais de cada beneficiário, viola** o § 8º do artigo 100 da\nConstituição Federal.\n\n<strong>TEMA 1137</strong>: É <strong>constitucional</strong> o artigo 8º da Lei\nComplementar 173/2020, editado no âmbito do Programa Federativo de\nEnfrentamento ao Coronavírus SARS-CoV-2 (Covid-19). (Art. 8º Na hipótese\nde que trata o [[art. 65 da Lei Complementar nº 101, de 4 de maio de\n2000]](https://www.planalto.gov.br/ccivil_03/leis/lcp/Lcp101.htm#art65),\na União, os Estados, o Distrito Federal e os Municípios afetados pela\ncalamidade pública decorrente da pandemia da Covid-19 ficam proibidos,\naté 31 de dezembro de 2021, de:)","refs":["1137","1142"]},{"id":"rg_2021_0704","tema":"0704","texto":"TEMA 0704: São <strong>constitucionais</strong> a <strong>cota de tela,</strong>\nconsistente na <strong>obrigatoriedade</strong> de <strong>exibição de filmes nacionais</strong>\nnos cinemas brasileiros, e as sanções administrativas decorrentes de sua\ninobservância.","refs":["0704"]},{"id":"rg_2021_0606","tema":"0606","texto":"TEMA 0606: A natureza do ato de **demissão de\nempregado público** é [constitucional-administrativa e não\ntrabalhista,] o que atrai a competência da <strong>Justiça comum</strong>\npara julgar a questão. A concessão de aposentadoria aos empregados\npúblicos <strong>inviabiliza a permanência no emprego</strong>, nos termos do art.\n37, § 14, da CRFB, <strong>salvo</strong> para as aposentadorias concedidas pelo\nRegime Geral de Previdência Social até a data de entrada em vigor da\nEmenda Constitucional nº 103/19, nos termos do que dispõe seu art. 6º.\n(RE 655283) <strong>(FGV/2022) (FGV-ENAM/2025)</strong>","refs":["0606"]},{"id":"rg_2021_0317","tema":"0317","texto":"TEMA 0317: O art. 40, § 21, da Constituição Federal,\nenquanto esteve em vigor, era norma de <strong>eficácia limitada</strong> e seus\nefeitos estavam condicionados à edição de lei complementar federal ou\nlei regulamentar específica dos entes federados no âmbito dos\nrespectivos regimes próprios de previdência social.","refs":["0317"]}],"DIREITO PENAL":[{"id":"rg_2021_1178","tema":"1178","texto":"TEMA 1178: A <strong>multa mínima</strong> prevista no artigo 33 da\nLei 11.343/06 é opção legislativa legítima para a quantificação da pena,\nn<strong>ão cabendo ao Poder Judiciário alterá-la</strong> com fundamento nos\nprincípios da proporcionalidade, da isonomia e da individualização da\npena.\n\n<strong>TEMA 1169</strong>: Tendo em vista a legalidade e a\ntaxatividade da norma penal (art. 5º, XXXIX, CF), a alteração promovida\npela Lei 13.964/2019 no art. 112 da LEP n**ão autoriza a incidência do\npercentual de 60%<strong> (inc. VII) aos condenados </strong>reincidentes não\nespecíficos** para o fim de progressão de regime. Diante da omissão\nlegislativa, impõe-se a analogia in bonam partem, para aplicação,\ninclusive retroativa, do inciso V do artigo 112 da LEP (lapso temporal\nde 40%) ao condenado por crime hediondo ou equiparado sem resultado\nmorte reincidente não específico. (ARE 1327963)\n<strong>(FGV-PCSC-DELEGADO/2024)</strong>","refs":["1178","1169"]},{"id":"rg_2021_1003","tema":"1003","texto":"TEMA 1003: É <strong>inconstitucional</strong> a aplicação do\npreceito secundário do art. 273 do Código Penal, com redação dada pela\nLei nº 9.677/98 (reclusão, de 10 a 15 anos, e multa), à hipótese\nprevista no seu § 1º-B, I, que versa sobre importar, vender, expor à\nvenda, ter em depósito para vender ou, de qualquer forma, distribuir ou\nentregar produto sem registro no órgão de vigilância sanitária. Para\nestas situações específicas, f**ica repristinado o preceito secundário\ndo art. 273,** na sua redação originária (reclusão, de 1 a 3 anos, e\nmulta","refs":["1003"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2021_1171","tema":"1171","texto":"TEMA 1171: <strong>Violam</strong> o princípio da presunção de\ninocência o <strong>indeferimento</strong> de matrícula em cursos de reciclagem de\nvigilante e a recusa de registro do respectivo certificado de conclusão,\nem razão da existência de <strong>inquérito</strong> ou ação penal [sem o trânsito em\njulgado] de sentença condenatória. (RE 1307053) **(FGV-JUIZ\nDO TRABALHO/2023)**","refs":["1171"]},{"id":"rg_2021_0858","tema":"0858","texto":"TEMA 0858: I - O <strong>trânsito em julgado</strong> de sentença\ncondenatória proferida em sede de ação desapropriatória <strong>não obsta</strong> a\npropositura de Ação Civil Pública em defesa do patrimônio público, para\ndiscutir a dominialidade do bem expropriado, <strong>ainda que</strong> já se tenha\nexpirado o prazo para a Ação Rescisória; II - Em sede de Ação de\nDesapropriação, os [honorários sucumbenciais só serão devidos caso haja\ndevido pagamento da indenização aos expropriados]. (RE\n1010819) **(FGV/2023) (FGV-TJSE-ATIV NOTARIAL E DE REGISTRO/2023)\n(FGV-TJSC-JUIZ/2022) (FGV-TRF3-JUIZ/2025)**\n\n<strong>TEMA 0642</strong>: O <strong>Município prejudicado</strong> é o\n<strong>legitimado</strong> para a <strong>execução</strong> de crédito decorrente de multa\naplicada por Tribunal de Contas estadual a agente público municipal, em\nrazão de danos causados ao erário municipal. (RE 1003433)\n\n<strong>\\ATENÇÃO: [Decisão na ADPF 1.011</strong>: O Tribunal, por\nunanimidade, conheceu da arguição de descumprimento de preceito\nfundamental e julgou procedente o pedido, para assentar que **[compete\nao Estado-membro a execução de crédito decorrente de multas simples,\naplicadas por Tribunais de Contas estaduais a agentes públicos\nmunicipais, em razão da inobservância das normas de Direito Financeiro\nou, ainda, do descumprimento dos deveres de colaboração impostos, pela\nlegislação, aos agentes públicos fiscalizados.]** Entendeu,\nainda, que a presente decisão [não afeta automaticamente a coisa julgada\nformada em momento anterior à publicação da ata deste\njulgamento] e que **deve ser acrescida à tese firmada no RE\n1.003.433/RJ, tema 642 de repercussão geral,** uma nova proposição, de\nmodo que passe a constar: \"1. <strong>O Município prejudicado</strong> é o\n<strong>legitimado</strong> para a <strong>execução</strong> de crédito decorrente de multa\naplicada por Tribunal de Contas estadual a agente público municipal, em\nrazão de danos causados ao erário municipal. 2. **Compete ao\nEstado-membr<strong>o a </strong>execução<strong> de crédito decorrente de </strong>multas**\nsimples, aplicadas por Tribunais de Contas estaduais a agentes públicos\nmunicipais, em razão da <strong>inobservância das normas</strong> de Direito\nFinanceiro ou, ainda, do <strong>descumprimento dos deveres</strong> de colaboração\nimpostos, pela legislação, aos agentes públicos fiscalizados\".\\]\n**(FGV/2023) (FGV/2022 - 3 VEZES) (CAIU NA 2ª FASE DO TJMS/FGV)\n(FGV-ENAM/2024) (FGV-TJGO-JUIZ/2023) (FGV-TJSC-JUIZ/2024.2)\n(FGV-TCERR-AUDITOR/2025)**\n\n<strong>TEMA 1013</strong>: São <strong>constitucionais</strong> os procedimentos\nlicitatórios que exijam percentuais mínimos e máximos a\nserem observados pelas emissoras de rádio na produção e transmissão de\nprogramas culturais, artísticos e jornalísticos locais, nos termos do\nartigo 221 da Constituição Federal de 1988. (RE 1070522)\n(FGV-TRF5-JUIZ/2025)","refs":["0642","1013","642","0858"]}],"DIREITO DO TRABALHO":[{"id":"rg_2021_1191","tema":"1191","texto":"TEMA 1191: I - É <strong>inconstitucional</strong> a utilização da\nTaxa Referencial - TR como índice de atualização dos débitos\ntrabalhistas, devendo ser aplicados, até que sobrevenha solução\nlegislativa, os mesmos índices de correção monetária e de juros vigentes\npara as condenações cíveis em geral, quais sejam a incidência do IPCA-E\nna fase pré-judicial e, a partir do ajuizamento da ação, a incidência da\ntaxa SELIC (art. 406 do Código Civil), à exceção das dívidas da Fazenda\nPública, que possuem regramento específico. A incidência de juros\nmoratórios com base na variação da taxa SELIC não pode ser cumulada com\na aplicação de outros índices de atualização monetária, cumulação que\nrepresentaria bis in idem.II - A fim de garantir segurança jurídica e\nisonomia na aplicação desta tese, devem ser observados os marcos para\nmodulação dos efeitos da decisão fixados no julgamento conjunto da ADI\n5.867, ADI 6.021, ADC 58 e ADC 59, como segue: (i) são reputados válidos\ne não ensejarão qualquer rediscussão, em ação em curso ou em nova\ndemanda, incluindo ação rescisória, todos os pagamentos realizados\nutilizando a TR (IPCA-E ou qualquer outro índice), no tempo e modo\noportunos (de forma extrajudicial ou judicial, inclusive depósitos\njudiciais) e os juros de mora de 1% ao mês, assim como devem ser\nmantidas e executadas as sentenças transitadas em julgado que\nexpressamente adotaram, na sua fundamentação ou no dispositivo, a TR (ou\no IPCA-E) e os juros de mora de 1% ao mês; (ii) os processos em curso\nque estejam sobrestados na fase de conhecimento, independentemente de\nestarem com ou sem sentença, inclusive na fase recursal, devem ter\naplicação, de forma retroativa, da taxa Selic (juros e correção\nmonetária), sob pena de alegação futura de inexigibilidade de título\njudicial fundado em interpretação contrária ao posicionamento do STF\n(art. 525, §§ 12 e 14, ou art. 535, §§ 5º e 7º, do CPC e (iii) os\nparâmetros fixados neste julgamento aplicam-se aos processos, ainda que\ntransitados em julgado, em que a sentença não tenha consignado\nmanifestação expressa quanto aos índices de correção monetária e taxa de\njuros (omissão expressa ou simples consideração de seguir os critérios\nlegais). (RE 1269353)","refs":["1191"]},{"id":"rg_2021_1112","tema":"1112","texto":"TEMA 1112: <strong>Inexiste direito adquirido</strong> à diferença\nde correção monetária dos saldos das contas vinculadas ao FGTS referente\nao Plano Collor II (fevereiro de 1991), conforme entendimento firmado no\nRE 226.855, o qual não foi superado pelo julgamento do RE 611.503 (Tema\n360). (ARE 1288550)","refs":["360","1112"]},{"id":"rg_2021_1166","tema":"1166","texto":"TEMA 1166: Compete à Justiça do Trabalho processar e\njulgar causas ajuizadas contra o empregador nas quais se pretenda o\nreconhecimento de verbas de natureza trabalhista e os reflexos nas\nrespectivas contribuições para a entidade de previdência privada a ele\nvinculada. (RE 1265564)","refs":["1166"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2021_0833","tema":"0833","texto":"TEMA 0833: É <strong>constitucional</strong> a expressão 'de forma\nnão cumulativa' constante do caput do art. 20 da Lei nº 8.212/91. (RE\n852796)","refs":["0833"]},{"id":"rg_2021_1125","tema":"1125","texto":"TEMA 1125: É <strong>constitucional</strong> o cômputo, para fins\nde carência, do período no qual o segurado esteve em gozo do benefício\nde auxílio-doença, desde que intercalado com atividade laborativa. (RE\n1298832)","refs":["1125"]}]},"2020":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2020_0855","tema":"0855","texto":"TEMA 0855: A <strong>exigência</strong> constitucional de **aviso\nprévio relativamente ao direito de reunião** é satisfeita com a\nveiculação de informação que permita ao poder público zelar para que seu\nexercício se dê de forma pacífica ou para que não frustre\noutra reunião no mesmo local. (RE 806339) **(FGV-ALTO-PROCURADOR\nJURÍDICO/2024)**\n\n<strong>TEMA 0492</strong>: É <strong>inconstitucional</strong> a cobrança por parte\nde associação de <strong>taxa de manutenção e conservação de loteamento</strong>\nimobiliário urbano de [proprietário não associado até o advento da Lei\nnº 13.465/17,] ou de anterior lei municipal que discipline a\nquestão, a partir da qual se torna possível a cotização dos\nproprietários de imóveis, titulares de direitos ou moradores em\nloteamentos de acesso controlado, que i) já possuindo lote, **adiram ao\nato constitutivo** das entidades equiparadas a administradoras de\nimóveis ou (ii) sendo novos adquirentes de lotes, o **ato constitutivo\nda obrigação esteja registrado** no competente Registro de Imóveis. (RE\n695911)","refs":["0855","0492"]},{"id":"rg_2020_0386","tema":"0386","texto":"TEMA 0386: Nos termos do artigo 5º, VIII, da\nConstituição Federal é <strong>possível</strong> a realização de **etapas de concurso\npúblico em datas e horários distintos** dos previstos em edital, por\ncandidato que invoca <strong>escusa de consciência</strong> por motivo de crença\nreligiosa, <strong>desde que</strong> presentes a razoabilidade da\nalteração, a preservação da igualdade entre todos os candidatos e que\nnão acarrete ônus desproporcional à Administração Pública, que deverá\ndecidir de maneira fundamentada. (RE 611874)\n<strong>(FGV-TCEGO-ANALISTA/2024)</strong>","refs":["0386"]},{"id":"rg_2020_0491","tema":"0491","texto":"TEMA 0491: Os Estados-Membros e o Distrito Federal têm\n<strong>competência legislativa</strong> para estabelecer [regras de postagem de\nboletos] referentes a pagamento de serviços prestados por\nempresas públicas e privadas. (ARE 649.379) (INFO 999)\n<strong>(FGV-ENAC/2025)</strong>","refs":["0491"]},{"id":"rg_2020_0840","tema":"0840","texto":"TEMA 0840: A expressão 'serviço efetivo, em qualquer\nregime jurídico', considerado o disposto no artigo 53 do Ato das\nDisposições Transitórias, <strong>não aproveita tempo ficto.</strong>","refs":["0840"]},{"id":"rg_2020_0969","tema":"0969","texto":"TEMA 0969: Os artigos 23 e 27 da Instrução 308/1999,\nda Comissão de Valores Mobiliários, ao estabelecerem restrições\nrazoáveis, proporcionais e adequadas ao exercício da atividade de\nauditoria independente, prestada às companhias sujeitas à sua\nfiscalização, são constitucionais, à luz dos arts. 5º, incs. II e XIII,\n84, incs. II e VI, 87, parágrafo único e inc. II, 88, 170 e 174 da\nConstituição Federal de 1988.","refs":["0969"]},{"id":"rg_2020_0383","tema":"0383","texto":"TEMA 0383: A equiparação de remuneração entre\nempregados da empresa tomadora de serviços e empregados da empresa\ncontratada (terceirizada) <strong>fere o princípio da livre iniciativa,</strong> por\nse tratar de agentes econômicos distintos, que não podem estar sujeitos\na decisões empresariais que não são suas.\n\nATENÇÃO: Cancelado tema de repercussão geral\n\nDecisão: O Tribunal, por maioria, julgou improcedente\no pedido formulado na ação direta, **com o cancelamento do Tema 964 da\nrepercussão geral,** vencido o Ministro Alexandre de Moraes. Em sede de\nmodulação, por unanimidade, concedeu-se o prazo de 12 (doze) meses,\ncontados da publicação da ata deste julgamento, para implementação pelos\nTribunais da sistemática aqui estabelecida. Ficam ressalvados os\nconcursos de remoção ou promoção já finalizados, bem como ficam\nmantidas, neste período, as regras até aqui estabelecidas pelos\ntribunais. Tudo nos termos do voto do Relator. Ausente,\njustificadamente, a Ministra Cármen Lúcia.","refs":["0383","964"]},{"id":"rg_2020_0942","tema":"0942","texto":"TEMA 0942: Até a edição da Emenda Constitucional nº\n103/2019, o direito à conversão, em tempo comum, do prestado sob\ncondições especiais que prejudiquem a saúde ou a integridade física de\nservidor público decorre da previsão de adoção de requisitos e critérios\ndiferenciados para a jubilação daquele enquadrado na hipótese prevista\nno então vigente inciso III do § 4º do art. 40 da Constituição da\nRepública, devendo ser aplicadas as normas do regime geral de\nprevidência social relativas à aposentadoria especial contidas na Lei\n8.213/1991 para viabilizar sua concretização enquanto não sobrevier lei\ncomplementar disciplinadora da matéria. [Após a vigência da EC n.º\n103/2019, o direito à conversão em tempo comum, do prestado sob\ncondições especiais pelos servidores obedecerá à legislação complementar\ndos entes federados], nos termos da competência conferida\npelo art. 40, § 4º-C, da Constituição da República. (RE 1014286)\n\n<strong>TEMA 0578:</strong> (i) Ressalvado o direito de opção, a regra\nde transição do art. 8º, inciso II da Emenda Constitucional nº 20/98,\nsomente se aplica aos servidores que, quando da sua publicação, ainda\nnão reuniam os requisitos necessários para a aposentadoria; (ii) em se\ntratando de carreira pública escalonada em classes, a exigência\ninstituída pelo art. 8º, inciso II da Emenda Constitucional n.º 20/98,\nde cinco anos de efetivo exercício no cargo no qual se dará a\naposentadoria, deverá ser compreendida como cinco anos de efetivo\nexercício na carreira a que pertencente o servidor. (RE 662423)\n\n<strong>TEMA 1049:</strong> Surgem constitucionais os artigos 5º e 6º,\ninciso I, da Lei nº 13.021/2014, no que previsto ser do farmacêutico a\nresponsabilidade técnica por drogaria. (RE 1156197)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>\n\n<strong>TEMA 0505</strong>: A <strong>Justiça do Trabalho</strong> é\ncompetente para executar, <strong>de ofício,</strong> as contribuições previstas no\nartigo 195, incisos I, alínea a, e II, da Carta da República,\nrelativamente a títulos executivos judiciais por si formalizados em data\nanterior à promulgação da Emenda Constitucional nº 20/1998.","refs":["0505","1049","0578","0942"]},{"id":"rg_2020_1038","tema":"1038","texto":"TEMA 1038: I - A Constituição Federal [não prevê\nadicional noturno aos Militares Estaduais ou Distritais].\nII - Mandado de Injunção será cabível para que se apliquem, aos\nmilitares estaduais, as normas que regulamentam o adicional noturno dos\nservidores públicos civis, desde que o direito a tal parcela\nremuneratória esteja expressamente previsto na Constituição Estadual ou\nna Lei Orgânica do Distrito Federal.","refs":["1038"]},{"id":"rg_2020_0452","tema":"0452","texto":"TEMA 0452: É <strong>inconstitucional</strong>, por violação ao\nprincípio da isonomia (art. 5º, I, da Constituição da República),\ncláusula de contrato de previdência complementar que, ao prever regras\ndistintas entre homens e mulheres para cálculo e concessão de\ncomplementação de aposentadoria, estabelece **valor inferior do\nbenefício para as mulheres**, tendo em conta o seu menor tempo de\ncontribuição.","refs":["0452"]},{"id":"rg_2020_0359","tema":"0359","texto":"TEMA 0359: Ocorrida a morte do instituidor da pensão\nem momento posterior ao da Emenda Constitucional nº 19/1998, **o teto\nconstitucional** previsto no inciso XI do artigo 37 da Constituição\nFederal i<strong>ncide sobre o somatório de remuneração ou provento e pensão</strong>\npercebida por servidor.","refs":["0359"]},{"id":"rg_2020_0179","tema":"0179","texto":"TEMA 0179: Em relação às contribuições ao PIS/COFINS,\n<strong>não viola</strong> o princípio da <strong>não-cumulatividade</strong> a impossibilidade de\ncreditamento de despesas ocorridas no sistema cumulativo, pois os\ncréditos são presumidos e o direito ao desconto somente\nsurge com as <strong>despesas incorridas em momento posterior</strong> ao início da\nvigência do regime não-cumulativo.","refs":["0179"]},{"id":"rg_2020_0373","tema":"0373","texto":"TEMA 0373: O § 1º do artigo 75 da Lei nº 6.815/1980\n<strong>não foi recepcionado</strong> pela Constituição Federal de 1988, sendo\n<strong>vedada</strong> a [expulsão de estrangeiro cujo filho brasileiro foi\nreconhecido ou adotado posteriormente ao fato ensejador do ato\nexpulsório,] uma vez comprovado estar a criança sob a guarda\ndo estrangeiro e deste depender economicamente. (RE 608898)\n<strong>(VUNESP-MPERO-PROMOTOR/2024)</strong>","refs":["0373"]},{"id":"rg_2020_0709","tema":"0709","texto":"TEMA 0709: I) É <strong>constitucional</strong> a **vedação de\ncontinuidade da percepção de aposentadoria especial** se o beneficiário\npermanece laborando em atividade especial ou a ela\nretorna, seja essa atividade especial aquela que ensejou a aposentação\nprecoce ou não. II) Nas hipóteses em que o segurado solicitar a\naposentadoria e continuar a exercer o labor especial, a data de início\ndo benefício será a data de entrada do requerimento, remontando a esse\nmarco, inclusive, os efeitos financeiros. Efetivada, contudo, seja na\nvia administrativa, seja na judicial a implantação do benefício, uma vez\nverificado o retorno ao labor nocivo ou sua continuidade, cessará o\npagamento do benefício previdenciário em questão.","refs":["0709"]},{"id":"rg_2020_0028","tema":"0028","texto":"TEMA 0028: Surge <strong>constitucional</strong> expedição de\nprecatório ou requisição de pequeno valor para pagamento\nda [parte incontroversa e autônoma do pronunciamento judicial transitada\nem julgado] observada a importância total executada para\nefeitos de dimensionamento como obrigação de pequeno valor.","refs":["0028"]},{"id":"rg_2020_1091","tema":"1091","texto":"TEMA 1091: É <strong>constitucional</strong> o fator previdenciário\nprevisto no art. 29, caput, incisos e parágrafos, da Lei nº 8.213/91,\ncom a redação dada pelo art. 2º da Lei nº 9.876/99.","refs":["1091"]},{"id":"rg_2020_0222","tema":"0222","texto":"TEMA 0222: Sempre que for pago ao trabalhador com\nvínculo permanente, o adicional de riscos é devido, nos mesmos termos,\nao trabalhador portuário avulso. <strong>(FGV-JUIZ DO TRABALHO/2023)</strong>","refs":["0222"]},{"id":"rg_2020_0958","tema":"0958","texto":"TEMA 0958: É <strong>constitucional</strong> a norma geral federal\nque reserva <strong>fração mínima de um terço</strong> da carga horária dos\nprofessores da educação básica para dedicação às [atividades\nextraclasse.]","refs":["0958"]},{"id":"rg_2020_0562","tema":"0562","texto":"TEMA 0562: Ante conflito entre a liberdade de\nexpressão de agente político, na defesa da coisa pública, e honra de\nterceiro, há de <strong>prevalecer o interesse coletivo.</strong>","refs":["0562"]},{"id":"rg_2020_0551","tema":"0551","texto":"TEMA 0551: Servidores **temporários não fazem jus a\ndécimo terceiro<strong> salário e </strong>férias remuneradas acrescidas do terço**\nconstitucional, <strong>salvo</strong> (I) expressa previsão legal e/ou contratual em\nsentido contrário, ou (II) comprovado desvirtuamento da contratação\ntemporária pela Administração Pública, em razão de sucessivas e\nreiteradas renovações e/ou prorrogações. (RE 1066677) **(CESPE-PREF DE\nMOSSORÓ/RN-PROCURADOR/2024)**","refs":["0551"]},{"id":"rg_2020_0996","tema":"0996","texto":"TEMA 0996: <strong>Não encontra amparo</strong> no Texto\nConstitucional revisão de benefício previdenciário pelo valor nominal do\nsalário mínimo. (RE 968414)","refs":["0996"]},{"id":"rg_2020_0774","tema":"0774","texto":"TEMA 0774: A <strong>norma estadual</strong> que impõe à\nconcessionária de geração de energia elétrica a promoção de\ninvestimentos, com recursos identificados como parcela da receita que\naufere, voltados à proteção e à preservação de mananciais hídricos é\n<strong>inconstitucional</strong> por configurar **intervenção indevida do Estado no\ncontrato de concessão da exploração do aproveitamento energético dos\ncursos de água, atividade de competência da União,** conforme art. 21,\nXII, \\'b\\', da Constituição Federal. (RE 827538) **(FGV-PCSC/2024)\n(FGV-TCEBA-AUDITOR/2023)**\n\n<strong>TEMA 1090</strong>: Os Procuradores da Fazenda Nacional **não\npossuem** direito a férias de 60 (sessenta) dias, nos termos da\nlegislação constitucional e infraconstitucional vigentes. (RE 594481)","refs":["0774","1090"]},{"id":"rg_2020_0595","tema":"0595","texto":"TEMA 0595: É <strong>constitucional</strong> a promulgação, pelo\nChefe do Poder Executivo, de <strong>parte incontroversa</strong> de projeto da lei\nque <strong>não foi vetada,</strong> <strong>antes</strong> da manifestação do Poder Legislativo\npela manutenção ou pela rejeição do veto, <strong>inexistindo vício</strong> de\ninconstitucionalidade dessa parte inicialmente publicada pela ausência\nde promulgação da derrubada dos vetos. (RE 706103) **(FGV-CÂMARA DE\nFORTALEZA-CONSULTOR LEG/2024) (FGV-TRF3-JUIZ/2025)**\n\n<strong>TEMA 0899</strong>: É <strong>prescritível</strong> a pretensão de\nressarcimento ao erário fundada em <strong>decisão</strong> de **Tribunal de\nContas<strong>. (RE 636886) </strong>(FGV-FHEMIG-ANALISTA/2023) (FGV/2022)\n(FGV-TCEGO-ANALISTA/2024) (FGV-TCEBA-AUDITOR/2023) (FGV-CÂMARA DOS\nDEPUTADOS-ANALISTA/2023) (FGV-PREF DE NITERÓI/RJ-AUDITOR/2024)\n(FGV-TCE/RR-AUDITOR/2025) (FGV-TRF3-JUIZ/2025)**","refs":["0595","0899"]},{"id":"rg_2020_0160","tema":"0160","texto":"TEMA 0160: É <strong>constitucional</strong> a cobrança de\ncontribuições sobre os proventos dos militares inativos, aqui\ncompreendidos os Policiais Militares e o Corpo de Bombeiros dos Estados\ne do Distrito Federal e os integrantes das Forças Armadas, entre o\nperíodo de vigência da Emenda Constitucional 20/98 e da Emenda\nConstitucional 41/03, por serem titulares de regimes jurídicos distintos\ndos servidores públicos civis e porque a eles não se estende a\ninterpretação integrativa dos textos dos artigos 40, §§ 8º e 12, e\nartigo 195, II, da Constituição da República.","refs":["0160"]},{"id":"rg_2020_1082","tema":"1082","texto":"TEMA 1082: As gratificações de natureza pro labore\nfaciendo são incorporadas à aposentadoria conforme as normas de regência\nde cada uma delas, não caracterizando ofensa ao direito à integralidade\na incorporação em valor inferior ao da última remuneração recebida em\natividade por servidor que se aposentou nos termos do art. 3º da Emenda\nConstitucional nº 47/2005.","refs":["1082"]},{"id":"rg_2020_1040","tema":"1040","texto":"TEMA 1040: Surge <strong>constitucional</strong> lei de iniciativa\nparlamentar a criar conselho de representantes da sociedade civil,\nintegrante da estrutura do Poder Legislativo, com atribuição de\nacompanhar ações do Executivo. (RE 626946) <strong>(FGV/2024)</strong>","refs":["1040"]},{"id":"rg_2020_0358","tema":"0358","texto":"TEMA 0358: A competência constitucional do tribunal\npara decidir sobre a perda do posto e da patente dos oficiais e da\ngraduação das praças é específica, nos termos do artigo 125, § 4º, não\nautorizando a concessão de reforma de policial militar julgado inapto a\npermanecer nas fileiras da corporação.","refs":["0358"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2020_0327","tema":"0327","texto":"TEMA 0327: A **inscrição de entes federados em\ncadastro de inadimplentes** (ou outro que dê causa à negativa de\nrealização de convênios, acordos, ajustes ou outros instrumentos\ncongêneres que impliquem transferência voluntária de recursos),\npressupõe o respeito aos princípios do **contraditório, da ampla defesa\ne do devido processo legal,** somente reconhecido: a) [após o julgamento\nde tomada de contas especial ou procedimento análogo perante o Tribunal\nde Contas], nos casos de descumprimento parcial ou total de\nconvênio, prestação de contas rejeitada, ou existência de débito\ndecorrente de ressarcimento de recursos de natureza contratual (salvo os\nde conta não prestada); b) após a [devida notificação do ente faltoso e\no decurso do prazo] nela previsto (conforme constante em\nlei, regras infralegais ou em contrato), independentemente de tomada de\ncontas especial, nos casos de não prestação de contas, não fornecimento\nde informações, débito decorrente de conta não prestada, ou quaisquer\noutras hipóteses em que incabível a tomada de contas especial. (RE\n1067086) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)","refs":["0327"]},{"id":"rg_2020_0362","tema":"0362","texto":"TEMA 0362: Nos termos do artigo 37, § 6º, da\nConstituição Federal, **não se caracteriza a responsabilidade civil\nobjetiva** do Estado por danos decorrentes de crime praticado por pessoa\nforagida do sistema prisional, quando <strong>não demonstrado o nexo causal</strong>\ndireto entre o momento da fuga e a conduta praticada. (RE 608880)\n**(FGV-TJSC-JUIZ/2022) (FGV-ENAM-MANAUS/2024)\n(VUNESP-PCSP-DELEGADO/2023)**\n\n<strong>TEMA 0951</strong>: Servidores que tiveram relação jurídica\nregida pela Consolidação das Leis do Trabalho, modificada considerado o\nRegime Jurídico Único, têm direito à diferença remuneratória decorrente\ndo plano de cargos e salários - PCCS.","refs":["0951","0362"]},{"id":"rg_2020_0779","tema":"0779","texto":"TEMA 0779: Os substitutos ou interinos designados para\no exercício de função delegada <strong>não se equiparam</strong> aos **titulares de\nserventias extrajudiciais,** visto não atenderem aos requisitos\nestabelecidos nos arts. 37, inciso II, e 236, § 3º, da Constituição\nFederal para o provimento originário da função, inserindo-se na\ncategoria dos agentes estatais, razão pela qual **se aplica a eles o\nteto** remuneratório do art. 37, inciso XI, da Carta da República.\n<strong>(FGV-TJES-JUIZ/2023)</strong>\n\n<strong>TEMA 0826</strong>: É <strong>imprescindível</strong> para o reconhecimento\nda responsabilidade civil do Estado em decorrência da fixação de preços\nno setor sucroalcooleiro a comprovação de efetivo prejuízo econômico,\nmediante perícia técnica em cada caso concreto.","refs":["0826","0779"]},{"id":"rg_2020_0512","tema":"0512","texto":"TEMA 0512: O Estado responde <strong>subsidiariamente</strong> por\ndanos materiais causados a candidatos em concurso público organizado por\npessoa jurídica de direito privado (art. 37, § 6º, da CRFB/88), quando\nos exames são cancelados por indícios de <strong>fraude</strong>.","refs":["0512"]},{"id":"rg_2020_0854","tema":"0854","texto":"TEMA 0854: Salvo em situações <strong>excepcionais</strong>\ndevidamente <strong>comprovadas</strong>, serviço público de transporte coletivo\npressupõe <strong>prévia licitação.</strong>","refs":["0854"]},{"id":"rg_2020_0667","tema":"0667","texto":"TEMA 0667: É <strong>inconstitucional</strong>, por dispensar o\nconcurso público, a <strong>reestruturação</strong> de quadro funcional por meio de\naglutinação, em uma <strong>única carreira,</strong> de <strong>cargos diversos,</strong> quando a\nnova carreira tiver <strong>atribuições e responsabilidades diferentes</strong> dos\ncargos originais. (RE 642895) **(VUNESP-PREF DE LINS/SP-ADVOGADO/2024)\n(VUNESP-TJRJ-JUIZ/2023)**","refs":["0667"]},{"id":"rg_2020_0546","tema":"0546","texto":"TEMA 0546: Surge <strong>constitucional</strong> previsão normativa\nlocal voltada a coibir fraude considerado o serviço público de\ntransporte coletivo e inconstitucional [condicionar a liberação de\nveículo apreendido ao pagamento] de multas, preços públicos\ne demais encargos decorrentes de infração. (RE 661702)","refs":["0546"]},{"id":"rg_2020_0047","tema":"0047","texto":"TEMA 0047: A competência técnica do Tribunal de Contas\ndo Estado, <strong>ao negar registro de admissão de pessoal</strong>, [não se\nsubordina à] revisão pelo Poder Legislativo respectivo. (RE\n576920) <strong>(FGV/2023) (FGV/2022)</strong>","refs":["0047"]},{"id":"rg_2020_1081","tema":"1081","texto":"TEMA 1081: As hipóteses excepcionais autorizadoras de\nacumulação de cargos públicos previstas na Constituição Federal\nsujeitam-se, <strong>unicamente</strong>, a existência de c**ompatibilidade de\nhorários**, verificada no caso concreto, ainda que haja\nnorma infraconstitucional que limite a jornada semanal (ARE 1246685).\n<strong>(FGV - TJMS/2023)</strong>","refs":["1081"]},{"id":"rg_2020_0022","tema":"0022","texto":"TEMA 0022: Sem previsão constitucionalmente adequada e\ninstituída por lei, <strong>não é legítima</strong> a cláusula de edital de concurso\npúblico que <strong>restrinja a participação</strong> de candidato pelo simples fato\nde responder a inquérito ou ação penal. (RE 560900)\n<strong>(VUNESP-PREF DE LINS/SP-ADVOGADO/2024) (FGV-ENAM/2025)</strong>\n\n<strong>TEMA 0532</strong>: É <strong>constitucional</strong> a [delegação do poder\nde polícia,] por meio de lei, a pessoas jurídicas de direito\nprivado integrantes da Administração Pública indireta de capital social\n<strong>majoritariamente</strong> público que prestem <strong>exclusivamente</strong> serviço\npúblico de atuação própria do Estado e em regime [não\nconcorrencial]. (RE 633782) (INFO 996) **(FGV/2023 - 4\nvezes) (FGV-SMF/RJ-FISCAL DE RENDAS/2023) (FGV-TJSE-ATIVIDADE NOTARIAL E\nDE REGISTRO/2023)<strong> </strong>(FGV/2024) (FGV-PROC-CÂMARA MUNICIPAL DE SP/2024)\n(FGV-ENAM/2024) (FGV-ALPR-ANALISTA LEGISLATIVO/2024) [(CESPE-PREF DE\nMOSSORÓ/RN-ANALISTA/2024) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)\n(FGV-TJAP-JUIZ/2022)] (FGV-TJSC-JUIZ/2024.2) (VUNESP-PREF DE SÃO\nPAULO-AUDITOR FISCAL/2023) (FGV-PCMG-DELEGADO/2025)\n(FGV-MPE/RJ-ANALISTA/2025)**","refs":["0022","0532"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2020_0939","tema":"0939","texto":"TEMA 0939: É <strong>constitucional</strong> a <strong>flexibilização</strong>\nda legalidade tributária constante do § 2º do art. 27 da Lei nº\n10.865/04, no que permitiu ao Poder Executivo, **prevendo as condições e\nfixando os tetos<strong>, </strong>reduzir e restabelece**r as alíquotas da\ncontribuição ao PIS e da COFINS incidentes sobre as receitas financeiras\nauferidas por pessoas jurídicas sujeitas ao regime não cumulativo,\nestando presente o desenvolvimento de função extrafiscal. (RE 1043313)\n<strong>(FGV-TCEPA-AUDITOR/2024)</strong>\n\n<strong>TEMA 0744:</strong> É <strong>constitucional</strong> o § 9º do artigo 8º da\nLei nº 10.865/2004, a estabelecer alíquotas maiores, quanto à\nContribuição ao PIS e à Cofins, consideradas empresas importadoras de\nautopeças não fabricantes de máquinas e veículos. (RE 633345)","refs":["0744","0939"]},{"id":"rg_2020_0668","tema":"0668","texto":"TEMA 0668: É <strong>inconstitucional</strong> o art. 1º da\nResolução CG/REFIS nº 20/2001, no que suprimiu a notificação da pessoa\njurídica optante do REFIS, prévia ao ato de exclusão. (RE 669196)\n(FGV-PREF DE NOVA IGUAÇU-AUDITOR FISCAL/2024)","refs":["0668"]},{"id":"rg_2020_1052","tema":"1052","texto":"TEMA 1052: Observadas as balizas da Lei Complementar\nnº 87/1996, é <strong>constitucional</strong> o creditamento de Imposto sobre\nOperações relativas à Circulação de Mercadorias -- **ICMS cobrado na\nentrada**, por prestadora de serviço de telefonia móvel, considerado\naparelho <strong>celular posteriormente cedido, mediante comodato.</strong> (RE\n1141756)","refs":["1052"]},{"id":"rg_2020_1024","tema":"1024","texto":"TEMA 1024: É <strong>constitucional</strong> a inclusão dos valores\nretidos pelas administradoras de cartões na base de cálculo das\ncontribuições ao PIS e da COFINS devidas por empresa que recebe\npagamentos por meio de cartões de crédito e débito.","refs":["1024"]},{"id":"rg_2020_0985","tema":"0985","texto":"TEMA 0985: É <strong>legítima</strong> a **incidência de\ncontribuição social** sobre o valor satisfeito a título de [terço\nconstitucional] de férias. ([RE\n1072485](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5255826))\n\n\\[RE 1.072.485-ED: O Tribunal, por maioria, deu parcial provimento aos\nembargos de declaração, com atribuição de efeitos ex nunc ao acórdão de\nmérito, a contar da publicação de sua ata de julgamento, ressalvadas as\ncontribuições já pagas e não impugnadas judicialmente até essa mesma\ndata, que não serão devolvidas pela União.\\]","refs":["0985"]},{"id":"rg_2020_0906","tema":"0906","texto":"TEMA 0906: É <strong>constitucional</strong> a incidência do\nImposto sobre Produtos Industrializados - <strong>IPI</strong> no **desembaraço\naduaneiro<strong> de bem industrializado </strong>e na saída do estabelecimento**\nimportador para comercialização no mercado interno.","refs":["0906"]},{"id":"rg_2020_0872","tema":"0872","texto":"TEMA 0872: Revela-se <strong>constitucional</strong> a sanção\nprevista no artigo 7º, inciso II, da Lei nº 10.426/2002, ante a\n<strong>ausência de ofensa</strong> aos princípios da proporcionalidade\ne da vedação de tributo com efeito confiscatório.","refs":["0872"]},{"id":"rg_2020_0346","tema":"0346","texto":"TEMA 0346: (i) <strong>Não viola</strong> o princípio da não\ncumulatividade (art. 155, §2º, incisos I e XII, alínea c, da CF/1988)\nlei complementar que [prorroga a compensação de créditos de\nICMS] relativos a bens adquiridos para uso e consumo no\npróprio estabelecimento do contribuinte; (ii) Conforme o artigo 150,\nIII, c, da CF/1988, o princípio da anterioridade nonagesimal aplica-se\nsomente para leis que instituem ou majoram tributos, **não\nincidindo<strong> relativamente às normas que </strong>prorrogam** a data de início\nda compensação de crédito tributário. <strong>(FGV- TJMS-JUIZ/2023)</strong>","refs":["0346"]},{"id":"rg_2020_1099","tema":"1099","texto":"TEMA 1099: <strong>Não incide</strong> ICMS no deslocamento de bens\nde um estabelecimento para outro do <strong>mesmo contribuinte</strong> localizados\nem estados distintos, visto não haver a transferência da\ntitularidade ou a realização de ato de mercancia. (ARE 1255885)\n<strong>(VUNESP-PGESP-PROCURADOR/2024)</strong>","refs":["1099"]},{"id":"rg_2020_1012","tema":"1012","texto":"TEMA 1012: É <strong>constitucional</strong> a incidência do ICMS\nsobre a operação de venda, realizada por locadora de veículos, de\nautomóvel com menos de 12 (doze) meses de aquisição da\nmontadora. (RE 1025986) <strong>(FGV-SEFAZ/MT- FISCAL DE TRIBUTOS/2023)</strong>\n\n<strong>TEMA 0796:</strong> A <strong>imunidade</strong> em relação ITBI, prevista\nno inciso I do § 2º do art. 156 da Constituição Federal, <strong>não alcança</strong>\no valor dos bens que <strong>exceder o limite do capital social a</strong> ser\nintegralizado. (RE 796376) **(FGV-TJPR-JUIZ/2023) (FGV-TJGO-JUIZ/2023)\n(FGV-PREF DE SÃO JOSÉ DOS CAMPOS-TÉCNICO TRIBUTÁRIO/2024) (FGV-PREF DE\nMACAÉ/RJ- AUDITOR FISCAL/2024) (FGV-ENAC/2025) (FGV-TJSC-JUIZ/2025)**","refs":["0796","1012"]},{"id":"rg_2020_0743","tema":"0743","texto":"TEMA 0743: É <strong>possível</strong> ao Município **obter\ncertidão positiva de débitos com efeito de negativa** quando a Câmara\nMunicipal do mesmo ente possui débitos com a Fazenda Nacional, tendo em\nconta o princípio da intranscendência subjetiva das\nsanções financeiras. (RE 770149) **(CESPE-PREF DE\nMOSSORÓ/RN-PROCURADOR/2024) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)**","refs":["0743"]},{"id":"rg_2020_0689","tema":"0689","texto":"TEMA 0689: Segundo o artigo 155, § 2º, X, b, da\nCF/1988, <strong>cabe ao Estado de destino</strong>, em sua <strong>totalidade</strong>, o [ICMS\nsobre a operação interestadual] de fornecimento de energia\nelétrica a consumidor final, para emprego em processo de\nindustrialização, não podendo o Estado de origem cobrar o referido\nimposto. (RE 748543)\n\n<strong>TEMA 0475:</strong> A <strong>imunidade</strong> a que se refere o art. 155,\n§ 2º, X, \\\"a\\\", da CF <strong>não alcança</strong> operações ou prestações anteriores\nà operação de exportação. (RE 754917) <strong>(FGV-TRF1-JUIZ/2023)</strong>","refs":["0689","0475"]},{"id":"rg_2020_0379","tema":"0379","texto":"TEMA 0379: No tocante às **farmácias de manipulação,\nincide o ISS** sobre as operações envolvendo [o preparo e o\nfornecimento] de medicamentos encomendados para posterior\nentrega aos fregueses, em caráter pessoal, para consumo; **incide o\nICMS** sobre os medicamentos de prateleira por elas\nproduzidos, ofertados ao público consumidor. (RE 605552)","refs":["0379"]},{"id":"rg_2020_0247","tema":"0247","texto":"TEMA 0247: O art. 9º, § 2º, do DL nº 406/1968 foi\nrecepcionado pela ordem jurídica inaugurada pela Constituição de 1988.","refs":["0247"]},{"id":"rg_2020_0508","tema":"0508","texto":"TEMA 0508: Sociedade de economia mista, cuja\nparticipação acionária é <strong>negociada</strong> em Bolsas de Valores, e que,\ninequivocamente, está voltada à <strong>remuneração</strong> do capital de seus\ncontroladores ou acionistas, <strong>não está abrangida</strong> pela regra de\nimunidade tributária prevista no art. 150, VI, 'a', da Constituição,\nunicamente em razão das atividades desempenhadas. (RE 600867)\n**(FGV/2022-2 VEZES) (FGV-CÂMARA MUN DE SP-PROCUR. LEGISL/2024)\n(VUNESP-PGESP-PROCURADOR/2024)**","refs":["0508"]},{"id":"rg_2020_0337","tema":"0337","texto":"TEMA 0337: Não obstante as Leis nº 10.637/02 e\n10.833/03 estejam em processo de inconstitucionalização, é ainda\nconstitucional o modelo legal de coexistência dos regimes cumulativo e\nnão cumulativo, na apuração do PIS/Cofins das empresas prestadoras de\nserviços.","refs":["0337"]},{"id":"rg_2020_0244","tema":"0244","texto":"TEMA 0244: Surge <strong>inconstitucional</strong>, por ofensa aos\nprincípios da <strong>não cumulatividade e da isonomia,</strong> o artigo 31, cabeça,\nda Lei nº 10.865/2004, no que vedou o creditamento da contribuição para\no PIS e da COFINS, relativamente ao ativo imobilizado adquirido até 30\nde abril de 2004.\n\n<strong>TEMA 0228:</strong> É <strong>devida</strong> a restituição da diferença das\ncontribuições para o Programa de Integração Social - PIS e para o\nFinanciamento da Seguridade Social - Cofins recolhidas a mais, no regime\nde substituição tributária, se a [base de cálculo efetiva das operações\nfor inferior à presumida]. (RE 596832) <strong>(FGV/2022)</strong>","refs":["0244","0228"]},{"id":"rg_2020_0708","tema":"0708","texto":"TEMA 0708: A Constituição autoriza a cobrança do\nImposto sobre a Propriedade de Veículos Automotores (IPVA) **somente\npelo Estado em que o contribuinte mantém sua sede ou domicílio\ntributário<strong>. (RE 1016605) </strong>(FGV-AL/MA-ADVOGADO/2023)**\n**(FGV-ALPR-ANALISTA LEGISLATIVO/2024) (FGV-CÂMARA DOS\nDEPUTADOS-ANALISTA/2024) (FGV-TRF5-JUIZ/2025)**\n\n<strong>TEMA 0700:</strong> É <strong>constitucional</strong> a incidência de **ISS\nsobre serviços de distribuição e venda de bilhetes e demais produtos de\nloteria,** bingos, cartões, pules ou cupons de apostas, sorteios e\nprêmios (item 19 da Lista de Serviços Anexa à Lei Complementar\n116/2003). Nesta situação, a base de cálculo do ISS é o valor a ser\nremunerado pela prestação do serviço, independentemente da cobrança de\ningresso, não podendo corresponder ao valor total da aposta.","refs":["0700","0708"]},{"id":"rg_2020_0300","tema":"0300","texto":"TEMA 0300: É <strong>constitucional</strong> a incidência de\nImposto sobre Serviços de Qualquer Natureza **(ISS) sobre contratos de\nfranquia** (franchising) (itens 10.04 e 17.08 da lista de serviços\nprevista no Anexo da Lei Complementar 116/2003).","refs":["0300"]},{"id":"rg_2020_0523","tema":"0523","texto":"TEMA 0523: São <strong>constitucionais</strong> as leis municipais\nanteriores à Emenda Constitucional n° 29/2000, que instituíram\n<strong>alíquotas diferenciadas de IPTU</strong> para imóveis edificados e não\nedificados, residenciais e não residenciais.","refs":["0523"]},{"id":"rg_2020_0732","tema":"0732","texto":"TEMA 0732: É <strong>inconstitucional</strong> a suspensão\nrealizada por conselho de fiscalização profissional do exercício laboral\nde seus inscritos por inadimplência de anuidades, pois a medida consiste\nem <strong>sanção política em matéria tributária</strong>. (RE 647885)\n<strong>(FGV-ENAC/2025)</strong>","refs":["0732"]},{"id":"rg_2020_0520","tema":"0520","texto":"TEMA 0520: O <strong>sujeito ativo</strong> da obrigação tributária\nde ICMS incidente sobre <strong>mercadoria importada é o Estado-membro</strong> no\nqual está <strong>domiciliado</strong> ou estabelecido o <strong>destinatário</strong> legal da\noperação que deu causa à circulação da mercadoria, com a transferência\nde domínio.","refs":["0520"]},{"id":"rg_2020_0391","tema":"0391","texto":"TEMA 0391: É infraconstitucional e incide a Súmula\n279/STF, a ela se aplicando os efeitos da ausência de repercussão geral,\na controvérsia relativa a base de cálculo da COFINS e do PIS, na\nimportação feita no âmbito do sistema FUNDAP, quando fundada na análise\ndo fatos e provas que originaram o negócio jurídico subjacente à\nimportação e no enquadramento como operação de importação por conta e\nordem de terceiro de que trata a MP nº 2.158-35/2001.","refs":["0391"]},{"id":"rg_2020_0723","tema":"0723","texto":"TEMA 0723: É <strong>constitucional</strong>, formal e\nmaterialmente, a contribuição social do segurado especial prevista no\nart. 25 da Lei 8.212/1991.","refs":["0723"]},{"id":"rg_2020_1085","tema":"1085","texto":"TEMA 1085: A inconstitucionalidade de majoração\nexcessiva de taxa tributária fixada em ato infralegal a partir de\ndelegação legislativa defeituosa **não conduz à invalidade do tributo\nnem impede** que o Poder Executivo atualize os valores previamente\nfixados em lei de acordo com percentual não superior aos índices\noficiais de correção monetária.","refs":["1085"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2020_0550","tema":"0550","texto":"TEMA 0550: Preenchidos os requisitos dispostos na Lei\n4.886/65, compete à J<strong>ustiça Comum</strong> o julgamento de processos\nenvolvendo relação jurídica entre **representante e representada\ncomerciais,** uma vez que não há relação de trabalho entre\nas partes. (RE 606003) <strong>(VUNESP-MPRJ-PROMOTOR/2024)</strong>","refs":["0550"]},{"id":"rg_2020_0792","tema":"0792","texto":"TEMA 0792: Lei disciplinadora da submissão de crédito\nao sistema de execução via precatório possui natureza material e\nprocessual, sendo **inaplicável a situação jurídica constituída em data\nque a anteceda**.","refs":["0792"]},{"id":"rg_2020_1092","tema":"1092","texto":"TEMA 1092: Compete à <strong>Justiça comum</strong> processar e\njulgar causas sobre <strong>complementação de aposentadoria</strong> instituída por\nlei cujo pagamento seja, originariamente ou por sucessão, da\n<strong>responsabilidade da Administração Pública direta ou indireta</strong>, por\nderivar essa responsabilidade de relação jurídico-administrativa. (RE\n1265549) <strong>(VUNESP-MPRJ-PROMOTOR/2024)</strong>","refs":["1092"]},{"id":"rg_2020_0679","tema":"0679","texto":"TEMA 0679: Surge **incompatível com a Constituição\nFederal<strong> exigência de </strong>depósito prévio como condição de\nadmissibilidade do recurso extraordinário**, no que não recepcionada a\nprevisão constante do § 1º do artigo 899 da Consolidação das Leis do\nTrabalho, sendo inconstitucional a contida na cabeça do artigo 40 da Lei\nnº 8.177 e, por arrastamento, no inciso II da Instrução Normativa nº\n3/1993 do Tribunal Superior do Trabalho. (RE 607447)","refs":["0679"]},{"id":"rg_2020_0521","tema":"0521","texto":"TEMA 0521: O **pagamento parcelado dos créditos não\nalimentares,** na forma do art. 78 do ADCT, [não caracteriza preterição\nindevida de precatórios alimentares], desde que os primeiros\ntenham sido inscritos em exercício anterior ao da apresentação dos\nsegundos, uma vez que, ressalvados os créditos de que trata o art. 100,\n§ 2º, da Constituição, o pagamento dos precatórios deve [observar as\nseguintes diretrizes:] (1) a divisão e a organização das\nclasses ocorrem segundo o ano de inscrição; (2) inicia-se o pagamento\npelo exercício mais antigo em que há débitos pendentes;\n(3) quitam-se primeiramente os créditos alimentares;\ndepois, os não alimentares do mesmo ano; (4) passa-se, então, ao ano\nseguinte da ordem cronológica, repetindo-se o esquema de pagamento; e\nassim sucessivamente. (RE 612707)","refs":["0521"]},{"id":"rg_2020_0992","tema":"0992","texto":"TEMA 0992: Compete à <strong>Justiça Comum</strong> processar e\njulgar controvérsias relacionadas à <strong>fase pré-contratual de seleção</strong> e\nde admissão de pessoal e eventual nulidade do certame em face da\nAdministração Pública, direta e indireta, nas hipóteses em que adotado o\n<strong>regime celetista de contratação</strong> de pessoas, <strong>salvo</strong> quando a\nsentença de mérito tiver sido proferida [antes de 6 de junho de\n2018,] situação em que, até o trânsito em julgado e a sua\nexecução, a competência continuará a ser da Justiça do Trabalho. (RE\n960429) **(FGV-CÂMARA DOS DEPUTADOS/ANALISTA/2024) (FGV-ENAM\nMANAUS/2024)**","refs":["0992"]}],"DIREITO PENAL":[{"id":"rg_2020_0438","tema":"0438","texto":"TEMA 0438: Em caso de <strong>inatividade processual</strong>\ndecorrente de citação por edital, ressalvados os crimes\nprevistos na Constituição Federal como imprescritíveis, é\n**constitucional limitar o período de suspensão do prazo prescricional\na**o t[empo de prescrição da pena máxima em abstrato cominada ao\ncrime], a despeito de o processo permanecer suspenso.","refs":["0438"]},{"id":"rg_2020_0486","tema":"0486","texto":"TEMA 0486: É <strong>constitucional</strong> a imposição da pena de\nsuspensão de habilitação para dirigir veículo automotor ao [motorista\nprofissional] condenado por [homicídio culposo no\ntrânsito.] <strong>(FGV/2021)</strong>","refs":["0486"]}]},"2019":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2019_0864","tema":"0864","texto":"TEMA 0864: A <strong>revisão geral anual</strong> da remuneração\ndos servidores públicos depende, <strong>cumulativamente</strong>, de dotação na Lei\nOrçamentária Anual e de previsão na Lei de Diretrizes Orçamentárias. (RE\n905357)\n\n<strong>TEMA 0990</strong>: 1. É <strong>constitucional</strong> o compartilhamento\ndos relatórios de inteligência financeira da UIF e da íntegra do\nprocedimento fiscalizatório da Receita Federal do Brasil, que define o\nlançamento do tributo, com os órgãos de persecução penal para fins\ncriminais, <strong>sem a obrigatoriedade de prévia autorização judicial,</strong>\ndevendo ser resguardado o sigilo das informações em\nprocedimentos formalmente instaurados e sujeitos a posterior controle\njurisdicional. 2. O compartilhamento pela UIF e pela RFB, referente ao\nitem anterior, deve ser feito **unicamente por meio de comunicações\nformais, com garantia de sigilo,** certificação do destinatário e\nestabelecimento de instrumentos efetivos de apuração e correção de\neventuais desvios. (RE 1055941) **(FGV/2022) (FGV-TJPR/2021)\n(VUNESP-MPRO-PROMOTOR/2024) (FGV-TJSE-JUIZ/2025)**","refs":["0990","0864"]},{"id":"rg_2019_1065","tema":"1065","texto":"TEMA 1065: É <strong>constitucional</strong> a contribuição\nprevidenciária devida por aposentado pelo Regime Geral de Previdência\nSocial (RGPS) que [permaneça em atividade ou a essa\nretorne.] (ARE 1224327)","refs":["1065"]},{"id":"rg_2019_0545","tema":"0545","texto":"TEMA 0545: 1. A qualificação de uma fundação\ninstituída pelo Estado como sujeita ao regime público ou privado depende\n(i) do <strong>estatuto</strong> de sua criação ou autorização e (ii) das\n<strong>atividades</strong> por ela prestadas. As atividades de conteúdo econômico e\nas passíveis de delegação, quando definidas como objetos de dada\nfundação, <strong>ainda que</strong> essa seja instituída ou mantida pelo Poder\npúblico, [podem-se submeter ao regime jurídico de direito\nprivado.] 2. A [estabilidade especial do art. 19 do ADCT não\nse estende aos empregados das fundações públicas de direito\nprivado], <strong>aplicando-se</strong> tão somente aos servidores das\n<strong>pessoas jurídicas de direito público</strong>. (RE 716378)\n<strong>(FGV-SEFAZ/RS-AUDITOR/2025)</strong>","refs":["0545"]},{"id":"rg_2019_0500","tema":"0500","texto":"TEMA 0500: 1. O Estado <strong>não pode</strong> ser obrigado a\nfornecer medicamentos <strong>experimentais</strong>. 2. A **ausência de registro na\nANVISA impede**, como regra geral, o fornecimento de medicamento por\ndecisão judicial. 3. É <strong>possível, excepcionalmente</strong>, a concessão\njudicial de medicamento sem registro sanitário, em caso de **mora\nirrazoável da ANVISA** em apreciar o pedido (prazo superior ao previsto\nna Lei nº 13.411/2016), quando preenchidos <strong>três requisitos</strong>: (i) a\n<strong>existência de pedido</strong> de registro do medicamento no Brasil (<strong>salvo</strong>\nno caso de medicamentos órfãos para doenças raras e ultrarraras); (ii) a\nexistência de <strong>registro do medicamento em renomadas agências</strong> de\nregulação no exterior; e (iii) a **inexistência de substituto\nt**erapêutico com registro no Brasil. 4. As ações que demandem\nfornecimento de medicamentos sem registro na ANVISA deverão\n<strong>necessariamente ser propostas em face da União</strong>. (RE 657718)\n<strong>(FGV/2022) (FGV-ALPR-ADVOGADO/2024) (FGV-ENAM 2/2024)</strong>\n\n<strong>TEMA 0967</strong>: 1. <strong>A proibição ou restrição</strong> da\natividade de transporte privado individual por motorista cadastrado em\naplicativo é <strong>inconstitucional</strong>, por violação aos princípios da livre\niniciativa e da livre concorrência; e 2. No exercício de sua competência\npara regulamentação e fiscalização do transporte privado individual de\npassageiros, os Municípios e o Distrito Federal **não podem contrariar\nos parâmetros fixados pelo legislador federal** (CF/1988, art. 22, XI).\n(RE 1054110) **(FGV/2022) (FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)\n(FGV-TJSC-JUIZ/2022) (FGV-PREF DE VITÓRIA/ES-PROCURADOR/2024)**","refs":["0500","0967"]},{"id":"rg_2019_0510","tema":"0510","texto":"TEMA 0510: A expressão \\\"Procuradores\\\", contida na\nparte final do inciso XI do art. 37 da Constituição da República,\n<strong>compreende os Procuradores Municipais</strong>, uma vez que estes se inserem\nnas funções essenciais à Justiça, estando, portanto, **submetidos ao\nteto de noventa inteiros e vinte e cinco centésimos por cento do\nsubsídio mensal**, em espécie, dos Ministros do Supremo Tribunal\nFederal. (RE 663696) **(FGV-PREF DE GUARAGUATATUBA-SP/2024) [(FGV-PREF\nDE VITÓRIA/ES-PROCURADOR/2024)]**\n\n<strong>TEMA 1027</strong>: A extensão, pelo Poder Judiciário, das\nverbas e vantagens concedidas pelo Conselho de Reitores das\nUniversidades do Estado de São Paulo (Cruesp) aos empregados das\ninstituições de ensino autônomas vinculadas às universidades estaduais\npaulistas contraria o disposto na Súmula Vinculante 37.","refs":["1027","0510"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2019_0400","tema":"0400","texto":"TEMA 0400: A **exigênc
