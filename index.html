 à regra geral da incidência do Imposto de Renda, posto\nque, excepcionalmente, configuram indenização por danos emergentes -\nPrecedente: RE n. 855.091 - RS; 3.) Escapam à regra geral de incidência\ndo Imposto de Renda sobre juros de mora aqueles cuja verba principal\nseja isenta ou fora do campo de incidência do IR - Precedente: REsp. n.\n1.089.720 - RS.","refs":["878"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2021_1000","tema":"1000","texto":"TEMA 1000: Desde que prováveis a existência da relação\njurídica entre as partes e de documento ou coisa que se pretende seja\nexibido, apurada em contraditório prévio, poderá o juiz, após tentativa\nde busca e apreensão ou outra medida coercitiva, determinar sua exibição\nsob pena de multa com base no art. 400, parágrafo único, do CPC/2015.","refs":["1000"]},{"id":"rep_2021_1004","tema":"1004","texto":"TEMA 1004: Reconhecida a incidência do princípio da\nboa-fé objetiva em ação de desapropriação indireta, se a aquisição do\nbem ou de direitos sobre ele ocorrer quando já existente restrição\nadministrativa, fica subentendido que tal ônus foi considerado na\nfixação do preço. Nesses casos, o adquirente não faz jus a qualquer\nindenização do órgão expropriante por eventual apossamento anterior.\n<strong>Excetuam-se</strong> da tese hipóteses em que patente a boa-fé objetiva do\nsucessor, como em situações de negócio jurídico gratuito ou de\nvulnerabilidade econômica do adquirente.","refs":["1004"]},{"id":"rep_2021_1058","tema":"1058","texto":"TEMA 1058: A Justiça da Infância e da Juventude tem\ncompetência <strong>absoluta </strong>para processar e julgar causas\nenvolvendo matrícula de menores em creches ou escolas, nos termos dos\narts. 148, IV, e 209 da Lei 8.069/90.","refs":["1058"]},{"id":"rep_2021_1092","tema":"1092","texto":"TEMA 1092: É <strong>possível</strong> a Fazenda Pública habilitar\nem processo de falência crédito objeto de execução fiscal em curso,\nmesmo antes da vigência da Lei n. 14.112/2020, e <strong>desde que</strong> **não\nhaja pedido de constrição** no juízo executivo. (REsp 1.872.759-SP)\n<strong>(FGV-PREF DE VITÓRIA/ES-PROCURADOR/2024)</strong>\n\n<strong>TEMA 6 (IAC):</strong> Os efeitos da Lei nº 13.876/2019 na\nmodificação de competência para o processamento e julgamento dos\nprocessos que tramitam na Justiça Estadual no exercício da competência\nfederal delegada insculpido no art, 109, § 3º, da Constituição Federal,\napós as alterações promovidas pela Emenda Constitucional 103, de 12 de\nnovembro de 2019, aplicar-se-ão aos feitos ajuizados após 1º de janeiro\nde 2020. As ações, em fase de conhecimento ou de execução, ajuizadas\nanteriormente a essa data, continuarão a ser processadas e julgadas no\njuízo estadual, nos termos em que previsto pelo § 3º do art. 109 da\nConstituição Federal, pelo inciso III do art. 15 da Lei n. 5.010, de 30\nde maio de 1965, em sua redação original.\n\n<strong>TEMA 10 (IAC):</strong> <strong>Tese A)</strong> <strong>Prevalecem</strong> sobre\nquaisquer outras normas locais, primárias ou secundárias, legislativas\nou administrativas, as seguintes competências de foro: i) em <strong>regra</strong>,\ndo local do <strong>dano</strong>, para ação civil pública (art. 2º da Lei n.\n7.347/1985); ii) ressalvada a competência da Justiça Federal, em **ações\ncoletivas, do local onde ocorreu ou deva ocorrer o dano** de impacto\nrestrito, **ou da capital do estado, se os danos forem regionais ou\nnacionais,** submetendo-se ainda os casos à regra geral do CPC, em\nhavendo competência concorrente (art. 93, I e II, do CDC). <strong>Tese B)</strong>\nSão <strong>absolutas</strong> as competências: i) da <strong>Vara da Infância</strong> e da\nJuventude do local onde ocorreu ou deva ocorrer a ação ou a omissão,\npara as causas individuais ou coletivas arroladas no ECA, inclusive\nsobre educação e saúde, ressalvadas a competência da Justiça Federal e a\ncompetência originária dos tribunais superiores (arts. 148, IV, e 209 da\nLei n. 8.069/1990; e Tese n. 1.058/STJ); ii) do **local de domicílio do\nidoso** nas causas individuais ou coletivas versando sobre serviços de\nsaúde, assistência social ou atendimento especializado ao idoso portador\nde deficiência, limitação incapacitante ou doença infectocontagiosa,\nressalvadas a competência da Justiça Federal e a competência originária\ndos tribunais superiores (arts. 79 e 80 da Lei n. 10.741/2003 e 53, III,\ne, do CPC/2015); iii) do <strong>Juizado Especial da Fazenda Pública,</strong> nos\nforos em que tenha sido instalado, para as causas da sua alçada e\nmatéria (art. 2º, § 4º, da Lei n. 12.153/2009); iv) nas hipóteses do\nitem (iii), faculta-se ao autor optar livremente pelo manejo de seu\npleito contra o estado no foro de seu domicílio, no do fato ou ato\nensejador da demanda, no de situação da coisa litigiosa ou, ainda, na\ncapital do estado, observada a competência absoluta do Juizado, se\nexistente no local de opção (art. 52, parágrafo único, do CPC/2015, c/c\no art. 2º, § 4º, da Lei n. 12.153/2009). <strong>Tese C)</strong> A **instalação de\nvara especializada não altera a competência prevista em lei ou na\nConstituição** Federal, nos termos da Súmula n. 206/STJ (\\\"A existência\nde vara privativa, instituída por lei estadual, não altera a competência\nterritorial resultante das leis de processo.\\\"). A previsão se estende\nàs competências definidas no presente IAC n. 10/STJ. <strong>Tese D)</strong> A\nResolução n. 9/2019/TJMT é ilegal e inaplicável quanto à criação de\ncompetência exclusiva em comarca arbitrariamente eleita em\ndesconformidade com as regras processuais, especificamente quando\ndetermina a redistribuição desses feitos, se ajuizados em comarcas\ndiversas da 1ª Vara Especializada da Fazenda Pública da Comarca de\nVárzea Grande/MT. Em consequência: i) fica vedada a redistribuição à 1ª\nVara Especializada da Fazenda Pública da Comarca de Várzea Grande/MT dos\nfeitos propostos ou em tramitação em comarcas diversas ou em juizados\nespeciais da referida comarca ou de outra comarca, cujo fundamento,\nexpresso ou implícito, seja a Resolução n. 9/2019/TJMT ou normativo\nsimilar; ii) os feitos já redistribuídos à 1ª Vara Especializada de\nVárzea Grande/MT com fundamento nessa norma deverão ser devolvidos aos\njuízos de origem, salvo se as partes, previamente intimadas, concordarem\nexpressamente em manter o processamento do feito no referido foro; iii)\nno que tange aos processos já ajuizados - ou que venham a ser\najuizados - pelas partes originalmente na 1ª Vara Especializada da\nFazenda Pública da Comarca de Várzea Grande/MT, poderão prosseguir\nnormalmente no referido juízo; iv) não se aplicam as previsões dos itens\n(ii) e (iii) aos feitos de competência absoluta, ou seja: de competência\ndos Juizados Especiais da Fazenda, das Varas da Infância e da Juventude\nou do domicílio do idoso, nos termos da Tese B deste IAC n. 10/STJ.","refs":["6","1092","10"]}],"DIREITO DO CONSUMIDOR":[{"id":"rep_2021_1061","tema":"1061","texto":"TEMA 1061: Na hipótese em que o consumidor/autor\n<strong>impugnar a autenticidade da assinatura</strong> constante em contrato\nbancário juntado ao processo pela instituição financeira, caberá **a\nesta o ônus** de provar a sua autenticidade (CPC, arts. 6º, 368 e 429,\nII).","refs":["1061"]},{"id":"rep_2021_1068","tema":"1068","texto":"TEMA 1068: Não é ilegal ou abusiva a cláusula que\nprevê a cobertura adicional de invalidez funcional permanente total por\ndoença (IFPD) em contrato de seguro de vida em grupo, condicionando o\npagamento da indenização securitária à perda da existência independente\ndo segurado, comprovada por declaração médica.","refs":["1068"]},{"id":"rep_2021_1078","tema":"1078","texto":"TEMA 1078: O <strong>atraso</strong>, por parte de instituição\nfinanceira, na baixa de gravame de alienação fiduciária no registro de\nveículo <strong>não caracteriza, por si só</strong>, dano moral in re ipsa.","refs":["1078"]}],"DIREITO CIVIL":[{"id":"rep_2021_1025","tema":"1025","texto":"TEMA 1025: É cabível a aquisição de imóveis\nparticulares situados no Setor Tradicional de Planaltina/DF, por\nusucapião, ainda que pendente o processo de regularização urbanística.","refs":["1025"]},{"id":"rep_2021_1034","tema":"1034","texto":"TEMA 1034: a) \\\"Eventuais mudanças de operadora, de\nmodelo de prestação de serviço, de forma de custeio e de valores de\ncontribuição não implicam interrupção da contagem do prazo de 10 (dez)\nanos previsto no art. 31 da Lei n. 9.656/1998, devendo haver a soma dos\nperíodos contributivos para fins de cálculo da manutenção proporcional\nou indeterminada do trabalhador aposentado no plano coletivo\nempresarial.\\\" b) \\\"O art. 31 da lei n. 9.656/1998 impõe que ativos e\ninativos sejam inseridos em plano de saúde coletivo único, contendo as\nmesmas condições de cobertura assistencial e de prestação de serviço, o\nque inclui, para todo o universo de beneficiários, a igualdade de modelo\nde pagamento e de valor de contribuição, admitindo-se a diferenciação\npor faixa etária se for contratada para todos, cabendo ao inativo o\ncusteio integral, cujo valor pode ser obtido com a soma de sua\ncota-parte com a parcela que, quanto aos ativos, é proporcionalmente\nsuportada pelo empregador.\\\" com o modelo dos trabalhadores ativos e\nfacultada a portabilidade de carências.\\\" c) \\\"[O ex-empregado\naposentado, preenchidos os requisitos do art. 31 da Lei n. 9.656/1998,\nnão tem direito adquirido de se manter no mesmo plano privado de\nassistência à saúde vigente na época da aposentadoria],\npodendo haver a substituição da operadora e a alteração do modelo de\nprestação de serviços, da forma de custeio e os BRASÍLIA, 18 DE DEZEMBRO\nDE 2020 Edição n. 58 -- 1ª/2/2021 a 12/2/2021 Página 2 de 5 respectivos\nvalores, desde que mantida paridade com o modelo dos trabalhadores\nativos e facultada a portabilidade de carências.","refs":["1034"]},{"id":"rep_2021_1066","tema":"1066","texto":"TEMA 1066: a) A disponibilização de equipamentos em\nquarto de hotel, motel ou afins para a transmissão de obras musicais,\nliteromusicais e audiovisuais permite a cobrança de direitos autorais\npelo Escritório Central de Arrecadação e Distribuição - ECAD. b) A\ncontratação por empreendimento hoteleiro de serviços de TV por\nassinatura <strong>não impede</strong> a cobrança de direitos autorais pelo\nEscritório Central de Arrecadação e Distribuição - ECAD, inexistindo bis\nin idem.","refs":["1066"]},{"id":"rep_2021_1067","tema":"1067","texto":"TEMA 1067: Salvo disposição contratual expressa, os\nplanos de saúde <strong>não são obrigados</strong> a custear o tratamento médico de\nfertilização in vitro. <strong>(CESPE-TJDFT/2023)</strong>","refs":["1067"]}],"DIREITO PENAL":[{"id":"rep_2021_931","tema":"931","texto":"TEMA 931: Nova tese firmada: Na\nhipótese de condenação concomitante a pena privativa de liberdade e\nmulta, o inadimplemento da sanção pecuniária, pelo condenado que\ncomprovar impossibilidade de fazê-lo, <strong>não obsta</strong> o reconhecimento da\nextinção da punibilidade. <strong>(FGV-TJSC-JUIZ/2025)</strong>\n\n(Primeiro entendimento: \\\"Na hipótese de condenação concomitante a pena\nprivativa de liberdade e multa, o inadimplemento da sanção pecuniária\nobsta o reconhecimento da extinção da punibilidade.\\\" )","refs":["931"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2021_1044","tema":"1044","texto":"TEMA 1044: Nas ações de acidente do trabalho, os\nhonorários periciais, adiantados pelo INSS, constituirão despesa a cargo\ndo Estado, nos casos em que sucumbente a parte autora, beneficiária da\nisenção de ônus sucumbenciais, prevista no parágrafo único do art. 129\nda Lei 8.213/91. (Recursos Especiais n. 1.823.402/PR e 1.824.823/PR)","refs":["1044"]},{"id":"rep_2021_862","tema":"862","texto":"TEMA 862: O termo inicial do auxílio-acidente deve\nrecair no dia seguinte ao da cessação do auxílio-doença que lhe deu\norigem, conforme determina o art. 86, § 2º, da Lei 8.213/91,\nobservando-se a prescrição quinquenal da Súmula 85/STJ.","refs":["862"]},{"id":"rep_2021_979","tema":"979","texto":"TEMA 979: Com relação aos pagamentos indevidos aos\nsegurados decorrentes de erro administrativo (material ou operacional),\nnão embasado em interpretação errônea ou equivocada da lei pela\nAdministração, são repetíveis, sendo legítimo o desconto\nno percentual de até 30% (trinta por cento) de valor do benefício pago\nao segurado/beneficiário, ressalvada a hipótese em que o segurado,\ndiante do caso concreto, comprova sua boa-fé objetiva, sobretudo com\ndemonstração de que não lhe era possível constatar o pagamento indevido.\n([REsp\n1381734/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301512182))","refs":["979"]},{"id":"rep_2021_1057","tema":"1057","texto":"TEMA 1057: I. O disposto no art. 112 da Lei n.\n8.213/1991 é aplicável aos âmbitos judicial e administrativo; II. Os\npensionistas detêm legitimidade ativa para pleitear, por direito\npróprio, a revisão do benefício derivado (pensão por morte) - caso não\nalcançada pela decadência -, fazendo a diferenças pecuniárias pretéritas\nnão prescritas, decorrentes da pensão recalculada; III. Caso não decaído\no direito de revisar a renda mensal inicial do benefício originário do\nsegurado instituidor, os pensionistas poderão postular a revisão da\naposentadoria, a fim de auferirem eventuais parcelas não prescritas\nresultantes da readequação do benefício original, bem como os reflexos\nna graduação econômica da pensão por morte; e IV. À falta de dependentes\nlegais habilitados à pensão por morte, os sucessores (herdeiros) do\nsegurado instituidor, definidos na lei civil, são partes legítimas para\npleitear, por ação e em nome próprios, a revisão do benefício original -\nsalvo se decaído o direito ao instituidor - e, por conseguinte, de\nhaverem eventuais diferenças pecuniárias não prescritas, oriundas do\nrecálculo da aposentadoria do de cujus.","refs":["1057"]},{"id":"rep_2021_1064","tema":"1064","texto":"TEMA 1064: 1ª) As inscrições em dívida ativa dos\ncréditos referentes a benefícios previdenciários ou assistenciais pagos\nindevidamente ou além do devido constituídos por processos\nadministrativos que tenham sido iniciados antes da vigência da Medida\nProvisória nº 780, de 2017, convertida na Lei n. 13.494/2017 (antes de\n22.05.2017) são nulas, devendo a constituição desses créditos ser\nreiniciada através de notificações/intimações administrativas a fim de\npermitir-se o contraditório administrativo e a ampla defesa aos\ndevedores e, ao final, a inscrição em dívida ativa, obedecendo-se os\nprazos prescricionais aplicáveis; e 2ª) As inscrições em dívida ativa\ndos créditos referentes a benefícios previdenciários ou assistenciais\npagos indevidamente ou além do devido contra os terceiros beneficiados\nque sabiam ou deveriam saber da origem dos benefícios pagos\nindevidamente em razão de fraude, dolo ou coação, constituídos por\nprocessos administrativos que tenham sido iniciados antes da vigência da\nMedida Provisória nº 871, de 2019, convertida na Lei nº 13.846/2019\n(antes de 18.01.2019) são nulas, devendo a constituição desses créditos\nser reiniciada através de notificações/intimações administrativas a fim\nde permitir-se o contraditório administrativo e a ampla defesa aos\ndevedores e, ao final, a inscrição em dívida ativa, obedecendo-se os\nprazos prescricionais aplicáveis.","refs":["1064"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2021_1084","tema":"1084","texto":"TEMA 1084: [É <strong>reconhecida a retroatividade</strong> do\npatamar estabelecido no <strong>art. 112, V,</strong> da Lei n. 13.964/2019, àqueles\napenados que, embora tenham cometido crime hediondo ou equiparado sem\nresultado morte, **não sejam reincidentes em delito de natureza\nsemelhante.** (REsp 1.910.240/MG e REsp 1.918.338/MT.)]","refs":["1084"]}],"DIREITO AMBIENTAL":[{"id":"rep_2021_1010","tema":"1010","texto":"TEMA 1010: Na vigência do novo Código Florestal (Lei\nn. 12.651/2012), a extensão não edificável nas Áreas de Preservação\nPermanente de qualquer curso d\\'água, perene ou intermitente, em trechos\ncaracterizados como área urbana consolidada, **deve respeitar o que\ndisciplinado pelo seu art. 4º, caput, inciso I, alíneas a, b, c, d e\ne**, a fim de assegurar a mais ampla garantia ambiental a esses espaços\nterritoriais especialmente protegidos e, por conseguinte, à\ncoletividade. ([REsp\n1770760/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201802631242)\n; [REsp\n1770808/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201802634652)\n; [REsp\n1770967/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201802637305))\n(VUNESP-PGESP-PROCURADOR/2024)","refs":["1010"]}]},"2020":{"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2020_1013","tema":"1013","texto":"TEMA 1013: No período entre o indeferimento\nadministrativo e a efetiva implantação de auxílio-doença ou de\naposentadoria por invalidez, mediante decisão judicial, o segurado do\nRPGS tem direito ao recebimento conjunto das rendas do trabalho\nexercido, ainda que incompatível com sua incapacidade laboral, e do\nrespectivo benefício previdenciário pago retroativamente.","refs":["1013"]},{"id":"rep_2020_1021","tema":"1021","texto":"TEMA 1021: a) \\\"A concessão do benefício de\nprevidência complementar tem como pressuposto a prévia formação de\nreserva matemática, de forma a evitar o desequilíbrio atuarial dos\nplanos. Em tais condições, quando já concedido o benefício de\ncomplementação de aposentadoria por entidade fechada de previdência\nprivada, é inviável a inclusão dos reflexos de quaisquer verbas\nremuneratórias reconhecidas pela Justiça do Trabalho nos cálculos da\nrenda mensal inicial dos benefícios de complementação de\naposentadoria.\\\" b) \\\"Os eventuais prejuízos causados ao participante ou\nao assistido que não puderam contribuir ao fundo na época apropriada\nante o ato ilícito do empregador poderão ser reparados por meio de ação\njudicial a ser proposta contra a empresa ex-empregadora na Justiça do\nTrabalho.\\\"","refs":["1021"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2020_1071","tema":"1071","texto":"TEMA 1071: A discussão acerca da eficácia e efeitos da\nmedida cautelar ou do julgamento de mérito da ADI 2332 não comporta\nrevisão em recurso especial.","refs":["1071"]}],"DIREITO CIVIL":[{"id":"rep_2020_1051","tema":"1051","texto":"TEMA 1051: Para o fim de submissão aos efeitos da\nrecuperação judicial, considera-se que a existência do crédito é\ndeterminada pela <strong>data em que ocorreu o seu fato gerador.</strong> ([REsp\n1842911/RS)] <strong>(FGV-ENAM 2/2024) (VUNESP-TJSP-JUIZ/2024)</strong>","refs":["1051"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2020_126","tema":"126","texto":"TEMA 126: O índice de juros compensatórios na\ndesapropriação direta ou indireta é de 12% até 11/6/1997, data anterior\nà vigência da MP 1577/97.","refs":["126"]},{"id":"rep_2020_280","tema":"280","texto":"TEMA 280: Até 26.9.99, data anterior à edição da MP\n1901- 30/99, são devidos juros compensatórios nas desapropriações de\nimóveis improdutivos.\n\n<strong>TEMA 281</strong>: Mesmo antes da MP 1901-30/99, **são\nindevidos juros compensatórios<strong> quando a </strong>propriedade se mostrar\nimpassível de qualquer espécie de exploração econômica** atual ou\nfutura, em decorrência de limitações legais ou fáticas. ([Pet\n12344/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201802308035);\n[REsp\n1116364/PI](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900064330)\n) (FGV-TJPE-JUIZ/2024)\n\n<strong>TEMA 282</strong>: : i) A partir de 27.9.99, data de edição da\nMP 1901- 30/99, exige-se a prova pelo expropriado da efetiva perda de\nrenda para incidência de juros compensatórios (art. 15-A, § 1º, do\nDecreto-Lei 3365/41); ii) Desde 5.5.2000, data de edição da MP 2027-\n38/00, veda-se a incidência dos juros em imóveis com índice de\nprodutividade zero (art. 15-A, § 2º, do DecretoLei 3365/41).","refs":["281","280","282"]},{"id":"rep_2020_1024","tema":"1024","texto":"TEMA 1024: A composição da tripulação das Ambulâncias\nde Suporte Básico - Tipo B e das Unidades de Suporte Básico de Vida\nTerrestre (USB) do Serviço de Atendimento Móvel de Urgência - SAMU sem a\npresença de profissional de enfermagem [não ofende, mas sim\nconcretiza,] o que dispõem os artigos 11, 12, 13 e 15 da Lei\nn.º 7.498/86, que regulamenta o exercício da enfermagem. ([REsp\n1828993/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201902223833))","refs":["1024"]},{"id":"rep_2020_1073","tema":"1073","texto":"TEMA 1073: As Súmulas 12/STJ (\\\"Em desapropriação, são\ncumuláveis juros compensatórios e moratórios.\\\"), 70/STJ (\\\"Os juros\nmoratórios, na desapropriação direta ou indireta, contam-se desde o\ntrânsito em julgado da sentença.\\\") e 102/STJ (\\\"A incidência dos juros\nmoratórios sobre compensatórios, nas ações expropriatórias, não\nconstitui anatocismo vedado em lei.\\\") somente se aplicam às situações\nhavidas até 12.01.2000, data anterior à vigência da MP 1.997-34.","refs":["1073"]},{"id":"rep_2020_1038","tema":"1038","texto":"TEMA 1038: Os editais de licitação ou pregão não podem\nconter cláusula prevendo percentual mínimo referente à taxa de\nadministração, sob pena de ofensa ao artigo 40, inciso X, da Lei nº\n8.666/1993.","refs":["1038"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2020_1003","tema":"1003","texto":"TEMA 1003: O termo inicial da correção monetária de\nressarcimento de crédito escritural excedente de tributo sujeito ao\nregime não cumulativo ocorre somente após escoado o prazo de 360 dias\npara a análise do pedido administrativo pelo Fisco (art. 24 da Lei n.\n11.457/2007).","refs":["1003"]}]},"2019":{"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2019_291","tema":"291","texto":"TEMA 291: Incidem os juros da mora no período\ncompreendido entre a data da realização dos cálculos e a da requisição\nou do precatório.","refs":["291"]},{"id":"rep_2019_568","tema":"568","texto":"TEMA 568: A **efetiva constrição patrimonial e a\nefetiva citação<strong> (ainda que por edital) são </strong>aptas a interromper** o\ncurso da prescrição intercorrente, <strong>não bastando</strong> para tal o **mero\npeticionamento** em juízo, requerendo, v.g., a feitura da penhora sobre\nativos financeiros ou sobre outros bens. ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933)\n) <strong>(FGV-TJSC-JUIZ/2024.2)</strong>","refs":["568"]},{"id":"rep_2019_587","tema":"587","texto":"TEMA 587: a) Os embargos do devedor são ação de\nconhecimento incidental à execução, razão porque os honorários\nadvocatícios podem ser fixados em cada uma das duas ações, de forma\nrelativamente autônoma, respeitando-se os limites de repercussão\nrecíproca entre elas, desde que a cumulação da verba honorária não\nexceda o limite máximo previsto no § 3º do art. 20 do CPC/1973. b)\nInexistência de reciprocidade das obrigações ou de bilateralidade de\ncréditos: ausência dos pressupostos do instituto da compensação (art.\n368 do Código Civil). Impossibilidade de se compensarem os honorários\nfixados em embargos à execução com aqueles fixados na própria ação de\nexecução. ([REsp\n1520710/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500567270);\n[REsp\n1349029/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201202196469)\n)\n\n<strong>TEMA 923:</strong> Até o trânsito em julgado das ações civis\npúblicas n. 5004891-93.2011.4004.7000 e n. 2001.70.00.019188-2, em\ntramitação na Vara Federal Ambiental, Agrária e Residual de Curitiba,\natinentes à macrolide geradora de processos multitudinários em razão de\nsuposta exposição à contaminação ambiental, decorrente da exploração de\njazida de chumbo no Município de Adrianópolis-PR, deverão ficar\nsuspensas as ações individuais.\n\n<strong>TEMA 1001:</strong> A teor dos arts. 27 e 511, § 1º, do\nrevogado CPC/73 (arts. 91 e 1.007, § 1º, do vigente CPC/15), o Instituto\nNacional do Seguro Social - INSS, nos recursos de competência dos\nTribunais de Justiça, está dispensado do prévio pagamento do porte de\nremessa e de retorno, enquanto parcela integrante do preparo, devendo\nrecolher o respectivo valor somente ao final da demanda, acaso vencido.","refs":["923","587","1001"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2019_966","tema":"966","texto":"TEMA 966: Incide o prazo decadencial previsto no caput\ndo artigo 103 da Lei 8.213/1991 para reconhecimento do direito adquirido\nao benefício previdenciário mais vantajoso.","refs":["966"]},{"id":"rep_2019_998","tema":"998","texto":"TEMA 998: O Segurado que exerce atividades em\ncondições especiais, quando em gozo de auxílio-doença, seja acidentário\nou previdenciário, faz jus ao cômputo desse mesmo período como tempo de\nserviço especial.","refs":["998"]},{"id":"rep_2019_1007","tema":"1007","texto":"TEMA 1007: O tempo de serviço rural, [ainda que remoto\ne descontínuo], <strong>anterior ao advento da Lei 8.213/1991</strong>,\n<strong>pode ser computado para fins da carência</strong> necessária à obtenção da\naposentadoria híbrida por idade, <strong>ainda que</strong> não tenha sido efetivado\no recolhimento das contribuições, nos termos do art. 48, § 3o. da Lei\n8.213/1991, seja qual for a predominância do labor misto exercido no\nperíodo de carência ou o tipo de trabalho exercido no momento do\nimplemento do requisito etário ou do requerimento administrativo.\n\n<strong>TEMA 563</strong>: No âmbito do Regime Geral de Previdência\nSocial - RGPS, somente lei pode criar benefícios e vantagens\nprevidenciárias, não havendo, por ora, previsão legal do direito à\n\\'desaposentação\\', sendo constitucional a regra do art. 18, § 2º, da\nLei nº 8.213/91.\n\n<strong>TEMA 907</strong>: O regulamento aplicável ao participante de\nplano fechado de previdência privada para fins de cálculo da renda\nmensal inicial do benefício complementar é aquele vigente no momento da\nimplementação das condições de elegibilidade, haja vista a natureza\ncivil e estatutária, e não o da data da adesão, assegurado o direito\nacumulado.","refs":["907","563","1007"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2019_984","tema":"984","texto":"TEMA 984: 1ª) As tabelas de honorários elaboradas\nunilateralmente pelos Conselhos Seccionais da OAB não vinculam o\nmagistrado no momento de arbitrar o valor da remuneração a que faz jus o\ndefensor dativo que atua no processo penal; servem como referência para\no estabelecimento de valor que seja justo e que reflita o labor\ndespendido pelo advogado; 2ª) Nas hipóteses em que o juiz da causa\nconsiderar desproporcional a quantia indicada na tabela da OAB em\nrelação aos esforços despendidos pelo defensor dativo para os atos\nprocessuais praticados, poderá, motivadamente, arbitrar outro valor; 3ª)\nSão, porém, vinculativas, quanto aos valores estabelecidos para os atos\npraticados por defensor dativo, as tabelas produzidas mediante acordo\nentre o Poder Público, a Defensoria Pública e a seccional da OAB. 4ª)\nDado o disposto no art. 105, parágrafo único, II, da Constituição da\nRepública, possui caráter vinculante a Tabela de Honorários da Justiça\nFederal, assim como tabelas similares instituídas, eventualmente, pelos\nórgãos competentes das Justiças dos Estados e do Distrito Federal, na\nforma dos arts 96, I, e 125, § 1º, parte final, da Constituição da\nRepública.","refs":["984"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2019_118","tema":"118","texto":"TEMA 118: (a) tratando-se de Mandado de Segurança\nimpetrado com vistas a declarar o direito à compensação tributária, em\nvirtude do reconhecimento da ilegalidade ou inconstitucionalidade da\nanterior exigência da exação, independentemente da apuração dos\nrespectivos valores, é suficiente, para esse efeito, a\ncomprovação cabal de que o impetrante ocupa a posição de credor\ntributário, visto que os comprovantes de recolhimento indevido serão\nexigidos posteriormente, na esfera administrativa, quando o procedimento\nde compensação for submetido à verificação pelo Fisco; e (b) tratando-se\nde Mandado de Segurança com vistas a obter juízo específico sobre as\nparcelas a serem compensadas, com efetiva alegação da liquidez e certeza\ndos créditos, ou, ainda, na hipótese em que os efeitos da sentença\nsupõem a efetiva homologação da compensação a ser realizada, o crédito\ndo Contribuinte depende de quantificação, de modo que a inexistência de\ncomprovação suficiente dos valores indevidamente recolhidos representa a\nausência de prova pré-constituída indispensável à propositura da ação\nmandamental.","refs":["118"]},{"id":"rep_2019_695","tema":"695","texto":"TEMA 695: <strong>Incide</strong> IPI sobre veículo importado para\nuso próprio, haja vista que tal cobrança <strong>não viola</strong> o princípio da\nnão cumulatividade nem configura bitributação.","refs":["695"]},{"id":"rep_2019_777","tema":"777","texto":"TEMA 777: A Fazenda pública <strong>possui</strong> interesse e\npode efetivar o <strong>protesto da CDA,</strong> documento de dívida, na forma do\nart. 1º, parágrafo único, da Lei 9.492/1997, com a redação dada pela Lei\n12.767/2012. ([REsp\n1686659/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201701792002);\n[REsp\n1139774/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900897325);\n[REsp\n1126515/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900420648)\n; [REsp\n1684690/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201701792115))\n**(CESPE-PREF CACHOEIRO DE ITAPEMIRIM-AUDITOR FISCAL TRIB MUN)\n(VUNESP-MPRO-PROMOTOR/2024)**","refs":["777"]},{"id":"rep_2019_969","tema":"969","texto":"TEMA 969: O encargo do DL n. 1.025/1969 tem as mesmas\npreferências do crédito tributário devendo, por isso, ser classificado,\nna falência, na ordem estabelecida pelo art. 83, III, da Lei n.\n11.101/2005. ([REsp\n1521999/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500713173);\n[REsp\n1525388/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500856994))","refs":["969"]},{"id":"rep_2019_963","tema":"963","texto":"TEMA 963: Não há direito de regresso\nportanto <strong>não é cabível</strong> a execução regressiva proposta pela\nELETROBRÁS contra a UNIÃO em razão da condenação das mesmas ao pagamento\ndas diferenças na devolução do empréstimo compulsório sobre o consumo de\nenergia elétrica ao PARTICULAR CONTRIBUINTE da exação.","refs":["963"]},{"id":"rep_2019_994","tema":"994","texto":"TEMA 994: ~~Os valores de ICMS <strong>não integram</strong> a base\nde cálculo da Contribuição Previdenciária sobre a Receita Bruta - CPRB,\ninstituída pela Medida Provisória n. 540/2011, convertida na Lei n.\n12.546/2011~~. (tese originária)\n\n\\[Ocorre que,em juízo de retratação, consoante o disposto no art. 1.040,\nII, do CPC⁄2015, e 256-S, § 1º, do RISTJ, **propõe-se a adequação da\ntese fixada no Tema 994⁄STJ**, em obediência à tese fixada no Tema\n1.048⁄STF, a qual passa a ostentar a seguinte redação: **\\\"É\nconstitucional a inclusão do Imposto Sobre Circulação de Mercadorias e\nServiços - ICMS na base de cálculo da Contribuição Previdenciária sobre\na Receita Bruta - CPRB\\\"**.\\]\n\n<strong>TEMA 3 (IAC):</strong> <strong>Não é cabível</strong> mandado de segurança\ncontra decisão proferida em execução fiscal no contexto do art. 34 da\nLei n. 6.830/80.","refs":["994","3","1"]}],"DIREITO CIVIL":[{"id":"rep_2019_970","tema":"970","texto":"TEMA 970: A cláusula penal moratória tem a finalidade\nde indenizar pelo adimplemento tardio da obrigação, e, em\nregra, estabelecida em valor equivalente ao locativo, **afasta-se sua\ncumulação com lucros cessantes.** (INFO 651) [(REsp\n1.498.484-DF;] [REsp\n1635428/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201602850005))\n(FGV/2022) **(FGV-TJPR/2021) (FGV-ALTO-PROCURADOR/2024)\n(FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)**\n\n<strong>TEMA 971</strong>: No contrato de adesão firmado entre o\ncomprador e a construtora/incorporadora, havendo previsão de cláusula\npenal apenas para o inadimplemento do adquirente, [deverá ela ser\nconsiderada para a fixação da indenização pelo inadimplemento do\nvendedor]. As obrigações heterogêneas (obrigações de fazer e\nde dar) serão convertidas em dinheiro, por arbitramento judicial.","refs":["971","970"]},{"id":"rep_2019_996","tema":"996","texto":"TEMA 996: As teses firmadas, para os fins do artigo\n1.036 do CPC/2015, em contrato de promessa de compra e venda de imóvel\nna planta, no âmbito do Programa Minha Casa, Minha Vida, para os\nbeneficiários das faixas de renda 1, 5, 2 e 3, foram as seguintes: 1.1.\nNa aquisição de unidades autônomas em construção, o contrato deverá\nestabelecer, de forma clara, expressa e inteligível, o prazo certo para\na entrega do imóvel, o qual não poderá estar vinculado à concessão do\nfinanciamento, ou a nenhum outro negócio jurídico, exceto o acréscimo do\nprazo de tolerância; 1.2. No caso de descumprimento do prazo para a\nentrega do imóvel, incluído o período de tolerância, o prejuízo do\ncomprador é presumido, consistente na injusta privação do uso do bem, a\nensejar o pagamento de indenização, na forma de aluguel mensal, com base\nno valor locatício de imóvel assemelhado, com termo final na data da\ndisponibilização da posse direta ao adquirente da unidade autônoma. 1.3.\nÉ ilícito cobrar do adquirente juros de obra, ou outro encargo\nequivalente, após o prazo ajustado no contrato para a entrega das chaves\nda unidade autônoma, incluído o período de tolerância. 1.4. O\ndescumprimento do prazo de entrega do imóvel, computado o período de\ntolerância, faz cessar a incidência de correção monetária sobre o saldo\ndevedor com base em indexador setorial, que reflete o custo da\nconstrução civil, o qual deverá ser substituído pelo IPCA, salvo quando\neste último for mais gravoso ao consumidor.","refs":["996"]},{"id":"rep_2019_1002","tema":"1002","texto":"TEMA 1002: Nos compromissos de compra e venda de\nunidades imobiliárias anteriores à Lei n. 13.786/2018, em que é\npleiteada a resolução do contrato por iniciativa do promitente comprador\nde forma diversa da cláusula penal convencionada, os juros de mora\nincidem a partir do trânsito em julgado da decisão.","refs":["1002"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2019_974","tema":"974","texto":"TEMA 974: A Lei 12.855/2013, que instituiu a\nIndenização por Trabalho em Localidade Estratégica, é norma de eficácia\ncondicionada à prévia regulamentação, para definição das localidades\nconsideradas estratégicas, para fins de pagamento da referida vantagem.\n([REsp\n1617086/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601986614);\n[REsp\n1612778/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601807263))","refs":["974"]}]},"2018":{"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2018_988","tema":"988","texto":"TEMA 988: O rol do art. 1.015 do CPC é de\n<strong>taxatividade mitigada</strong>, por isso admite a interposição de agravo de\ninstrumento quando verificada a u<strong>rgência decorrente da inutilidade</strong>\ndo julgamento da questão no recurso de apelação. [(REsp\n1.704.520-MT)] **[(VUNESP-CÂMARA DE\nTANABI/SP-ADVOGADO/2023)] (FGV-DPE/PE-DEFENSOR/2025)**\n\n[\\[Modulação de efeitos: \\\" Embora não haja risco de as partes que\nconfiaram na absoluta taxatividade serem surpreendidas pela tese\njurídica firmada neste recurso especial repetitivo, pois somente haverá\npreclusão quando o recurso eventualmente interposto pela parte venha a\nser admitido pelo Tribunal, modulam-se os efeitos da presente decisão, a\nfim de que a tese jurídica apenas seja aplicável às decisões\ninterlocutórias proferidas após a publicação do presente acórdão.\\\"\n(acórdão publicado no DJe de 19/12/2018)\\]]","refs":["988"]},{"id":"rep_2018_566","tema":"566","texto":"TEMA 566: O prazo de 1 (um) ano de suspensão do\nprocesso e do respectivo prazo prescricional previsto no art. 40, §§ 1º\ne 2º da Lei n. 6.830/80 - LEF tem início automaticamente na data da\nciência da Fazenda Pública a respeito da não localização do devedor ou\nda inexistência de bens penhoráveis no endereço fornecido, havendo, sem\nprejuízo dessa contagem automática, o dever de o magistrado declarar ter\nocorrido a suspensão da execução. ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))","refs":["566"]},{"id":"rep_2018_567","tema":"567","texto":"TEMA 567: [Havendo ou não petição da Fazenda Pública e\nhavendo ou não pronunciamento judicial nesse sentido, findo o prazo de 1\n(um) ano de suspensão inicia-se automaticamente o prazo prescricional\naplicável.] ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))\n\n[","refs":["567"]},{"id":"rep_2018_568","tema":"568","texto":"TEMA 568: A efetiva constrição patrimonial e a\nefetiva citação (ainda que por edital) são aptas a interromper o curso\nda prescrição intercorrente, não bastando para tal o mero peticionamento\nem juízo, requerendo, v.g., a feitura da penhora sobre ativos\nfinanceiros ou sobre outros bens.] ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))","refs":["568"]},{"id":"rep_2018_569","tema":"569","texto":"TEMA 569: <strong>Havendo ou não petição</strong> da Fazenda\nPública e <strong>havendo ou não pronunciamento</strong> judicial nesse sentido,\n<strong>findo o prazo de 1 (um) ano de suspensão i</strong>nicia-se o prazo\nprescricional aplicável. ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))\n\n[","refs":["569"]},{"id":"rep_2018_570","tema":"570","texto":"TEMA 570: A Fazenda Pública, em sua primeira\noportunidade de falar nos autos (art. 245 do CPC/73, correspondente ao\nart. 278 do CPC/2015), ao alegar nulidade pela falta de qualquer\nintimação dentro do procedimento do art. 40 da LEF, deverá demonstrar o\nprejuízo que sofreu (exceto a falta da intimação que constitui o termo\ninicial - 4.1., onde o prejuízo é presumido), por exemplo, deverá\ndemonstrar a ocorrência de qualquer causa interruptiva ou suspensiva da\nprescrição.] ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))\n\n[","refs":["570"]},{"id":"rep_2018_571","tema":"571","texto":"TEMA 571: A Fazenda Pública, em sua primeira\noportunidade de falar nos autos (art. 245 do CPC/73, correspondente ao\nart. 278 do CPC/2015), ao alegar nulidade pela falta de qualquer\nintimação dentro do procedimento do art. 40 da LEF, deverá demonstrar o\nprejuízo que sofreu (exceto a falta da intimação que constitui o termo\ninicial - 4.1., onde o prejuízo é presumido), por exemplo, deverá\ndemonstrar a ocorrência de qualquer causa interruptiva ou suspensiva da\nprescrição.] ([REsp\n1340553/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201691933))","refs":["571"]},{"id":"rep_2018_967","tema":"967","texto":"TEMA 967: Em ação consignatória, a <strong>insuficiência</strong>\ndo depósito realizado pelo devedor conduz ao julgamento de\n<strong>improcedência do pedido</strong>, pois o pagamento parcial da dívida **não\nextingue** o vínculo obrigacional. (REsp 1.108.058/DF) (INFO 636)\n<strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023) (FGV-ENAM/2025)</strong>","refs":["967"]},{"id":"rep_2018_1__IAC_","tema":"1 (IAC)","texto":"TEMA 1 (IAC): 1.1. Incide a prescrição intercorrente,\nnas causas regidas pelo CPC/73, quando o exequente permanece inerte por\nprazo superior ao de prescrição do direito material vindicado, conforme\ninterpretação extraída do art. 202, parágrafo único, do Código Civil de\n2002. 1.2. O termo inicial do prazo prescricional, na vigência do\nCPC/1973, conta-se do fim do prazo judicial de suspensão do processo ou,\ninexistindo prazo fixado, do transcurso de um ano (aplicação analógica\ndo art. 40, § 2º, da Lei 6.830/1980). 1.3. O termo inicial do art. 1.056\ndo CPC/2015 tem incidência apenas nas hipóteses em que o processo se\nencontrava suspenso na data da entrada em vigor da novel lei processual,\numa vez que não se pode extrair interpretação que viabilize o reinício\nou a reabertura de prazo prescricional ocorridos na vigência do revogado\nCPC/1973 (aplicação irretroativa da norma processual). 1.4. O\ncontraditório é princípio que deve ser respeitado em todas as\nmanifestações do Poder Judiciário, que deve zelar pela sua observância,\ninclusive nas hipóteses de declaração de ofício da prescrição\nintercorrente, devendo o credor ser previamente intimado para opor algum\nfato impeditivo à incidência da prescrição. (REsp 1.604.412/SC)","refs":["1"]},{"id":"rep_2018_910","tema":"910","texto":"TEMA 910: Legitimidade passiva da TELEBRAS, bem como\ndas companhias cindendas (ou sucessoras destas), para a ação de\ncomplementação de ações, na hipótese em que as ações originárias tenham\nsido emitidas pela TELEBRAS.(REsp 1.651.814/SP e REsp 1.633.801/SP)","refs":["910"]},{"id":"rep_2018_973","tema":"973","texto":"TEMA 973: O art. 85, § 7º, do CPC/2015 <strong>não afasta</strong>\na aplicação do entendimento consolidado na Súmula 345 do STJ, de modo\nque são devidos honorários advocatícios nos procedimentos individuais de\ncumprimento de sentença decorrente de ação coletiva, ainda que não\nimpugnados e promovidos em litisconsórcio. (REsp 1.648.238/RS, REsp\n1.648.498/RS e REsp 1.650.588/RS)","refs":["973"]},{"id":"rep_2018_880","tema":"880","texto":"TEMA 880: A partir da vigência da Lei n. 10.444/2002,\nque incluiu o § 1º ao art. 604, dispositivo que foi sucedido, conforme\nLei n. 11.232/2005, pelo art. 475-B, §§ 1º e 2º, todos do CPC/1973,\n<strong>não é mais imprescindível,</strong> para acertamento da conta exequenda, a\n<strong>juntada de documentos pela parte executada,</strong> ainda que esteja\npendente de envio eventual **documentação requisitada pelo juízo ao\ndevedor,<strong> que </strong>não tenha havido dita requisiçã**o, por qualquer\nmotivo, ou mesmo que a documentação tenha sido encaminhada de forma\n<strong>incompleta</strong> pelo executado. Assim, sob a égide do diploma legal\ncitado e para as decisões transitadas em julgado sob a vigência do\nCPC/1973, a demora, independentemente do seu motivo, para juntada das\nfichas financeiras ou outros documentos correlatos aos autos da\nexecução, ainda que sob a responsabilidade do devedor ente público, não\nobsta o transcurso do lapso prescricional executório, nos termos da\nSúmula 150/STF. (EDcl no REsp 1.336.026/PE)\n\n\\[Modulação de efeitos: Os efeitos decorrentes dos\ncomandos contidos neste acórdão ficam modulados a partir de 30/6/2017,\ncom fundamento no § 3º do art. 927 do CPC/2015. Resta firmado, com essa\nmodulação, que, para as decisões transitadas em julgado até 17/3/2016\n(quando ainda em vigor o CPC/1973) e que estejam dependendo, para\ningressar com o pedido de cumprimento de sentença, do fornecimento pelo\nexecutado de documentos ou fichas financeiras (tenha tal providência\nsido deferida, ou não, pelo juiz ou esteja, ou não, completa a\ndocumentação), o prazo prescricional de 5 anos para propositura da\nexecução ou cumprimento de sentença conta-se a partir de 30/6/2017.\\]","refs":["880"]},{"id":"rep_2018_766","tema":"766","texto":"TEMA 766: O Ministério Público é <strong>parte legítima</strong>\npara pleitear tratamento médico ou entrega de medicamentos nas demandas\nde saúde propostas contra os entes federativos, <strong>mesmo quando</strong> se\ntratar de feitos contendo beneficiários individualizados, porque se\nrefere a direitos individuais indisponíveis, na forma do art. 1º da Lei\nn. 8.625/1993 (Lei Orgânica Nacional do Ministério Público). (REsp\n1.681.690/SP)\n\n\\[\\* O acórdão de afetação do REsp 1.682.836/SP, vinculado a esse tema,\nfoi publicado no dia 30/4/2018, conforme noticiado no boletim anterior.\n\\]","refs":["766"]},{"id":"rep_2018_950","tema":"950","texto":"TEMA 950: [As questões acerca do trade dress\n(conjunto-imagem) dos produtos, concorrência desleal, e outras demandas\nafins, por **não envolver registro no INPI e cuidando de ação judicial\nentre particulares<strong>, é </strong>inequivocamente<strong> de </strong>competência** da\n<strong>justiça estadual</strong>, já que não afeta interesse institucional da\nautarquia federal. No entanto, compete à Justiça Federal, em ação de\nnulidade de registro de marca, com a participação do INPI, impor ao\ntitular a abstenção do uso, inclusive no tocante à tutela provisória.\n(][REsp\n1527232/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500535587)P)\n<strong>(FGV-TJES-JUIZ/2023)</strong>","refs":["950"]}],"DIREITO CIVIL":[{"id":"rep_2018_958","tema":"958","texto":"TEMA 958: 2.1. Abusividade da cláusula que prevê a\ncobrança de ressarcimento de serviços prestados por terceiros, sem a\nespecificação do serviço a ser efetivamente prestado; 2.2. Abusividade\nda cláusula que prevê o ressarcimento pelo consumidor da comissão do\ncorrespondente bancário, em contratos celebrados a partir de 25/02/2011,\ndata de entrada em vigor da Res.-CMN 3.954/2011, sendo válida a cláusula\nno período anterior a essa resolução, ressalvado o controle da\nonerosidade excessiva; 2.3. Validade da tarifa de avaliação do bem dado\nem garantia, bem como da cláusula que prevê o ressarcimento de despesa\ncom o registro do contrato, ressalvadas a: 2.3.1. abusividade da\ncobrança por serviço não efetivamente prestado; e a 2.3.2. possibilidade\nde controle da onerosidade excessiva, em cada caso concreto.","refs":["958"]},{"id":"rep_2018_972","tema":"972","texto":"TEMA 972: 1 - Abusividade da cláusula que prevê o\nressarcimento pelo consumidor da despesa com o registro do pré-gravame,\nem contratos celebrados a partir de 25/02/2011, data de entrada em\nPágina 4 de 8 vigor da Res.-CMN 3.954/2011, sendo válida a cláusula\npactuada no período anterior a essa resolução, ressalvado o controle da\nonerosidade excessiva. 2 - Nos contratos bancários em geral, o\nconsumidor não pode ser compelido a contratar seguro com a instituição\nfinanceira ou com seguradora por ela indicada. 3 - A abusividade de\nencargos acessórios do contrato não descaracteriza a mora. ([REsp\n1639320/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603072869);\n[REsp\n1639259/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603068997))\n\n\\[Delimitação do Julgado: [Contratos bancários celebrados a partir de\n30/04/2008, com instituições financeiras ou equiparadas, seja\ndiretamente, seja por intermédio de correspondente bancário, no âmbito\ndas relações de consumo.\\]]","refs":["972"]},{"id":"rep_2018_960","tema":"960","texto":"TEMA 960: Ressalvada a denominada Faixa 1, em que não\nhá intermediação imobiliária, é válida a cláusula contratual que\ntransfere ao promitente-comprador a obrigação de pagar a comissão de\ncorretagem nos contratos de promessa de compra e venda do Programa Minha\nCasa, Minha Vida, desde que previamente informado o preço total da\naquisição da unidade autônoma, com o destaque do valor da comissão de\ncorretagem. (REsp 1.601.149/RS e REsp 1.602.042/RS)","refs":["960"]},{"id":"rep_2018_936","tema":"936","texto":"TEMA 936: I - A patrocinadora **não possui\nlegitimidade passiva** para litígios que envolvam participante/assistido\ne entidade fechada de previdência complementar, ligados estritamente ao\nplano previdenciário, como a concessão e a revisão de benefício ou o\nresgate da reserva de poupança, em virtude de sua personalidade jurídica\nautônoma. II - Não se incluem no âmbito da matéria afetada as causas\noriginadas de eventual ato ilícito, contratual ou extracontratual,\npraticado pelo patrocinador. (REsp 1.370.191/RJ)","refs":["936"]},{"id":"rep_2018_968","tema":"968","texto":"TEMA 968: Descabimento da repetição do indébito com os\nmesmos encargos do contrato. (REsp 1.552.434/GO)\n\n\\[Delimitação do Julgado: A 2ª Seção, na sessão de\njulgamento de 13/06/2018, definiu que a tese firmada é aplicável a todo\ncontrato de mútuo feneratício celebrado com instituição financeira\nmutuante.\\]","refs":["968"]},{"id":"rep_2018_905","tema":"905","texto":"TEMA 905: <strong>1. Correção monetária</strong>: o art. 1º-F da\nLei 9.494/97 (com redação dada pela Lei 11.960/2009), para fins de\ncorreção monetária, não é aplicável nas condenações judiciais impostas à\nFazenda Pública, independentemente de sua natureza. 1.1 Impossibilidade\nde fixação apriorística da taxa de correção monetária. No presente\njulgamento, o estabelecimento de índices que devem ser aplicados a\ntítulo de correção monetária não implica pré-fixação (ou fixação\napriorística) de taxa de atualização monetária. Do contrário, a decisão\nbaseia-se em índices que, atualmente, refletem a correção monetária\nocorrida no período correspondente. Nesse contexto, em relação às\nsituações futuras, a aplicação dos índices em comento, sobretudo o INPC\ne o IPCA-E, é legítima enquanto tais índices sejam capazes de captar o\nfenômeno inflacionário. 1.2 Não cabimento de modulação dos efeitos da\ndecisão. A modulação dos efeitos da decisão que declarou\ninconstitucional a atualização monetária dos débitos da Fazenda Pública\ncom base no índice oficial de remuneração da caderneta de poupança, no\nâmbito do Supremo Tribunal Federal, objetivou reconhecer a validade dos\nprecatórios expedidos ou pagos até 25 de março de 2015, impedindo, desse\nmodo, a rediscussão do débito baseada na aplicação de índices diversos.\nAssim, mostra-se descabida a modulação em relação aos casos em que não\nocorreu expedição ou pagamento de precatório. <strong>2. Juros de mora</strong>: o\nart. 1º-F da Lei 9.494/97 (com redação dada pela Lei 11.960/2009), na\nparte em que estabelece a incidência de juros de mora nos débitos da\nFazenda Pública com base no índice oficial de remuneração da caderneta\nde poupança, aplica-se às condenações impostas à Fazenda Pública,\nexcepcionadas as condenações oriundas de relação jurídico-tributária.\n<strong>3. Índices aplicáveis a depender da natureza da condenação</strong>. 3.1\nCondenações judiciais de natureza administrativa em geral. As\ncondenações judiciais de natureza administrativa em geral, sujeitam-se\naos seguintes encargos: (a) até dezembro/2002: juros de mora de 0,5% ao\nmês; correção monetária de acordo com os índices previstos no Manual de\nCálculos da Justiça Federal, com destaque para a incidência do IPCA-E a\npartir de janeiro/2001; (b) no período posterior à vigência do CC/2002 e\nanterior à vigência da Lei 11.960/2009: juros de mora correspondentes à\ntaxa Selic, vedada a cumulação com qualquer outro índice; (c) período\nposterior à vigência da Lei 11.960/2009: juros de mora segundo o índice\nde remuneração da caderneta de poupança; correção monetária com base no\nIPCA-E. 3.1.1 Condenações judiciais referentes a servidores e empregados\npúblicos. As condenações judiciais referentes a servidores e empregados\npúblicos, sujeitam-se aos seguintes encargos: (a) até julho/2001: juros\nde mora: 1% ao mês (capitalização simples); correção monetária: índices\nprevistos no Manual de Cálculos da Justiça Federal, com destaque para a\nincidência do IPCA-E a partir de janeiro/2001; (b) agosto/2001 a\njunho/2009: juros de mora: 0,5% ao mês; correção monetária: IPCA-E; (c)\na partir de julho/2009: juros de mora: remuneração oficial da caderneta\nde poupança; correção monetária: IPCA-E. 3.1.2 Condenações judiciais\nreferentes a desapropriações diretas e indiretas. No âmbito das\ncondenações judiciais referentes a desapropriações diretas e indiretas\nexistem regras específicas, no que concerne aos juros moratórios e\ncompensatórios, razão pela qual não se justifica a incidência do art.\n1º-F da Lei 9.494/97 (com redação dada pela Lei 11.960/2009), nem para\ncompensação da mora nem para remuneração do capital. 3.2 Condenações\njudiciais de natureza previdenciária. As condenações impostas à Fazenda\nPública de natureza previdenciária sujeitam-se à incidência do INPC,\npara fins de correção monetária, no que se refere ao período posterior à\nvigência da Lei 11.430/2006, que incluiu o art. 41-A na Lei 8.213/91.\nQuanto aos juros de mora, incidem segundo a remuneração oficial da\ncaderneta de poupança (art. 1º-F da Lei 9.494/97, com redação dada pela\nLei n. 11.960/2009). 3.3 Condenações judiciais de natureza tributária. A\ncorreção monetária e a taxa de juros de mora incidentes na repetição de\nindébitos tributários devem corresponder às utilizadas na cobrança de\ntributo pago em atraso. Não havendo disposição legal específica, os\njuros de mora são calculados à taxa de 1% ao mês (art. 161, § 1º, do\nCTN). Observada a regra isonômica e havendo previsão na legislação da\nentidade tributante, é legítima a utilização da taxa Selic, sendo vedada\nsua cumulação com quaisquer outros índices. **4. Preservação da coisa\njulgada.** Não obstante os índices estabelecidos para atualização\nmonetária e compensação da mora, de acordo com a natureza da condenação\nimposta à Fazenda Pública, cumpre ressalvar eventual coisa julgada que\ntenha determinado a aplicação de índices diversos, cuja\nconstitucionalidade/legalidade há de ser aferida no caso concreto.","refs":["905"]},{"id":"rep_2018_955","tema":"955","texto":"TEMA 955: [I - A concessão do benefício de previdência\ncomplementar tem como pressuposto a prévia formação de reserva\nmatemática, de forma a evitar o desequilíbrio atuarial dos planos. Em\ntais condições, quando já concedido o benefício de complementação de\naposentadoria por entidade fechada de previdência privada, é inviável a\ninclusão dos reflexos das verbas remuneratórias (horas extras)\nreconhecidas pela Justiça do Trabalho nos cálculos da renda mensal\ninicial dos benefícios de complementação de aposentadoria;]\n\n[II - Os eventuais prejuízos causados ao participante ou ao assistido\nque não puderam contribuir ao fundo na época apropriada ante o ato\nilícito do empregador poderão ser reparados por meio de ação judicial a\nser proposta contra a empresa ex-empregadora na Justiça do\nTrabalho;]\n\n[III - Modulação de efeitos (art. 927, § 3º, do CPC/2015): para as\ndemandas ajuizadas na Justiça Comum até a data do presente julgamento, e\nainda sendo útil ao participante ou assistido, conforme as\npeculiaridades da causa, admite-se a inclusão dos reflexos de verbas\nremuneratórias (horas extras), reconhecidas pela Justiça do Trabalho,\nnos cálculos da renda mensal inicial dos benefícios de complementação de\naposentadoria, condicionada à previsão regulamentar (expressa ou\nimplícita) e à recomposição prévia e integral das reservas matemáticas\ncom o aporte de valor a ser apurado por estudo técnico atuarial em cada\ncaso;]\n\n[IV - Nas reclamações trabalhistas em que o ex-empregador tiver sido\ncondenado a recompor a reserva matemática, e sendo inviável a revisão da\nrenda mensal inicial da aposentadoria complementar, os valores\ncorrespondentes a tal recomposição devem ser entregues ao participante\nou assistido a título de reparação, evitando-se, igualmente, o\nenriquecimento sem causa do ente fechado de previdência\ncomplementar.] ([REsp\n1312736/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201200647966))","refs":["955"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2018_980","tema":"980","texto":"TEMA 980: (i) O termo inicial do prazo prescricional\nda cobrança judicial do Imposto Predial e Territorial Urbano - IPTU\n<strong>inicia-se no dia seguinte à data estipulada para o vencimento</strong> da\nexação; (ii) o parcelamento de ofício da dívida tributária n**ão\nconfigura causa interruptiva** da contagem da prescrição, uma vez que o\ncontribuinte não anuiu. REsp n. 1.658.517/PA e REsp n. 1.641.011/PA)\n**(FGV-CÂMARA DE FORTALEZA-ADVOGADO/2024) (FGV-PREF DE CARAGUATATUBA\nSP-PROCURADOR/024) (FGV-TJAP-JUIZ/2022) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["980"]},{"id":"rep_2018_761","tema":"761","texto":"TEMA 761: Inexigibilidade do ressarcimento de custos e\ndemais encargos pelo fornecimento de selos de controle de IPI instituído\npelo DL 1.437/1975, que, embora denominado ressarcimento prévio, é\ntributo da espécie Taxa de Poder de Polícia, de modo que há vício de\nforma na instituição desse tributo por norma infralegal, excluídos os\nfatos geradores ocorridos após a vigência da Lei 12.995/2014. Aqui se\ntrata de observância à estrita legalidade tributária. (REsp n.\n1.405.244/SP)","refs":["761"]},{"id":"rep_2018_779_e_780","tema":"779 e 780","texto":"TEMA 779 e 780: : (a) é <strong>ilegal</strong> a disciplina de\ncreditamento prevista nas Instruções Normativas da SRF ns. 247/2002 e\n404/2004, porquanto compromete a eficácia do sistema de **não\ncumulatividade** da contribuição ao PIS e da COFINS, tal como definido\nnas Leis 10.637/2002 e 10.833/2003; e (b) o conceito de insumo deve ser\naferido à luz dos critérios de essencialidade ou relevância, ou seja,\nconsiderando-se a **imprescindibilidade ou a importância de determinado\nitem** - bem ou serviço - para o desenvolvimento da atividade econômica\ndesempenhada pelo Contribuinte.","refs":["779"]}],"DIREITO DO CONSUMIDOR":[{"id":"rep_2018_989","tema":"989","texto":"TEMA 989: Nos planos de saúde coletivos **custeados\nexclusivamente pelo empregador<strong> </strong>não há direito de permanência** do\nex-empregado aposentado ou demitido sem justa causa como beneficiário,\n<strong>salvo</strong> disposição contrária expressa prevista em contrato ou em\nacordo/convenção coletiva de trabalho, não caracterizando contribuição o\npagamento apenas de coparticipação, tampouco se enquadrando como salário\nindireto. (REsp 1.680.318/SP e REsp 1.708.104/SP)","refs":["989"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2018_982","tema":"982","texto":"TEMA 982: Comprovadas a invalidez e a necessidade de\nassistência permanente de terceiro, é devido o acréscimo de 25% (vinte e\ncinco por cento), previsto no art. 45 da Lei n. 8.213/91, a todos os\naposentados pelo RGPS, independentemente da modalidade de aposentadoria.\n(REsp 1.648.305/RS e REsp 1.720.805/RJ)","refs":["982"]},{"id":"rep_2018_995","tema":"995","texto":"TEMA 995: I - A concessão do benefício de previdência\ncomplementar tem como pressuposto a prévia formação de reserva\nmatemática, de forma a evitar o desequilíbrio atuarial dos planos. Em\ntais condições, quando já concedido o benefício de complementação de\naposentadoria por entidade fechada de previdência privada, é inviável a\ninclusão dos reflexos das verbas remuneratórias (horas extras)\nreconhecidas pela Justiça do Trabalho nos cálculos da renda mensal\ninicial dos benefícios de complementação de aposentadoria; II - Os\neventuais prejuízos causados ao participante ou ao assistido que não\npuderam contribuir ao fundo na época apropriada ante o ato ilícito do\nempregador poderão ser reparados por meio de ação judicial a ser\nproposta contra a empresa ex-empregadora na Justiça do Trabalho; III -\nModulação de efeitos (art. 927, § 3º, do CPC/2015): para as demandas\najuizadas na Justiça Comum até a data do presente julgamento, e ainda\nsendo útil ao participante ou assistido, conforme as peculiaridades da\ncausa, admite-se a inclusão dos reflexos de verbas remuneratórias (horas\nextras), reconhecidas pela Justiça do Trabalho, nos cálculos da renda\nmensal inicial dos benefícios de complementação de aposentadoria,\ncondicionada à previsão regulamentar (expressa ou implícita) e à\nrecomposição prévia e integral das reservas matemáticas com o aporte de\nvalor a ser apurado por estudo técnico atuarial em cada caso; IV - Nas\nreclamações trabalhistas em que o ex-empregador tiver sido condenado a\nrecompor a reserva matemática, e sendo inviável a revisão da renda\nmensal inicial da aposentadoria complementar, os valores correspondentes\na tal recomposição devem ser entregues ao participante ou assistido a\ntítulo de reparação, evitando-se, igualmente, o enriquecimento sem causa\ndo ente fechado de previdência complementar. (REsp 1.312.736/RS)","refs":["995"]},{"id":"rep_2018_609","tema":"609","texto":"TEMA 609: O segurado que tenha provado o desempenho de\nserviço rurícola em período anterior à vigência da Lei n. 8.213/1991,\nembora faça jus à expedição de certidão nesse sentido para mera\naverbação nos seus assentamentos, somente tem direito ao cômputo do\naludido tempo rural, no respectivo órgão público empregador, para\ncontagem recíproca no regime estatutário se, com a certidão de tempo de\nserviço rural, acostar o comprovante de pagamento das respectivas\ncontribuições previdenciárias, na forma da indenização calculada\nconforme o dispositivo do art. 96, IV, da Lei n. 8.213/1991. (REsp\n1.682.671/SP, REsp 1.682.672/SP, REsp 1.682.682/SP e REsp 1.676.865/RS)","refs":["609"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2018_699","tema":"699","texto":"TEMA 699: Na hipótese de débito estrito de recuperação\nde consumo efetivo por fraude no aparelho medidor atribuída ao\nconsumidor, <strong>desde que</strong> apurado em observância aos princípios do\n<strong>contraditório e da ampla defesa,</strong> é <strong>possível o corte</strong>\nadministrativo do fornecimento do serviço de energia elétrica, mediante\n<strong>prévio aviso</strong> ao consumidor, pelo inadimplemento do consumo\nrecuperado correspondente ao período <strong>de 90 (noventa) dias anterior</strong> à\nconstatação da fraude, contanto que **executado o corte em até 90\n(noventa) dias após o vencimento do débito,** sem prejuízo do direito de\na concessionária utilizar os meios judiciais ordinários de cobrança da\ndívida, inclusive antecedente aos mencionados 90 (noventa) dias de\nretroação. ([REsp\n1412433/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301120621)\n; [REsp\n1412435/MT](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301087877);\n[REsp\n1381222/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301056626);\n[REsp\n1101937/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200800471156))\n<strong>(FGV-TJSC-JUIZ/2024.2)</strong>\n\n\\[Delimitação do julgado: [\\\"3. São três os principais cenários de corte\nadministrativo do serviço em decorrência de débitos de consumo de\nenergia elétrica por inadimplemento: a) consumo regular (simples mora do\nconsumidor); b) recuperação de consumo por responsabilidade atribuível à\nconcessionária; e c) recuperação de consumo por responsabilidade\natribuível ao consumidor (normalmente, fraude do medidor).]\n\n[4. O caso tratado no presente recurso representativo da controvérsia é\no do item \\\"c\\\" acima, já que a apuração de débitos pretéritos decorreu\nde fato atribuível ao consumidor: fraude no medidor de consumo.\\\"\n(acórdão publicado no DJe de 28/9/2018).\\]]","refs":["699"]},{"id":"rep_2018_106","tema":"106","texto":"TEMA 106: A concessão dos medicamentos não\nincorporados em atos normativos do SUS exige a <strong>presença cumulativa</strong>\ndos seguintes requisitos: (i) Comprovação, por meio de **laudo médico\nfundamentado** e circunstanciado expedido por médico que assiste o\npaciente, da <strong>imprescindibilidade ou necessidade</strong> do medicamento,\nassim como da <strong>ineficácia</strong>, para o tratamento da moléstia, dos\nfármacos fornecidos pelo SUS; (ii) <strong>incapacidade financeira</strong> de arcar\ncom o custo do medicamento prescrito; (iii) existência de **registro na\nANVISA** do medicamento. (REsp 1.657.156/RJ)\n\n\\[Modulação de efeitos: \\\"Sendo assim, verifica-se que\no caso em tela impõe a esta Corte Superior de Justiça a modulação dos\nefeitos deste julgamento, pois vinculativo (art. 927, inciso III, do\nCPC/2015), no sentido de que os critérios e requisitos estipulados\nsomente serão exigidos para os processos que forem distribuídos a partir\nda conclusão do presente julgamento\\\" (trecho do acórdão publicado no\nDJe de 04/05/2018).\\]","refs":["106"]},{"id":"rep_2018_405","tema":"405","texto":"TEMA 405: O art. 2º, § 6º, inc. VIII, do Decreto n.\n3.179/99 (redação original), quando permite a liberação de veículos e\nembarcações mediante pagamento de multa, não é compatível com o que\ndispõe o art. 25, § 4º, da Lei n. 9.605/98; entretanto, não há\nilegalidade quando o referido dispositivo regulamentar admite a\ninstituição do depositário fiel na figura do proprietário do bem\napreendido por ocasião de infração nos casos em que é apresentada defesa\nadministrativa - anote-se que não se está defendendo a simplória\nliberação do veículo, mas a devolução com a instituição de depósito (e\nos consectários legais que daí advêm), observado, entretanto, que a\nliberação só poderá ocorrer caso o veículo ou a embarcação estejam\nregulares na forma das legislações de regência (Código de Trânsito\nBrasileiro, p. ex.). (REsp 1.133.965/BA)","refs":["405"]},{"id":"rep_2018_731","tema":"731","texto":"TEMA 731: A remuneração das contas vinculadas ao FGTS\ntem disciplina própria, ditada por lei, que estabelece a TR como forma\nde atualização monetária, sendo vedado, portanto, ao Poder Judiciário\nsubstituir o mencionado índice. (REsp 1.614.874/SC)","refs":["731"]},{"id":"rep_2018_965","tema":"965","texto":"TEMA 965: O Departamento Nacional de Infraestrutura de\nTransportes - DNIT detém competência para a fiscalização do trânsito nas\nrodovias e estradas federais, podendo aplicar, em caráter não exclusivo,\npenalidade por infração ao Código de Trânsito Brasileiro, consoante se\nextrai da conjugada exegese dos arts. 82, § 3º, da Lei 10.233/2001 e 21\nda Lei 9.503/97 (Código de Trânsito Brasileiro). (REsp 1.588.969/RS e\nREsp 1.613.733/RS)","refs":["965"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2018_993","tema":"993","texto":"TEMA 993: A **inexistência de estabelecimento penal\nadequado** ao regime prisional determinado para o cumprimento da pena\n<strong>não autoriza</strong> a concessão imediata do benefício da **prisão\ndomiciliar,** porquanto, nos termos da Súmula Vinculante n° 56, é\nimprescindível que a adoção de tal medida seja precedida das\nprovidências estabelecidas no julgamento do RE n° 641.320/RS, quais\nsejam: (i) <strong>saída antecipada</strong> de outro sentenciado no regime com falta\nde vagas, abrindo-se, assim, vagas para os reeducandos que acabaram de\nprogredir; (ii) a <strong>liberdade eletronicamente monitorada</strong> ao\nsentenciado que sai antecipadamente ou é posto em prisão domiciliar por\nfalta de vagas; e (iii) <strong>cumprimento de penas restritivas</strong> de direitos\ne/ou estudo aos sentenciados em regime aberto. (REsp 1.710.674/MG)","refs":["993"]}],"DIREITO PENAL":[{"id":"rep_2018_992","tema":"992","texto":"TEMA 992: A **superveniência da maioridade penal não\ninterfere** na apuração de ato infracional nem na aplicabilidade de\nmedida socioeducativa em curso, inclusive na liberdade assistida,\n<strong>enquanto não atingida a idade de 21</strong> anos. (REsp 1.705.149/RJ e REsp\n1.717.022/RJ)","refs":["992"]},{"id":"rep_2018_157","tema":"157","texto":"TEMA 157: Incide o <strong>princípio da insignificância</strong>\naos <strong>crimes tributários federais e de descaminho</strong> quando o débito\ntributário verificado <strong>não ultrapassar o limite de R\\$ 20.000,00</strong>\n(vinte mil reais), a teor do disposto no art. 20 da Lei n. 10.522/2002,\ncom as atualizações efetivadas pelas Portarias 75 e 130, ambas do\nMinistério da Fazenda. (REsp 1.688.878/SP e REsp 1.709.029/MG)\n**[(FGV-ENAM-MANAUS/2024) (FGV-PREF SÃO JOSÉ DOS CAMPOS-ANALISTA/2024)\n(VUNESP-MPRJ-PROMOTOR/2024) (FGV-TCEES-CONSELHEIRO\nSUBSTITUTO/2023)] (FGV-RECEITA FEDERAL-AUDITOR/2023)**\n\n\\[Entendimento anterior (REsp n. 1.112.748/TO --\nsuperado): DESCAMINHO. Incide o princípio da insignificância aos débitos\ntributários que não ultrapassem o limite de R\\$ 10.000,00 (dez mil\nreais), a teor do disposto no art. 20 da Lei nº 10.522/02.\\]","refs":["157"]},{"id":"rep_2018_983","tema":"983","texto":"TEMA 983: Nos casos de violência contra a mulher\npraticados no âmbito doméstico e familiar, é **possível a fixação de\nvalor mínimo indenizatório a título de dano moral,<strong> </strong>[desde\nque]<strong> haja </strong>pedido expresso** da acusação ou da parte\nofendida, ainda que não especificada a quantia, e independentemente de\ninstrução probatória. (REsp 1.643.051/MS e REsp 1.675.874/MS)","refs":["983"]}]},"2017":{"DIREITO ADMINISTRATIVO":[{"id":"rep_2017_932","tema":"932","texto":"TEMA 932: O prazo prescricional para as **ações de\nrepetição de indébito** relativo às tarifas de serviços de água e esgoto\ncobradas <strong>indevidamente</strong> é de: (a) <strong>20 (vinte) anos</strong>, na forma do\nart. 177 do Código Civil de 1916; ou (b) <strong>10 (dez) anos</strong>, tal como\nprevisto no art. 205 do Código Civil de 2002, observando-se a regra de\ndireito intertemporal, estabelecida no art. 2.028 do Código Civil de\n2002. ([REsp\n1532514/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201501144461))","refs":["932"]},{"id":"rep_2017_928","tema":"928","texto":"TEMA 928: 1. Havendo o Conselho Nacional de Educação\nexpedido parecer público e direcionado ao Conselho Estadual de Educação\ndo Paraná sobre a regularidade do Programa Especial de Capacitação de\nDocentes, executado pela Fundação Faculdade Vizinhança Vale do Iguaçu, a\nsua desconstituição ou revogação pelo próprio Conselho Nacional de\nEducação ou mesmo a sua não homologação pelo Ministério da Educação\nautorizam a tese de que a União é responsável, civil e\nadministrativamente, e de forma exclusiva, pelo registro dos diplomas e\npela consequente indenização aos alunos que detinham vínculo formal como\nprofessores perante instituição pública ou privada, diante dos danos\ncausados. 2. Havendo o Conselho Nacional de Educação expedido parecer\npúblico sobre a regularidade do Programa Especial de Capacitação de\nDocentes executado pela Fundação Faculdade Vizinhança Vale do Iguaçu e\ndirecionado ao Conselho Estadual de Educação do Paraná, o qual já havia\npossibilitado o ingresso anterior dos alunos sem vínculo formal como\nprofessor de instituição pública ou privada (Portaria n. 93/2002 do\nConselho Estadual de Educação do Paraná), a sua desconstituição ou\nrevogação pelo próprio Conselho Nacional de Educação, ou mesmo a sua não\nhomologação pelo Ministério da Educação, ou, ainda, pelo Parecer n.\n193/2007 do Conselho Estadual de Educação do Paraná autorizam a tese de\nque a União e o Estado do Paraná são responsáveis, civil e\nadministrativamente, e de forma solidária, pelo registro dos diplomas e\npela consequente indenização aos alunos que detinham vínculo apenas\nprecário perante instituição pública ou privada, diante dos danos\ncausados. 3. Inexistindo ato regulamentar, seja do Conselho Nacional de\nEducação, seja do Conselho Estadual de Educação do Paraná, sobre a\nregularidade do Programa Especial de Capacitação de Docentes executado\npela Fundação Faculdade Vizinhança Vale do Iguaçu relativamente a alunos\nestagiários, descabe falar em condenação dos aludidos entes, devendo a\nparte que entender prejudicada postular a indenização em face, tão\nsomente, da instituição de ensino. (REsp 1.487.139/PR e REsp\n1.498.719/PR)","refs":["928"]},{"id":"rep_2017_616_e_617","tema":"616 e 617","texto":"TEMA 616 e 617: À míngua de previsão contida da Lei n.\n5.517/68, a venda de medicamentos veterinários - o que não abrange a\nadministração de fármacos no âmbito de um procedimento clínico - bem\ncomo a comercialização de animais vivos são atividades que não se\nencontram reservadas à atuação exclusiva do médico veterinário. Assim,\nas pessoas jurídicas que atuam nessas áreas não estão sujeitas ao\nregistro no respectivo Conselho Regional de Medicina Veterinária nem à\nobrigatoriedade de contratação de profissional habilitado. ([REsp\n1338942/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201709674))","refs":["616"]},{"id":"rep_2017_727","tema":"727","texto":"TEMA 727: É facultado aos técnicos de farmácia,\nregularmente inscritos no Conselho Regional de Farmácia, a assunção de\nresponsabilidade técnica por drogaria, independentemente do\npreenchimento dos requisitos previstos nos arts. 15, § 3º, da Lei\n5.991/73, c/c o art. 28 do Decreto 74.170/74, entendimento que deve ser\naplicado até a entrada em vigor da Lei n. 13.021/2014. ([REsp\n1243994/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201100560482)\n)","refs":["727"]}],"DIREITO CIVIL":[{"id":"rep_2017_953","tema":"953","texto":"TEMA 953: A cobrança de **juros capitalizados nos\ncontratos de mútuo<strong> é </strong>permitida<strong> quando houver e</strong>xpressa\npactuação.** ([REsp\n1388972/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301760262)\n)","refs":["953"]},{"id":"rep_2017_957","tema":"957","texto":"TEMA 957: As empresas adquirentes da carga\ntransportada pelo navio Vicuña no momento de sua explosão, no Porto de\nParanaguá/PR, em 15/11/2004, <strong>não respondem</strong> pela reparação dos danos\nalegadamente suportados por pescadores da região atingida, haja vista a\nausência de nexo causal a ligar tais prejuízos (decorrentes da proibição\ntemporária da pesca) à conduta por elas perpetrada (mera aquisição\npretérita do metanol transportado). (REsp 1.602.106/PR e REsp\n1.596.081/PR)","refs":["957"]},{"id":"rep_2017_949","tema":"949","texto":"TEMA 949: [Na vigência do Código Civil de 2002, é\n<strong>quinquenal</strong> o prazo prescricional para que o **condomínio geral ou\nedifício<strong> (horizontal ou vertical) exercite a pretensão de </strong>cobrança\nda taxa condominial** ordinária ou extraordinária constante em\n<strong>instrumento público ou particular,</strong> a contar do dia seguinte ao\nvencimento da prestação. (][REsp\n1483930/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201402409893))\n<strong>(VUNESP-PGESP-PROCURADOR/2024)</strong>","refs":["949"]},{"id":"rep_2017_369","tema":"369","texto":"TEMA 369: A <strong>correção monetária</strong> dos depósitos\njudiciais <strong>deve</strong> incluir os expurgos inflacionários. ([REsp\n1131360/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901486897))","refs":["369"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2017_177","tema":"177","texto":"TEMA 177: A ação penal nos crimes de lesão corporal\nleve cometidos em detrimento da mulher, no âmbito doméstico e familiar,\n<strong>é pública incondicionada.</strong>","refs":["177"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2017_976","tema":"976","texto":"TEMA 976: [A competência para processar e julgar\ndemandas cíveis com pedidos ilíquidos contra massa falida, quando em\nlitisconsórcio passivo com pessoa jurídica de direito público, é do\njuízo cível no qual for proposta a ação de conhecimento, competente para\njulgar ações contra a Fazenda Pública, de acordo as respectivas normas\nde organização judiciária. (][REsp\n1643856/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603244094);\n[REsp\n1643873/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603243832))\n<strong>(FGV-TJSC-JUIZ/2025)</strong>","refs":["976"]},{"id":"rep_2017_98","tema":"98","texto":"TEMA 98: [Possibilidade de **imposição de multa\ndiária<strong> (astreintes) a </strong>ente público<strong>, para compeli-lo a </strong>fornecer\nmedicamento** à pessoa desprovida de recursos financeiros.]\n([REsp\n1474665/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201402074797))","refs":["98"]},{"id":"rep_2017_379","tema":"379","texto":"TEMA 379: Nos casos de <strong>intimação/citação</strong>\nrealizadas por <strong>Correio</strong>, <strong>Oficial</strong> de Justiça, ou por <strong>Carta</strong> de\nOrdem, Precatória ou Rogatória, o <strong>prazo recursal</strong> inicia-se com **a\njuntada** aos autos do aviso de recebimento, do mandado cumprido, ou da\njuntada da carta.([REsp\n1632777/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201602743763);\n[REsp\n1632497/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201602734209))","refs":["379"]},{"id":"rep_2017_592","tema":"592","texto":"TEMA 592: Os dispositivos do art. 4º, *caput*, e §§ 1º\ne 2º, da Lei n. 11.738/2008 não amparam a tese de que a União é parte\nlegítima, perante terceiros particulares, em demandas que visam à sua\nresponsabilização pela implementação do piso nacional do magistério,\nafigurando-se correta a decisão que a exclui da lide e declara a\nincompetência da Justiça Federal para processar e julgar o feito ou, em\nsendo a única parte na lide, que decreta a extinção da demanda sem\nresolução do mérito. ([REsp\n1559965/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502571560))","refs":["592"]},{"id":"rep_2017_880","tema":"880","texto":"TEMA 880: A partir da vigência da Lei n. 10.444/2002,\nque incluiu o § 1º ao art. 604, dispositivo que foi sucedido, conforme\nLei n. 11.232/2005, pelo art. 475-B, §§ 1º e 2º, todos do CPC/1973, não\né mais imprescindível, para acertamento da conta exequenda, a juntada de\ndocumentos pela parte executada, ainda que esteja pendente de envio\neventual documentação requisitada pelo juízo ao devedor, que não tenha\nhavido dita requisição, por qualquer motivo, ou mesmo que a documentação\ntenha sido encaminhada de forma incompleta pelo executado. Assim, sob a\négide do diploma legal citado e para as decisões transitadas em julgado\nsob a vigência do CPC/1973, a demora, independentemente do seu motivo,\npara juntada das fichas financeiras ou outros documentos correlatos aos\nautos da execução, ainda que sob a responsabilidade do devedor ente\npúblico, não obsta o transcurso do lapso prescricional executório, nos\ntermos da Súmula 150/STF. ([REsp\n1336026/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201564977))","refs":["880"]},{"id":"rep_2017_950","tema":"950","texto":"TEMA 950: As questões acerca do <strong>trade dress</strong>\n(conjunto-imagem) dos produtos, <strong>concorrência desleal,</strong> e outras\ndemandas afins, por não envolver registro no INPI e cuidando de ação\njudicial entre particulares, é **inequivocamente de competência da\njustiça estadual,<strong> já que </strong>não afeta interesse institucional da\nautarquia federal<strong>. No entanto, </strong>compete à Justiça Federal,** em\n**ação de nulidade de registro de marca, com a participação do INPI,\nimpor ao titular a abstenção do uso, in**clusive no tocante à tutela\nprovisória. ([REsp\n1527232/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500535587))","refs":["950"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2017_627","tema":"627","texto":"TEMA 627: O segur
