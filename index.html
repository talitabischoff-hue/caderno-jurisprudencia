corporado** às listas de\ndispensação do Sistema Único de Saúde, <strong>desde que</strong> preenchidos,\n<strong>cumulativamente</strong>, os seguintes requisitos, cujo <strong>ônus</strong> probatório\nincumbe ao <strong>autor da ação</strong>: (a) <strong>negativa de fornecimento</strong> do\nmedicamento na via administrativa, nos termos do item \\'4\\' do Tema 1234\nda repercussão geral; (b) <strong>ilegalidade do ato de não incorporação</strong> do\nmedicamento pela Conitec, **ausência de pedido de incorporação ou da\nmora na sua apreciação**, tendo em vista os prazos e critérios previstos\nnos artigos 19-Q e 19-R da Lei nº 8.080/1990 e no Decreto nº 7.646/2011;\nc) <strong>impossibilidade de substituição</strong> por outro medicamento constante\ndas listas do SUS e dos protocolos clínicos e diretrizes terapêuticas;\n(d) <strong>comprovação</strong>, à luz da medicina baseada em evidências, da\n<strong>eficácia</strong>, acurácia, efetividade e segurança do fármaco,\nnecessariamente respaldadas por evidências científicas de alto nível, ou\nseja, unicamente ensaios clínicos randomizados e revisão sistemática ou\nmeta-análise; (e) <strong>imprescindibilidade</strong> clínica do tratamento,\ncomprovada mediante <strong>laudo médico fundamentado,</strong> descrevendo inclusive\nqual o tratamento já realizado; e (f) <strong>incapacidade financeira</strong> de\narcar com o custeio do medicamento. 3. <strong>Sob pena de nulidade</strong> da\ndecisão judicial, nos termos do artigo 489, § 1º, incisos V e VI, e\nartigo 927, inciso III, § 1º, ambos do Código de Processo Civil, o\n<strong>Poder Judiciário</strong>, ao apreciar pedido de concessão de medicamentos\nnão incorporados, <strong>deverá obrigatoriamente:</strong> (a) **analisar o ato\nadministrativo comissivo ou omissivo** de não incorporação pela Conitec\nou da negativa de fornecimento da via administrativa, à luz das\ncircunstâncias do caso concreto e da legislação de regência,\nespecialmente a política pública do SUS, **não sendo possível a incursão\nno mérito do ato administrativo<strong>; (b) </strong>aferir a presença dos\nrequisitos de dispensação do medicamento**, previstos no item 2, a\npartir da prévia consulta ao Núcleo de Apoio Técnico do Poder Judiciário\n(NATJUS), sempre que disponível na respectiva jurisdição, ou a entes ou\npessoas com expertise técnica na área, **não podendo fundamentar a sua\ndecisão unicamente<strong> em </strong>prescrição, relatório ou laudo médico juntado\naos autos pelo autor<strong> da ação; e (c) no caso de </strong>deferimento**\njudicial do fármaco, <strong>oficiar aos órgãos competentes</strong> para avaliarem a\npossibilidade de sua incorporação no âmbito do SUS. (RE 566.471)","refs":["6","1234"]},{"id":"rg_2024_1323","tema":"1323","texto":"TEMA 1323: A execução do **serviço público de\nloteria<strong> por </strong>agentes privados<strong> depende de </strong>delegação estatal**\nprecedida de <strong>licitação</strong>. (RE 1.498.128)","refs":["1323"]},{"id":"rg_2024_952","tema":"952","texto":"TEMA 952: [1. Testemunhas de Jeová, quando **maiores e\ncapazes<strong>, têm o direito de </strong>recusar** procedimento médico que envolva\n<strong>transfusão de sangue</strong>, com base na **autonomia individual e na\nliberdade religiosa<strong>. 2. Como consequência, em respeito ao </strong>direito à\nvida e à saúde<strong>, fazem </strong>jus aos procedimentos alternativos**\ndisponíveis no Sistema Único de Saúde - SUS, <strong>podendo</strong>, se necessário,\nrecorrer a t<strong>ratamento fora de seu domicílio</strong>.] ([RE\n979742](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5006128))\n**(FGV-EBSERGH-ADVOGADO/2024) (VUNESP-CÂMARA DA ESTÂNCIA BALNEÁRIA DE\nPRAIA GRANDE/SP-CONTROLADOR/2025) (VUNESP-UNESP-ENFERMEIRO/2025)\n(VUNESP-MPE/SP-ANALISTA/2025)**\n\n[","refs":["952"]},{"id":"rg_2024_1069","tema":"1069","texto":"TEMA 1069: 1. É <strong>permitido</strong> ao paciente, no **gozo\npleno de sua capacidade civil,<strong> </strong>recusar-se** a se submeter a\n<strong>tratamento</strong> de saúde, por <strong>motivos religiosos</strong>. A recusa a\ntratamento de saúde, por razões religiosas, é condicionada à **decisão\ninequívoca, livre, informada e esclarecida<strong> do paciente, </strong>inclusive**,\nquando veiculada por meio de <strong>diretiva antecipada de vontade</strong>. 2. É\n<strong>possível</strong> a realização de procedimento médico, disponibilizado a\ntodos pelo sistema público de saúde, com a <strong>interdição</strong> da realização\nde <strong>transfusão</strong> sanguínea ou <strong>outra medida excepcional</strong>, caso haja\n<strong>viabilidade técnico-científica</strong> de sucesso, <strong>anuência</strong> da equipe\n<strong>médica</strong> com a sua realização e decisão inequívoca, livre, informada e\nesclarecida do paciente.] ([RE\n1212272](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5703626))\n**(FGV-TJMT-JUIZ/2024) (FGV-TJCE-JUIZ/2025) (FGV-MPE/RJ-PROMOTOR/2025)\n(VUNESP-MPE/SP-ANALISTA/2025)**","refs":["1069"]},{"id":"rg_2024_1234","tema":"1234","texto":"TEMA 1234: : \"I -- Competência 1)\nPara fins de fixação de competência, as **demandas relativas a\nmedicamentos não incorporados na política pública do SUS,<strong> mas </strong>com\nregistro na ANVISA,<strong> tramitarão perante a </strong>Justiça Federal,** nos\ntermos do art. 109, I, da Constituição Federal, quando o <strong>valor</strong> do\n<strong>tratamento anual</strong> específico do fármaco <strong>ou do princípio ativo</strong>,\ncom base no <strong>Preço Máximo de Venda do Governo</strong> (PMVG -- situado na\nalíquota zero), divulgado pela Câmara de Regulação do Mercado de\nMedicamentos (CMED - Lei 10.742/2003), **for igual ou superior ao valor\nde 210 salários mínimos**, na forma do art. 292 do CPC. 1.1) Existindo\n<strong>mais de um medicamento do mesmo princípio</strong> ativo e **não sendo\nsolicitado um fármaco específico**, considera-se, para efeito de\n<strong>competência</strong>, aquele <strong>listado no menor valor</strong> na lista CMED (PMVG,\nsituado na alíquota zero). 1.2) No caso de <strong>inexistir valor fixado</strong> na\nlista CMED, <strong>considera-se o valor do tratamento anual</strong> do medicamento\nsolicitado na demanda, <strong>podendo o magistrado</strong>, em caso de\n<strong>impugnação</strong> pela parte requerida, <strong>solicitar auxílio à CMED,</strong> na\nforma do art. 7º da Lei 10.742/2003. 1.3) Caso **inexista resposta em\ntempo hábil<strong> da CMED, o </strong>juiz analisará** de acordo com o orçamento\ntrazido pela parte autora. 1.4) No caso de <strong>cumulação de pedidos</strong>,\npara fins de <strong>competência</strong>, será considerado apenas o **valor do(s)\nmedicamento(s) não incorporado(<strong>s) que deverá(ão) ser </strong>somado**(s),\n<strong>independentemente</strong> da existência de <strong>cumulação alternativa</strong> de\noutros pedidos envolvendo obrigação de fazer, pagar ou de entregar coisa\ncerta.\n\nII -- Definição de Medicamentos Não Incorporados 2.1)\nConsideram-se medicamentos não incorporados aqueles que **não constam na\npolítica pública do SUS;<strong> medicamentos </strong>previstos nos PCDTs para\noutras finalidades<strong>; medicamentos </strong>sem registro na ANVISA**; e\nmedicamentos <strong>off label sem PCDT</strong> ou que **não integrem listas do\ncomponente básico**. 2.1.1) Conforme decidido pelo Supremo Tribunal\nFederal na tese fixada no tema 500 da sistemática da repercussão geral,\né <strong>mantida a competência da Justiça Federal</strong> em relação às ações que\ndemandem <strong>fornecimento de medicamentos sem registro na Anvisa</strong>, as\nquais deverão <strong>necessariamente ser propostas em face da União</strong>,\nobservadas as especificidades já definidas no aludido tema.\n\nIII -- Custeio 3) As ações de **fornecimento de\nmedicamentos incorporados ou não incorporados,** que se inserirem na\n**competência da Justiça Federal, serão custeadas integralmente pela\nUnião<strong>, cabendo, em caso de haver </strong>condenação supletiva dos Estados e\ndo Distrito Federal<strong>, o </strong>ressarcimento integral pela União**, via\nrepasses Fundo a Fundo (FNS ao FES), na situação de ocorrer\nredirecionamento pela impossibilidade de cumprimento por aquela, a ser\nimplementado mediante ato do Ministério da Saúde, previamente pactuado\nem instância tripartite, no prazo de até <strong>90 dias.</strong> 3.1) Figurando\n<strong>somente a União no polo passivo</strong>, cabe ao **magistrado, se\nnecessário,<strong> promover a </strong>inclusão do Estado ou Município** para\npossibilitar o <strong>cumprimento efetivo</strong> da decisão, o que **não importará\nem responsabilidade financeira nem em ônus de sucumbência**, devendo ser\nrealizado o <strong>ressarcimento</strong> pela via acima indicada em caso de\neventual custo financeiro ser arcado pelos referidos entes. 3.2) Na\ndeterminação judicial de fornecimento do medicamento, o **magistrado\ndeverá estabelecer que o valor de venda do medicamento seja limitado ao\npreço com desconto,** proposto no processo de incorporação na Conitec\n(se for o caso, considerando o venire contra factum proprium/tu quoque e\nobservado o índice de reajuste anual de preço de medicamentos definido\npela CMED), <strong>ou valor já praticado pelo ente</strong> em compra pública,\naquele que seja identificado como menor valor, tal como previsto na\nparte final do art. 9º na Recomendação 146, de 28.11.2023, do CNJ.\nSob nenhuma hipótese, <strong>poderá</strong> haver **pagamento\njudicial às pessoas físicas/jurídicas acima descritas em valor superior\nao teto** do PMVG, devendo ser operacionalizado pela serventia judicial\njunto ao fabricante ou distribuidor. 3.3) As **ações que permanecerem na\nJustiça Estadual** e cuidarem de medicamentos não incorporados, as quais\nimpuserem condenações aos Estados e Municípios, **serão ressarcidas pela\nUnião**, via repasses Fundo a Fundo (FNS ao FES ou ao FMS). Figurando\nsomente um dos entes no polo passivo, **cabe ao magistrado, se\nnecessário,<strong> promover a </strong>inclusão do outro** para possibilitar o\n<strong>cumprimento efetivo</strong> da decisão. 3.3.1) O ressarcimento descrito no\nitem 3.3 ocorrerá no <strong>percentual de 65%</strong> (sessenta e cinco por cento)\ndos <strong>desembolsos</strong> decorrentes de <strong>condenações</strong> oriundas de ações\ncujo **valor da causa seja superior a 7 (sete) e inferior a 210\n(duzentos e dez) salários mínimo**s, a ser implementado mediante ato do\nMinistério da Saúde, previamente pactuado em instância tripartite, no\nprazo de até 90 dias. 3.4) Para fins de **ressarcimento\ninterfederativo**, quanto aos medicamentos para tratamento\n<strong>oncológico</strong>, as ações ajuizadas p[reviamente a 10 de junho de\n2024] serão ressarcidas pela União na <strong>proporção de 80%</strong>\n(oitenta por cento) do valor total pago por Estados e por Municípios,\n<strong>independentemente do trânsito em julgad</strong>o da decisão, a ser\nimplementado mediante ato do Ministério da Saúde, previamente pactuado\nem instância tripartite, no prazo de até 90 dias. O ressarcimento para\nos casos posteriores a 10 de junho de 2024 deverá ser pactuado na CIT,\nno mesmo prazo.\n\n**[IV -- Análise judicial do ato administrativo de indeferimento de\nmedicamento pelo SUS]<strong> 4) Sob </strong>pena de nulidade** do ato\njurisdicional (art. 489, § 1º, V e VI, c/c art. 927, III, §1º, ambos do\nCPC), o Poder Judiciário, ao apreciar pedido de concessão de\nmedicamentos não incorporados, **deverá obrigatoriamente analisar o ato\nadministrativo comissivo ou omissivo da não incorporação** pela Conitec\ne da <strong>negativa de fornecimento</strong> na via administrativa, tal como\nacordado entre os Entes Federativos em autocomposição no Supremo\nTribunal Federal. 4.1) No exercício do **controle de legalidade, o Poder\nJudiciário não pode substituir a vontade do administrador,** mas tão\nsomente <strong>verificar</strong> se o ato administrativo específico daquele caso\nconcreto <strong>está em conformidade</strong> com as balizas presentes na\nConstituição Federal, na legislação de regência e na política pública no\nSUS. 4.2) A análise jurisdicional do ato administrativo que indefere o\nfornecimento de medicamento não incorporado **restringe-se ao exame da\nregularidade** do procedimento e da legalidade do ato de não\nincorporação e do ato administrativo questionado, à luz do **controle de\nlegalidade e da teoria dos motivos determinantes<strong>, </strong>não sendo\npossível<strong> </strong>incursão no mérito<strong> administrativo, </strong>ressalvada** a\ncognição do ato administrativo discricionário, o qual se vincula à\nexistência, à veracidade e à legitimidade dos motivos apontados como\nfundamentos para a sua adoção, a sujeitar o ente público aos seus\ntermos. 4.3) Tratando-se de <strong>medicamento não incorporado,</strong> é do\n<strong>autor da ação o ônus</strong> de demonstrar, com fundamento na **Medicina\nBaseada em Evidências,** a segurança e a eficácia do fármaco, bem como a\ninexistência de substituto terapêutico incorporado pelo SUS. 4.4)\nConforme decisão da STA 175-AgR, **não basta a simples alegação de\nnecessidade<strong> do medicamento, </strong>mesmo que acompanhada de relatório**\nmédico, sendo <strong>necessária a demonstração</strong> de que a opinião do\nprofissional <strong>encontra respaldo</strong> em **evidências científicas de alto\nnível,** ou seja, unicamente ensaios clínicos randomizados, revisão\nsistemática ou meta-análise.\n\nV --Plataforma Nacional 5) Os Entes Federativos, em\ngovernança colaborativa com o Poder Judiciário, implementarão uma\n**plataforma nacional que centralize todas as informações relativas às\ndemandas administrativas e judiciais de acesso a fármaco,** de fácil\nconsulta e informação ao cidadão, na qual constarão dados básicos para\npossibilitar a análise e eventual resolução administrativa, além de\nposterior controle judicial. 5.1) A porta de ingresso à plataforma será\nvia prescrições eletrônicas, devidamente certificadas, possibilitando o\ncontrole ético da prescrição, a posteriori, mediante ofício do Ente\nFederativo ao respectivo conselho profissional. 5.2) A plataforma\nnacional visa a orientar todos os atores ligados ao sistema público de\nsaúde, <strong>possibilitando a eficiência</strong> da análise pelo Poder Público e\ncompartilhamento de informações com o Poder Judiciário, mediante a\ncriação de fluxos de atendimento diferenciado, a depender de a\nsolicitação estar ou não incluída na política pública de assistência\nfarmacêutica do SUS e de acordo com os fluxos administrativos aprovados\npelos próprios Entes Federativos em autocomposição. 5.3) A plataforma,\nentre outras medidas, d**everá identificar quem é o responsável pelo\ncusteio<strong> e </strong>fornecimento** administrativo entre os Entes Federativos,\ncom base nas responsabilidades e fluxos definidos em autocomposição\nentre todos os Entes Federativos, além de possibilitar o **monitoramento\ndos pacientes** beneficiários de decisões judiciais, com permissão de\nconsulta virtual dos dados centralizados nacionalmente, pela simples\nconsulta pelo CPF, nome de medicamento, CID, entre outros, com a\nobservância da Lei Geral de Proteção da Dados e demais legislações\nquanto ao tratamento de dados pessoais sensíveis. 5.4) O **serviço de\nsaúde cujo profissional prescrever medicamento não incorporado ao SUS\ndeverá assumir a responsabilidade contínua pelo acompanhamento** clínico\ndo paciente, apresentando, p<strong>eriodicamente, relatório atualizado</strong> do\nestado clínico do paciente, com informações detalhadas sobre o progresso\ndo tratamento, incluindo melhorias, estabilizações ou deteriorações no\nestado de saúde do paciente, assim como qualquer mudança relevante no\nplano terapêutico.\n\nVI --Medicamentos incorporados 6) Em relação aos\nmedicamentos incorporados, conforme conceituação estabelecida no âmbito\nda Comissão Especial e constante do Anexo I, os Entes concordam em\nseguir o fluxo administrativo e judicial detalhado no Anexo I, inclusive\nem relação à competência judicial para apreciação das demandas e forma\nde ressarcimento entre os Entes, quando devido. 6.1) A(o) magistrada(o)\ndeverá determinar o fornecimento em face de qual ente público deve\nprestá-lo (União, estado, Distrito Federal ou Município), nas hipóteses\nprevistas no próprio fluxo acordado pelos Entes Federativos, anexados ao\npresente acórdão\". (RE 1.366.243) <strong>(FGV-ENAM 2/2024)</strong>\n\n\\[ATENÇÃO: RE 1.366.243-EDsextos: Decisão: O\nTribunal, por unanimidade, 1) não conheceu dos embargos opostos pelos\namici curiae e por Vinícius Aluísio de Moraes, como assistente, por\nausência dos requisitos legais; 2) rejeitou os embargos de declaração\nopostos pelo Estado de Santa Catarina, mas os **acolheu a título de\nesclarecimentos e sem efeitos modificativos para constar do item 1,**\nreferente à Competência, a seguinte redação: 1) Para fins de fixação de\ncompetência, **as demandas relativas a medicamentos não incorporados na\npolítica pública do SUS e medicamentos oncológicos, ambos com registro\nna ANVISA, tramitarão perante a Justiça Federal,** nos termos do art.\n109, I, da Constituição Federal, quando o valor do tratamento anual\nespecífico do fármaco ou do princípio ativo, com base no Preço Máximo de\nVenda do Governo (PMVG situado na alíquota zero), divulgado pela Câmara\nde Regulação do Mercado de Medicamentos (CMED - Lei 10.742/2003), for\nigual ou superior ao valor de 210 salários mínimos, na forma do art. 292\ndo CPC; e 3) acolheu parcialmente os embargos opostos pela União, tão\nsomente quanto à modulação dos efeitos da decisão no que se refere à\ncompetência, para abarcar também os medicamentos incorporados, devendo\nser suprimido do Capítulo 5 do voto condutor do acórdão embargado a\nremissão ao \\\"item 1 do acordo firmado na Comissão Especial\\\", por\nreferir-se unicamente aos medicamentos não incorporados.\nConsequentemente, **os efeitos do tema 1234, quanto à competência,\nsomente se aplicam às ações que forem ajuizadas após a publicação do\nresultado do julgamento de mérito no Diário de Justiça Eletrônico,**\nafastando sua incidência sobre os processos em tramitação até o referido\nmarco, **sem possibilidade de suscitação de conflito negativo de\ncompetência a respeito dos processos anteriores ao referido marco\njurídico**. Tudo nos termos do voto do Relator. O Ministro Luiz Fux\nacompanhou o Relator com ressalvas.\\]","refs":["500","1234"]},{"id":"rg_2024_1322","tema":"1322","texto":"TEMA 1322: A utilização, por qualquer ente estatal, de\n<strong>recursos públicos</strong> para promover comemorações alusivas ao Golpe de\n1964 <strong>atenta contra a Constituição</strong> e consiste em **[ato lesivo ao\npatrimônio imaterial]** da União. (RE 1.429.329)\n[\\[10/09/2024 - Reconhecida a RG e julgado o mérito com reafirmação da\njurisprudência no PV.\\]]","refs":["1322"]},{"id":"rg_2024_1072","tema":"1072","texto":"TEMA 1072: A mãe servidora ou trabalhadora **não\ngestante em união homoafetiva<strong> tem </strong>direito** ao gozo de\nlicença-maternidade. Caso a companheira tenha utilizado o\nbenefício, fará jus à licença pelo período equivalente ao da\nlicença-paternidade. (RE 1211446) **(FGV-TRF3-JUIZ/2025) (FGV-ENAM/2025)\n(VUNESP-PREF DE ITAPEVI/SP-ADVOGADO/2025)**","refs":["1072"]},{"id":"rg_2024_1287","tema":"1287","texto":"TEMA 1287: No âmbito da [tomada de contas\nespecial,] é <strong>possível</strong> a condenação administrativa de\nChefes dos Poderes Executivos municipais, estaduais e distrital pelos\nTribunais de Contas, quando identificada a [responsabilidade\npessoal] em face de irregularidades no cumprimento de\nconvênios interfederativos de repasse de verbas, [sem\nnecessidade] de posterior julgamento ou aprovação do ato\npelo respectivo Poder Legislativo. ([ARE\n1436197](https://portal.stf.jus.br/processos/detalhe.asp?incidente=6636875))\n**(FGV-ALPR-PROCURADOR/2024) (FGV-TCEPA-AUDITOR/2024) (FGV-PREF DE\nMACAÉ/RJ-AUDITOR FISCAL/2024) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["1287"]},{"id":"rg_2024_0953","tema":"0953","texto":"TEMA 0953: É <strong>constitucional</strong> a utilização de\n<strong>vestimentas ou acessórios</strong> relacionados a crença ou <strong>religião</strong> nas\nfotos de documentos oficiais, desde que\n<strong>não impeçam</strong> a adequada <strong>identificação</strong> individual, com rosto\nvisível. (RE 859.376) <strong>(FGV-PREF DE NOVA IGUAÇU/RJ-AUDITOR/2024)</strong>","refs":["0953"]},{"id":"rg_2024_1305","tema":"1305","texto":"TEMA 1305: O art. 4º da Emenda Constitucional 42/2003\n<strong>validou os adicionais</strong> instituídos pelos Estados e pelo Distrito\nFederal para financiar os Fundos de Combate à Pobreza. (RE 592.152)","refs":["1305"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2024_1317","tema":"1317","texto":"TEMA 1317: A **execução de créditos individuais e\ndivisíveis<strong> decorrentes de </strong>título judicial coletivo,** promovida por\nsubstituto processual, <strong>não caracteriza o fracionamento</strong> de precatório\nvedado pelo § 8º do art. 100 da Constituição. (ARE 1.491.569)","refs":["1317"]},{"id":"rg_2024_1204","tema":"1204","texto":"TEMA 1204: A aplicação do art. 46, § 5º, do CPC **deve\nficar restrita** aos limites do território de cada ente subnacional ou\nao local de ocorrência do fato gerador. (ARE 1.327.576)","refs":["1204"]}],"DIREITO PENAL":[{"id":"rg_2024_857","tema":"857","texto":"TEMA 857: : O art. 19 da Lei de Contravenções penais\n<strong>permanece válido e é aplicável ao porte de arma branca,</strong> cuja\npotencialidade lesiva deve ser aferida com base nas circunstâncias do\n<strong>caso concreto,</strong> tendo em conta, inclusive, o <strong>elemento subjetivo</strong>\ndo agente. (ARE 901.623)","refs":["857"]},{"id":"rg_2024_1087","tema":"1087","texto":"TEMA 1087: É <strong>cabível</strong> recurso de <strong>apelação</strong>, com\nbase no art. 593, III, d, do Código de Processo Penal, nas hipóteses em\nque a <strong>decisão do Tribunal do Júri</strong>, amparada em <strong>quesito genérico,</strong>\nfor considerada pela acusação como <strong>manifestamente contrária</strong> à prova\ndos autos. O <strong>Tribunal</strong> de Apelação <strong>não determinará novo júri</strong>\nquando <strong>tiver</strong> ocorrido <strong>apresentação</strong> constante em ata de **tese\nconducente à clemência<strong> ao acusado, e esta for </strong>acolhida pelos\njurados<strong>, </strong>desde que<strong> seja </strong>compatível** com a Constituição, com os\nprecedentes vinculantes do Supremo Tribunal Federal e com as\ncircunstâncias fáticas apresentadas nos autos. ([[ARE\n122518]5](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5745131))","refs":["1087"]},{"id":"rg_2024_1068","tema":"1068","texto":"TEMA 1068: [A <strong>soberania dos veredictos</strong> do Tribunal\ndo Júri autoriza a <strong>imediata execução</strong> de condenação imposta pelo\ncorpo de jurados, <strong>independentemente</strong> do total da <strong>pena aplicada</strong>.\n(RE 1235340)]","refs":["1068"]},{"id":"rg_2024_506","tema":"506","texto":"TEMA 506: 1. <strong>Não comete infração</strong> penal quem\nadquirir, guardar, tiver em depósito, transportar ou trouxer consigo,\npara <strong>consumo pessoal,</strong> a substância *cannabis* *sativa*, sem prejuízo\ndo reconhecimento da ilicitude extrapenal da conduta, com\n<strong>apreensão da droga</strong> e aplicação de sanções de <strong>advertência</strong> sobre\nos efeitos dela (art. 28, I) e <strong>medida educativa</strong> de comparecimento a\nprograma ou curso educativo (art. 28, III); 2. As sanções estabelecidas\nnos incisos I e III do art. 28 da Lei 11.343/06 serão aplicadas pelo\njuiz em procedimento de <strong>natureza não penal,</strong> **sem nenhuma\nrepercussão criminal** para a conduta; 3. Em se tratando da posse de\n*cannabis* para consumo pessoal, a autoridade policial **apreenderá a\nsubstância e notificará **[o autor do fato para comparecer\nem Juízo], na forma do regulamento a ser aprovado pelo CNJ.\nAté que o CNJ delibere a respeito, a competência para julgar as condutas\ndo art. 28 da Lei 11.343/06 será dos <strong>Juizados Especiais Criminais</strong>,\nsegundo a sistemática atual, <strong>vedada</strong> a atribuição de quaisquer\n<strong>efeitos penais para a sentença;</strong> 4. Nos termos do § 2º do artigo 28\nda Lei 11.343/2006, será presumido usuário quem, para consumo próprio,\nadquirir, guardar, tiver em depósito, transportar ou trouxer consigo,\n<strong>até 40 gramas de *cannabis sativa* ou seis plantas-fêmeas,</strong> até que o\nCongresso Nacional venha a legislar a respeito; 5. A <strong>presunção</strong> do\nitem anterior é <strong>relativa</strong>, <strong>não estando</strong> a autoridade policial e\nseus agentes <strong>impedidos</strong> de realizar a **prisão em flagrante por\ntráfico de drogas,** mesmo para quantidades inferiores ao\nlimite acima estabelecido, quando **presentes elementos que indiquem\nintuito de mercancia**, como a forma de acondicionamento\nda droga, as circunstâncias da apreensão, a\nvariedade de substâncias apreendidas, a [apreensão\nsimultânea de instrumentos] como balança, registros de\noperações comerciais e aparelho celular contendo contatos\nde usuários ou traficantes; 6. Nesses casos, <strong>caberá ao Delegado</strong> de\nPolícia consignar, no auto de prisão em flagrante, **justificativa\nminudente** para afastamento da presunção do porte para uso pessoal,\nsendo <strong>vedada</strong> a alusão a <strong>critérios subjetivos arbitrário</strong>s; 7. Na\nhipótese de prisão por quantidades inferiores à fixada no item 4,\n<strong>deverá o juiz,</strong> na audiência de custódia, <strong>avaliar as razões</strong>\ninvocadas para o afastamento da presunção de porte para uso próprio; 8.\nA <strong>apreensão de quantidades superiores</strong> aos limites ora fixados **não\nimpede o jui<strong>z de concluir que a </strong>conduta é atípica,** apontando nos\nautos prova suficiente da condição de usuário\". ([RE\n635659](https://portal.stf.jus.br/processos/detalhe.asp?incidente=4034145))\n**(FGV-PREF DE CANAÃ DOS CARAJÁS/PA-PSICÓLOGO/2025) (FGV-TJSE-JUIZ/2025)\n(FGV-DPE/PE-DEFENSOR/2025)**","refs":["506"]},{"id":"rg_2024_1303","tema":"1303","texto":"TEMA 1303: 1. O sobrestamento de recurso\nextraordinário nos tribunais de origem para aguardar o julgamento de\ntema de repercussão geral <strong>não suspende automaticamente</strong> o prazo\nprescricional de pretensão punitiva penal; 2. O ministro relator do\nprocesso selecionado como paradigma no Supremo Tribunal Federal, caso\nentenda necessário e adequado, **poderá determinar a suspensão de ações\npenais em curso** que tratem de mesma controvérsia, assim como do prazo\nprescricional de pretensão punitiva penal. (RE 1.448.742)","refs":["1303"]},{"id":"rg_2024_703","tema":"703","texto":"TEMA 703: O art. 47 da Lei nº 6.880/80 **foi\nrecepcionado** pela Constituição Federal de 1988, sendo válidos, por\nconseguinte, os incisos IV e V do art. 24 do Decreto nº 4.346/02, os\nquais <strong>não ofendem</strong> o princípio da reserva legal. (RE 603.116)","refs":["703"]}],"DIREITO DO TRABALHO":[{"id":"rg_2024_0488","tema":"0488","texto":"TEMA 0488: Em observância ao princípio da **unicidade\nsindical**, previsto no art. 8º, inciso II, da Constituição Federal de\n1988, a quantidade de empregados, ou qualquer outro critério relativo à\ndimensão da empresa, <strong>não constitui elemento apto</strong> a embasar a\ndefinição de categoria econômica ou profissional para fins de criação de\nsindicatos de micros e pequenas empresas. (RE 646.104)","refs":["0488"]}],"DIREITO ELEITORAL":[{"id":"rg_2024_1304","tema":"1304","texto":"TEMA 1304: É <strong>correta</strong> a interpretação conforme à\nConstituição no sentido de que o disposto no § 4º-A do art. 1º da LC\n64/90 **aplica-se apenas aos casos de julgamento de gestores públicos\npelos Tribunais de Contas**. (RE 1.459.224)","refs":["1304"]},{"id":"rg_2024_0979","tema":"0979","texto":"TEMA 0979: No processo eleitoral, é <strong>ilícita</strong> a\nprova colhida por meio de <strong>gravação ambiental clandestina</strong>, [sem\nautorização] judicial e com violação à\nprivacidade e à intimidade dos interlocutores, <strong>ainda que</strong> realizada\npor um dos participantes, sem o conhecimento dos demais. A <strong>exceção</strong> à\nregra da ilicitude da gravação ambiental feita sem o conhecimento de um\ndos interlocutores e sem autorização judicial **ocorre na hipótese de\nregistro de fato ocorrido em local público** desprovido de qualquer\ncontrole de acesso, pois, nesse caso, **não há violação à intimidade ou\nquebra da expectativa de privacidade**. (RE 1.040.515) (INFO 1134)\n(deverá ser aplicada a partir das eleições de 2022)\n<strong>(FGV-TJPE-JUIZ/2024) (FGV-PCMG-DELEGADO/2025)</strong>","refs":["0979"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2024_975","tema":"975","texto":"TEMA 975: O art. 43, caput e § 1º, da Lei Complementar\nestadual 1.059/2008, de São Paulo, é formal e materialmente\nconstitucional. A <strong>natureza indenizatória da conversão</strong> de\nlicença-prêmio em pecúnia **é válida somente no que se refere ao valor\ntotal da indenização<strong>. O </strong>teto remuneratório constitucional incide**\nna base de cálculo utilizada para computação do valor a ser pago a\ntítulo de indenização de licença-prêmio não gozada, equivalente à\nremuneração a que o servidor faz jus no momento de sua aposentadoria.\n(RE 1167842)","refs":["975"]},{"id":"rg_2024_1347","tema":"1347","texto":"TEMA 1347: O <strong>adiamento</strong> de exame de <strong>concurso</strong>\npúblico por <strong>motivo de biossegurança</strong> relacionado à pandemia do\nCOVID19 <strong>não impõe</strong> ao Estado o dever de <strong>indenizar</strong>. (RE 1.455.038)","refs":["1347"]},{"id":"rg_2024_309","tema":"309","texto":"TEMA 309: a) O <strong>dolo é necessário</strong> para a\nconfiguração de <strong>qualquer ato de improbidade</strong> administrativa (art. 37,\n§ 4º, da Constituição Federal), de modo que é **[inconstitucional a\nmodalidade culposa]** de ato de improbidade administrativa\nprevista nos arts. 5º e 10 da Lei nº 8.429/92, em sua redação\noriginária. b) São **constitucionais os arts. 13, V, e 25, II, da Lei nº\n8.666/1993**, desde de que interpretados no sentido de que a contratação\ndireta de serviços advocatícios pela Administração Pública, por\ninexigibilidade de licitação, além dos critérios já previstos\nexpressamente (necessidade de procedimento administrativo formal;\nnotória especialização profissional; natureza singular do serviço),\n<strong>deve observar:</strong> (i) <strong>inadequação da prestação do serviço</strong> pelos\nintegrantes do Poder Público; e (ii) cobrança de <strong>preço compatível</strong>\ncom a responsabilidade profissional exigida pelo caso, observado,\ntambém, o valor médio cobrado pelo escritório de advocacia contratado em\nsituações similares anteriores. (RE 656.558) <strong>(FGV-TJSE-JUIZ/2025)</strong>","refs":["309"]},{"id":"rg_2024_1344","tema":"1344","texto":"TEMA 1344: O regime administrativo-remuneratório da\ncontratação temporária é <strong>diverso</strong> do regime jurídico dos servidores\nefetivos, sendo <strong>vedada</strong> a extensão por decisão judicial de parcelas\nde qualquer natureza, observado o Tema 551/RG. (RE 1.500.990)\n(26/10/2024 julgado o mérito e reafirmada a jurisprudência)","refs":["551","1344"]},{"id":"rg_2024_1036","tema":"1036","texto":"TEMA 1036: São <strong>constitucionais</strong> as leis dos\nEstados, Distrito Federal e Municípios que, no procedimento licitatório,\n<strong>antecipam a fase da apresentação das propostas à da habilitação</strong> dos\nlicitantes, em razão da competência dos demais entes federativos de\nlegislar sobre procedimento administrativo. (RE 1.188.352)","refs":["1036"]},{"id":"rg_2024_0683","tema":"0683","texto":"TEMA 0683: A ação judicial visando ao **reconhecimento\ndo direito à nomeação<strong> de candidato </strong>aprovado fora das vagas**\nprevistas no edital (cadastro de reserva) deve ter por **causa de pedir\npreterição ocorrida na vigência do certame.** (RE 766.304)\n<strong>(VUNESP-CÂMARA DE CAMPINAS-ASSESSOR JURÍDICO/2024)</strong>","refs":["0683"]},{"id":"rg_2024_1022","tema":"1022","texto":"TEMA 1022: As empresas públicas e as sociedades de\neconomia mista, sejam elas prestadoras de serviço público ou\nexploradoras de atividade econômica, <strong>ainda que</strong> em regime\nconcorrencial, têm o <strong>dever jurídico de motivar</strong>, em ato formal, a\ndemissão de seus empregados concursados, [não se exigindo processo\nadministrativo.] Tal motivação deve consistir em fundamento\nrazoável, não se exigindo, porém, que se enquadre nas\nhipóteses de justa causa da legislação trabalhista. ([RE\n688267](https://portal.stf.jus.br/processos/detalhe.asp?incidente=4245763))\n<strong>(FGV-TJMS-ANALISTA JUDICIÁRIO/2024) (FGV-DATAPREV-ADVOGADO/2024)</strong>","refs":["1022"]},{"id":"rg_2024_1237","tema":"1237","texto":"TEMA 1237: (i) O <strong>Estado é responsável,</strong> na **esfera\ncível,<strong> por </strong>morte<strong> ou </strong>ferimento** decorrente de operações de\nsegurança pública, nos termos da [Teoria do Risco\nAdministrativo]; (ii) É <strong>ônus probatório do ente</strong>\nfederativo demonstrar eventuais <strong>excludentes</strong> de responsabilidade\ncivil; (iii) A <strong>perícia inconclusiva</strong> sobre a origem de disparo fatal\ndurante operações policiais e militares **não é suficiente, [por si só,\n]**para afastar a responsabilidade civil do Estado, por\nconstituir <strong>elemento indiciário.</strong> (ARE 1.385.315) **(FGV-TJSC-ANALISTA\nJURÍDICO/2024) (FGV-TRF1-ANALISTA/2024) (FGV-PREF DE\nNITERÓI-AUDITOR/2024) ] [(FGV-PCMG-DELEGADO/2025)**\n\n\\[ARE 1.385.315- ED-segundos. Decisão: O Tribunal, por unanimidade,\nacolheu os embargos de declaração <strong>para prestar esclarecimentos</strong>, sem\nefeitos infringentes, de modo a **explicitar que o vocábulo comunidade\nnão se limita a designar favela ou periferia**, não sendo, portanto,\nnecessário inseri-lo na redação da tese do Tema 1237 da repercussão\ngeral, evidenciando-se que a inserção do termo ferimento foi amplamente\ndiscutida pelo Colegiado desta Suprema Corte, nos termos do voto do\nRelator.\\]","refs":["1237"]}],"DIREITO CIVIL":[{"id":"rg_2024_1236","tema":"1236","texto":"TEMA 1236: Nos <strong>casamentos e uniões estáveis</strong>\nenvolvendo pessoa <strong>maior de 70 anos,</strong> o regime de separação de bens\nprevisto no art. 1.641, II, do Código Civil, [pode ser\nafastado] por <strong>expressa manifestação de vontade</strong> das\npartes, mediante <strong>escritura pública</strong>. ([ARE\n1309642](https://portal.stf.jus.br/processos/detalhe.asp?incidente=6096433))\n<strong>(FGV-ENAM/2024) (FGV-DPE/PE-DEFENSOR/2025)</strong>\n\n\\[O STF definiu que o regime de separação de bens nos casamentos e\nuniões estáveis envolvendo pessoas com mais de 70 anos não é\nobrigatório. Por unanimidade, os ministros entenderam que a\nobrigatoriedade prevista no Código Civil **desrespeita o direito de\nescolha das pessoas idosas<strong>. O colegiado considerou que, </strong>caso a\npessoa com mais de 70 anos queira se casar ou fazer união estável em\noutro regim<strong>e, como comunhão de bens, por exemplo, é </strong>necessário\nmanifestar esse desejo por meio de escritura pública,** firmada em\n<strong>cartório</strong>. Também ficou definido que **pessoas acima dessa idade\natualmente casadas ou em união estável podem alterar o regime legal**,\nmas para isso é **[necessário autorização judicial (no caso do\ncasamento)]<strong> ou </strong>[manifestação em escritura pública (no\ncaso da união estável).]** Nesses casos, a alteração\nproduzirá efeitos em relação à divisão do patrimônio apenas para o\nfuturo.\\]","refs":["1236"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2024_1214","tema":"1214","texto":"TEMA 1214: É <strong>inconstitucional</strong> a incidência do\nimposto sobre transmissão causa mortis e doação (<strong>ITCMD</strong>) **sobre o\nrepasse aos beneficiários** de valores e direitos relativos ao plano\nvida gerador de benefício livre (VGBL) ou ao plano gerador de benefício\nlivre (PGBL) na hipótese de morte do titular do plano. (RE 1.363.013)\n(INFO 1163) <strong>(FGV-MPU-ANALISTA/2025)</strong>","refs":["1214"]},{"id":"rg_2024_1280","tema":"1280","texto":"TEMA 1280: É <strong>constitucional</strong> a incidência de **PIS\ne COFINS<strong> em relação a </strong>rendimentos auferidos em aplicações\nfinanceiras** das entidades fechadas de previdência complementar (EFPC).\n(RE 722.528) <strong>(FGV-TRF1-JUIZ/2025)</strong>","refs":["1280"]},{"id":"rg_2024_1335","tema":"1335","texto":"TEMA 1335: . <strong>Não incide</strong> a taxa SELIC, prevista no\nart. 3º da EC nº 113/2021, **no prazo constitucional de pagamento de\nprecatórios** do § 5º do art. 100 da Constituição. 2. Durante o\ndenominado '<strong>período de graça'</strong>, os valores inscritos em precatório\nterão <strong>exclusivamente correção monetária,</strong> nos termos decididos na ADI\n4.357-QO/DF e na ADI 4.425-QO/DF. (RE 1.515.163)","refs":["1335"]},{"id":"rg_2024_863","tema":"863","texto":"TEMA 863: A[té que seja editada lei complementar\nfederal sobre a matéria, **a multa tributária qualificada em razão de\nsonegação, fraude ou conluio limita-se a 100%** (cem por cento) do\ndébito tributário, <strong>podendo ser de até 150%</strong> (cento e cinquenta por\ncento) do débito tributário caso se verifique a <strong>reincidência</strong>\ndefinida no art. 44, § 1º-A, da Lei nº 9.430/96, incluído pela Lei nº\n14.689/23, observando-se, ainda, o disposto no § 1º-C do citado\nartigo.] (RE 736090) <strong>(FGV-TRF3-JUIZ/2025)</strong>\n\n[\\[Modulou os efeitos da decisão para estabelecer que ela passe a\nproduzir efeitos a partir da edição da Lei nº 14.689/23, mantidos os\npatamares atualmente fixados pelos entes da federação até os limites da\ntese, ficando ressalvados desses efeitos (i) as ações\njudiciais e os processos administrativos pendentes de conclusão até a\nreferida data; e (ii) os fatos geradores ocorridos até a referida data\nem relação aos quais não tenha havido o pagamento de multa abrangida\npelo presente tema de repercussão geral.\\]]","refs":["863"]},{"id":"rg_2024_1083","tema":"1083","texto":"TEMA 1083: [A <strong>imunidade tributária</strong> prevista no\nart. 150, inciso VI, alínea e, da Constituição Federal <strong>não se aplica</strong>\nàs importações de suportes materiais produzidos fora do Brasil, **ainda\nque** contenham obra musical de artista brasileiro.] (ARE\n1244302/SP) (INFO 1149) **(FGV-PREF DE NOVA IGUAÇU/RJ-ANALISTA/2024)\n(FGV-TJSE-JUIZ/2025)**","refs":["1083"]},{"id":"rg_2024_1170","tema":"1170","texto":"TEMA 1170: É <strong>aplicável</strong> às condenações da Fazenda\nPública envolvendo relações jurídicas não tributárias o índice de juros\nmoratórios estabelecido no art. 1º-F da Lei n. 9.494/1997, na redação\ndada pela Lei n. 11.960/2009, a partir da vigência da referida\nlegislação, <strong>mesmo havendo previsão diversa</strong> em título executivo\njudicial transitado em julgado. ([RE\n1317982](https://portal.stf.jus.br/processos/detalhe.asp?incidente=6137386))","refs":["1170"]},{"id":"rg_2024_0630","tema":"0630","texto":"TEMA 0630: É <strong>constitucional</strong> a incidência da\ncontribuição para o PIS e da COFINS sobre as **receitas auferidas com a\nlocação de bens móveis ou imóveis**, quando constituir [atividade\nempresarial] do contribuinte, considerando que o resultado\neconômico dessa operação coincide com o conceito de faturamento ou\nreceita bruta, tomados como a soma das receitas oriundas do exercício\ndas atividades empresariais, pressuposto desde a redação original do\nart. 195, I, da Constituição Federal. (RE 599.658) (OBS: O","refs":["0630"]},{"id":"rg_2024_684","tema":"684","texto":"**[TEMA\n684]** teve a mesma tese definida - RE 659.412)","refs":["684"]},{"id":"rg_2024_0684","tema":"0684","texto":"TEMA 0684: É <strong>constitucional</strong> a incidência da\ncontribuição para o PIS e da COFINS sobre as receitas auferidas com a\n<strong>locação de bens móveis ou imóveis,</strong> quando constituir **atividade\nempresarial** do contribuinte, considerando que o resultado econômico\ndessa operação coincide com o conceito de faturamento ou receita bruta,\ntomados como a soma das receitas oriundas do exercício das atividades\nempresariais, pressuposto desde a redação original do art. 195, I, da\nConstituição Federal. (RE 659.412)\n\n<strong>TEMA 1174</strong>: É <strong>inconstitucional</strong> a sujeição, na forma\ndo art. 7º da Lei nº 9.779/99, com a redação conferida pela Lei nº\n13.315/16, dos rendimentos de aposentadoria e de pensão pagos,\ncreditados, entregues, empregados ou remetidos a residentes ou\ndomiciliados no exterior à **incidência do imposto de renda na fonte à\nalíquota de 25%** (vinte e cinco por cento). (ARE 1.327.491)","refs":["1174","0684"]},{"id":"rg_2024_1337","tema":"1337","texto":"TEMA 1337: A aplicação das **alíquotas integrais do\nPIS e da COFINS,** a partir da repristinação promovida pelo Decreto nº\n11.374/2023, <strong>não está submetida à anterioridade nonagesimal</strong>. (RE\n1.501.643)","refs":["1337"]},{"id":"rg_2024_1338","tema":"1338","texto":"TEMA 1338: <strong>Cabe ação rescisóri</strong>a para adequação de\njulgado à modulação temporal dos efeitos da tese de repercussão geral\nfixada no julgamento do RE 574.706 (Tema 69/RG). (RE 1.489.562)","refs":["1338","69"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2024_632","tema":"632","texto":"TEMA 632: Aplicam-se os efeitos da ausência de\nrepercussão geral a controvérsias relativas à possibilidade de o\nInstituto Nacional do Seguro Social proceder, a qualquer tempo, à\nrevisão do critério de reajuste da aposentadoria de ex-combatente e da\ncorrespondente pensão por morte com fundamento em errônea aplicação da\nLei nº 5.698, de 31 de agosto de 1971. (RE 699535)","refs":["632"]},{"id":"rg_2024_968","tema":"968","texto":"TEMA 968: 1. É <strong>constitucional</strong> a previsão, em lei\nfederal, de <strong>medidas sancionatórias</strong> ao **ente federativo que\ndescumprir** os critérios e exigências aplicáveis aos regimes próprios\nde previdência social. 2. <strong>Admite-se o controle judicial</strong> das\nexigências feitas pela União no exercício da fiscalização desses\nregimes. Nesse caso, o <strong>ente fiscalizado deverá demonstrar,</strong> de forma\ntécnica: (i) a <strong>inexistência do déficit</strong> atuarial apontado; ou, (ii)\ncaso reconheça o desequilíbrio, a **impertinência das medidas impostas\npela União<strong> e a existência de </strong>plano alternativo** capaz de assegurar,\nde maneira equivalente, a sustentabilidade do regime. ([RE\n1007271](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5082568))","refs":["968"]}]},"2023":{"DIREITO PROCESSUAL PENAL":[{"id":"rg_2023_0580","tema":"0580","texto":"TEMA 0580: Compete à <strong>Justiça Federal</strong> processar e\njulgar o crime de violação de direito autoral de caráter transnacional.\n(RE 702362)","refs":["0580"]},{"id":"rg_2023_1041","tema":"1041","texto":"TEMA 1041: [(1) Sem autorização judicial ou fora das\nhipóteses legais, é <strong>ilícita</strong> a prova obtida mediante abertura de\ncarta, telegrama, pacote ou meio análogo, <strong>salvo</strong> se ocorrida em\nestabelecimento penitenciário, quando houver [fundados\nindícios] da prática de atividades ilícitas; (2) Em relação\na abertura de encomenda postada nos Correios, a prova obtida somente\nserá lícita quando houver **fundados indícios da prática de atividade\nilícita,** formalizando-se as providências adotadas para fins de\ncontrole administrativo ou judicial.] (RE 1116949)","refs":["1041"]}],"DIREITO CIVIL":[{"id":"rg_2023_0982","tema":"0982","texto":"TEMA 0982: É <strong>constitucional</strong> o procedimento da Lei\nnº 9.514/1997 para a **execução extrajudicial da cláusula de alienação\nfiduciária** em garantia, haja vista sua compatibilidade com as\ngarantias processuais previstas na Constituição Federal. (RE 860631)","refs":["0982"]},{"id":"rg_2023_1053","tema":"1053","texto":"TEMA 1053: Após a promulgação da EC nº 66/2010, a\n<strong>separação judicial não é mais requisito para o divórcio</strong> **[nem\nsubsiste como figura autônoma no ordenamento]** jurídico.\nSem prejuízo, preserva-se o estado civil das pessoas que já estão\nseparadas, por decisão judicial ou escritura pública, por se tratar de\nato jurídico perfeito (art. 5º, XXXVI, da CF). (RE 1167478) **(FGV-PREF\nSÃO JOSÉ DOS CAMPOS-AUDITOR/2024)**","refs":["1053"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2023_0633","tema":"0633","texto":"TEMA 0633: A <strong>imunidade</strong> a que se refere o art. 155,\n§ 2º, X, \\'a\\', CF/88 <strong>não alcança,</strong> nas operações de exportação, o\naproveitamento de créditos de ICMS decorrentes de aquisições de bens\ndestinados ao <strong>uso e consumo da empresa,</strong> que depende de lei\ncomplementar para sua efetivação.\" (RE 704815)","refs":["0633"]},{"id":"rg_2023_0694","tema":"0694","texto":"TEMA 0694: O diferimento do ICMS relativo à saída do\nálcool etílico anidro combustível (AEAC) das usinas ou destilarias para\no momento da saída da gasolina C das distribuidoras (Convênios ICMS nº\n80/97 e 110/07) <strong>não gera o direito de crédito</strong> do imposto para as\ndistribuidoras. (RE 781926)","refs":["0694"]},{"id":"rg_2023_0736","tema":"0736","texto":"TEMA 0736: É <strong>inconstitucional</strong> a <strong>multa isolada</strong>\nprevista em lei para incidir diante da mera [negativa de homologação de\ncompensação] tributária por não consistir em ato ilícito com\naptidão para propiciar automática penalidade pecuniária. (RE 796939)\n(<strong>FGV-ALPR-PROCURADOR/2024)</strong>","refs":["0736"]},{"id":"rg_2023_0390","tema":"0390","texto":"TEMA 0390: É <strong>constitucional</strong> o art. 40 da Lei nº\n6.830/1980 (Lei de Execuções Fiscais LEF), tendo **natureza processual o\nprazo de 1 (um) ano** de suspensão da execução fiscal. Após o decurso\ndesse prazo, inicia-se automaticamente a contagem do prazo\nprescricional tributário de 5 (cinco) anos. (RE 636562)\n**(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(VUNESP-MPRJ-PROMOTOR/2024) (FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024\n[](FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)\n(FGV-TRF3-JUIZ/2025)**","refs":["0390"]},{"id":"rg_2023_0881_e_TEMA_0885","tema":"0881 e TEMA 0885","texto":"TEMA 0881 e TEMA 0885: 1. As decisões do STF em\ncontrole <strong>incidental</strong> de constitucionalidade, anteriores à instituição\ndo regime de repercussão geral, **não impactam automaticamente a coisa\njulgada** que se tenha formado, mesmo nas relações jurídicas tributárias\nde trato sucessivo. 2. Já as decisões proferidas em **ação direta ou em\nsede de repercussão geral** interrompem\n<strong>automaticamente</strong> os efeitos temporais das decisões transitadas em\njulgado nas referidas relações, [respeitadas a irretroatividade, a\nanterioridade anual e a noventena] ou a anterioridade\nnonagesimal, conforme a natureza do tributo. (RE 949297 e RE 955227\nrespectivamente) **(VIDE INFO 1131 STF) (FGV-TJGO-JUIZ/2023)\n(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)\n(VUNESP-MPRJ-PROMOTOR/2024)**\n\n<strong>\\[OBS:</strong> 881 - Título: [Limites da coisa julgada em matéria\ntributária], notadamente diante de julgamento, em [controle\nconcentrado pelo Supremo Tribunal Federal, que declara a\nconstitucionalidade de tributo anteriormente considerado\ninconstitucional, na via do controle incidental, por decisão transitada\nem julgado. (RE 949.297-ED)]\n\n885 - Título: Efeitos das decisões do Supremo Tribunal Federal em\ncontrole difuso de constitucionalidade sobre a coisa julgada formada nas\nrelações tributárias de trato continuado. (RE 955.227-ED)\n\nDecisão: O Tribunal, por maioria, resolvendo questão de ordem, manteve\nsua jurisprudência no sentido da ausência de legitimidade de amicus\ncurie para oposição de embargos de declaração, registrando, todavia, a\npossibilidade de invocação do art. 323, § 3º, do RISTF, vencidos os\nMinistros André Mendonça, Nunes Marques, Edson Fachin, Luiz Fux e Dias\nToffoli. Votou na questão de ordem o Ministro Flávio Dino. Por maioria,\no Tribunal não modulou os efeitos da decisão de mérito, vencidos os\nMinistros Luiz Fux, Edson Fachin, Dias Toffoli e Nunes Marques. Não\nvotou nesse ponto o Ministro Flávio Dino, sucessor da Ministra Rosa\nWeber, que já havia votado em assentada anterior também no sentido da\nnão modulação dos efeitos. Por fim, por maioria, o Tribunal [deu parcial\nprovimento aos embargos de declaração] opostos por TBM --\nTêxtil Bezerra de Menezes S/A para **afastar exclusivamente as multas\ntributárias de qualquer natureza impostas aos contribuintes que tiveram\ndecisão favorável transitada em julgado em ações judiciais propostas\npara questionar a exigibilidade da CSLL e cujo fato gerador tenha\nocorrido até a data da publicação da ata do julgamento de mérito\n(13.02.2023),<strong> ficando </strong>preservada a incidência dos juros de mora e da\ncorreção monetária e vedada a repetição dos valores já recolhidos\nreferentes a multas de qualquer natureza,** vencidos os Ministros Gilmar\nMendes, Cristiano Zanin, Alexandre de Moraes, Cármen Lúcia e Rosa Weber,\nque já havia votado em assentada anterior. Não votou nesse ponto o\nMinistro Flávio Dino.\\]","refs":["0885","0881"]},{"id":"rg_2023_1084","tema":"1084","texto":"TEMA 1084: É <strong>constitucional</strong> a lei municipal que\ndelega ao Poder Executivo a avaliação individualizada,\npara fins de cobrança do IPTU, de imóvel novo <strong>não previsto</strong> na Planta\nGenérica de Valores, <strong>desde que</strong> fixados em lei os critérios para a\navaliação técnica e assegurado ao contribuinte o [direito ao\ncontraditório]. (ARE 1245097) (INFO 1098) **(FGV/2024)\n(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024) (FGV-TCEPA-AUDITOR/2024)\n(FGV-PREF DE CUIABÁ/MT-AUDITOR FISCAL/2024)**\n\n<strong>TEMA 0372:</strong> As <strong>receitas brutas operacionais</strong>\ndecorrentes da <strong>atividade</strong> empresarial <strong>típica</strong> das instituições\nfinanceiras <strong>integram</strong> a base de cálculo PIS/COFINS cobrado em face\ndaquelas ante a Lei nº 9.718/98, mesmo em sua redação original,\n<strong>ressalvadas</strong> as exclusões e deduções legalmente prescritas. (RE\n609096) <strong>(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)</strong>","refs":["1084","0372"]},{"id":"rg_2023_1284","tema":"1284","texto":"TEMA 1284: A cobrança do ICMS-DIFAL de empresas\noptantes do Simples Nacional deve ter fundamento em l**ei estadual em\nsentido estrito<strong>. (ARE 1460254) [</strong>(FGV-TJSC-JUIZ/2024)\n(CESPE-SEBRAE-ANALISTA/2024) (FGV-TJMT-JUIZ/2024)\n(FGV-SEFAZ/RS-AUDITOR/2025)**]","refs":["1284"]},{"id":"rg_2023_0504","tema":"0504","texto":"TEMA 0504: [Os créditos presumidos de IPI, instituídos\npela Lei nº 9.363/1996, <strong>não integram</strong> a base de cálculo da\ncontribuição para o PIS e da COFINS, sob a sistemática de apuração\ncumulativa (Lei nº 9.718/1998), pois não se amoldam ao conceito\nconstitucional de faturamento. (][RE\n593544](https://portal.stf.jus.br/processos/detalhe.asp?incidente=2640659))","refs":["0504"]}],"DIREITO PENAL":[{"id":"rg_2023_1246","tema":"1246","texto":"TEMA 1246: O art. 268 do Código Penal veicula norma\npenal em branco que pode ser complementada por atos normativos\ninfralegais editados pelos entes federados (União, Estados, Distrito\nFederal e Municípios), respeitadas as respectivas esferas de atuação,\nsem que isso implique ofensa à competência privativa da União para\nlegislar sobre direito penal (CF, art. 22, I). (ARE 1418846)","refs":["1246"]},{"id":"rg_2023_0477","tema":"0477","texto":"TEMA 0477: 1. A <strong>revogação ou modificação</strong> do ato\nnormativo em que se fundou a edição de enunciado de súmula vinculante\nacarreta, em regra, a necessidade de sua [revisão ou\ncancelamento] pelo Supremo Tribunal Federal, conforme o\ncaso. 2. É <strong>constitucional</strong> a previsão legislativa de <strong>perda</strong> dos\ndias remidos pelo condenado que comete <strong>falta grave</strong> no curso da\nexecução penal. (RE 1116485)","refs":["0477"]},{"id":"rg_2023_1200","tema":"1200","texto":"TEMA 1200: 1) A perda da graduação da praça pode ser\ndeclarada como efeito secundário da sentença condenatória pela prática\nde crime militar ou comum, nos termos do art. 102 do Código Penal\nMilitar e do art. 92, I, \\'b\\', do Código Penal, respectivamente. 2) Nos\ntermos do artigo 125, § 4º, da Constituição Federal, o Tribunal de\nJustiça Militar, onde houver, ou o Tribunal de Justiça são competentes\npara decidir, em processo autônomo decorrente de representação do\nMinistério Público, sobre a perda do posto e da patente dos oficiais e\nda graduação das praças que teve contra si uma sentença condenatória,\n<strong>independentemente</strong> da natureza do crime por ele cometido. (ARE\n1320744)","refs":["1200"]},{"id":"rg_2023_0788","tema":"0788","texto":"TEMA 0788: O <strong>prazo para a prescrição</strong> da execução\nda pena concretamente aplicada somente começa a correr do dia em que a\nsentença condenatóri<strong>a transita em julgado para ambas as partes,</strong>\nmomento em que nasce para o Estado a pretensão executória da pena,\nconforme interpretação dada pelo Supremo Tribunal Federal ao **princípio\nda presunção de inocência** (art. 5º, inciso LVII, da Constituição\nFederal) nas ADC 43, 44 e 54. (ARE 848107)\n\n\\[Esse entendimento se aplica aos casos em que (i) a **pena não foi\ndeclarada extinta pela prescrição;<strong> e (ii) cujo </strong>trânsito em julgado\npara a acusação tenha ocorrido após 12.11.2020**.\\]\n\n<strong>(FGV-ENAM/2024) (FGV-DPERJ-DEFENSOR/2023)</strong>","refs":["0788"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2023_1032","tema":"1032","texto":"TEMA 1032: O candidato estrangeiro tem **direito\nlíquido e certo à nomeação** em concurso público para provimento de\ncargos de professor, técnico e cientista em universidades e instituições\nde pesquisa científica e tecnológica federais, nos termos do art. 207, §\n1º, da Constituição Federal, <strong>salvo</strong> se a restrição da nacionalidade\nestiver expressa no edital do certame com o exclusivo objetivo de\npreservar o interesse público e desde que, sem prejuízo de controle\njudicial, devidamente justificada. (RE 1177699) <strong>(FGV/2024)</strong>","refs":["1032"]},{"id":"rg_2023_1001","tema":"1001","texto":"TEMA 1001: É <strong>constitucional</strong> o ato normativo\n<strong>municipal</strong>, editado no exercício de **competência legislativa\nsuplementar,<strong> que </strong>proíba a participação** em licitação ou a\ncontratação: (a) de agentes eletivos; (b) de ocupantes de cargo em\ncomissão ou função de confiança; (c) de cônjuge, companheiro ou parente\nem linha reta, colateral ou por afinidade, <strong>até o terceiro grau</strong>,\ninclusive, de qualquer destes; e (d) dos demais servidores públicos\nmunicipais. <strong>\\[de modo a excluir a proibição</strong> de contratação de\npessoas ligadas, por matrimônio ou parentesco, afim ou consanguíneo, até\no terceiro grau inclusive, ou por adoção, a servidores municipais que\n<strong>não ocupem cargo em comissão ou função de confiança,</strong> nos termos do\nvoto do Ministro Roberto Barroso\\]. (RE 910552) (INFO 1101)\n**(FGV-TJPR-JUIZ/2023) (FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)\n(FGV/2024) (FGV-ENAM/2024) (FGV-TJGO-JUIZ/2023)\n[(FGV-TCEPA-AUDITOR/2024) (FGV-PREF DE MACAÉ/RJ-ANALISTA/2024) (FGV-PREF\nDE VITÓRIA/ES-PROCURADOR/2024) (FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)\n(FGV-PREF DE NITERÓI/RJ-AUDITOR/2024) (FGV-TJPE-JUIZ/2024)]**","refs":["1001"]},{"id":"rg_2023_1015","tema":"1015","texto":"TEMA 1015: É <strong>inconstitucional</strong> a vedação à posse em\ncargo público de candidato (a) aprovado(a) que, embora tenha sido\nacometido(a) por doença grave, [não apresenta sintoma incapacitante nem\npossui restrição relevante] que impeça o exercício da função\npretendida (CF, arts. 1º, III, 3º, IV, 5º, caput, 37, caput, I e II).\n([RE\n886131](https://portal.stf.jus.br/processos/detalhe.asp?incidente=4766104))\n(INFO 1119) <strong>(FGV-PCMG-DELEGADO/2025) (FGV-ENAM/2025)</strong>","refs":["1015"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2023_1128","tema":"1128","texto":"TEMA 1128: É **inconstitucional dispositivo de\nConstituição estadual<strong> que </strong>permite** [transposição, absorção ou\naproveitamento] de empregado público no quadro estatutário\nda Administração Pública estadual **sem prévia aprovação em concurso\npúblico**, nos termos do art. 37, II, da Constituição Federal. (RE\n1232885) <strong>(FGV-ALPR-PROCURADOR/2024)</strong>\n\n<strong>TEMA 1054</strong>: O Conselho Federal e os Conselhos\nSeccionais da Ordem dos Advogados do Brasil <strong>não estão obrigados</strong> a\nprestar contas ao Tribunal de Contas da União nem a qualquer outra\nentidade externa. (RE 1182189) <strong>(FGV/2024) (FGV-TCE/PI-AUDITOR/2025)</strong>","refs":["1128","1054"]},{"id":"rg_2023_1056","tema":"1056","texto":"TEMA 1056: É <strong>constitucional</strong> [formal e\nmaterialmente] lei municipal que proíbe a soltura de fogos\nde artifício e artefatos pirotécnicos produtores de estampidos. (RE\n1210727)\n\n<strong>TEMA 1002</strong>: 1. É <strong>devido</strong> o pagamento de honorários\nsucumbenciais à Defensoria Pública, quando representa parte vencedora em\ndemanda ajuizada **contra qualquer ente público, inclusive aquele que\nintegra;** 2. O valor recebido a título de honorários sucumbenciais deve\nser destinado, exclusivamente, ao aparelhamento das\nDefensorias Públicas, <strong>vedado</strong> o seu rateio entre os membros da\ninstituição. (RE 1.140.005) **(FGV/2023) (FGV-ALPR-ANALISTA\nLEGISL/2024)**","refs":["1056","1002"]},{"id":"rg_2023_0416","tema":"0416","texto":"TEMA 0416: 1. A complementação ao FUNDEF realizada a\npartir do valor mínimo anual por aluno fixada em desacordo com a média\nnacional impõe à União o dever de suplementação de recursos. 2. Sendo\ntal obrigação imposta por título executivo judicial, aplica-se a\nsistemática dos precatórios, nos termos do art. 100 da Constituição\nFederal. (RE 635347)","refs":["0416"]},{"id":"rg_2023_0698","tema":"0698","texto":"TEMA 0698: 1. A intervenção do Poder Judiciário em\npolíticas públicas voltadas à realização de direitos fundamentais, em\ncaso de ausência ou deficiência grave do serviço, **não\nviola** o princípio da separação dos poderes. 2. A decisão judicial,\ncomo regra, em lugar de determinar medidas pontuais, **deve apontar as\nfinalidades** a serem alcançadas e determinar à Administração Pública\nque apresente um <strong>plano e/ou os meios adequados</strong> para alcançar o\nresultado. 3. No caso de serviços de <strong>saúde</strong>, o déficit de\nprofissionais pode ser <strong>suprido por concurso público</strong> ou, por exemplo,\npelo remanejamento de recursos humanos e pela c[ontratação de\norganizações sociais (OS) e organizações da sociedade civil de interesse\npúblico (OSCIP).] (RE 684.612) **(FGV-DPERJ-DEFENSOR/2023)\n(FGV/2024 - duas vezes) (FGV-TJSC/2024) (FGV-ENAM/2024) (FGV-CÂMARA MUN\nDE SP-PROC/2024) (FGV-TCE/PA-AUDITOR/2024) (FGV-PREF DE\nVITÓRIA-PROCURADOR/2024) (FGV-PREF DE MACAÉ/RJ-ANALISTA/2024)\n(VUNESP-TJSP-JUIZ/2024) (FGV-TJPE-JUIZ/2024) (FGV-TJRR-ANALISTA/2024)\n(FGV-ENAM 2/2024)**\n\n<strong>TEMA 1262</strong>: <strong>Não se mostra admissível</strong> a restituição\nadministrativa do indébito reconhecido na via judicial, sendo\n<strong>indispensável</strong> a observância do regime constitucional de precatórios,\nnos termos do art. 100 da Constituição Federal.","refs":["1262","0698"]},{"id":"rg_2023_0519","tema":"0519","texto":"TEMA 0519: O regime especial de precatórios trazido\npela Emenda Constitucional nº 62/2009 aplica-se aos precatórios\nexpedidos anteriormente a sua promulgação, observados a declaração de\ninconstitucionalidade parcial quando do julgamento da ADI nº 4.425 e os\nefeitos prospectivos do julgado. (RE 659.172)","refs":["0519"]},{"id":"rg_2023_0598","tema":"0598","texto":"TEMA 0598: O deferimento de sequestro de rendas\npúblicas para pagamento de precatório [deve se restringir às hipóteses\nenumeradas taxativamente] na Constituição Federal de 1988.\n(RE 840.435) <strong>(FGV-ALTO-PROCURADOR JURÍD/2024)</strong>","refs":["0598"]},{"id":"rg_2023_0865","tema":"0865","texto":"TEMA 0865: No caso de necessidade de co**mplementação\nda indenização,** ao final do processo expropriatório, deverá o\npagamento ser feito mediante <strong>depósito judicial</strong> direto se o Poder\nPúblico n<strong>ão estiver em dia com os precatórios.</strong> (RE 922.144)\n**(FGV-PROC-CÂMARA MUNICIPAL DE SP/2024) (VUNESP-MPRO-PROMOTOR/2024)\n(FGV-TJSC-JUIZ/2024.2) (FGV-TJMT-JUIZ/2024)**","refs":["0865"]},{"id":"rg_2023_1051","tema":"1051","texto":"TEMA 1051: É <strong>inconstitucional</strong> lei <strong>municipal</strong>\nque estabelece a obrigação da implantação, nos shopping centers, de\nambulatório médico ou serviço de pronto-socorro equipado para o\natendimento de emergência. ([RE\n833291](https://portal.stf.jus.br/processos/detalhe.asp?incidente=4623913))\n<strong>(VUNESP-PREF DE CATANDUVA/SP-PROCURADOR/2024)</strong>","refs":["1051"]},{"id":"rg_2023_0995","tema":"0995","texto":"TEMA 0995: 1. A [plena proteção constitucional à\nliberdade de imprensa é consagrada pelo **binômio liberdade com\nresponsabilidade**], vedada qualquer espécie de\ncensura prévia. Admite-se a possibilidade posterior de análise e\nresponsabilização, inclusive com remoção de conteúdo, por informações\n<strong>comprovadamente</strong> injuriosas, difamantes, caluniosas, mentirosas, e em\nrelação a eventuais danos materiais e morais. Isso porque os direitos à\nhonra, intimidade, vida privada e à própria imagem formam a proteção\nconstitucional à dignidade da pessoa humana, salvaguardando um espaço\níntimo intransponível por intromissões ilícitas externas. 2. Na hipótese\nde publicação de entrevista em que o entrevistado imputa\nfalsamente prática de crime a terceiro, a empresa\njornalística somente poderá ser responsabilizada civilmente se: (i) à\népoca da divulgação, havia indícios concretos da falsidade\nda imputação; e (ii) o veículo [deixou de observar o dever de\ncuidado] na verificação da veracidade dos fatos e na\ndivulgação da existência de tais indícios. ([RE\n1075412](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5263701))\n\n[<strong>\\[ATENÇÃO: Decisão:</strong> O Tribunal, por unanimidade, **conheceu dos\nembargos de declaração e deu-lhes parcial provimento**, para fixação da\nseguinte tese de repercussão geral (tema 995): \\\"1. Na hipótese de\npublicação de entrevista, por quaisquer meios, em que o **entrevistado\nimputa falsamente prática de crime a terceiro<strong>, a </strong>empresa\njornalística somente poderá ser responsabilizada civilmente** se\ncomprovada sua <strong>má-fé</strong> caracterizada: (i) pelo <strong>dolo</strong> demonstrado em\nrazão do <strong>conhecimento prévio da falsidade</strong> da declaração, <strong>ou</strong> (ii)\n<strong>culpa grave</strong> decorrente da <strong>evidente negligência</strong> na apuração da\nveracidade do fato e na sua **divulgação ao público sem resposta do\nterceiro ofendido<strong> </strong>ou,<strong> ao menos, de </strong>busca do contraditório pelo\nveículo<strong>; 2. Na hipótese de entrevistas </strong>realizadas e transmitidas ao\nvivo<strong>, fica </strong>excluída a responsabilidade do veículo<strong> por </strong>ato\nexclusivamente de terceiro<strong> quando este </strong>falsamente imputa a outrem a\nprática de um crime**, devendo ser assegurado pelo veículo o exercício\ndo <strong>direito de resposta em iguais condições, espaço e destaque</strong>, sob\npena de responsabilidade nos termos dos incisos V e X do artigo 5º da\nConstituição Federal; 3. <strong>Constatada a falsidade</strong> referida nos itens\nacima, <strong>deve haver remoção, de ofício ou por notificação</strong> da vítima,\nquando a imputação permanecer disponível em plataformas digitais, sob\npena de responsabilidade\\\", nos termos do voto do Relator. Presidência\ndo Ministro Luís Roberto Barroso. Plenário, <strong>20.3.2025</strong>.\\] (INFO\n1170)]","refs":["995","0995"]},{"id":"rg_2023_1031","tema":"1031","texto":"TEMA 1031: I - A demarcação consiste em procedimento\n<strong>declaratório</strong> do direito originário territorial à posse das terras\nocupadas tradicionalmente por comunidade indígena; II - A posse\ntradicional indígena é <strong>distinta da posse civil,</strong> consistindo na\nocupação das terras habitadas em <strong>caráter permanente</strong> pelos indígenas,\nnas u<strong>tilizadas para suas atividades produtivas</strong>, nas\n<strong>imprescindíveis à preservação dos recursos ambientais necessários</strong> a\nseu bem-estar e nas necessárias a sua r<strong>eprodução física e cultural</strong>,\nsegundo seus usos, costumes e tradições, nos termos do § 1º do artigo\n231 do texto constitucional; III - A proteção constitucional aos\ndireitos originários sobre as terras que tradicionalmente ocupam\n<strong>independe</strong> da existência de um marco temporal em 05 de outubro de\n1988 ou da configuração do renitente esbulho, como conflito físico ou\ncontrovérsia judicial persistente à data da promulgação da Constituição;\nIV -- Existindo ocupação tradicional indígena ou renitente esbulho\ncontemporâneo à promulgação da Constituição Federal, aplica-se o\n<strong>regime indenizatório</strong> relativo às benfeitorias úteis e necessárias,\nprevisto no § 6º do art. 231 da CF/88; V -- Ausente ocupação tradicional\nindígena ao tempo da promulgação da Constituição Federal ou renitente\nesbulho na data da promulgação da Constituição, são válidos e eficazes,\nproduzindo todos os seus efeitos, os atos e negócios jurídicos perfeitos\ne a coisa julgada relativos a justo título ou posse de boa-fé das terras\nde ocupação tradicional indígena, assistindo ao particular direito à\njusta e prévia indenização das benfeitorias necessárias e úteis, pela\nUnião; e, quando inviável o reassentamento dos particulares, caberá a\neles indenização pela União (com direito de regresso em face do ente\nfederativo que titulou a área) correspondente ao valor da terra nua,\npaga em dinheiro ou em títulos da dívida agrária, se for do interesse do\nbeneficiário, e processada em autos apartados do procedimento de\ndemarcação, com pagamento imediato da parte incontroversa, garantido o\ndireito de retenção até o pagamento do valor incontroverso, permitidos a\nautocomposição e o regime do § 6º do art. 37 da CF; VI -- Descabe\nindenização em casos já pacificados, decorrentes de terras indígenas já\nreconhecidas e declaradas em procedimento demarcatório, ressalvados os\ncasos judicializados e em andamento; VII -- É **dever da União efetivar\no procedimento demarcatório das terras indígenas,** sendo admitida a\nformação de áreas reservadas somente diante da **absoluta\nimpossibilidade** de concretização da ordem constitucional de\ndemarcação, devendo ser ouvida, em todo caso, a comunidade indígena,\nbuscando-se, se necessário, a autocomposição entre os respectivos entes\nfederativos para a identificação das terras necessárias à formação das\náreas reservadas, tendo sempre em vista a busca do interesse público e a\npaz social, bem como a proporcional compensação às comunidades indígenas\n(art. 16.4 da Convenção 169 OIT); VIII -- A instauração de procedimento\nde redimensionamento de terra indígena não é vedada em caso de\ndescumprimento dos elementos contidos no artigo 231 da Constituição da\nRepública, por meio de pedido de revisão do procedimento demarcatório\napresentado até o prazo de cinco anos da demarcação anterior, sendo\nnecessário comprovar grave e insanável erro na condução do procedimento\nadministrativo ou na definição dos limites da terra indígena,\nressalvadas as ações judiciais em curso e os pedidos de revisão já\ninstaurados até a data de conclusão deste julgamento; IX - **O laudo\nantropológico realizado nos termos do Decreto nº 1.775/1996 é um dos\nelementos fundamentais para a demonstração da tradicionalidade da\nocupação de comunidade indígena** determinada, de acordo com seus usos,\ncostumes e tradições, na forma do instrumento normativo citado; X - As\nterras de ocupação tradicional indígena são de posse permanente da\ncomunidade, cabendo aos indígenas o usufruto exclusivo das riquezas do\nsolo, dos rios e lagos nelas existentes; XI - As terras de ocupação\ntradicional indígena, na qualidade de terras públicas, são\n**inalienáveis, indisponíveis e os direitos sobre elas\nimprescritíveis;** XII -- A ocupação tradicional das terras indígenas é\ncompatível com a tutela constitucional do meio ambiente, sendo\nassegurado o exercício das atividades tradicionais dos povos indígenas;\nXIII -- Os povos indígenas possuem <strong>capacidade civil e postulatória,</strong>\nsendo partes legítimas nos processos em que discutidos seus interesses,\nsem prejuízo, nos termos da lei, da **legitimidade concorrente da FUNAI\ne da intervenção do Ministério Público** como fiscal da lei.\n<strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR LEGISL/2024)</strong>\n<strong>(FGV-TJPE-JUIZ/2024) (FGV-TJSE-JUIZ/2025) (FGV-TRF1-JUIZ/2025)</strong>","refs":["1031"]},{"id":"rg_2023_1132","tema":"1132","texto":"TEMA 1132: I - É <strong>constitucional</strong> a aplicação do\npiso salarial nacional dos Agentes Comunitários de Saúde e Agentes de\nCombate às Endemias, instituído pela Lei 12.994/2014, aos servidores\nestatutários dos entes subnacionais, em consonância com o art. 198, §\n5º, da Constituição Federal, com a redação dada pelas Emendas\nConstitucionais 63/2010 e 120/2022, cabendo à União arcar com os ônus da\ndiferença entre o piso nacional e a legislação do ente municipal; II -\nAté o advento da Lei 9.646/2022, a expressão \\`piso salarial´ para os\nAgentes Comunitários de Saúde e Agentes de Combate às Endemias\ncorresponde à remuneração mínima, considerada, nos termos do art. 3º,\ninciso XIX, da Lei 8.629/2014, somente a soma do vencimento do cargo e\nda gratificação por avanço de competências. ([RE\n1279765](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5959896))","refs":["1132"]},{"id":"rg_2023_847","tema":"847","texto":"TEMA 847: **Ofende a autonomia administrativa das\nDefensoria<strong>s Públicas decisão judicial que </strong>determine a lotação de\ndefensor público<strong> em localidade desamparada, em </strong>desacordo** com os\ncritérios previamente definidos pela própria instituição, desde que\nobservados os critérios do art. 98, caput e § 2º, do Ato das Disposições\nConstitucionais Transitórias -- ADCT. (RE 887.671) (INFO 1086)\n<strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023) (FGV-DPEPE-DEFENSOR/2025)</strong>","refs":["847"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2023_1043","tema":"1043","texto":"TEMA 1043: É <strong>constitucional</strong> a utilização da\n<strong>colaboração premiada,</strong> nos termos da Lei 12.850/2013, no âmbito\ncivil, em ação civil pública por ato de improbidade administrativa\nmovida pelo Ministério Público, observando-se as seguintes diretrizes:\n(1) Realizado o acordo de colaboração premiada, serão remetidos ao juiz,\npara análise, o respectivo termo, as declarações do colaborador e cópia\nda investigação, <strong>devendo o juiz ouvir sigilosamente o colaborador,</strong>\nacompanhado de seu <strong>defensor</strong>, oportunidade em que analisará os\nseguintes aspectos na homologação: regularidade, legalidade e\nvoluntariedade da manifestação de vontade, especialmente nos casos em\nque o colaborador está ou esteve sob efeito de medidas cautelares, nos\ntermos dos §§ 6º e 7º do artigo 4º da referida Lei 12.850/2013; (2) As\ndeclarações do agente colaborador, <strong>desacompanhadas</strong> de outros\nelementos de prova, são <strong>insuficientes</strong> para o início da ação civil\npor ato de improbidade; (3) A obrigação de ressarcimento do dano causado\nao erário pelo agente colaborador deve ser <strong>integral</strong>, não podendo ser\nobjeto de transação ou acordo, sendo válida a negociação em torno do\nmodo e das condições para a indenização; (4) O acordo de colaboração\ndeve ser celebrado pelo Ministério Público, **com a\ninterveniência da pessoa jurídica** interessada e devidamente\nhomologado pela autoridade judicial; (5) Os acordos já\nfirmados somente pelo Ministério Público ficam preservados até a data\ndeste julgamento, desde que haja previsão de total ressarcimento do\ndano, tenham sido devidamente homologados em Juízo e regularmente\ncumpridos pelo beneficiado. (RE 1.175.650) **(FGV/2024)\n(FGV-TJGO-JUIZ/2023) (FGV-TCEPA-AUDITOR/2024)\n(VUNESP-PCSP-DELEGADO/2023) (FGV-ALPR-PROCURADOR/2024)**","refs":["1043"]},{"id":"rg_2023_1143","tema":"1143","texto":"TEMA 1143: 1. A <strong>Justiça Comum</strong> é competente para\njulgar ação ajuizada por servidor <strong>celetista contra o Poder Público</strong>,\nem que se pleiteia parcela de natureza administrativa.\n<strong>(FGV-TJSC-JUIZ/2024.2) (FGV-TRF3-JUIZ/2025) (FGV-TRF5-JUIZ/2025)</strong>","refs":["1143"]},{"id":"rg_2023_1184","tema":"1184","texto":"TEMA 1184: [1. É <strong>legítima</strong> a **extinção de execução\nfiscal de baixo valor** pela ausência de interesse de agir\ntendo em vista o princípio constitucional da <strong>eficiência</strong>\nadministrativa, respeitada a competência constitucional de cada ente\nfederado. 2. O ajuizamento da execução fiscal dependerá da prévia adoção\ndas seguintes providências: a) tentativa de conciliação ou\nadoção de solução administrativa; e b)\nprotesto do título, salvo por motivo de eficiência\nadministrativa, comprovando-se a inadequação da medida. 3. O trâmite de\nações de execução fiscal não impede os entes federados de\npedirem a suspensão do processo para a adoção das medidas previstas no\nitem 2, devendo, nesse caso, o juiz ser comunicado do prazo para as\nprovidências cabíveis. (][RE\n1355208](https://portal.stf.jus.br/processos/detalhe.asp?incidente=6291425))\n(INFO 1121) **[(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024) (FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024)] (FGV-PREF DE MACAÉ/RJ-ANALISTA/2024)\n(FGV-TJPE-JUIZ/2024)**\n\n[(OBS:O Tribunal, por unanimidade, acolheu os embargos de declaração,\nsem atribuição de efeitos infringentes, apenas para esclarecer que a\ntese de repercussão geral fixada na espécie **aplica-se somente aos\ncasos de execução fiscal de baixo valor,** nos exatos limites do Tema\n1.184, incidindo [também sobre as execuções fiscais\nsuspensas] em razão do julgamento desse tema pelo Supremo\nTribunal Federal, nos termos do voto da Relatora.)]","refs":["1184","1"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2023_0651","tema":"0651","texto":"TEMA 0651: I - É inconstitucional a contribuição à\nseguridade social, a cargo do empregador rural pessoa jurídica,\nincidente sobre a receita bruta proveniente da comercialização da sua\nprodução, prevista no artigo 25, incisos I e II, da Lei nº 8.870/1994,\nna redação anterior à Emenda Constitucional nº 20/1998; II - É\nconstitucional a contribuição à seguridade social, a cargo do empregador\nrural pessoa jurídica, incidente sobre a receita bruta proveniente da\ncomercialização da sua produção, prevista no art. 25, incisos I e II, da\nLei 8.870/1994, na redação dada pela Lei nº 10.256/2001; III - É\nconstitucional a contribuição social destinada ao Serviço Nacional de\nAprendizagem Rural (SENAR), de que trata o art. 25, § 1º, da Lei nº\n8.870/1994, inclusive na redação conferida pela Lei nº 10.256/2001.","refs":["0651"]}]},"2022":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2022_0281","tema":"0281","texto":"TEMA 0281: É <strong>constitucional</strong> o art. 22A da Lei nº\n8.212/1991, com a redação da Lei nº 10.256/2001, no que instituiu\ncontribuição previdenciária incidente sobre a receita bruta proveniente\nda comercialização da produção, em substituição ao regime anterior da\ncontribuição incidente sobre a folha de salários.","refs":["0281"]},{"id":"rg_2022_1172","tema":"1172","texto":"TEMA 1172: Os **programas de diferimento ou\npostergação de pagamento de ICMS** - a exemplo do FOMENTAR e do\nPRODUZIR, do Estado de Goiás - <strong>não violam</strong> o sistema constitucional\nde repartição de receitas tributárias previsto no art. 158, IV, da\nConstituição Federal, <strong>desde que</strong> seja <strong>preservado o repasse</strong> da\nparcela pertencente aos Municípios quando do efetivo ingresso do tributo\nnos cofres públicos estaduais. (RE 1288634)\n<strong>(FGV-TCE/PI-AUDITOR/2025)</strong>\n\n\\[*A obrigação de transferência da quota pertencente aos municípios\nsobre o produto da arrecadação do ICMS, relativa à repartição\nconstitucional das receitas tributárias, só ocorre quando há o efetivo\nrecolhimento do tributo, isto é, quando configurada a receita pública\npor parte do estado-membro.\\]*\n\n<strong>TEMA 0756</strong>: I. O **legislador ordinário possui\nautonomia para disciplinar a não cumulatividade** a que se refere o art.\n195, § 12, da Constituição, respeitados os demais preceitos\nconstitucionais, como a matriz constitucional das contribuições ao PIS e\nCOFINS e os princípios da razoabilidade, da isonomia, da livre\nconcorrência e da proteção à confiança; II. É infraconstitucional, a ela\nse aplicando os efeitos da ausência de repercussão geral, a discussão\nsobre a expressão insumo presente no art. 3º, II, das Leis nºs 10.637/02\ne 10.833/03 e sobre a compatibilidade, com essas leis, das IN SRF nºs\n247/02 (considerada a atualização pela IN SRF nº 358/03) e 404/04. III.\nÉ constitucional o § 3º do art. 31 da Lei nº 10.865/04.\n\n<strong>TEMA 0699</strong>: É <strong>constitucional</strong> a cobrança, em face\ndas entidades fechadas de previdência complementar [não\nimunes,] do imposto de renda retido na fonte (IRRF) e da\ncontribuição social sobre o lucro líquido (CSLL). **(FGV-CÂMARA DOS\nDEPUTADOS-CONSULTOR/2024)<strong> </strong>(FGV-TRF1-JUIZ/2025)**","refs":["0699","0756","1172"]},{"id":"rg_2022_1223","tema":"1223","texto":"TEMA 1223: São <strong>inconstitucionais</strong> o Decreto nº\n3.048/99 e a Portaria MPAS nº 1.135/01 no que alteraram a base de\ncálculo da contribuição previdenciária incidente sobre a remuneração\npaga ou creditada a transportadores autônomos, devendo o reconhecimento\nda inconstitucionalidade observar os princípios da congruência e da\ndevolutividade.","refs":["1223"]},{"id":"rg_2022_0336","tema":"0336","texto":"TEMA 0336: As entidades religiosas <strong>podem</strong> se\ncaracterizar como instituições de assistência social a fim de se\nbeneficiarem da imunidade tributária prevista no art. 150, VI, c, da\nConstituição, que abrangerá [não só os impostos sobre o seu patrimônio,\nrenda e serviços, mas também os impostos sobre a importação de\nbens] a serem utilizados na consecução de seus objetivos\nestatutários. (RE 630790) **(VUNESP-TJSP-JUIZ/2024)\n(FGV-TRF5-JUIZ/2025)**","refs":["0336"]},{"id":"rg_2022_1193","tema":"1193","texto":"TEMA 1193: A contribuição prevista no artigo 1º da Lei\nComplementar 110/2001 foi recepcionada pela Emenda Constitucional\n33/2001.","refs":["1193"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2022_1097","tema":"1097","texto":"TEMA 1097: Aos servidores públicos **estaduais e\nmunicipais<strong> é </strong>aplicado**, para todos os efeitos, o art. 98, § 2° e §\n3°, da Lei 8.112/1990. (RE 1237867)\n\n\\[Por analogia, aplica-se aos servidores públicos estaduais e municipais\nque são pais ou cuidadores legais de pessoas com
