<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Jurisprudência — STF & STJ</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lora:ital,wght@0,400;0,600;1,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== CSS VARIABLES — DUAL THEME ===== */
[data-theme="dark"] {
  --bg:      #0f0e0c;
  --bg2:     #161410;
  --bg3:     #1e1b17;
  --bg4:     #252119;
  --bgcard:  #1a1814;
  --bghover: #201d19;
  --gold:    #c9a84c;
  --gold2:   #e8c97a;
  --gold3:   #f5e0a8;
  --accent:  #2980b9;
  --accent2: #3498db;
  --green:   #27ae60;
  --green2:  #2ecc71;
  --red:     #c0392b;
  --red2:    #e74c3c;
  --text:    #e8e0d0;
  --text2:   #c4b89a;
  --text3:   #8a7e6a;
  --text4:   #5a5040;
  --border:  #2e2a22;
  --border2: #3d3830;
  --shadow:  0 4px 24px rgba(0,0,0,0.6);
  --shadow2: 0 8px 40px rgba(0,0,0,0.8);
  --mark-bg: rgba(201,168,76,0.25);
  --mark-text: #f5e0a8;
  --search-hl: rgba(201,168,76,0.3);
}
[data-theme="light"] {
  --bg:      #f5f0e8;
  --bg2:     #faf7f2;
  --bg3:     #f0ebe0;
  --bg4:     #e8e1d4;
  --bgcard:  #fff;
  --bghover: #f8f4ed;
  --gold:    #8b6914;
  --gold2:   #9d7a1c;
  --gold3:   #6b5010;
  --accent:  #1a5c8a;
  --accent2: #2170a8;
  --green:   #1a7a45;
  --green2:  #20935a;
  --red:     #a02820;
  --red2:    #c0302a;
  --text:    #1a1610;
  --text2:   #3a3020;
  --text3:   #6a5e44;
  --text4:   #9a8c70;
  --border:  #d8cdb8;
  --border2: #c4b898;
  --shadow:  0 2px 12px rgba(0,0,0,0.12);
  --shadow2: 0 6px 24px rgba(0,0,0,0.18);
  --mark-bg: rgba(139,105,20,0.12);
  --mark-text: #6b5010;
  --search-hl: rgba(139,105,20,0.2);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 15px; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Lora', Georgia, serif;
  min-height: 100vh;
  line-height: 1.65;
  transition: background 0.25s, color 0.25s;
}

/* ===== HEADER ===== */
.app-header {
  background: var(--bg2);
  border-bottom: 2px solid var(--gold);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky; top: 0; z-index: 200;
  box-shadow: var(--shadow);
  transition: background 0.25s, border-color 0.25s;
}
.header-emblem {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  box-shadow: 0 0 16px rgba(201,168,76,0.3);
}
.header-title h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.25rem;
  color: var(--gold2);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.header-title p { font-size: 0.72rem; color: var(--text3); letter-spacing: 0.06em; text-transform: uppercase; }
.header-right { margin-left: auto; display: flex; align-items: center; gap: 14px; }
.header-stats { display: flex; gap: 12px; }
.stat-pill {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px;
  text-align: center;
  transition: background 0.25s;
}
.stat-pill .num { font-family: 'Fira Code', monospace; font-size: 1rem; color: var(--gold2); font-weight: 500; display: block; }
.stat-pill .lbl { font-size: 0.62rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; display: block; }

/* Theme toggle */
.theme-toggle {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 6px 14px;
  cursor: pointer;
  color: var(--text2);
  font-size: 0.8rem;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.2s;
  white-space: nowrap;
  font-family: 'Lora', serif;
}
.theme-toggle:hover { border-color: var(--gold); color: var(--gold2); }

/* ===== GLOBAL SEARCH BAR ===== */
.global-search-wrap {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 10px 28px;
  position: sticky; top: 73px; z-index: 190;
  transition: background 0.25s;
}
.global-search-inner {
  display: flex;
  align-items: center;
  background: var(--bg3);
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  max-width: 860px;
  transition: border-color 0.2s, background 0.25s;
  overflow: hidden;
}
.global-search-inner:focus-within { border-color: var(--gold); }
.search-icon { padding: 0 12px; color: var(--text3); font-size: 1rem; flex-shrink: 0; }
#global-search-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  padding: 9px 4px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.88rem;
}
#global-search-input::placeholder { color: var(--text3); }
.search-clear {
  padding: 0 12px;
  cursor: pointer;
  color: var(--text3);
  font-size: 1.1rem;
  display: none;
  background: none;
  border: none;
  transition: color 0.15s;
}
.search-clear:hover { color: var(--text); }
.search-shortcut {
  padding: 4px 10px;
  margin-right: 8px;
  background: var(--bg4);
  border: 1px solid var(--border);
  border-radius: 4px;
  font-family: 'Fira Code', monospace;
  font-size: 0.7rem;
  color: var(--text3);
}
.search-results-count {
  margin-left: 12px;
  font-size: 0.78rem;
  color: var(--text3);
  font-family: 'Fira Code', monospace;
  white-space: nowrap;
}

/* Search results dropdown */
.search-dropdown {
  position: absolute;
  top: 100%;
  left: 28px;
  right: 28px;
  max-width: 860px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-top: none;
  border-radius: 0 0 8px 8px;
  box-shadow: var(--shadow2);
  max-height: 480px;
  overflow-y: auto;
  z-index: 300;
  display: none;
}
.search-dropdown.open { display: block; }
.search-dropdown::-webkit-scrollbar { width: 6px; }
.search-dropdown::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.search-result-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  transition: background 0.12s;
}
.search-result-item:hover { background: var(--bghover); }
.search-result-item:last-child { border-bottom: none; }
.sri-badges { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.sri-tema {
  font-family: 'Fira Code', monospace;
  font-size: 0.72rem;
  color: var(--gold2);
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 2px 7px;
  white-space: nowrap;
}
.sri-src {
  font-size: 0.65rem;
  color: var(--text3);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.sri-content { flex: 1; }
.sri-subj {
  font-size: 0.72rem;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 3px;
}
.sri-preview {
  font-size: 0.83rem;
  color: var(--text2);
  line-height: 1.5;
}
.sri-preview mark {
  background: var(--search-hl);
  color: var(--gold2);
  border-radius: 2px;
  padding: 0 2px;
}
.sri-year {
  font-family: 'Fira Code', monospace;
  font-size: 0.7rem;
  color: var(--text4);
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}
.search-empty { padding: 24px; text-align: center; color: var(--text3); font-size: 0.85rem; }
.search-group-header {
  padding: 8px 16px 4px;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text3);
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  font-family: 'Fira Code', monospace;
}

/* ===== MAIN TABS ===== */
.main-tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  gap: 2px;
  position: sticky; top: 128px; z-index: 180;
  transition: background 0.25s;
}
.tab-btn {
  padding: 11px 20px;
  background: none; border: none;
  color: var(--text3);
  font-family: 'Lora', serif;
  font-size: 0.875rem;
  cursor: pointer;
  border-bottom: 3px solid transparent;
  transition: all 0.18s;
  letter-spacing: 0.01em;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text2); background: rgba(128,100,50,0.05); }
.tab-btn.active { color: var(--gold2); border-bottom-color: var(--gold); font-weight: 600; }
.tab-btn .badge {
  display: inline-block;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1px 7px;
  font-size: 0.68rem;
  font-family: 'Fira Code', monospace;
  margin-left: 5px;
  color: var(--gold);
  transition: background 0.25s;
}

/* ===== PANELS ===== */
.panel { display: none; }
.panel.active { display: flex; }
.panel-full { display: none; }
.panel-full.active { display: block; }

/* ===== SIDEBAR ===== */
.sidebar {
  width: 268px; min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  height: calc(100vh - 179px);
  overflow-y: auto;
  position: sticky; top: 179px;
  flex-shrink: 0;
  transition: background 0.25s, border-color 0.25s;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.sidebar-search { padding: 10px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--bg2); z-index: 10; }
.sidebar-search input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 7px 10px;
  color: var(--text);
  font-family: 'Lora', serif;
  font-size: 0.82rem;
  outline: none;
  transition: all 0.25s;
}
.sidebar-search input:focus { border-color: var(--gold); }
.sidebar-search input::placeholder { color: var(--text3); }

.year-group { border-bottom: 1px solid var(--border); }
.year-header {
  padding: 9px 14px;
  cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  font-family: 'Fira Code', monospace;
  font-size: 0.9rem; font-weight: 500;
  color: var(--gold2);
  background: var(--bg3);
  transition: background 0.12s;
  user-select: none;
}
.year-header:hover { background: var(--bg4); }
.year-header .arrow { transition: transform 0.2s; font-size: 0.65rem; color: var(--text3); }
.year-header.open .arrow { transform: rotate(90deg); }
.year-header .cnt { margin-left: auto; font-size: 0.68rem; color: var(--text3); }
.phase-badge {
  font-size: 0.58rem; padding: 2px 5px; border-radius: 3px;
  background: var(--accent); color: white;
  font-family: sans-serif; letter-spacing: 0.04em;
}
.phase-badge.p2 { background: var(--red); }

.subj-list { display: none; }
.subj-list.open { display: block; }
.subj-item {
  padding: 6px 14px 6px 26px;
  cursor: pointer; font-size: 0.78rem; color: var(--text3);
  transition: all 0.12s;
  display: flex; align-items: center; gap: 5px;
  border-left: 3px solid transparent;
}
.subj-item:hover { color: var(--text2); background: rgba(128,100,50,0.05); }
.subj-item.active { color: var(--gold2); background: var(--mark-bg); border-left-color: var(--gold); }
.subj-item .subj-cnt { margin-left: auto; font-family: 'Fira Code', monospace; font-size: 0.68rem; color: var(--border2); }

/* ===== CONTENT AREA ===== */
.content-area {
  flex: 1;
  height: calc(100vh - 179px);
  overflow-y: auto;
  padding: 24px 32px;
  transition: background 0.25s;
}
.content-area::-webkit-scrollbar { width: 7px; }
.content-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.content-header {
  margin-bottom: 20px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: flex-start; gap: 16px;
}
.content-header-text { flex: 1; }
.content-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem; color: var(--gold2); font-weight: 700;
}
.content-header .meta { font-size: 0.78rem; color: var(--text3); margin-top: 3px; }

/* ===== FILTER BAR ===== */
.filter-bar {
  display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center;
}
.filter-bar input {
  flex: 1; min-width: 180px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 5px; padding: 7px 12px;
  color: var(--text); font-family: 'Lora', serif; font-size: 0.83rem; outline: none;
  transition: all 0.25s;
}
.filter-bar input:focus { border-color: var(--gold); }
.filter-bar input::placeholder { color: var(--text3); }
.filter-chip {
  padding: 5px 13px; border: 1px solid var(--border2);
  border-radius: 16px; background: var(--bg2); color: var(--text3);
  font-size: 0.76rem; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.filter-chip:hover { border-color: var(--gold); color: var(--gold); }
.filter-chip.active { background: var(--gold); border-color: var(--gold); color: var(--bg); font-weight: 600; }

/* ===== TESE CARD ===== */
.tese-card {
  background: var(--bgcard);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 12px;
  overflow: hidden;
  transition: border-color 0.18s, box-shadow 0.18s, background 0.25s;
}
.tese-card:hover { border-color: var(--border2); box-shadow: var(--shadow); }
.tese-card.read { border-left: 3px solid var(--green); }
.tese-card.bookmarked { border-left: 3px solid var(--gold); }
.tese-card.read.bookmarked { border-left: 3px solid var(--green); border-right: 3px solid var(--gold); }
.tese-card.highlighted {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(201,168,76,0.2);
  animation: highlightPulse 0.6s ease;
}
@keyframes highlightPulse {
  0% { box-shadow: 0 0 0 4px rgba(201,168,76,0.4); }
  100% { box-shadow: 0 0 0 2px rgba(201,168,76,0.2); }
}

.tese-card-header {
  padding: 11px 14px;
  display: flex; align-items: center; gap: 9px;
  cursor: pointer; background: var(--bg3);
  user-select: none; transition: background 0.12s;
}
.tese-card-header:hover { background: var(--bghover); }

.tema-badge {
  background: var(--bg);
  border: 1px solid var(--gold);
  border-radius: 4px;
  padding: 3px 9px;
  font-family: 'Fira Code', monospace;
  font-size: 0.72rem; color: var(--gold2);
  white-space: nowrap; flex-shrink: 0;
  cursor: pointer;
  transition: background 0.15s;
}
.tema-badge:hover { background: var(--mark-bg); }

.tese-title-preview {
  font-size: 0.83rem; color: var(--text2);
  flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tese-actions { display: flex; gap: 5px; flex-shrink: 0; }
.status-btn {
  width: 27px; height: 27px; border: none; border-radius: 50%;
  cursor: pointer; font-size: 0.72rem;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.btn-read { background: rgba(39,174,96,0.12); color: var(--green); border: 1px solid rgba(39,174,96,0.25); }
.btn-read:hover, .btn-read.active { background: var(--green); color: white; }
.btn-bookmark { background: rgba(201,168,76,0.12); color: var(--gold); border: 1px solid rgba(201,168,76,0.25); }
.btn-bookmark:hover, .btn-bookmark.active { background: var(--gold); color: var(--bg); }
.expand-btn {
  background: none; border: none; color: var(--text3);
  cursor: pointer; font-size: 0.65rem; transition: transform 0.2s; padding: 4px;
}
.expand-btn.open { transform: rotate(180deg); }

/* ===== TESE BODY (FULL TEXT) ===== */
.tese-body { display: none; padding: 16px 18px; border-top: 1px solid var(--border); }
.tese-body.open { display: block; }
.tese-text {
  font-size: 0.9rem; color: var(--text); line-height: 1.75;
  text-align: justify;
  font-family: 'Lora', serif;
}
.tese-text strong { color: var(--text); font-weight: 700; }
[data-theme="dark"] .tese-text strong { color: var(--gold3); }
.tese-text br { line-height: 0.5; }

/* Cross-reference chips */
.cross-refs {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px dashed var(--border2);
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
}
.cross-refs-label {
  font-size: 0.7rem; color: var(--text3); text-transform: uppercase;
  letter-spacing: 0.06em; margin-right: 4px;
}
.ref-chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--bg3); border: 1px solid var(--border2);
  border-radius: 12px; padding: 3px 10px;
  font-family: 'Fira Code', monospace; font-size: 0.7rem;
  color: var(--accent2); cursor: pointer; transition: all 0.15s;
  text-decoration: none;
}
.ref-chip:hover { border-color: var(--accent2); background: var(--bghover); }
.ref-chip .ref-arrow { font-size: 0.6rem; }

/* In-text search highlight */
.tese-text mark {
  background: var(--search-hl);
  color: var(--mark-text);
  border-radius: 2px; padding: 0 2px;
  font-style: normal;
}

/* Reading mode banner */
.read-banner {
  display: none;
  padding: 8px 18px;
  background: rgba(39,174,96,0.08);
  border-top: 1px solid rgba(39,174,96,0.2);
  font-size: 0.78rem; color: var(--green2);
  align-items: center; gap: 8px;
}
.tese-card.read .read-banner { display: flex; }

/* ===== PROGRESS PANEL ===== */
.progress-panel {
  padding: 28px 36px;
  overflow-y: auto;
  height: calc(100vh - 179px);
  transition: background 0.25s;
}
.progress-panel::-webkit-scrollbar { width: 7px; }
.progress-panel::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 4px; }

.progress-header { margin-bottom: 28px; }
.progress-header h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.8rem; color: var(--gold2);
}
.progress-header p { color: var(--text3); font-size: 0.88rem; margin-top: 5px; }

.progress-overview {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px; margin-bottom: 32px;
}
.overview-card {
  background: var(--bgcard);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 18px; text-align: center;
  transition: background 0.25s, border-color 0.25s;
}
.overview-card .big-num {
  font-family: 'Playfair Display', serif;
  font-size: 2.2rem; color: var(--gold2); font-weight: 900;
}
.overview-card .label { font-size: 0.72rem; color: var(--text3); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 3px; }
.progress-bar { height: 5px; background: var(--bg3); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--gold), var(--gold2)); transition: width 0.5s ease; }

.schedule-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.2rem; color: var(--gold2);
  margin: 24px 0 6px;
  display: flex; align-items: center; gap: 10px;
}
.phase-label {
  font-size: 0.7rem; font-family: 'Fira Code', monospace;
  background: var(--accent); color: white; padding: 3px 9px; border-radius: 4px;
}
.phase-label.p2 { background: var(--red); }
.phase-desc { font-size: 0.8rem; color: var(--text3); margin-bottom: 14px; }

.days-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; margin-bottom: 28px; }
@media (max-width: 900px) { .days-grid { grid-template-columns: repeat(4, 1fr); } }

.day-card {
  background: var(--bgcard); border: 1px solid var(--border);
  border-radius: 6px; padding: 11px 8px;
  cursor: pointer; transition: all 0.15s; text-align: center; position: relative;
}
.day-card:hover { border-color: var(--gold); background: var(--bghover); }
.day-card.done { border-color: var(--green); background: rgba(39,174,96,0.04); }
.day-card.partial { border-color: var(--gold); background: var(--mark-bg); }
.day-card .day-num { font-family: 'Fira Code', monospace; font-size: 1rem; font-weight: 500; color: var(--text); }
.day-card.done .day-num { color: var(--green); }
.day-card .day-count { font-size: 0.67rem; color: var(--text3); margin-top: 2px; }
.day-card .day-pbar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 7px; overflow: hidden; }
.day-card .day-pfill { height: 100%; border-radius: 2px; background: var(--green2); transition: width 0.3s; }
.day-card.done .day-pfill { background: var(--green); }
.day-card .check { position: absolute; top: 5px; right: 6px; font-size: 0.68rem; color: var(--green); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  z-index: 500; display: none;
  align-items: center; justify-content: center;
  backdrop-filter: blur(3px);
}
.modal-overlay.open { display: flex; }
.modal-box {
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; width: 92%; max-width: 720px;
  max-height: 88vh; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow2); transition: background 0.25s;
}
.modal-header {
  padding: 16px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px; background: var(--bg3);
}
.modal-header h3 { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--gold2); flex: 1; }
.modal-close { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 1.3rem; transition: color 0.15s; }
.modal-close:hover { color: var(--text); }
.modal-body { overflow-y: auto; padding: 18px 22px; flex: 1; }
.modal-body::-webkit-scrollbar { width: 5px; }
.modal-body::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.modal-tese-item {
  padding: 10px 12px; border: 1px solid var(--border);
  border-radius: 4px; margin-bottom: 8px;
  display: flex; align-items: flex-start; gap: 10px;
  background: var(--bg3); cursor: pointer; transition: background 0.12s;
}
.modal-tese-item:hover { background: var(--bghover); }
.modal-tese-item.read { border-left: 3px solid var(--green); }
.modal-tese-label {
  font-family: 'Fira Code', monospace; font-size: 0.7rem;
  color: var(--gold); background: var(--bg); border: 1px solid var(--border2);
  border-radius: 3px; padding: 2px 7px; flex-shrink: 0; white-space: nowrap;
}
.modal-tese-text { font-size: 0.8rem; color: var(--text2); flex: 1; line-height: 1.5; }
.modal-check-btn {
  background: none; border: 1px solid var(--border2);
  border-radius: 50%; width: 22px; height: 22px; cursor: pointer;
  color: var(--text3); font-size: 0.65rem;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s;
}
.modal-check-btn.done { background: var(--green); border-color: var(--green); color: white; }
.modal-check-btn:hover:not(.done) { border-color: var(--green); color: var(--green); }
.modal-footer {
  padding: 12px 22px; border-top: 1px solid var(--border);
  display: flex; gap: 9px; justify-content: flex-end;
}
.btn-primary {
  background: var(--gold); color: var(--bg); border: none;
  border-radius: 5px; padding: 8px 18px;
  font-family: 'Lora', serif; font-size: 0.83rem; font-weight: 600;
  cursor: pointer; transition: background 0.15s;
}
.btn-primary:hover { background: var(--gold2); }
.btn-secondary {
  background: var(--bg3); color: var(--text2);
  border: 1px solid var(--border2); border-radius: 5px; padding: 8px 18px;
  font-family: 'Lora', serif; font-size: 0.83rem;
  cursor: pointer; transition: all 0.15s;
}
.btn-secondary:hover { border-color: var(--text3); color: var(--text); }

/* ===== FLOATING PROGRESS ===== */
.float-progress {
  position: fixed; bottom: 18px; right: 18px;
  background: var(--bg2); border: 1px solid var(--border2);
  border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: center; gap: 11px;
  box-shadow: var(--shadow2); z-index: 50; font-size: 0.78rem;
  transition: background 0.25s;
}
.fp-ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
.fp-ring canvas { position: absolute; inset: 0; }
.fp-pct {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Fira Code', monospace; font-size: 0.6rem; color: var(--gold2); font-weight: 500;
}
.fp-label { color: var(--text3); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.05em; }
.fp-count { color: var(--gold2); font-family: 'Fira Code', monospace; font-weight: 500; }

/* ===== EMPTY STATE ===== */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text3); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 14px; opacity: 0.4; }
.empty-state h3 { font-family: 'Playfair Display', serif; font-size: 1.15rem; color: var(--text2); margin-bottom: 7px; }
.empty-state p { font-size: 0.83rem; }

/* ===== JUMP TO TESE (from search/ref) ===== */
@keyframes jumpHighlight {
  0%, 100% { background: var(--bgcard); }
  30%, 70% { background: var(--mark-bg); }
}
.tese-card.jump-highlight { animation: jumpHighlight 1.2s ease; }

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .app-header { padding: 10px 14px; }
  .header-stats { display: none; }

}
</style>

const SITE_DATA = {"rg":{"2026":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2026_837","tema":"837","texto":"TEMA 837: 1. <strong>Campanhas de mobilização</strong> social\npromovidas por <strong>entidades da sociedade civil,</strong> com base em **pautas de\ndireitos fundamentais,<strong> voltadas a </strong>desestimular o financiamento ou\napoio institucional<strong> a eventos, ou organizações, estão </strong>protegidas**\npela <strong>liberdade de expressão.</strong>\n\n2\\. A <strong>responsabilidade civil,</strong> inclusive com a determinação de\n<strong>cessação da campanha</strong> e <strong>retirada de conteúdo</strong> das redes sociais ou\nquando a <strong>imputação permanecer disponível</strong> em plataformas digitais ou\nem ambiente público, <strong>somente</strong> será possível quando comprovada\n<strong>má-fé</strong> caracterizada:\n\nI - Pelo <strong>dolo</strong> demonstrado em razão do **conhecimento prévio da\nfalsidade** da declaração; ou\n\nII - <strong>Culpa grave</strong> decorrente da <strong>evidente negligência</strong> da apuração\nda veracidade do fato. (RE 662055) (Julgado em 11/02/2026)","refs":["837"]},{"id":"rg_2026_1167","tema":"1167","texto":"TEMA 1167: O <strong>valor</strong> correspondente aos **proventos\nou à remuneração<strong> do instituidor da </strong>pensão por morte,** para os fins\ndo art. 40, § 7º, da Constituição Federal, na redação da Emenda\nConstitucional nº 41/2003, **deve considerar apenas as parcelas\nefetivamente percebida**s pelo servidor ativo ou aposentado,\n<strong>excluídos</strong> os valores que <strong>excedam o teto ou subteto</strong>\nremuneratórios previstos no art. 37, XI, da Constituição, posto que\n<strong>sobre eles não incidiu contribuição previdenciária.</strong> A sistemática\nconstitucional exige congruência entre custeio e benefícios. (ARE\n1.314.490)","refs":["1167"]}],"DIREITO ELEITORAL":[{"id":"rg_2026_1260","tema":"1260","texto":"TEMA 1260: (I) É <strong>possível</strong> a **dupla\nresponsabilização<strong> por </strong>crime eleitoral** caixa dois (art. 350 do\nCódigo Eleitoral) <strong>e ato de improbidade</strong> administrativa (Lei\n8.429/1992), pois a <strong>independência de instâncias</strong> exige tratamentos\nsancionatórios diferenciados entre os atos ilícitos em geral (civis,\npenais e político-administrativos) e os atos de improbidade\nadministrativa; (II) <strong>Reconhecida</strong>, na <strong>instância eleitoral,</strong> a\n<strong>inexistência do fato ou negativa de autoria</strong> do réu, a decisão\nrepercute na seara administrativa; (III) Compete à\n<strong>Justiça Comum</strong> processar e julgar <strong>ação de improbidade</strong>\nadministrativa por ato <strong>que também configure crime eleitoral.</strong> (ARE\n1.428.742)","refs":["1260"]}]},"2025":{"DIREITO PENAL":[{"id":"rg_2025_1370","tema":"1370","texto":"TEMA 1370: [1) Compete ao <strong>juízo estadual,</strong> no\nexercício da <strong>jurisdição criminal,</strong> especialmente aquele\n<strong>responsável</strong> pela aplicação da <strong>Lei nº 11.340/2006</strong> (Lei Maria da\nPenha), <strong>fixar a medida protetiva</strong> prevista no <strong>art. 9º, § 2º, II,</strong>\nda referida lei, <strong>inclusive quanto</strong> à requisição de **pagamento de\nprestação pecuniária em favor da vítima afastada do local de trabalho,**\n<strong>ainda que</strong> o c<strong>umprimento material</strong> da decisão fique sob o\n<strong>encargo do INSS e do empregador</strong>; 2) Nos termos do que dispõe o art.\n109, I, da Constituição Federal, compete à <strong>Justiça Federal</strong> processar\ne julgar as <strong>ações regressivas</strong> que, com **fundamento no art. 120,\nII,<strong> da Lei nº 8.213/1991, deverão ser </strong>ajuizadas pela Autarquia\nPrevidenciária Federal<strong> </strong>contra os responsáveis nos casos de\nviolência** doméstica e familiar contra a mulher; 3) A expressão\nconstante da Lei (<strong>\"vínculo trabalhista</strong>\") deve **abranger e não tem natureza hedionda</strong>. (RE 1.542.482)","refs":["1400"]},{"id":"rg_2025_998","tema":"998","texto":"TEMA 998: 1) Em **visitas sociais nos presídios ou\nestabelecimentos de segregação<strong>, é </strong>inadmissível a visita íntima\nvexatória,<strong> com o </strong>desnudamento<strong> de visitantes </strong>ou exames\ninvasivos<strong>, com finalidade de causar </strong>humilhação**. A prova obtida por\nesse tipo de revista é <strong>ilícita</strong>, <strong>salvo</strong> decisões judiciais em cada\n<strong>caso concreto.</strong> A presente decisão tem efeitos prospectivos a partir\nda publicação da ata de julgamento.\n\n2\\) A <strong>autoridade administrativa</strong>, de forma **fundamentada e por\nescrito<strong>, tem o </strong>poder de não permitir a visita** diante da presença\nde <strong>indício robusto</strong> de ser a pessoa visitante **portadora de qualquer\nitem corporal oculto ou sonegado,** especialmente de material\n<strong>proibido</strong>, como produtos <strong>ilegais</strong>, **drogas ou objetos\nperigosos.<strong> São considerados </strong>\"robustos indícios\"** embasados em\n<strong>elementos tangíveis e verificáveis</strong>, como **informações prévias de\ninteligência, denúncias e comportamentos suspeitos.**\n\n3\\) Confere-se o prazo de <strong>24 meses</strong>, a contar da data desse\njulgamento, para a <strong>aquisição e instalação de equipamentos</strong>, como\nscanners corporais, esteiras de raio-x e portais detectores de metais em\n<strong>todos os estabelecimentos penais;</strong>\n\n4\\) Fica **determinado ao Ministério da Justiça e da Segurança Pública e\naos estados** que, por meio dos recursos do Fundo Penitenciário Nacional\ne do Fundo Nacional de Segurança Pública, promovam a **aquisição ou\nlocação** e distribuição de scanners corporais para as unidades\nprisionais, em conformidade com sua atribuição de coordenação nacional\nda política penitenciária, assegurando a **proteção dos servidores, a\nintegridade dos detentos e a dignidade dos visitantes**, prevenindo\npráticas abusivas e ilícitas, **sem interferir na autonomia dos entes\nfederativos<strong> e garantindo a </strong>aplicação uniforme** das diretrizes de\nsegurança penitenciária no país.\n\n5\\) <strong>Devem</strong> os entes federados, no âmbito de suas atribuições,\ngarantir que a aquisição ou locação de scanners corporais para as\nunidades prisionais esteja contemplada no respectivo planejamento\nadministrativo e orçamento, com total prioridade na aplicação dos\nrecursos.\n\n6\\) <strong>Excepcionalmente</strong> na **impossibilidade ou inefetividade de\nutilização** do scanner corporal, esteira de raio-x, portais e\ndetectores de metais, a <strong>revista íntima para ingresso</strong> em\nestabelecimentos prisionais, diante de **indícios objetivos e robustos\nde suspeita, deverá ser motivada para cada caso** específico e dependerá\nda <strong>plena concordância do visitante.</strong> V**edada em qualquer\ncircunstância<strong> a execução da </strong>revista<strong> como forma de </strong>humilhação e\ndisposição vexatória.<strong> Deve ser realizada em </strong>local adequado,\nexclusivo<strong> para tal verificação e </strong>apenas em pessoas maiores** e que\npossam emitir consentimento válido, por si ou por meio de seu\nrepresentante legal, de acordo com protocolos gerais e nacionais\npré-estabelecidos <strong>e por pessoas do mesmo gênero</strong> do visitante,\n<strong>preferencialmente profissionais de saúde</strong> nas hipóteses de\n<strong>desnudamento</strong> e exames <strong>invasivos</strong>. (i) O <strong>excesso</strong> ou abuso da\nrealização da revista íntima acarretarão <strong>responsabilidade</strong> do agente\npúblico ou do profissional de saúde habilitado e <strong>ilicitude</strong> de\neventual prova obtida. (ii) Caso <strong>não haja concordância do visitante,</strong>\na autoridade administrativa poderá, de forma **fundamentada e por\nescrito<strong>, </strong>impedir a realização da visita.** (iii) O procedimento de\n**revista em criança, adolescente ou pessoa com deficiência que não\npossa emitir consentimento<strong> válido será </strong>substituído pela revista\ninvertida** direcionada à pessoa a ser visitada. (ARE 959620) [(julgado\nem 02/04/2025)]","refs":["998"]},{"id":"rg_2025_1267","tema":"1267","texto":"TEMA 1267: É <strong>constitucional</strong> o indulto natalino do\nart. 5º, caput e parágrafo único, do Decreto Presidencial nº 11.302, de\n22/12/2022. (RE 1.450.100)","refs":["1267"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2025_977","tema":"977","texto":"TEMA 977: \\\"1. A mera <strong>apreensão do</strong> aparelho\n<strong>celular,</strong> nos termos do <strong>art. 6º do CPP ou</strong> em <strong>flagrante</strong>\ndelito, <strong>não</strong> está sujeita à <strong>reserva de jurisdição.</strong> Contudo, o\n<strong>acesso aos dados</strong> nele contidos <strong>deve observar</strong> as seguintes\ncondicionantes: 1.1 Nas hipóteses de <strong>encontro fortuito</strong> de aparelho\ncelular, o <strong>acesso</strong> aos respectivos <strong>dados</strong> para o <strong>fim exclusivo</strong>\nde <strong>esclarecer a autoria</strong> do fato supostamente criminoso, <strong>ou</strong> de\nquem seja o seu <strong>proprietário</strong>, <strong>não depende</strong> de <strong>consentimento</strong>\nou de <strong>prévia decisão judicial, desde qu</strong>e **justificada\nposteriormente** a adoção da medida. 1.2. Em se tratando de aparelho\ncelular <strong>apreendido na forma do art. 6º do CPP</strong> <strong>ou</strong> por ocasião da\nprisão em <strong>flagrante</strong>, o <strong>acesso</strong> aos respectivos dados será\n<strong>condicionado</strong> ao <strong>consentimento expresso e livre</strong> do titular dos\ndados <strong>ou</strong> de <strong>prévia decisão</strong> judicial (cf. art. 7º, inciso III, e\nart. 10, § 2º, da Lei nº 12.965/2014) que justifique, com base em\n<strong>elementos concretos,</strong> a <strong>proporcionalidade</strong> da medida e delimite\nsua <strong>abrangência</strong> à luz de direitos fundamentais à **intimidade, à\nprivacidade, à proteção dos dados pessoais e à autodeterminação\ninformacional<strong>, </strong>inclusive nos meios digitais** (art. 5º, X e LXXIX,\nCRFB/88). Nesses casos, a <strong>celeridade</strong> se impõe, devendo a Autoridade\nPolicial atuar com a maior <strong>rapidez e eficiência</strong> possíveis e o Poder\nJudiciário conferir tramitação e apreciação prioritárias aos pedidos\ndessa natureza, <strong>inclusive em regime de plantão</strong>. 2. A autoridade\n<strong>policial poderá</strong> adotar as <strong>providências</strong> necessárias para a\n<strong>preservação dos dados</strong> e metadados contidos no aparelho celular\napreendido<strong>, antes da autorização</strong> judicial, **justificando,\nposteriormente**, as razões de referido acesso. 3. As teses acima\nenunciadas só produzirão <strong>efeitos prospectivos,</strong> <strong>ressalvados</strong> os\n<strong>pedidos</strong> eventualmente formulados por defesas <strong>até</strong> a data do\n<strong>encerramento</strong> do presente julgamento\\\". (ARE 1042075)","refs":["977"]}],"DIREITO ELEITORAL":[{"id":"rg_2025_1229","tema":"1229","texto":"TEMA 1229: O **exercício da chefia do Poder\nExecutivo<strong>, nos </strong>seis meses anteriores** ao pleito, em decorrência de\n<strong>decisão judicial não transitada em julgado</strong>, **[não conta como\nexercício de um mandato para efeito de reeleição.]** (RE\n1355228) (Tese fixada em 26/11/2025)","refs":["1229"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2025_1101","tema":"1101","texto":"TEMA 1101: É <strong>constitucional</strong> o art. 2º, I, da Lei\nnº 11.101/2005 quanto à <strong>inaplicabilidade do regime falimentar</strong> às\n<strong>empresas públicas e sociedades de economia mista</strong>, <strong>ainda que</strong>\ndesempenhem <strong>atividades</strong> em regime de <strong>concorrência</strong> com a\niniciativa privada, em razão do <strong>eminente interesse público/coletivo</strong>\nna sua criação e da necessidade de **observância do princípio do\nparalelismo das formas**. ([RE\n1249945](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5830583))","refs":["1101"]},{"id":"rg_2025_1164","tema":"1164","texto":"TEMA 1164: A **superveniente extinção dos cargos\noferecidos em edital<strong> de concurso público em razão da </strong>superação do\nlimite prudencial de gastos** com pessoal, previsto em lei complementar\nregulamentadora do art. 169 da Constituição Federal, **desde que\nanterior ao término do prazo de validade<strong> do concurso e </strong>devidamente\nmotivada, justifica<strong> a </strong>mitigação do direito subjetivo à nomeação** de\ncandidato aprovado dentro do número de vagas. (RE 1.316.010)","refs":["1164"]},{"id":"rg_2025_1427","tema":"1427","texto":"TEMA 1427: 1. É <strong>inconstitucional</strong> a **delegação ao\nPoder Executivo<strong> de atribuição para </strong>fixar e alterar o valor de\nparcela remuneratória,** prevista no § 2º do art. 20 da Lei estadual nº\n6.762/1975, com a redação dada pela Lei nº 12.984/1998, e no art. 3º do\nDecreto nº 46.284/2013; 2. O reconhecimento da **inconstitucionalidade\nnão autoriza decréscimo remuneratório nem a repetição de valores**.([ARE\n1524795](https://portal.stf.jus.br/processos/detalhe.asp?incidente=7090096))","refs":["1427"]},{"id":"rg_2025_1424","tema":"1424","texto":"TEMA 1424: A <strong>exigência de altura mínima</strong> para\ningresso em <strong>cargo do Sistema Único de Segurança Pública</strong> pressupõe a\nexistência de <strong>lei e da observância dos parâmetros</strong> fixados para a\ncarreira do exército (Lei federal nº 12.705/2012, 1,60m para homens e\n1,55m para mulheres). (RE 1.469.887/AL)","refs":["1424"]},{"id":"rg_2025_1420","tema":"1420","texto":"TEMA 1420: 1. O Poder **Judiciário pode controlar o\nato administrativo<strong> de </strong>heteroidentificação** de candidatos que\nconcorrem às vagas reservadas a pessoas negras e pardas em concurso\npúblico, para garantia de <strong>contraditório e ampla defesa</strong>; 2. É\n<strong>fática</strong> e pressupõe a <strong>análise de cláusulas do edital</strong> do concurso\na <strong>controvérsia</strong> sobre a adequação de <strong>critérios e de fundamentos</strong>\ndo ato de exclusão de candidato por comissão de heteroidentificação.\n(ARE 1.553.243)","refs":["1420"]},{"id":"rg_2025_1118","tema":"1118","texto":"TEMA 1118: [1. **Não há responsabilidade subsidiária\nda Administração Pública<strong> por </strong>encargos trabalhistas** gerados pelo\ni<strong>nadimplemento de empresa prestadora de serviços contratada</strong>, se\namparada **exclusivamente na premissa da inversão do ônus\nda prova<strong>, remanescendo </strong>imprescindível<strong> a </strong>comprovação**, pela\nparte autora, da **efetiva existência de comportamento negligente ou\nnexo de causalidade** entre o dano por ele invocado e a conduta\ncomissiva ou omissiva do poder público. 2. **Haverá comportamento\nnegligente<strong> quando a Administração Pública permanecer </strong>inerte após** o\nrecebimento de <strong>notificação formal</strong> de que a empresa contratada está\ndescumprindo suas obrigações trabalhistas, enviada pelo trabalhador,\nsindicato, Ministério do Trabalho, Ministério Público, Defensoria\nPública ou outro meio idôneo. 3. <strong>Constitui responsabilidade</strong> da\nAdministração Pública <strong>garantir as condições</strong> de segurança, higiene e\nsalubridade dos trabalhadores, quando o trabalho for realizado em suas\ndependências ou local previamente convencionado em contrato, nos termos\ndo art. 5º-A, § 3º, da Lei nº 6.019/1974. 4. Nos **contratos de\nterceirização, a Administração Pública deverá:** (i) exigir da\ncontratada a <strong>comprovação de capital social integralizado compatível</strong>\ncom o número de empregados, na forma do art. 4º-B da Lei nº 6.019/1974;\ne (ii) adotar **medidas para assegurar o cumprimento das obrigações\ntrabalhistas** pela contratada, na forma do art. 121, § 3º, da Lei nº\n14.133/2021, tais como condicionar o pagamento à comprovação de quitação\ndas obrigações trabalhistas do mês anterior\\\". ([RE\n1298647](https://portal.stf.jus.br/processos/detalhe.asp?incidente=6048634)])\n(INFO 1165) **(FGV-MPU-ANALISTA/2025) (VUNESP-PREF DE\nITATIBA/SP-ANALISTA DE PROCURADORIA/2025) (VUNESP-PREF DE\nCAMPINAS/SP-PROCURADOR/2025)**","refs":["1118"]},{"id":"rg_2025_1189","tema":"1189","texto":"TEMA 1189: O **prazo bienal para ajuizamento de\nação**, previsto na parte final do art. 7º, XXIX, da Constituição\nFederal, <strong>não se aplica aos servidores temporários</strong> que tiveram seus\n<strong>contratos declarados nulos,</strong> por se tratarem de ocupantes de **cargos\npúblicos<strong> regidos por </strong>vínculo de natureza jurídico-administrativa**.\nNesses casos, incide o prazo prescricional quinquenal, nos termos do\nart. 1º do Decreto nº 20.910/1932. (RE 1.336.848)","refs":["1189"]}],"DIREITO AMBIENTAL":[{"id":"rg_2025_1194","tema":"1194","texto":"TEMA 1194: É <strong>imprescritível</strong> a **pretensão\nexecutória<strong> e </strong>inaplicável a prescrição intercorrente** na execução de\n<strong>reparação de dano ambiental, ainda que</strong> posteriormente **convertida\nem indenização** por perdas e danos. (ARE 1.352.872) (INFO 1171)\n<strong>(FGV-TJCE-JUIZ/2025) (FGV-TRF6-JUIZ/2025)</strong>\n\n\\[OBS: decorrente de condenação criminal por dano ambiental convertida\nem prestação pecuniária\\]","refs":["1194"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2025_1244","tema":"1244","texto":"TEMA 1244: [A fixação de <strong>multa administrativa</strong> em\n<strong>múltiplos do salário mínimo não viola</strong> o disposto no art. 7º, IV, da\nConstituição Federal. (ARE 1.409.059/SP)]","refs":["1244"]},{"id":"rg_2025_950","tema":"950","texto":"TEMA 950: 1. A <strong>imunidade material parlamentar</strong>\n(art. 53, caput, c/c art. 27, § 1º, e art. 29, VIII, CF/1988) configura\n<strong>excludente da responsabilidade civil objetiva</strong> do Estado (art. 37, §\n6º, CF/1988), <strong>afastando qualquer pretensão indenizatória</strong> em face do\nente público por opiniões, palavras e votos cobertos por essa garantia.\n2. Nas hipóteses em que a conduta do parlamentar **extrapolar os\nlimites<strong> da imunidade material, </strong>eventual responsabilização** recairá\nde forma <strong>pessoal, direta e exclusiva</strong> sobre o próprio parlamentar,\nsob o regime de <strong>responsabilidade civil subjetiva</strong>. (RE 632.115)","refs":["950"]},{"id":"rg_2025_1428","tema":"1428","texto":"TEMA 1428: 1. As <strong>providências da Resolução CNJ</strong> nº\n547/2024 <strong>não usurpam nem interferem</strong> na **competência tributária dos\nentes<strong> federativos e </strong>devem ser observadas<strong> para o </strong>processamento e\na extinção de execuções fiscais** com base no princípio constitucional\nda <strong>eficiência</strong>; 2. É infraconstitucional e fática a controvérsia\nsobre o atendimento das exigências da Resolução CNJ nº 547/2024 para\nextinção da execução fiscal por falta de interesse de agir. (ARE\n1.553.607/RS)","refs":["1428"]},{"id":"rg_2025_1352","tema":"1352","texto":"TEMA 1352: É <strong>possível a revogação ou alteração</strong> por\n<strong>lei ordinária</strong> de <strong>benefício</strong> instituído a <strong>servidor público</strong> por\n<strong>lei complementar</strong> quando <strong>materialmente ordinária,</strong> observado o\nprincípio da <strong>simetria</strong>. (ARE 1.521.802/MG)","refs":["1352"]},{"id":"rg_2025_1388","tema":"1388","texto":"TEMA 1388: É <strong>inconstitucional</strong> o artigo 144-A da\nLei n. 6.880/1980 (Estatuto dos Militares), ao <strong>condicionar</strong> o\n<strong>ingresso e a permanência</strong> nos órgãos de formação ou graduação de\noficiais e de praças, ainda que em regime de internato, de **dedicação\nexclusiva e/ou de disponibilidade permanente** peculiar à carreira\nmilitar à **inexistência de vínculos conjugal, de união estável, de\nmaternidade, de paternidade e de dependência socioafetiva**. (RE\n1530083)","refs":["1388"]},{"id":"rg_2025_987_e_TEMA_553","tema":"987 e TEMA 553","texto":"TEMA 987 e TEMA 553: Reconhecimento da\n**[inconstitucionalidade parcial e progressiva do artigo 19 do marco\ncivil da internet, MCI.]**\n\n1\\. O artigo 19 da lei nº 12.965/2014, marco civil da internet, **que\nexige ordem judicial especial específica<strong> para a </strong>responsabilização**\ncivil de <strong>provedor</strong> de aplicações de internet por danos decorrentes de\nconteúdo gerado por terceiros, é <strong>parcialmente inconstitucional.</strong> Há\num estado de omissão parcial que decorre do fato de que a **regra geral\ndo artigo 19 não confere proteção suficiente** a bens jurídicos\nconstitucionais de alta relevância, proteção de direitos fundamentais e\nda democracia.\n\nInterpretação do artigo 19 do MCI.\n\n2\\. <strong>Enquanto não sobrevier nova legislação</strong>, o <strong>artigo 19</strong> do MCI\n<strong>deve ser interpretado</strong> de forma que os <strong>provedores</strong> de aplicação de\ninternet estão <strong>sujeitos à responsabilização civil ressalvada</strong> à\naplicação das <strong>disposições específicas</strong> da legislação <strong>eleitoral</strong> e\nos atos normativos expedidos pelo Tribunal Superior Eleitoral (TSE).\n\n3\\. O <strong>provedor</strong> de aplicações de internet **será responsabilizado\ncivilmente<strong>, nos termos do artigo 21 do MCI, pelos </strong>danos decorrentes\nde conteúdo gerados por terceiros<strong> em casos de </strong>crime ou atos\nilícitos,<strong> sem prejuízo do </strong>dever de remoção** do conteúdo. Aplica-se\na <strong>mesma regra</strong> nos casos de <strong>contas denunciadas como inautênticas.</strong>\n\n3.1. Nas hipóteses de <strong>crime contra a honra</strong>, **aplica-se o artigo\n19<strong> do MCI, sem prejuízo da possibilidade de </strong>remoção** por\n<strong>notificação extrajudicial.</strong>\n\n3.2. Em se tratando de <strong>sucessivas replicações do fato ofensivo</strong> **já\nreconhecido<strong> por decisão judicial, </strong>todos os provedores** de redes\nsociais <strong>deverão remover</strong> as publicações com idênticos conteúdos,\n<strong>independentemente</strong> de <strong>novas decisõe</strong>s judiciais, a partir de\nnotificação judicial ou extrajudicial.\n\nPresunção de responsabilidade.\n\n4\\. Fica estabelecida a <strong>presunção de responsabilidade</strong> dos provedores\nem casos de <strong>conteúdos ilícitos</strong> quando se tratar de: (a) <strong>anúncios</strong>\ne impulsionamentos <strong>pagos</strong>; ou (b) **rede artificial de distribuição\nchatbots ou robôs<strong>. Nestas hipóteses, a responsabilização </strong>poderá** se\ndar <strong>independentemente de notificação.</strong> Os provedores ficarão\n<strong>excluídos de responsabilidade</strong> se comprovarem que **atuaram\ndiligentemente<strong> e em </strong>tempo razoável** para tornarem disponível o\nconteúdo.\n\n**[Dever de cuidado em caso de circulação massiva de conteúdos ilícitos\ngraves]**\n\n5\\. O provedor de aplicações de internet é <strong>responsável</strong> quando **não\npromover a indisponibilização imediata** de conteúdos que configurem as\npráticas de <strong>crimes graves</strong> previstos no seguinte <strong>rol taxativo:</strong>\n\na\\. Condutas e <strong>atos antidemocráticos</strong> que se amoldem aos tipos\nprevistos nos artigos 296, parágrafo único, 359-L, 359-M, 359-N, 359-P e\n359-R do Código Penal.\n\nb\\. Crimes de <strong>terrorismo</strong> ou preparatórios de terrorismo tipificados\npela lei nº 13.260/2016.\n\nc\\. Crimes de induzimento, instigação ou auxílio a <strong>suicídio</strong> ou a\nautomutilação nos termos do art. 122 do Código Penal.\n\nd\\. Incitação à **discriminação em razão de raça, cor, etnia, religião,\nprocedência nacional, sexualidade ou identidade de gênero**.\n\ne\\. Condutas <strong>homofóbicas e transfóbicas</strong> passível de enquadramento\nnos artigos 20, 20A, 20B e 20C da Lei nº 7.716, de 1989.\n\nf\\. Crimes praticados <strong>contra a mulher</strong> em razão da **condição do sexo\nfeminino**, inclusive conteúdos que propagam ódio às mulheres. (art. 147\n§ 1º, Art. 147A e Art. 147-B do Código Penal).\n\ng\\. **Crimes sexuais contra pessoas vulneráveis, pornografia infantil e\ncrimes graves contra crianças e adolescentes,** nos temos dos artigos\n217-A, 218, 218-A, 218-B, 218-C do Código Penal e dos artigos 240,\n241-A, 241-C, 241-D do Estatuto da Criança e do Adolescente.\n\nh\\. <strong>Tráfico de pessoas</strong> (Código Penal, art. 149-A).\n\n5.1. A responsabilidade dos provedores de aplicações de internet\nprevista neste item diz respeito à configuração de falha sistêmica.\n\n5.2. Considera-se <strong>falha sistêmica</strong> imputável ao provedor de\naplicações de internet **deixar de adotar adequadas medidas de prevenção\nou remoção** dos conteúdos ilícitos anteriormente listados, configurando\n<strong>violação ou dever de atuar</strong> de forma responsável, transparente e\ncautelosa.\n\n5.3. Consideram-se <strong>adequadas</strong> as medidas que, conforme o estado da\ntécnica, forneçam os <strong>níveis mais elevados de segurança</strong> para o tipo\nde atividade desempenhada pelo provedor.\n\n5.4. A existência de <strong>conteúdo ilícito de forma isolada</strong>, atomizada,\n<strong>não é por si só suficiente</strong> para ensejar a aplicação da\n<strong>responsabilidade</strong> civil do presente item. Contudo, nesta hipótese,\n<strong>incidirá o regime de responsabilidade previsto no artigo 21</strong> do marco\ncivil da internet.\n\n5.5. Nas hipóteses previstas neste item, o <strong>responsável</strong> pela\npublicação do conteúdo removido pelo provedor de aplicações de internet\n<strong>poderá requerer judicialmente o seu restabelecimento,</strong> mediante\n<strong>demonstração da ausência de ilicitude</strong>. Ainda que o conteúdo seja\nrestaurado por ordem judicial, **não haverá imposição de indenização ao\nprovedor.**\n\nIncidência do artigo 19.\n\n6\\. <strong>Aplica-se o artigo 19</strong> do MCI ao:\n\na\\. Provedor de serviços de <strong>e-mail;</strong>\n\nb\\. Provedor de aplicações cuja finalidade primordial seja a realização\nde <strong>reuniões fechadas por vídeo ou voz;</strong>\n\nc\\. Provedor de serviços de <strong>mensageria instantânea;</strong>\n\nd\\. Provedores de serviços de <strong>mensageria privada,</strong> exclusivamente no\nque diz respeito às <strong>comunicações interpessoais</strong> resguardadas pelo\nsigilo das comunicações da Constituição Federal de 1988\n\nMarketplaces\n\n7\\. Os provedores de aplicações de internet que funcionarem como\nmarketplaces r**espondem civilmente de acordo com o Código de Defesa do\nConsumidor** (lei nº 8.078/1990)\n\nDeveres adicionais\n\n8\\. Os provedores de aplicações de internet **deverão editar\nautorregulação<strong> que abranja, necessariamente, </strong>sistema de notificações\ndevido processo e relatórios anuais de transparência** em relação a\nnotificações extrajudiciais, anúncios e impulsionamentos\n\n9\\. <strong>Deverão</strong>, igualmente, <strong>disponibilizar</strong> a **usuários e a\nnão-usuários canais específicos<strong> de atendimento, </strong>preferencialmente\neletrônicos,** que sejam acessíveis e amplamente divulgados nas\nrespectivas plataformas de maneira permanente\n\n10\\. Tais <strong>regras</strong> deverão ser **publicadas e revisadas\nperiodicamente** de forma transparente e acessível ao público\n\n11\\. Os provedores de aplicações de internet com atuação no Brasil\n<strong>devem constituir e manter sede e representante no paí</strong>s, cuja\nidentificação e informações para contato deverão ser disponibilizadas e\nestar facilmente acessíveis nos respectivos sítios. Essa representação\ndeve conferir ao representante, <strong>necessariamente pessoa jurídica</strong> com\nsede no país, plenos poderes para:\n\na\\. <strong>Responder</strong> perante as esferas administrativa e judicial;\n\nb\\. <strong>Prestar</strong> às autoridades competentes <strong>informações</strong> relativas ao\nfuncionamento do provedor, às regras e aos procedimentos utilizados para\na moderação de conteúdo e para a gestão das reclamações pelos sistemas\ninternos\n\nc\\. Aos **relatórios de transparência, monitoramento e gestão dos\nriscos** sistêmicos;\n\nd\\. As <strong>regras para o perfilamento de usuários,</strong> quando for o caso, a\nveiculação de <strong>publicidade e o impulsionamento remunerado</strong> de\nconteúdos\n\ne\\. <strong>Cumprir</strong> as determinações judiciais;\n\nf\\. <strong>Responder e cumprir eventuais penalizações,</strong> multas e afetações\nfinanceiras em que o representado incorrer, especialmente por\ndescumprimento de obrigações legais e judiciais\n\nNatureza da responsabilidade\n\n12\\. <strong>Não haverá responsabilidade objetiva</strong> na aplicação da tese aqui\nenunciada.\n\nApelo ao legislador\n\n13\\. Apela-se ao Congresso Nacional para que seja elaborada legislação\ncapaz de sanar as deficiências do atual regime quanto à proteção de\ndireitos fundamentais\n\nModulação dos efeitos temporais.\n\n14\\. Para preservar a segurança jurídica, <strong>ficam modulados os efeitos</strong>\nda presente decisão que somente <strong>se aplicará prospectivamente</strong>,\nressalvadas decisões transitadas em julgado.\n\n(RE 1037396) <strong>(FGV-PGM/RJ-ANALISTA/2025)</strong>\n\n<strong>\\[Lei 12.965/2014: Art. 19</strong>. Com o intuito de assegurar a liberdade\nde expressão e impedir a censura, o provedor de aplicações de internet\nsomente poderá ser responsabilizado civilmente por danos decorrentes de\nconteúdo gerado por terceiros se, após ordem judicial específica, não\ntomar as providências para, no âmbito e nos limites técnicos do seu\nserviço e dentro do prazo assinalado, tornar indisponível o conteúdo\napontado como infringente, ressalvadas as disposições legais em\ncontrário.\n\n§ 1º A ordem judicial de que trata o <strong>caput</strong> deverá conter, sob pena\nde nulidade, identificação clara e específica do conteúdo apontado como\ninfringente, que permita a localização inequívoca do material.\n\n§ 2º A aplicação do disposto neste artigo para infrações a direitos de\nautor ou a direitos conexos depende de previsão legal específica, que\ndeverá respeitar a liberdade de expressão e demais garantias previstas\nno art. 5º da Constituição Federal.\n\n§ 3º As causas que versem sobre ressarcimento por danos decorrentes de\nconteúdos disponibilizados na internet relacionados à honra, à reputação\nou a direitos de personalidade, bem como sobre a indisponibilização\ndesses conteúdos por provedores de aplicações de internet, poderão ser\napresentadas perante os juizados especiais.\n\n§ 4º O juiz, inclusive no procedimento previsto no § 3º , poderá\nantecipar, total ou parcialmente, os efeitos da tutela pretendida no\npedido inicial, existindo prova inequívoca do fato e considerado o\ninteresse da coletividade na disponibilização do conteúdo na internet,\ndesde que presentes os requisitos de verossimilhança da alegação do\nautor e de fundado receio de dano irreparável ou de difícil reparação.\\]","refs":["553","987"]},{"id":"rg_2025_1286","tema":"1286","texto":"TEMA 1286: [É <strong>constitucional lei estadual</strong> que\n<strong>impõe</strong> a <strong>obrigatoriedade</strong> de adaptação de **percentual de\ncarrinhos de compras<strong> para </strong>transporte de crianças com deficiência**\nou mobilidade reduzida]. ([RE\n1198269](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5660013))","refs":["1286"]},{"id":"rg_2025_1156","tema":"1156","texto":"TEMA 1156: O **pagamento de crédito\nsuperpreferencial<strong> (art. 100, § 2°, da CF/1988) </strong>deve** ser realizado\npor <strong>meio de precatório, exceto</strong> se o <strong>valor</strong> a ser adimplido\nencontrar-se <strong>dentro do limite</strong> estabelecido por lei como **pequeno\nvalor.** (RE 1.326.178)","refs":["1156"]},{"id":"rg_2025_1366","tema":"1366","texto":"TEMA 1366: 1. A pretensão indenizatória por **danos\nmateriais<strong> em </strong>transporte aéreo internacional de carga e mercadoria**\nestá <strong>sujeita aos limites</strong> previstos em normas e **tratados\ninternacionais** firmados pelo Brasil, em especial as Convenções de\nVarsóvia e de Montreal; 2. É infraconstitucional e fática a controvérsia\nsobre o afastamento da limitação à pretensão indenizatória quando a\ntransportadora tem conhecimento do valor da carga ou age com dolo ou\nculpa grave. (RE 1.520.841)","refs":["1366"]},{"id":"rg_2025_656","tema":"656","texto":"TEMA 656: [É <strong>constitucional</strong>, no âmbito dos\n<strong>municípios</strong>, o **exercício de ações de segurança urbana pelas Guardas\nMunicipais<strong>, inclusive </strong>policiamento ostensivo e comunitário,**\nrespeitadas as atribuições dos demais órgãos de segurança pública\nprevistos no art. 144 da Constituição Federal e **excluída qualquer\natividade de polícia judiciária,<strong> sendo </strong>submetidas ao controle\nexterno da atividade policial pelo Ministério Público**, nos termos do\nartigo 129, inciso VII, da CF. Conforme o art. 144, § 8º, da\nConstituição Federal, as leis municipais devem observar as normas gerais\nfixadas pelo Congresso Nacional. (RE 608.588)]\n\n[","refs":["656"]},{"id":"rg_2025_285","tema":"285","texto":"TEMA 285: O Tribunal, por unanimidade, apreciando o\ntema 285 da repercussão geral, (i) deu provimento ao recurso\nextraordinário para cassar o acórdão recorrido (art. 932, VIII, do CPC\nc/c art. 21, § 1º, do RISTF) e determinar que outro seja proferido\nconsiderando a constitucionalidade do Plano Collor II e que a parte\nautora seja informada que, caso manifeste interesse, o pagamento de\ndiferenças de correção monetária de depósitos em cadernetas de poupança\nse dará nos termos do acordo coletivo e seus aditivos celebrados,\nconforme definido pela ADPF 165; (ii) revogou a determinação, datada de\n16/04/2021, de suspensão de todos os processos em fase recursal que\nversem sobre expurgos inflacionários referentes aos valores bloqueados\ndo Plano Collor I (tema 284) e Plano Collor II (tema 285); (iii) fixou a\nseguinte tese:] 1. Considerando que o STF declarou a\nconstitucionalidade do Plano Collor II na ADPF 165, **o direito a\ndiferenças de correção monetária** de depósitos em cadernetas de\npoupança, não bloqueados pelo Banco Central do Brasil, por alegados\nexpurgos inflacionários decorrentes de referido plano, **dependerá de\nadesão ao acordo coletivo e seus aditamentos,** homologados no âmbito da\nADPF 165, no prazo de 24 meses da publicação da ata de julgamento de\nreferida ação. 2. Com o objetivo de **resguardar a segurança jurídica,\nnão caberá ação rescisória ou arguição de inexigibilidade** do título\ncom base na constitucionalidade dos Planos Econômicos **de processos já\ntransitados em julgado;** [e, por fim, (iv) determinou que se oficiem\naos Presidentes dos Tribunais de Justiça para que orientem os\nmagistrados sob sua jurisdição a, nas ações relativas ao recebimento de\nexpurgos inflacionários do Plano Collor II, intimar os autores acerca da\ndecisão do Supremo Tribunal Federal e fornecer as devidas orientações\npara adesão ao acordo coletivo, e, caso a adesão não seja realizada no\nprazo estipulado pela ADPF 165, o juiz ou Tribunal de origem deverá\njulgar a ação aplicando o entendimento firmado pelo STF. (RE\n632.212)]","refs":["285","284"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2025_487","tema":"487","texto":"TEMA 487: 1. A <strong>multa isolada</strong> aplicada por\n<strong>descumprimento de obrigação tributária acessória</strong> estabelecida em\npercentual <strong>não pode ultrapassar 60% do valor do tributo</strong> ou do\n<strong>crédito vinculado,</strong> <strong>podendo</strong> chegar a <strong>100</strong>% no caso de\nexistência de circunstâncias <strong>agravantes</strong>. 2. **Não havendo tributo ou\ncrédito tributário vinculado,<strong> mas </strong>havendo valor de operação ou\nprestação vinculado à penalidade<strong>, a multa em questão </strong>não pode\nsuperar 20%<strong> do referido valor, </strong>podendo<strong> chegar a </strong>30%** no caso de\nexistência de circunstâncias <strong>agravantes</strong>. 3. Na aplicação da\n<strong>multa</strong> por <strong>descumprimento de deveres instrumentais,</strong> deve ser\nobservado o <strong>princípio da consunçã</strong>o, e, na **análise\nindividualizada<strong> das circunstâncias </strong>agravantes e atenuantes,** o\naplicador das normas sancionatórias por descumprimento de deveres\ninstrumentais pode considerar outros parâmetros qualitativos, tais como:\nadequação, necessidade, justa medida, princípio da insignificância e ne\nbis in idem. 4. <strong>Não se aplicam os limites</strong> ora estabelecidos **à\nmulta isolada que<strong>, embora aplicada pelo órgão fiscal, </strong>se refira a\ninfrações de natureza predominantemente administrativa,** a exemplo das\nmultas aduaneiras. (RE 640.452/RO)","refs":["487"]},{"id":"rg_2025_1266","tema":"1266","texto":"TEMA 1266: \"I - É <strong>Constitucional</strong> o art. 3º da Lei\nComplementar 190/2022, o qual estabelece vacatio legis no prazo\ncorrespondente à anterioridade nonagesimal prevista no art. 150, III,\n'c', da Constituição Federal. II - As <strong>leis estaduais</strong> editadas após a\nEC 87/2015 e <strong>antes da entrada em vigor da Lei Complementar 190/2022,</strong>\ncom o propósito de <strong>instituir</strong> a cobrança do Diferencial de Alíquotas\ndo ICMS -- <strong>DIFAL</strong> nas operações e prestações que destinem **bens e\nserviços a consumidor final não contribuinte<strong> do imposto, </strong>são\nválidas,<strong> mas </strong>produzem efeitos somente a partir da vigência da LC\n190/2022.<strong> III- </strong>Contribuintes que ajuizaram ação judicial**\n(modulação dos efeitos) - **Exclusivamente quanto ao exercício de 2022,\nnão se admite a exigência do DIFA**L em relação aos contribuintes que\ntenham ajuizado ação judicial questionando a cobrança **até a data de\njulgamento da ADI 7066 (29/11/2023),<strong> e tenham </strong>deixado de recolher o\ntributo naquele exercício.** (RE 1.426.271)","refs":["1266"]},{"id":"rg_2025_1153","tema":"1153","texto":"TEMA 1153: [É <strong>inconstitucional</strong> a **eleição do\ncredor fiduciário como contribuinte ou responsável** tributário do\nImposto sobre a Propriedade de Veículos Automotores (<strong>IPVA</strong>) incidente\nsobre <strong>veículo alienado fiduciariamente,</strong> <strong>ressalvada</strong> a hipótese da\n<strong>consolidação de sua propriedade plena</strong> sobre o bem. (RE\n1.355.870)]\n\n[\\[modulou os efeitos da decisão (arts. 8º e 927, § 3º, do Código de\nProcesso Civil, e arts. 20 e 21 da Lei de Introdução às Normas do\nDireito Brasileiro), para que a tese produza efeitos ex nunc, a contar\nda publicação da ata de julgamento do mérito, ressalvadas as hipóteses\nde ações judiciais e de processos administrativos pendentes de conclusão\naté o marco temporal epigrafado.\\]]","refs":["1153"]},{"id":"rg_2025_1035","tema":"1035","texto":"TEMA 1035: É **constitucional considerar o tipo de\natividade<strong> exercida pelo contribuinte como </strong>um dos critérios para\nfixação do valor de taxa** de fiscalização do estabelecimento. (ARE\n990094/SP)","refs":["1035"]},{"id":"rg_2025_914","tema":"914","texto":"TEMA 914: [I - É <strong>constitucional</strong> a contribuição de\nintervenção no domínio econômico **(CIDE) destinada a financiar o\nPrograma de Estímulo à Interação Universidade-Empresa** para o Apoio à\nInovação, instituída e disciplinada pela Lei nº 10.168/2000, com as\nalterações empreendidas pelas Leis nºs 10.332/2001 e 11.452/2007; II - A\n<strong>arrecadação da CIDE,</strong> instituída pela Lei nº 10.168/2000, com as\nalterações empreendidas pelas Leis nºs 10.332/2001 e 11.452/2007, **deve\nser integralmente aplicada na área de atuação Ciência e Tecnologia,**\nnos termos da lei\\\".] (RE 928943) **[(julgado mérito em\n13/08/2025)]**","refs":["914"]},{"id":"rg_2025_1186","tema":"1186","texto":"TEMA 1186: É <strong>constitucional</strong> a inclusão da\ncontribuição ao Programa de Integração Social (<strong>PIS</strong>) e da\nContribuição para Financiamento da Seguridade Social (<strong>Cofins</strong>) n**a\nbase de cálculo** da Contribuição Previdenciária sobre a Receita Bruta\n(<strong>CPRB</strong>). (RE 1.341.464)","refs":["1186"]},{"id":"rg_2025_1282","tema":"1282","texto":"TEMA 1282: [São <strong>constitucionais</strong> as **taxas\nestaduais<strong> pela utilização, efetiva ou potencial, dos </strong>serviços\npúblicos de prevenção e combate a incêndios<strong>, </strong>busca, salvamento ou\nresgate<strong> prestados ao contribuinte ou postos a sua disposição </strong>pelos\ncorpos de bombeiros militares.** (RE 1417155) Julgado mérito de tema com\nrepercussão geral em 26/03/2025] **(FGV-TJES-ATIV NOTARIAL E DE\nREGISTRO/2025)**","refs":["1282"]},{"id":"rg_2025_1383","tema":"1383","texto":"TEMA 1383: O princípio da **anterioridade tributária,\ngeral e nonagesimal, se aplica<strong> às hipóteses de </strong>redução ou de\nsupressão de benefícios ou de incentivos fiscais** que resultem em\n<strong>majoração indireta de tributos,</strong> observadas as determinações e as\nexceções constitucionais para cada tributo. (RE 1.473.645) (INFO 1170)\n**(FGV-TRF1-JUIZ/2025) (VUNESP-DESENVOLVE/SP-AUDITOR/2024) (FGV-ENAC\n2/2025)**","refs":["1383"]},{"id":"rg_2025_816","tema":"816","texto":"TEMA 816: [1. É <strong>inconstitucional</strong> a **incidência do\nISS<strong> a que se refere o </strong>subitem 14.05** da Lista anexa à LC nº 116/03\nse o <strong>objeto é destinado à industrialização ou à comercialização</strong>; 2.\nAs <strong>multas moratórias</strong> instituídas pela União, Estados, Distrito\nFederal e municípios devem observar o <strong>teto de 20%</strong> do débito\ntributário\\\", e, no que diz respeito apenas à **primeira tese fixada,\natribuiu eficácia ex nunc,** a contar da data de publicação da ata de\njulgamento do mérito, para: a) **impossibilitar a repetição de\nindébito** do ISS em favor de quem recolheu esse imposto até a véspera\nda referida data, <strong>vedando</strong>, nesse caso, a **cobrança do IPI e do ICMS\nem relação aos mesmos fatos geradores<strong>; b) </strong>impedir** que os\n<strong>municípios cobrem</strong> o ISS em relação aos fatos geradores ocorridos até\na véspera daquela data. Ficam <strong>ressalvadas</strong> (i) as ações judiciais\najuizadas até a véspera da mesma data, inclusive as de repetição de\nindébito e as execuções fiscais em que se discuta a incidência do ISS, e\n(ii) as hipóteses de comprovada bitributação relativas a fatos geradores\nocorridos até a véspera da mencionada data, casos em que o contribuinte\nterá direito à repetição do indébito do ISS e não do IPI/ICMS,\nrespeitado o prazo prescricional, independentemente da propositura de\nação judicial até esse marco. No caso de não recolhimento nem do ISS nem\ndo IPI/ICMS, o Tribunal entendeu pela incidência do IPI/ICMS em relação\naos fatos geradores ocorridos até a véspera da publicação da ata de\njulgamento do mérito]. (RE 882461) []\n\n[\\[14.05 - Restauração, recondicionamento, acondicionamento, pintura,\nbeneficiamento, lavagem, secagem, tingimento, galvanoplastia,\nanodização, corte, recorte, plastificação, costura, acabamento,\npolimento e congêneres de objetos quaisquer.\\]]","refs":["816"]},{"id":"rg_2025_1373","tema":"1373","texto":"TEMA 1373: O ajuizamento de **ação para o\nreconhecimento de isenção<strong> de </strong>imposto de renda por doença grave** e\npara a <strong>repetição do indébito</strong> tributário <strong>não exige</strong> prévio\nrequerimento administrativo. (RE 1.525.407)","refs":["1373"]},{"id":"rg_2025_1367","tema":"1367","texto":"TEMA 1367: A <strong>não incidência de ICMS</strong> no\ndeslocamento de bens de um estabelecimento para outro do mesmo\ncontribuinte localizados em estados distintos, estabelecida no Tema\n1.099/RG e na ADC 49, **tem efeitos a partir do exercício financeiro de\n2024,<strong> </strong>ressalvados** os processos administrativos e judiciais\npendentes de conclusão até a data de publicação da ata de julgamento da\ndecisão de mérito da ADC 49 (29.04.2021). (RE 1.490.708)","refs":["1367","1"]},{"id":"rg_2025_1368","tema":"1368","texto":"TEMA 1368: A aplicação das alíquotas integrais do\nAFRMM, a partir da revogação do Decreto nº 11.321/2022 pelo Decreto nº\n11.374/2023, <strong>não está submetida à anterioridade tributária</strong>\n(exercício e nonagesimal). (ARE 1.527.985)","refs":["1368"]},{"id":"rg_2025_1386","tema":"1386","texto":"TEMA 1386: (i) É <strong>constitucional</strong> a **exigência de\ndepósito de percentual de benefícios fiscais de ICMS** para o Fundo\nOrçamentário Temporário (FOT), nos termos da ADI 5.635; e (ii) é\ninfraconstitucional e fática a controvérsia sobre a possibilidade de\nexigir o depósito ao FOT em benefícios fiscais de ICMS concedidos por\nprazo certo e sob condição. (RE 1.506.320)","refs":["1386"]},{"id":"rg_2025_111","tema":"111","texto":"TEMA 111: O <strong>regime previsto no art. 78</strong> do Ato das\nDisposições Constitucionais Transitórias é <strong>inconstitucional</strong>,\nrespeitando-se os parcelamentos realizados, com amparo no dispositivo,\naté a concessão da medida cautelar na ADI 2.356 MC em 25/11/2010. (RE\n970.343)","refs":["111"]},{"id":"rg_2025_1108","tema":"1108","texto":"TEMA 1108: As reduções do percentual de crédito a ser\napurado no REINTEGRA, assim como a revogação do benefício, ensejam a\n<strong>majoração indireta das contribuições para o PIS e COFINS</strong> e devem\n<strong>observar</strong>, quanto à sua vigência, o **princípio da anterioridade\nnonagesimal**, previsto no art. 195, § 6º, da Constituição Federal,\n**não se lhes aplicando o princípio da anterioridade geral ou de\nexercício,** previsto no art. 150, III, b. (ARE 1.285.177)","refs":["1108"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2025_1300","tema":"1300","texto":"TEMA 1300: É <strong>constitucional</strong> o pagamento do\n<strong>benefício</strong> de aposentadoria por <strong>incapacidade permanente</strong> nos\ntermos fixados pelo art. 26, § 2º, III, da Emenda Constitucional nº\n103/2019 para os casos em que a **incapacidade para o trabalho seja\nconstatada posteriormente à Reforma da Previdência.** (RE 1.469.150/PR)","refs":["1300"]},{"id":"rg_2025_1196","tema":"1196","texto":"TEMA 1196: <strong>Não viola</strong> os artigos 62, caput e § 1º,\ne 246 da Constituição Federal a estipulação de <strong>prazo estimado</strong> para a\n<strong>duração de benefício de auxílio-doença,</strong> conforme estabelecido nos §§\n8º e 9º do art. 60 da Lei 8.213/1991, com redação dada pelas medidas\nprovisórias 739/2016 e 767/2017, esta última convertida na Lei\n13.457/2017. (RE 1.347.526/SE)","refs":["1196"]},{"id":"rg_2025_599","tema":"599","texto":"TEMA 599: O auxílio-suplementar, concedido à luz do\nart. 9º da Lei nº 6.367/76, é cumulável com a aposentadoria por\ninvalidez somente se as condições para a concessão dessa tiverem sido\nimplementadas na vigência da Lei nº 8.213/91 e antes de 11/11/97, quando\nentrou em vigor a MP nº 1.596-14/97 (convertida na Lei nº 9.528/97) .\n(RE 687.813)","refs":["599"]},{"id":"rg_2025_616","tema":"616","texto":"TEMA 616: É <strong>constitucional</strong> a **aplicação do fator\nprevidenciário,<strong> instituído pela Lei 9.876/1999, aos </strong>benefícios\nconcedidos a segurados filiados ao Regime Geral** de Previdência Social\nantes de 16.12.1998, <strong>abrangidos pela regra de transição</strong> do art. 9º\nda EC 20/98. (RE 639856/RS)","refs":["616"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2025_1232","tema":"1232","texto":"TEMA 1232: 1 - O **cumprimento da sentença trabalhista\nnão poderá<strong> ser promovido </strong>em face de empresa que não tiver\nparticipado da fase de conhecimento** do processo, devendo o\n<strong>reclamante indicar na petição inicial</strong> as **pessoas jurídicas\ncorresponsáveis solidárias** contra as quais pretende direcionar a\nexecução de eventual título judicial, inclusive nas hipóteses de grupo\neconômico (art. 2°, §§ 2° e 3°, da CLT), demonstrando concretamente,\nnesta hipótese, a presença dos requisitos legais; 2 - Admite-se,\n<strong>excepcionalmente</strong>, o **redirecionamento da execução trabalhista ao\nterceiro que não participou** do processo de conhecimento nas hipóteses\nde <strong>sucessão empresarial</strong> (art. 448-A da CLT) **e abuso da\npersonalidade jurídica** (art. 50 do CC), observado o procedimento\nprevisto no art. 855-A da CLT e nos arts. 133 a 137 do CPC; 3 -\nAplica-se tal procedimento mesmo aos redirecionamentos operados antes da\nReforma Trabalhista de 2017, ressalvada a indiscutibilidade relativa aos\ncasos já transitados em julgado, aos créditos já satisfeitos e às\nexecuções findas ou definitivamente arquivadas. (RE 1.387.795)","refs":["1232"]},{"id":"rg_2025_1277","tema":"1277","texto":"TEMA 1277: O art. 3º, § 3º, da Lei 10.259/2001 **é\ncompatível com a Constituição** Federal, devendo ser interpretado no\nsentido de que **a competência absoluta dos juizados especiais federais\nse restringe ao valor da causa,** havendo a faculdade de escolha do foro\npelo demandante na forma do art. 109, § 2º, da CF/88. (RE 1.426.083)","refs":["1277"]},{"id":"rg_2025_1396","tema":"1396","texto":"TEMA 1396: 1. É <strong>possível exigir</strong> da <strong>Fazenda</strong>\nPública a apresentação de **documentos e cálculos para o início de\ncumprimento de sentença** nos juizados especiais, nos termos da ADPF\n219; 2. <strong>É fática a controvérsia</strong> sobre a <strong>hipossuficiência</strong> da\nparte credora para atribuição à Fazenda Pública do ônus de apresentação\nde documentos para início de execução de sentença em Juizados Especiais.\n(RE 1.528.097) <strong>(FGV-ENAM 2/2025)</strong>","refs":["1396"]},{"id":"rg_2025_1255","tema":"1255","texto":"TEMA 1255: O Tribunal, por unanimidade, resolveu a\nquestão de ordem no sentido de esclarecer que o Tema RG nº 1.255 está,\natualmente, restrito à fixação de honorários advocatícios devidos pela\nFazenda Pública, nos termos do voto do Relator, Ministro André Mendonça.\n(RE 1.412.069-QO)","refs":["1255"]},{"id":"rg_2025_1220","tema":"1220","texto":"TEMA 1220: É <strong>formalmente constitucional</strong> o § 14 do\nart. 85 do Código de Processo Civil no que diz respeito à **preferência\ndos honorários advocatícios<strong>, inclusive contratuais, em </strong>relação ao\ncrédito tributário,** considerando-se o teor do art. 186 do CTN\". (RE\n1326559) (INFO 1171)","refs":["1220"]}]},"2024":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2024_1086","tema":"1086","texto":"TEMA 1086: [A presença de <strong>símbolos religiosos</strong> em\nprédios públicos, pertencentes a qualquer dos Poderes da União, dos\nEstados, do Distrito Federal e dos Municípios, <strong>desde que</strong> tenha o\nobjetivo de manifestar a <strong>tradição cultural</strong> da sociedade brasileira,\n<strong>não viola</strong> os princípios da não discriminação, da laicidade estatal e\nda impessoalidade]. ([ARE\n1249095](https://portal.stf.jus.br/processos/detalhe.asp?incidente=5827249))\n(INFO 1160) **(FGV-PCMG-DELEGADO/2025)\n(CESPE-CAESB/DF-ADVOGADO/2025) (VUNESP-CÂMARA DA ESTÂNCIA BALNEÁRIA DE\nPRAIA GRANDE/SP-CONTROLADOR/2025)**","refs":["1086"]},{"id":"rg_2024_1360","tema":"1360","texto":"TEMA 1360: 1. É <strong>vedada</strong> a **expedição de\nprecatórios complementares<strong> ou suplementares de valor pago, </strong>salvo**\nnas hipóteses de <strong>erro material,</strong> inexatidão aritmética ou\nsubstituição de índices aplicáveis por força de alteração normativa; 2.\nA <strong>verificação de enquadrament</strong>o nas hipóteses admitidas de\ncomplementação ou suplementação de precatório **pressupõe o reexame de\nmatéria** fático-probatória. (ARE 1.491.413)","refs":["1360"]},{"id":"rg_2024_1361","tema":"1361","texto":"TEMA 1361: O <strong>trânsito em julgado</strong> de decisão de\nmérito com previsão de índice específico de juros ou de correção\nmonetária <strong>não impede</strong> a incidência de legislação ou entendimento\njurisprudencial do STF supervenientes, nos termos do Tema 1.170/RG. (RE\n1.505.031)","refs":["1361","1"]},{"id":"rg_2024_558","tema":"558","texto":"TEMA 558: A <strong>compensação</strong> dos <strong>débitos</strong> da Fazenda\nPública inscritos em precatórios, prevista nos §§ 9º e 10 do art. 100 da\nConstituição Federal, incluídos pela EC nº 62/09, **viola frontalmente o\ntexto constitucional,** pois obsta a efetividade da jurisdição (CRFB/88,\nart. 5º, XXXV), desrespeita a coisa julgada material (CRFB/88, art. 5º,\nXXXVI), vulnera a Separação dos Poderes (CRFB/88, art. 2º) e ofende a\nisonomia entre o Poder Público e o particular (CRFB/88, art. 5º, caput).\n(RE 678.360)","refs":["558"]},{"id":"rg_2024_1326","tema":"1326","texto":"TEMA 1326: A <strong>iniciativa legislativa</strong> para definição\nde <strong>obrigações de pequeno valor</strong> para pagamento de condenação judicial\n<strong>não é reservada ao chefe do Poder Executivo</strong>. (RE 1.496.204)","refs":["1326"]},{"id":"rg_2024_6","tema":"6","texto":"TEMA 6: 1. A <strong>ausência de inclusão</strong> de medicamento\nnas listas de dispensação do Sistema Único de Saúde - SUS (RENAME,\nRESME, REMUME, entre outras) <strong>impede</strong>, como **regra geral, o\nfornecimento<strong> do fármaco por decisão judicial, </strong>independentemente do\ncust<strong>o. 2. É </strong>possível, excepcionalmente<strong>, a </strong>concessão judicial de\nmedicamento registrado<strong> na ANVISA, mas </strong>não in
