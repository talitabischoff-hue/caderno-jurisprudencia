ado especial, cujo acidente ou\nmoléstia é anterior à vigência da Lei n. 12.873/2013, que alterou a\nredação do inciso I do artigo 39 da Lei n. 8.213/91, não precisa\ncomprovar o recolhimento de contribuição como segurado facultativo para\nter direito ao auxílio-acidente. ([REsp\n1361410/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300098614))","refs":["627"]},{"id":"rep_2017_732","tema":"732","texto":"TEMA 732: [O menor sob guarda tem direito à concessão\ndo benefício de pensão por morte do seu mantenedor, comprovada sua\ndependência econômica, nos termos do art. 33, § 3º do Estatuto da\nCriança e do Adolescente, ainda que o óbito do instituidor da pensão\nseja posterior à vigência da Medida Provisória 1.523/96, reeditada e\nconvertida na Lei 9.528/97. Funda-se essa conclusão na qualidade de lei\nespecial do Estatuto da Criança e do Adolescente (8.069/90), frente à\nlegislação previdenci]ária. ([REsp\n1411258/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201303392039))","refs":["732"]},{"id":"rep_2017_904","tema":"904","texto":"TEMA 904: O décimo terceiro salário (gratificação\nnatalina) somente integra o cálculo do salário de benefício, nos termos\nda redação original do § 7º do art. 28 da Lei 8.212/1991 e § 3º do art.\n29 da Lei n. 8.213/1991, quando os requisitos para a concessão do\nbenefício forem preenchidos em data anterior à publicação da Lei n.\n8.870/1994, que expressamente excluiu o décimo terceiro salário do\ncálculo da Renda Mensal Inicial (RMI), independentemente de o Período\nBásico de Cálculo (PBC) do benefício estar, parcialmente, dentro do\nperíodo de vigência da legislação revogada. ([REsp\n1546680/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201501916140))","refs":["904"]},{"id":"rep_2017_941","tema":"941","texto":"TEMA 941: Nos planos de benefícios de previdência\ncomplementar administrados por entidade fechada, a previsão regulamentar\nde reajuste, com base nos mesmos índices adotados pelo Regime Geral de\nPrevidência Social, não inclui a parte correspondente a aumentos reais.\n([REsp\n1564070/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502742659))","refs":["941"]},{"id":"rep_2017_943","tema":"943","texto":"TEMA 943: 1.1. Em caso de migração de plano de\nbenefícios de previdência complementar, não é cabível o pleito de\nrevisão da reserva de poupança ou de benefício, com aplicação do índice\nde correção monetária.\n\n1.2. Em havendo transação para migração de plano de benefícios, em\nobservância à regra da indivisibilidade da pactuação e proteção ao\nequilíbrio contratual, a anulação de cláusula que preveja concessão de\nvantagem contamina todo o negócio jurídico, conduzindo ao retorno ao\nstatus quo ante. ([REsp\n1551488/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502077230))","refs":["943"]}]},"2016":{"DIREITO DO CONSUMIDOR":[{"id":"rep_2016_922","tema":"922","texto":"TEMA 922: A <strong>inscrição indevida</strong> comandada pelo\ncredor em cadastro de inadimplentes, quando **preexistente legítima\nanotação,<strong> </strong>não enseja<strong> indenização por </strong>dano moral,<strong> </strong>ressalvado\no direito ao cancelamento.** Inteligência da Súmula 385/STJ. ([REsp\n1386424/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301746445))\n(FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)","refs":["922"]},{"id":"rep_2016_915","tema":"915","texto":"TEMA 915: Em relação ao **sistema \\\"credit\nscoring\\\",** o interesse de agir para a propositura da ação cautelar de\nexibição de documentos exige, no mínimo, a prova de: i) requerimento\npara obtenção dos dados ou, ao menos, a tentativa de fazê-lo à\ninstituição responsável pelo sistema de pontuação, com a fixação de\nprazo razoável para atendimento; e ii) que a recusa do crédito almejado\nocorreu em razão da pontuação que lhe foi atribuída pelo sistema\n\\\"scoring\\\". ([REsp\n1304736/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201200318393))","refs":["915"]}],"DIREITO CIVIL":[{"id":"rep_2016_945","tema":"945","texto":"TEMA 945: [a) a pactuação da pós-datação de cheque,\npara que seja hábil a ampliar o prazo de apresentação à instituição\nfinanceira sacada, **deve espelhar a data de emissão estampada no campo\nespecífico da cártula**;]\n\n[b) <strong>sempre será possível,</strong> no <strong>prazo para a execução</strong> cambial, o\n<strong>protesto cambiário</strong> de cheque, com a indicação do emitente como\ndevedor.] ([REsp\n1423464/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201304008052))\n<strong>(VUNESP-MPRJ-PROMOTOR/2024)</strong>","refs":["945"]},{"id":"rep_2016_919","tema":"919","texto":"TEMA 919: [I - A pretensão de **repetição de indébito\nde contrato de cédula de crédito rural prescreve no prazo de vinte\nanos,<strong> sob a égide do art. 177 do Código Civil de 1916, e de </strong>três\nanos,** sob o amparo do art. 206, §3º, IV, do Código Civil de 2002,\nobservada a norma de transição do art. 2.028 desse último Diploma Legal;\nII - O termo inicial da prescrição da pretensão de repetição de indébito\nde contrato de cédula de crédito rural é a <strong>data da efetiva lesão</strong>, ou\nseja, do pagamento. (][REsp\n1361730/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300111247))\n<strong>(VUNESP-PGESP-PROCURADOR/2024)</strong>","refs":["919"]},{"id":"rep_2016_939","tema":"939","texto":"TEMA 939: Legitimidade passiva \\'ad causam\\' da\nincorporadora, na condição de promitente-vendedora, para responder pela\nrestituição ao consumidor dos valores pagos a título de comissão de\ncorretagem e de taxa de assessoria técnico-imobiliária, nas demandas em\nque se alega prática abusiva na transferência desses encargos ao\nconsumidor. ([REsp\n1551951/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502162012)\n; [REsp\n1551968/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502161783)\n)","refs":["939"]},{"id":"rep_2016_938","tema":"938","texto":"TEMA 938: (i) Incidência da <strong>prescrição trienal</strong>\nsobre a pretensão de restituição dos valores pagos a título de comissão\nde corretagem ou de serviço de assistência técnico-imobiliária (SATI),\nou atividade congênere (artigo 206, § 3º, IV, CC). (vide REsp n.\n1.551.956/SP)\n\n\\(ii\\) **Validade da cláusula contratual que transfere ao\npromitente-comprador a obrigação de pagar a comissão de corretagem** nos\ncontratos de promessa de compra e venda de unidade autônoma em regime de\nincorporação imobiliária, <strong>desde que</strong> previamente informado o preço\ntotal da aquisição da unidade autônoma, com o destaque do valor da\ncomissão de corretagem; (vide REsp n. 1.599.511/SP)\n\n(ii, parte final) Abusividade da cobrança pelo promitente-vendedor do\nserviço de assessoria técnico-imobiliária (SATI), ou atividade\ncongênere, vinculado à celebração de promessa de compra e venda de\nimóvel. (vide REsp n. 1.599.511/SP)\n\n([REsp\n1918648/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002761066);\n[REsp\n1551956/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201502161710);\n[REsp\n1599510/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601296910);\n[REsp\n1599511/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601297158);\n[REsp\n1599618/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601302920);\n[REsp\n1602800/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601428817);\n[Pet\n14369/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101913686))\n\n\\[[A Terceira Turma do STJ, no REsp n. 1.747.307/SP, relator Ministro\nPaulo de Tarso Sanseverino (relator do Tema 938/STJ), esclareceu a\ncontrovérsia referente ao cumprimento do dever de informação no que diz\nrespeito à cláusula que transfere ao consumidor a obrigação de pagar a\ncomissão de corretagem nos seguintes termos (acórdão publicado no DJe de\n6/9/2018):]\n\n[\\\"Deveras, a \\'informação prévia\\' referida no Tema 938/STJ tem por\nescopo proteger o consumidor de eventual acréscimo do preço após a\naceitação da proposta.]\n\n\\\\...\\\n\n[O que realmente importa para a aplicação da tese firmada no Tema\n938/STJ é verificar se a comissão de corretagem não foi escamoteada na\nfase pré-contratual, como se estivesse embutida no preço, para depois\nser cobrada como um valor adicional, gerando aumento indevido do preço\ntotal. Desse modo, o fato de a proposta ter sido aceita no mesmo dia da\ncelebração do contrato torna-se irrelevante, não merecendo guarida a\ndistinção estabelecida pelo Tribunal de origem, no acórdão recorrido.\\\"\n.\\]]","refs":["938"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2016_0872","tema":"0872","texto":"TEMA 0872: Nos Embargos de Terceiro cujo pedido foi\nacolhido para desconstituir a constrição judicial, os honorários\nadvocatícios serão arbitrados com base no <strong>princípio da causalidade,</strong>\nresponsabilizando-se o atual proprietário (embargante), se este não\natualizou os dados cadastrais. Os encargos de sucumbência serão\nsuportados pela parte embargada, porém, na hipótese em que esta, depois\nde tomar ciência da transmissão do bem, apresentar ou insistir na\nimpugnação ou recurso para manter a penhora sobre o bem cujo domínio foi\ntransferido para terceiro. <strong>(FGV-TJSC-JUIZ/2022)</strong>","refs":["0872"]},{"id":"rep_2016_910","tema":"910","texto":"TEMA 910: [Legitimidade passiva da TELEBRAS, bem como\ndas companhias cindendas (ou sucessoras destas), para a ação de\ncomplementação de ações, na hipótese em que as ações originárias tenham\nsido emitidas pela TELEBRAS.]","refs":["910"]},{"id":"rep_2016_877","tema":"877","texto":"TEMA 877: O **prazo prescricional para a execução\nindividual<strong> é contado do </strong>trânsito em julgado** da sentença coletiva,\nsendo <strong>desnecessária</strong> a providência de que trata o **art. 94 da Lei\nn.8.078/90**. ([REsp\n1388000/P](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301798905)R)\n<strong>(FGV-TJGO-JUIZ/2023)</strong>","refs":["877"]},{"id":"rep_2016_686","tema":"686","texto":"TEMA 686: [O <strong>chamamento ao processo da União</strong> com\nbase no art. 77, III, do CPC, nas demandas propostas **contra os demais\nentes federativos<strong> responsáveis para o fornecimento de </strong>medicamentos**\nou prestação de serviços de saúde, <strong>não é impositivo,</strong> mostrando-se\n**inadequado opor obstáculo inútil à garantia fundamental do cidadão à\nsaúde**.] ([REsp\n1203244/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201001375288);\n[REsp\n1396300/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201101670015))","refs":["686"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2016_903","tema":"903","texto":"TEMA 903: [A notificação do contribuinte para o\nrecolhimento do IPVA perfectibiliza a **constituição definitiva do\ncrédito<strong> tributário, </strong>iniciando-se o prazo prescricional** para a\nexecução fiscal no <strong>dia seguinte</strong> à data estipulada para o vencimento\nda exação.] ([REsp\n1320825/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201200838768))\n**(FGV/2022) (FGV-SES-MT-ADVOGADO/2024)\n(FGV-FHEMIG-ANALISTA/2023) (FGV-TCPA-AUDITOR/2024)**","refs":["903"]}]},"2015":{"DIREITO CIVIL":[{"id":"rep_2015_725","tema":"725","texto":"TEMA 725: [No regime próprio da Lei n. 9.492/1997,\n<strong>legitimamente protestado</strong> o título de crédito ou outro documento de\ndívida, <strong>salvo</strong> inequívoca pactuação em sentido contrário, **incumbe\nao devedor,<strong> após a quitação da dívida, </strong>providenciar o cancelamento\ndo protesto**.] ([REsp\n1339436/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201728380))\n<strong>(FGV-ENAM 2/2024)</strong>","refs":["725"]},{"id":"rep_2015_806","tema":"806","texto":"TEMA 806: [Diante da presunção legal de veracidade e\npublicidade inerente aos registros do cartório de protesto, a reprodução\nobjetiva, fiel, atualizada e clara desses dados na base de órgão de\nproteção ao crédito - <strong>ainda que sem a ciência do consumidor</strong> - **não\ntem o condão de ensejar obrigação de reparação de dano<strong>]</strong>s.**\n([REsp\n1444469/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201400666202))\n<strong>(VUNESP-MPRO-PROMOTOR/2024)</strong>","refs":["806"]},{"id":"rep_2015_882","tema":"882","texto":"TEMA 882: [As taxas de manutenção criadas por\nassociações de moradores **não obrigam os não associados\nou que a elas não anuíram.** (][REsp\n1280871/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201101896590)P;\n[REsp\n1439163/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201400379700))\n(FGV-PGM/NITERÓI/RJ-PROCURADOR/2023)","refs":["882"]}],"DIREITO PENAL":[{"id":"rep_2015_917","tema":"917","texto":"TEMA 917: [É <strong>possível</strong> a <strong>remição</strong> de parte do\ntempo de execução da pena quando o condenado, em regime **fechado ou\nsemiaberto,** desempenha atividade laborativa extramuros.] ([REsp\n1381315/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201301487621))","refs":["917"]},{"id":"rep_2015_918","tema":"918","texto":"TEMA 918: [Para a caracterização do crime de estupro\nde vulnerável previsto no art. 217-A, caput, do Código Penal, basta que\no agente tenha **conjunção carnal ou pratique qualquer ato libidinoso\ncom pessoa menor de 14 anos<strong>. O </strong>consentimento** da vítima, sua\neventual <strong>experiência sexual anterior</strong> ou a existência de\n<strong>relacionamento amoroso</strong> entre o agente e a vítima <strong>não afastam</strong> a\nocorrência do crime. (][REsp\n1480881/PI](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201402075380))\n\n\\[atenção ao INFO 820 STJ: É <strong>possível</strong> o reconhecimento da\n<strong>atipicidade</strong> de conduta que poderia configurar o crime de estupro de\nvulnerável, quando as <strong>circunstâncias fáticas verificadas</strong>\n(<strong>consentimento</strong> da <strong>família</strong> da vítima, inclusive abrigando o casal\npor período de tempo, e a <strong>manutenção do relacionamento</strong> até os dias\natuais, inclusive com <strong>nascimento de filho</strong> fruto da relação), indicam\nque o <strong>bem jurídico tutelado não foi vulnerado</strong>.\\]","refs":["918"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2015_920","tema":"920","texto":"TEMA 920: Se descumpridas as condições impostas\ndurante o período de prova da suspensão condicional do processo, o\nbenefício <strong>poderá ser revogado,</strong> **mesmo se já ultrapassado o prazo\nlegal<strong>, </strong>desde que** referente a fato ocorrido durante sua vigência.\n([REsp\n1498034/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201403152749)\n; [REsp\n1406624/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201303282464)\n) <strong>(FGV-DPERJ-DEFENSOR/2023)</strong>","refs":["920"]},{"id":"rep_2015_930","tema":"930","texto":"TEMA 930: <strong>Não há óbice</strong> a que se estabeleçam, no\nprudente uso da faculdade judicial disposta no art. 89, § 2º, da Lei n.\n9.099/1995, <strong>obrigações equivalentes</strong>, do ponto de vista prático, a\nsanções penais (tais como a prestação de serviços comunitários ou a\nprestação pecuniária), m<strong>as que, para os fins do sursis</strong> processual,\nse apresentam t<strong>ão somente como condições para sua incidência</strong>. ([REsp\n1498034/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201403152749))\n<strong>(FGV-DPERJ-DEFENSOR/2023)</strong>","refs":["930"]}],"DIREITO EMPRESARIAL":[{"id":"rep_2015_885","tema":"885","texto":"TEMA 885: [A recuperação judicial do devedor principal\n<strong>não impede</strong> o prosseguimento das execuções <strong>nem induz</strong> suspensão ou\nextinção de ações ajuizadas contra terceiros devedores solidários ou\ncoobrigados em geral, por garantia cambial, real ou fidejussória, pois\nnão se lhes aplicam a suspensão prevista nos arts. 6º, caput, e 52,\ninciso III, ou a novação a que se refere o art. 59, caput, por força do\nque dispõe o art. 49, § 1º, todos da Lei n. 11.101/2005. (][REsp\n1333349/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201422684))\n<strong>(VUNESP-TJSP-JUIZ/2024)</strong>","refs":["885"]}]},"2014":{"DIREITO DO CONSUMIDOR":[{"id":"rep_2014_710","tema":"710","texto":"TEMA 710: I - O sistema \\\"credit scoring\\\" é um método\ndesenvolvido para avaliação do risco de concessão de crédito, a partir\nde modelos estatísticos, considerando diversas variáveis, com atribuição\nde uma pontuação ao consumidor avaliado (nota do risco de crédito).\n\nII - Essa prática comercial é <strong>lícita</strong>, estando autorizada pelo art.\n5º, IV, e pelo art. 7º, I, da Lei n. 12.414/2011 (lei do cadastro\npositivo).\n\nIII - Na avaliação do risco de crédito, devem ser respeitados os limites\nestabelecidos pelo sistema de proteção do consumidor no sentido da\ntutela da privacidade e da máxima transparência nas relações negociais,\nconforme previsão do CDC e da Lei n. 12.414/2011.\n\nIV - Apesar de desnecessário o consentimento do consumidor consultado,\n**devem ser a ele fornecidos esclarecimentos, caso solicitados, acerca\ndas fontes dos dados considerados (histórico de crédito), bem como as\ninformações pessoais valoradas.**\n\nV - O desrespeito aos limites legais na utilização do sistema \\\"credit\nscoring\\\", configurando abuso no exercício desse direito (art. 187 do\nCC), pode ensejar a responsabilidade objetiva e solidária do fornecedor\ndo serviço, do responsável pelo banco de dados, da fonte e do consulente\n(art. 16 da Lei n. 12.414/2011) pela ocorrência de danos morais nas\nhipóteses de utilização de informações excessivas ou sensíveis (art. 3º,\n§ 3º, I e II, da Lei n. 12.414/2011), bem como nos casos de comprovada\nrecusa indevida de crédito pelo uso de dados incorretos ou\ndesatualizados. **(VUNESP-TJSP-JUIZ/2023) [(FGV-PREF DE\nMACAÉ/RJ-PROCURADOR/2024)] (FGV-DPE/PE-DEFENSOR/2025)**\n\n\\[OBS: LEI 12.414, Art. 5º São direitos do cadastrado: (\\...) IV -\nconhecer os principais elementos e critérios considerados para a análise\nde risco, resguardado o segredo empresarial;\\]","refs":["710"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2014_701","tema":"701","texto":"TEMA 701: É possível a decretação da\n\\\"indisponibilidade de bens do promovido em Ação Civil Pública por Ato\nde Improbidade Administrativa, quando ausente (ou não demonstrada) a\nprática de atos (ou a sua tentativa) que induzam a conclusão de risco de\nalienação, oneração ou dilapidação patrimonial de bens do acionado,\ndificultando ou impossibilitando o eventual ressarcimento futuro.([REsp\n1366721/BA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300295483))\n\n**\\[[Observação: O TEMA 701/STJ foi cancelado em razão da determinação\ncontida no acórdão de julgamento do TEMA 1257/STJ (DJEN de\n13/2/2025).\\]]**","refs":["1257","701"]},{"id":"rep_2014_243","tema":"243","texto":"TEMA 243: [Para fins do art. 543-c do CPC, firma-se a\nseguinte orientação:]\n\n[1.1. É <strong>indispensável</strong> citação válida para configuração da **fraude\nde execução,** ressalvada a hipótese prevista no § 3º do art. 615-A do\nCPC.]\n\n[1.2. O reconhecimento da fraude de execução <strong>depende do registro</strong> da\npenhora do bem alienado ou da prova de má-fé do terceiro adquirente\n(Súmula n. 375/STJ).]\n\n[1.3. A <strong>presunção de boa-fé</strong> é princípio geral de direito\nuniversalmente aceito, sendo milenar parêmia: a boa-fé se presume; a\nmá-fé se prova.]\n\n[1.4<strong>. Inexistindo registro</strong> da penhora na matrícula do imóvel, **é do\ncredor o ônus da prova** de que o terceiro adquirente tinha conhecimento\nde demanda capaz de levar o alienante à insolvência, sob pena de\ntorna-se letra morta o disposto no art. 659, § 4º, do CPC.]\n\n[1.5. Conforme previsto no § 3º do art. 615-A do CPC, **presume-se em\nfraude<strong> de execução a alienação ou oneração de bens realizada </strong>após\naverbação** referida no dispositivo. (][REsp\n956943/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200701242518);\n[REsp\n1112648/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900510724);\n[REsp\n773643/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200501329320))","refs":["243"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2014_646","tema":"646","texto":"TEMA 646: É <strong>típica</strong> a conduta de **atribuir-se\nfalsa identidade** perante autoridade policial, ainda que em situação de\nalegada autodefesa (art. 307 do CP). ([REsp\n1362524/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300216964))\n<strong>(FGV-TJAP-ANALISTA JUD/2024)</strong>","refs":["646"]}],"DIREITO CIVIL":[{"id":"rep_2014_681","tema":"681","texto":"TEMA 681: A responsabilidade por dano ambiental é\n<strong>objetiva</strong>, informada pela <strong>teoria do risco integral,</strong> sendo o nexo\nde causalidade o fator aglutinante que permite que o risco se integre na\nunidade do ato, sendo <strong>descabida a invocação,</strong> pela empresa\nresponsável pelo dano ambiental, de **excludentes de responsabilidade\ncivil** para afastar a sua obrigação de indenizar. ([REsp\n1354536/SE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201202466478))\n[**(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023)\n(FGV-TCE/RR-ANALISTA/2025)**]","refs":["681"]},{"id":"rep_2014_885","tema":"885","texto":"TEMA 885: A recuperação judicial do devedor principal\n<strong>não impede</strong> o <strong>prosseguimento das execuções</strong> **nem induz\nsuspensão<strong> ou extinção de ações ajuizadas </strong>contra terceiros devedores\nsolidários ou coobrigados em geral, por garantia cambial, real ou\nfidejussória,** pois não se lhes aplicam a suspensão prevista nos arts.\n6º, caput, e 52, inciso III, ou a novação a que se refere o art. 59,\ncaput, por força do que dispõe o art. 49, § 1º, todos da Lei n.\n11.101/2005. ([REsp\n1333349/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201422684))\n**[(FGV-PREF DE VITÓRIA/ES-PROCURADOR/2024) (FGV-PREF DE\nCUIABÁ/MT-AUDITOR FISCAL/2024)]**\n\nDIREITO AMBIENTAL","refs":["885"]},{"id":"rep_2014_707","tema":"707","texto":"TEMA 707: [a) **a responsabilidade por dano ambiental\né objetiva, informada pela teoria do risco integral<strong>, sendo o </strong>nexo de\ncausalidade o fator aglutinante<strong> que </strong>permite que o risco se integre\nna unidade do ato**, sendo descabida a invocação, pela empresa\nresponsável pelo dano ambiental, de excludentes de responsabilidade\ncivil para afastar sua obrigação de indenizar; b) em decorrência do\nacidente, a empresa deve recompor os danos materiais e morais causados;\nc) na fixação da indenização por danos morais, recomendável que o\narbitramento seja feito caso a caso e com moderação, proporcionalmente\nao grau de culpa, ao nível socioeconômico do autor, e, ainda, ao porte\nda empresa, orientando-se o juiz pelos critérios sugeridos pela doutrina\ne jurisprudência, com razoabilidade, valendo-se de sua experiência e bom\nsenso, atento à realidade da vida e às peculiaridades de cada caso, de\nmodo a que, de um lado, não haja enriquecimento sem causa de quem recebe\na indenização e, de outro, haja efetiva compensação pelos danos morais\nexperimentados por aquele que fora lesado. (][REsp\n1374284/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201082657))\n<strong>(FGV-MPU-ANALISTA/2025)</strong>\n\nDIREITO EMPRESARIAL","refs":["707"]},{"id":"rep_2014_637","tema":"637","texto":"TEMA 637: I -os <strong>créditos</strong> resultantes de\n<strong>honorários advocatícios têm natureza alimentar</strong> e **equiparam-se aos\ntrabalhistas<strong> para efeito de </strong>habilitação** em falência, seja pela\nregência do Decreto-Lei n. 7.661/1945, seja pela forma prevista na Lei\nn. 11.101/2005, <strong>observado o limite de valor</strong> previsto no artigo 83,\ninciso I, do referido Diploma legal.\n\nII - são <strong>créditos extraconcursais</strong> os honorários de advogado\n<strong>resultantes de trabalhos prestados à massa falida, depois</strong> do decreto\nde <strong>falência</strong>, nos termos dos arts. 84 e 149 da Lei n. 11.101/2005.\n([REsp\n1152218/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901563744))\n<strong>(FGV-ENAM/2025)</strong>","refs":["637"]}]},"2013":{"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2013_614","tema":"614","texto":"TEMA 614: [<strong>Inexiste óbices</strong> à <strong>penhora</strong>, em face\nde <strong>dívidas</strong> tributárias da <strong>matriz</strong>, de valores depositados **em\nnome das filiais**.] ([REsp\n1355812/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201202490963))","refs":["614"]}],"DIREITO CIVIL":[{"id":"rep_2013_500","tema":"500","texto":"TEMA 500: Nas <strong>ações de reintegração de posse</strong>\nmotivadas por <strong>inadimplemento</strong> de **arrendamento mercantil\nfinanceiro<strong>, quando o produto da </strong>soma do VRG quitado<strong> com o </strong>valor\nda venda<strong> do bem for </strong>maior** que o total pactuado como VRG na\ncontratação, será <strong>direito</strong> do arrendatário <strong>receber a diferença,</strong>\ncabendo, porém, se estipulado no contrato, o <strong>prévio desconto</strong> de\n<strong>outras despesas</strong> ou encargos contratuais. ([REsp\n1099212/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200802335154))\n(vide súm 564, STJ) <strong>(FGV-ENAM/2025)</strong>","refs":["500"]}]},"2012":{"DIREITO CIVIL":[{"id":"rep_2012_438","tema":"438","texto":"TEMA 438: [A alegação de **culpa exclusiva de\nterceiro** pelo acidente em causa, como excludente de responsabilidade,\n<strong>deve ser afastada,</strong> ante a incidência da **teoria do risco integral e\nda responsabilidade objetiva** ínsita ao dano ambiental (art. 225, § 3º,\nda CF e do art. 14, § 1º, da Lei nº 6.938/81), responsabilizando o\ndegradador em decorrência do princípio do poluidor-pagador.\n<strong>(FGV-TJSC-JUIZ/2024)</strong>]","refs":["438"]},{"id":"rep_2012_246","tema":"246","texto":"TEMA 246: É **permitida a capitalização de\njuros<strong> com periodicidade </strong>inferior a um ano** em contratos celebrados\napós 31.3.2000, data da publicação da Medida Provisória n. 1.963-17/2000\n(em vigor como MP 2.170-36/2001), <strong>desde que expressamente pactuada.</strong>\n([REsp\n973827/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200701790723))","refs":["246"]},{"id":"rep_2012_247","tema":"247","texto":"TEMA 247: [A <strong>capitalização dos juros</strong> em\nperiodicidade <strong>inferior à anual deve</strong> vir pactuada de forma **expressa\ne clara.** A previsão no contrato bancário de taxa de juros anual\n<strong>superior ao duodécuplo da mensal é suficiente</strong> para permitir a\n<strong>cobrança da taxa efetiva anual</strong> contratada. (][REsp\n973827/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200701790723))","refs":["247"]}],"DIREITO PENAL":[{"id":"rep_2012_561","tema":"561","texto":"TEMA 561: [Afigura-se absolutamente **\\'possível o\nreconhecimento do privilégio** previsto no § 2º do art. 155 do Código\nPenal n<strong>os casos de furto qualificado</strong> (CP, art. 155, § 4º)\\', máxime\nse presente **qualificadora de ordem objetiva, a primariedade do réu e,\ntambém, o pequeno valor** da res furtiva.] ([REsp\n1193194/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201000840080)\n; [REsp\n1193932/MG;](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201000839365)\n[REsp\n1193558/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201000841380);\n[REsp\n1193554/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201000841130))\n\\[SÚMULA 511 STJ originou deste tema) <strong>(FGV-TJMT-JUIZ/2024)</strong>","refs":["561"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2012_535","tema":"535","texto":"TEMA 535: [São <strong>isentos</strong> do Imposto de Renda os\n**rendimentos do trabalho recebidos por técnicos a serviço das Nações\nUnidas, contratados no Brasil** para atuar como consultores no âmbito do\nPrograma das Nações Unidas para o Desenvolvimento - PNUD. \\'Peritos\\' a\nque se refere o Acordo Básico de Assistência Técnica com a Organização\ndas Nações Unidas, suas Agências Especializadas e a Agência\nInternacional de Energia Atômica, promulgado pelo Decreto 59.308/66,\nestão ao abrigo da norma isentiva do imposto de renda. O Acordo Básico\nde Assistência Técnica atribuiu os benefícios fiscais decorrentes da\nConvenção sobre Privilégios e Imunidades das Nações Unidas, promulgada\npelo Decreto 27.784/50, não só aos funcionários da ONU em sentido\nestrito, mas também aos que a ela prestam serviços na condição de\n\\'peritos de assistência técnica\\', no que se refere a essas atividades\nespecíficas.] <strong>(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)</strong>\n\n[","refs":["535"]},{"id":"rep_2012_537","tema":"537","texto":"TEMA 537: Diante do que dispõe a legislação que\ndisciplina as concessões de serviço público e da peculiar relação\nenvolvendo o Estado-concedente, a concessionária e o consumidor, esse\núltimo tem legitimidade para propor ação declaratória c/c repetição de\nindébito na qual se busca afastar, no tocante ao fornecimento de energia\nelétrica, a incidência do ICMS sobre a demanda contratada e não\nutilizada. (][REsp\n1299303/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201103084763)[)\n<strong>(VUNESP-PGESP-PROCURADOR/2024)</strong>]\n\nDIREITO ADMINISTRATIVO\n\n[","refs":["537"]},{"id":"rep_2012_553","tema":"553","texto":"TEMA 553: Aplica-se o **prazo prescricional\nquinquenal<strong> - previsto do Decreto 20.910/32 - nas </strong>ações\nindenizatórias ajuizadas contra a Fazenda Pública**, em detrimento do\nprazo trienal contido do Código Civil de 2002]. ([REsp\n1251993/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201101008870))\n<strong>(VUNESP-PGESP-PROCURADOR/2024)</strong>","refs":["553"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2012_476","tema":"476","texto":"TEMA 476: [Transitado em julgado o título judicial sem\nqualquer limitação ao pagamento integral do índice de 28,86%, não cabe à\nUnião e às autarquias federais alegar, por meio de embargos, a\ncompensação com tais reajustes, sob pena de ofender-se a coisa\njulgada.]\n\n[\\[ANOTAÇÕES NUGEPNAC: RRC de Origem (art. 543-C, § 1º, do\nCPC/73).]\n\n[1. Algumas categorias de servidores públicos federais também foram\ncontempladas com reajustes específicos nesses diplomas legais, como\nocorreu com os docentes do ensino superior. Em razão disso, a Suprema\nCorte decidiu que esses aumentos deveriam ser compensados, no âmbito de\nexecução, com o índice de 28,86%.]\n\n[2. Nos embargos à execução, a **compensação só pode ser alegada se não\npôde ser objetada no processo de conhecimento.** Se a compensação\nbaseia-se em fato que já era passível de ser invocado no processo\ncognitivo, estará a matéria protegida pela coisa julgada. Ver TEMA\n547.\\]]","refs":["547","476"]}]},"2011":{"DIREITO EMPRESARIAL":[{"id":"rep_2011_463","tema":"463","texto":"TEMA 463: Só <strong>responde por danos materiais e morais</strong>\no <strong>endossatário</strong> que recebe título de crédito por **endosso-mandato e\no leva a protesto se extrapola os poderes<strong> de mandatário </strong>ou** em\nrazão de <strong>ato culposo próprio</strong>, como no caso de apontamento depois da\nciência acerca do pagamento anterior ou da falta de higidez da cártula.\n([REsp\n1063474/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200801285010))\n(VUNESP-MPSP-PROMOTOR/2023)","refs":["463"]}]},"2010":{"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2010_421","tema":"421","texto":"TEMA 421: É possível a condenação da Fazenda Pública\nao pagamento de honorários advocatícios em decorrência da extinção da\nExecução Fiscal pelo acolhimento de Exceção de Pré-Executividade.\n<strong>(FGV/2022)</strong>\n\n[","refs":["421"]},{"id":"rep_2010_60","tema":"60","texto":"TEMA 60: Ajuizada ação coletiva atinente a\n<strong>macro-lide</strong> geradora de <strong>processos multitudinários,</strong>\n<strong>suspendem-se</strong> as ações <strong>individuais</strong>, no aguardo do julgamento da\nação coletiva]. ([REsp\n1110549/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900070092))\n<strong>(FGV-TJBA-JUIZ LEIGO/2023)</strong>\n\n[\\[\\\"Na identificação da macro-lide multitudinária, deve-se considerar\napenas o capítulo substancial do processo coletivo. No ato de suspensão\nnão se devem levar em conta peculiaridades da contrariedade (p. ex.,\nalegações diversas, como as de ilegitimidade de de parte, de prescrição,\nde irretroatividade de lei, de nomeação de gestor, de julgamento por\nCâmaras Especiais e outras que porventura surjam, ressalvada,\nnaturalmente, a extinção devido à proclamação absolutamente evidente e\nsólida de pressupostos processuais ou condições da ação), pois, dada a\nmultiplicidade de questões que podem ser enxertadas pelas partes, na\nsustentação de suas pretensões, o não sobrestamento devido a\nacidentalidades de cada processo individual levaria à ineficácia do\nsistema.\\\"\\]]","refs":["60"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2010_385","tema":"385","texto":"TEMA 385: A denúncia espontânea resta configurada na\nhipótese em que o contribuinte, após efetuar a declaração parcial do\ndébito tributário (sujeito a lançamento por homologação) acompanhado do\nrespectivo pagamento integral, <strong>retifica-a</strong> (antes de qualquer\nprocedimento da Administração Tributária), **noticiando a existência de\ndiferença<strong> a maior, cuja </strong>quitação se dá concomitantemente.** ([REsp\n1149022/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901341424))\n(FGV-TJMT-JUIZ/2024) (VUNESP-TJSP-JUIZ/2024)","refs":["385"]},{"id":"rep_2010_0193","tema":"0193","texto":"TEMA 0193: [Os Estados da Federação são partes\nlegítimas para figurar no pólo passivo das ações propostas por\nservidores públicos estaduais, que visam o reconhecimento do direito à\nisenção ou à repetição do indébito relativo ao imposto de renda retido\nna fonte. \\JULGADO em 2009; TRANSITO EM JULGADO em 2013\\.\n<strong>(FGV/2022)</strong>]","refs":["0193"]},{"id":"rep_2010_378","tema":"378","texto":"TEMA 378: A <strong>fiança bancária não é equiparável</strong> ao\n<strong>depósito integral</strong> do débito exequendo <strong>para fins de suspensão</strong> da\nexigibilidade do crédito tributário, ante a **taxatividade do art. 151\ndo CTN** e o teor do Enunciado Sumular n. 112 desta Corte. ([REsp\n1156668/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901753941))\n**(FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)\n(VUNESP-PGESP-PROCURADOR/2024)**\n\n[","refs":["378"]},{"id":"rep_2010_391","tema":"391","texto":"TEMA 391: O <strong>juízo do inventário</strong>, na modalidade de\n<strong>arrolamento sumário, não detém</strong> competência para apreciar pedido de\nreconhecimento da <strong>isenção do ITCMD</strong> (Imposto sobre Transmissão *Causa\nMortis* e Doação de quaisquer Bens ou Direitos), à luz do disposto no\ncaput do artigo 179, do CTN. (][REsp\n1150356/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901424392)[P)\n<strong>(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)</strong>]","refs":["391"]},{"id":"rep_2010_346","tema":"346","texto":"TEMA 346: [Nos termos do art. 170-A do CTN, 'é\n<strong>vedada</strong> a compensação mediante o aproveitamento de tributo, objeto de\ncontestação judicial pelo sujeito passivo, a**ntes do trânsito em\njulgado<strong> da respectiva decisão judicial\\', vedação que </strong>se aplica**\ninclusive às hipóteses de reconhecida **inconstitucionalidade do tributo\nindevidamente recolhido**.] ([REsp\n1167039/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200902265493))\n(<strong>FGV-ALPR-PROCURADOR/2024)</strong>\n\nTEMA 358: O **descumprimento da obrigação\nacessória** de informar, mensalmente, ao INSS, dados relacionados aos\nfatos geradores da contribuição previdenciária, é **condição impeditiva\npara expedição da prova de inexistência de débito**. ([REsp\n1042585/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200800632652);\n[REsp\n1100059/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200802449869))\n<strong>(FGV-TJSC-JUIZ/2024.2)</strong>\n\n[","refs":["346","358"]},{"id":"rep_2010_0402","tema":"0402","texto":"TEMA 0402: Revela-se <strong>legítima</strong> a <strong>recusa</strong> da\nautoridade impetrada em **expedir certidão negativa de débito (CND) ou\nde certidão positiva com efeitos de negativa** (CPEN) quando a\nautoridade tributária verifica a ocorrência d<strong>e pagamento a menor,</strong> em\nvirtude da existência de divergências entre os valores declarados na\nGuia de Recolhimento do FGTS e Informações] à Previdência Social\n(GFIP) e os valores efetivamente recolhidos mediante guia de pagamento\n(GP). ([REsp\n1143094/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901057660))\n**(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024) (FGV-TCEPA-AUDITOR/2024)\n(FGV-TJSC-JUIZ/2024.2)**","refs":["0402"]},{"id":"rep_2010_0251","tema":"0251","texto":"TEMA 0251: [A <strong>natureza jurídica</strong> da remuneração dos\nserviços de água e esgoto, prestados por concessionária de serviço\npúblico, é de <strong>tarifa ou preço público,</strong> consubstanciando, assim,\ncontraprestação de <strong>caráter não-tributário,</strong> razão pela qual não se\nsubsume ao regime jurídico tributário estabelecido para as\ntaxas]. ([REsp\n1117903/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900740539))\n**(FGV-CÂMARA MUN DE SP-PROCURADOR/2024) (VUNESP-PREF DE SANTO\nANDRÉ-ANALISTA/2024)**\n\n[","refs":["0251"]},{"id":"rep_2010_375","tema":"375","texto":"TEMA 375: A <strong>confissão da dívida não inibe</strong> o\nquestionamento judicial da obrigação tributária, no que se refere aos\nseus <strong>aspectos jurídicos</strong>. Quanto aos <strong>aspectos fáticos</strong> sobre os\nquais incide a norma tributária, **a regra é que não se pode rever\njudicialmente a confissão de dívida efetuada com o escopo de obter\nparcelamento de débitos tributários**. No entanto, como na situação\npresente, a matéria de fato constante de confissão de dívida pode ser\ninvalidada quando ocorre defeito causador de nulidade do ato jurídico\n(v.g. erro, dolo, simulação e fraude). (][REsp\n1133027/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200901533160)[)\n<strong>(FGV-TCERR-AUDITOR/2025)</strong>]\n\nDIREITO ADMINISTRATIVO\n\n[","refs":["375"]},{"id":"rep_2010_330","tema":"330","texto":"TEMA 330: O <strong>termo inicial</strong> do prazo\n<strong>prescricional</strong> para o ajuizamento da a<strong>ção executória</strong> é a\n<strong>constituição definitiva do crédito</strong>, que se dá com o **término do\nprocesso administrativo de apuração da infração** e constituição da\ndívida. (][REsp\n1115078/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200900743420)[)\n<strong>(FGV-PCMG-DELEGADO/2025)</strong>]\n\n[","refs":["330"]}]},"2009":{"DIREITO CIVIL":[{"id":"rep_2009_192","tema":"192","texto":"TEMA 192: [A <strong>pensão</strong> alimentícia <strong>incide</strong> sobre o\n<strong>décimo terceiro</strong> salário e o t<strong>erço constitucional de férias,</strong>\ntambém conhecidos, respectivamente, por gratificação natalina e\ngratificação de férias. (][REsp\n1106654/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=200802617500))\n(VUNESP-CÂMARA DE TANABI/SP-ADVOGADO/2023)","refs":["192"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2009_869","tema":"869","texto":"TEMA 869: [Nos termos do artigo 219, caput e § 1º, do\nCPC e de acordo com a jurisprudência consolidada desta Corte, exceto nas\nhipóteses <script>
// ============================================================
// STATE
// ============================================================
let state = {
  read: new Set(JSON.parse(localStorage.getItem('juri_read_v2') || '[]')),
  bookmarked: new Set(JSON.parse(localStorage.getItem('juri_bm_v2') || '[]')),
  theme: localStorage.getItem('juri_theme') || 'dark',
  currentTab: 'rep'
};
document.documentElement.setAttribute('data-theme', state.theme);
updateThemeBtn();

function saveState() {
  localStorage.setItem('juri_read_v2', JSON.stringify([...state.read]));
  localStorage.setItem('juri_bm_v2', JSON.stringify([...state.bookmarked]));
}

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  localStorage.setItem('juri_theme', state.theme);
  updateThemeBtn();
}
function updateThemeBtn() {
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = state.theme === 'dark' ? '☀️ Modo Claro' : '🌙 Modo Escuro';
}

// ============================================================
// TAB SWITCHING
// ============================================================
function switchTab(tab) {
  state.currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['rep','rg','progress'][i] === tab);
  });
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.panel-full').forEach(p => p.classList.remove('active'));
  if (tab === 'progress') {
    document.getElementById('panel-progress').classList.add('active');
    buildProgressPanel();
  } else {
    document.getElementById('panel-' + tab).classList.add('active');
  }
}

// ============================================================
// SIDEBAR
// ============================================================
function buildSidebar(source) {
  const data = source === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  const el = document.getElementById('sidebar-' + source);
  const years = Object.keys(data).sort((a,b) => b-a);
  let html = `<div class="sidebar-search"><input type="text" placeholder="Filtrar matéria..." oninput="onSidebarSearch('${source}',this.value)"/></div>`;
  for (const year of years) {
    const subjs = data[year];
    const totalYear = Object.values(subjs).reduce((s,t) => s+t.length, 0);
    const phase = parseInt(year) <= 2020 ? 'p1' : 'p2';
    html += `<div class="year-group">
      <div class="year-header" onclick="toggleYear(this)">
        <span class="arrow">▶</span><span>${year}</span>
        <span class="phase-badge ${phase}">${phase === 'p1' ? 'F1' : 'F2'}</span>
        <span class="cnt">${totalYear}</span>
      </div><div class="subj-list">`;
    for (const [subj, teses] of Object.entries(subjs)) {
      if (subj === 'ATENÇÃO') continue;
      const short = subj.replace('DIREITO ','').replace('PROCESSUAL ','PROC. ');
      html += `<div class="subj-item" onclick="loadContent('${source}','${year}','${encodeURIComponent(subj)}')" data-src="${source}" data-year="${year}" data-subj="${subj}"><span>${short}</span><span class="subj-cnt">${teses.length}</span></div>`;
    }
    html += `</div></div>`;
  }
  el.innerHTML = html;
}

function toggleYear(h) {
  h.classList.toggle('open');
  h.nextElementSibling.classList.toggle('open');
}

function onSidebarSearch(src, q) {
  document.querySelectorAll(`#sidebar-${src} .subj-item`).forEach(item => {
    const m = !q || item.dataset.subj.toLowerCase().includes(q.toLowerCase()) || item.dataset.year.includes(q);
    item.style.display = m ? '' : 'none';
  });
}

// ============================================================
// CONTENT LOADING
// ============================================================
let activeSearchTerm = '';

function loadContent(source, year, subjEncoded, jumpId) {
  const subj = decodeURIComponent(subjEncoded);
  const data = source === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  const teses = data[year]?.[subj] || [];
  const contentEl = document.getElementById('content-' + source);

  document.querySelectorAll(`#sidebar-${source} .subj-item`).forEach(el => {
    el.classList.toggle('active', el.dataset.year === year && el.dataset.subj === subj);
  });

  // Open year in sidebar
  const targetItem = document.querySelector(`#sidebar-${source} .subj-item[data-year="${year}"][data-subj="${subj}"]`);
  if (targetItem) {
    const list = targetItem.closest('.subj-list');
    const header = list?.previousElementSibling;
    if (list && !list.classList.contains('open')) {
      list.classList.add('open');
      if (header) header.classList.add('open');
    }
    setTimeout(() => targetItem.scrollIntoView({ block: 'nearest' }), 100);
  }

  const srcLabel = source === 'rep' ? 'Repetitivos STJ' : 'Repercussão Geral STF';
  const subjShort = subj.replace('DIREITO ','');

  let html = `<div class="content-header">
    <div class="content-header-text">
      <h2>${subjShort} <span style="color:var(--text3);font-weight:400;font-size:0.85rem">· ${year}</span></h2>
      <div class="meta">${srcLabel} · ${teses.length} teses nesta seção</div>
    </div>
  </div>
  <div class="filter-bar">
    <input type="text" placeholder="Filtrar teses nesta seção..." oninput="filterTeses('${source}',this.value)" id="section-filter-${source}"/>
    <div class="filter-chip active" onclick="filterByStatus('${source}','all',this)">Todos</div>
    <div class="filter-chip" onclick="filterByStatus('${source}','unread',this)">Não lidos</div>
    <div class="filter-chip" onclick="filterByStatus('${source}','read',this)">Lidos ✓</div>
    <div class="filter-chip" onclick="filterByStatus('${source}','bookmarked',this)">★ Salvos</div>
  </div>
  <div id="teses-list-${source}">`;

  for (const t of teses) {
    html += renderTeseCard(t, source, activeSearchTerm);
  }
  html += `</div>`;
  contentEl.innerHTML = html;
  contentEl.scrollTop = 0;

  if (jumpId) {
    setTimeout(() => {
      const card = document.getElementById('card-' + jumpId);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('jump-highlight');
        // Auto expand
        const body = card.querySelector('.tese-body');
        const btn = card.querySelector('.expand-btn');
        if (body && !body.classList.contains('open')) { body.classList.add('open'); if(btn) btn.classList.add('open'); }
        setTimeout(() => card.classList.remove('jump-highlight'), 1500);
      }
    }, 120);
  }
}

function renderTeseCard(t, source, hl) {
  const isRead = state.read.has(t.id);
  const isBM = state.bookmarked.has(t.id);
  const preview = t.texto.replace(/<[^>]+>/g,'').slice(0, 130).replace(/\n/g,' ') + '…';

  // Cross-refs chips
  let refsHtml = '';
  if (t.refs && t.refs.length > 0) {
    const chips = t.refs.slice(0,6).map(r => {
      const refNorm = r.replace(/\D/g,'');
      return `<span class="ref-chip" onclick="jumpToRef('${refNorm}','${source}')" title="Ir para Tema ${refNorm}">
        <span class="ref-arrow">↗</span> Tema ${refNorm}
      </span>`;
    }).join('');
    refsHtml = `<div class="cross-refs"><span class="cross-refs-label">Referências:</span>${chips}</div>`;
  }

  // Highlight search term in text
  let textoHtml = t.texto.replace(/\n/g,'<br>');
  if (hl && hl.length > 2) {
    const escaped = hl.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    textoHtml = textoHtml.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
  }

  const classes = ['tese-card', isRead?'read':'', isBM?'bookmarked':''].filter(Boolean).join(' ');
  return `<div class="${classes}" id="card-${t.id}" data-id="${t.id}">
    <div class="tese-card-header">
      <span class="tema-badge" onclick="event.stopPropagation();jumpToRef('${t.tema.replace(/[^0-9]/g,'')}','${source}')" title="Copiar número do Tema">TEMA ${t.tema}</span>
      <span class="tese-title-preview">${preview}</span>
      <div class="tese-actions">
        <button class="status-btn btn-read ${isRead?'active':''}" onclick="toggleRead('${t.id}','${source}')" title="Marcar como lido">✓</button>
        <button class="status-btn btn-bookmark ${isBM?'active':''}" onclick="toggleBookmark('${t.id}','${source}')" title="Salvar">★</button>
        <button class="expand-btn" onclick="toggleExpand(this)">▼</button>
      </div>
    </div>
    <div class="tese-body">
      <div class="tese-text">${textoHtml}</div>
      ${refsHtml}
      <div class="read-banner">✓ Lido</div>
    </div>
  </div>`;
}

function toggleExpand(btn) {
  const body = btn.closest('.tese-card').querySelector('.tese-body');
  body.classList.toggle('open');
  btn.classList.toggle('open');
}

// ============================================================
// READ / BOOKMARK
// ============================================================
function toggleRead(id, source) {
  if (state.read.has(id)) state.read.delete(id); else state.read.add(id);
  saveState(); refreshCard(id); updateStats();
}
function toggleBookmark(id, source) {
  if (state.bookmarked.has(id)) state.bookmarked.delete(id); else state.bookmarked.add(id);
  saveState(); refreshCard(id);
}
function refreshCard(id) {
  const card = document.getElementById('card-' + id);
  if (!card) return;
  const isRead = state.read.has(id); const isBM = state.bookmarked.has(id);
  card.className = ['tese-card', isRead?'read':'', isBM?'bookmarked':''].filter(Boolean).join(' ');
  card.querySelector('.btn-read').className = 'status-btn btn-read ' + (isRead?'active':'');
  card.querySelector('.btn-bookmark').className = 'status-btn btn-bookmark ' + (isBM?'active':'');
}

// ============================================================
// FILTER
// ============================================================
function filterTeses(source, q) {
  document.querySelectorAll(`#teses-list-${source} .tese-card`).forEach(c => {
    const id = c.dataset.id;
    const text = c.querySelector('.tese-body .tese-text').textContent;
    const tema = c.querySelector('.tema-badge').textContent;
    const match = !q || tema.toLowerCase().includes(q.toLowerCase()) || text.toLowerCase().includes(q.toLowerCase());
    c.style.display = match ? '' : 'none';
  });
}
function filterByStatus(source, status, btn) {
  document.querySelectorAll('.filter-bar .filter-chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll(`#teses-list-${source} .tese-card`).forEach(c => {
    const id = c.dataset.id;
    let show = true;
    if (status === 'read') show = state.read.has(id);
    else if (status === 'unread') show = !state.read.has(id);
    else if (status === 'bookmarked') show = state.bookmarked.has(id);
    c.style.display = show ? '' : 'none';
  });
}

// ============================================================
// GLOBAL SEARCH
// ============================================================
let searchDebounce = null;
let searchResultIndex = -1;
let currentResults = [];

function onGlobalSearch(q) {
  const clearBtn = document.getElementById('search-clear-btn');
  clearBtn.style.display = q ? 'block' : 'none';
  const countEl = document.getElementById('search-count');
  clearTimeout(searchDebounce);
  if (!q || q.trim().length < 2) {
    document.getElementById('search-dropdown').classList.remove('open');
    countEl.style.display = 'none';
    return;
  }
  searchDebounce = setTimeout(() => runSearch(q.trim()), 200);
}

function runSearch(q) {
  const dd = document.getElementById('search-dropdown');
  const countEl = document.getElementById('search-count');
  activeSearchTerm = q;
  const qLow = q.toLowerCase();

  // Search in index
  const results = SITE_DATA.search.filter(e => {
    return e.t.toLowerCase().includes(qLow) ||
           e.p.toLowerCase().includes(qLow) ||
           e.y.includes(qLow);
  });

  currentResults = results;
  searchResultIndex = -1;
  countEl.style.display = results.length > 0 ? 'block' : 'none';
  countEl.textContent = `${results.length} resultado${results.length !== 1 ? 's' : ''}`;

  if (results.length === 0) {
    dd.innerHTML = `<div class="search-empty">Nenhum resultado para "<strong>${q}</strong>"</div>`;
    dd.classList.add('open');
    return;
  }

  // Group by source
  const rg = results.filter(r => r.s === 'rg').slice(0, 12);
  const rep = results.filter(r => r.s === 'rep').slice(0, 12);
  const shown = [...rep.slice(0,10), ...rg.slice(0,10)];

  let html = '';
  if (rep.length > 0) {
    html += `<div class="search-group-header">🏛️ Repetitivos STJ (${results.filter(r=>r.s==='rep').length})</div>`;
    rep.slice(0,10).forEach((r, i) => {
      html += buildResultItem(r, q, rep.indexOf(r));
    });
  }
  if (rg.length > 0) {
    html += `<div class="search-group-header">⚖️ Repercussão Geral STF (${results.filter(r=>r.s==='rg').length})</div>`;
    rg.slice(0,10).forEach((r, i) => {
      html += buildResultItem(r, q, rep.length + rg.indexOf(r));
    });
  }
  if (results.length > 20) {
    html += `<div class="search-empty" style="padding:10px">+ ${results.length - 20} resultados — refine a busca para ver mais</div>`;
  }
  dd.innerHTML = html;
  dd.classList.add('open');
}

function buildResultItem(r, q, idx) {
  const srcLabel = r.s === 'rep' ? 'STJ' : 'STF';
  const subjShort = (r.subj || '').replace('DIREITO ','');
  const preview = highlightText(r.p, q);
  return `<div class="search-result-item" data-idx="${idx}" onclick="goToSearchResult(${idx})">
    <div class="sri-badges">
      <span class="sri-tema">T.${r.t}</span>
      <span class="sri-src">${srcLabel}</span>
    </div>
    <div class="sri-content">
      <div class="sri-subj">${r.y} · ${r.s === 'rep' ? 'Repetitivo' : 'Rep. Geral'}</div>
      <div class="sri-preview">${preview}</div>
    </div>
    <span class="sri-year">${r.y}</span>
  </div>`;
}

function highlightText(text, q) {
  if (!q) return text;
  const escaped = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<mark>$1</mark>');
}

function goToSearchResult(idx) {
  const r = currentResults[idx];
  if (!r) return;
  closeDropdown();
  // Find the tese in data to get year+subj
  const data = r.s === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  let foundYear, foundSubj;
  for (const [year, subjs] of Object.entries(data)) {
    for (const [subj, teses] of Object.entries(subjs)) {
      if (teses.find(t => t.id === r.id)) { foundYear = year; foundSubj = subj; break; }
    }
    if (foundYear) break;
  }
  if (!foundYear) return;
  switchTab(r.s);
  setTimeout(() => {
    loadContent(r.s, foundYear, encodeURIComponent(foundSubj), r.id);
  }, 50);
}

function showDropdown() {
  const q = document.getElementById('global-search-input').value;
  if (q && q.length >= 2 && currentResults.length > 0) {
    document.getElementById('search-dropdown').classList.add('open');
  }
}
function closeDropdown() {
  document.getElementById('search-dropdown').classList.remove('open');
}
function clearSearch() {
  document.getElementById('global-search-input').value = '';
  document.getElementById('search-clear-btn').style.display = 'none';
  document.getElementById('search-count').style.display = 'none';
  closeDropdown();
  activeSearchTerm = '';
  currentResults = [];
}
function handleSearchKey(e) {
  const dd = document.getElementById('search-dropdown');
  const items = dd.querySelectorAll('.search-result-item');
  if (e.key === 'Escape') { clearSearch(); return; }
  if (e.key === 'ArrowDown') {
    searchResultIndex = Math.min(searchResultIndex + 1, items.length - 1);
    items.forEach((item, i) => item.style.background = i === searchResultIndex ? 'var(--bghover)' : '');
    if (items[searchResultIndex]) items[searchResultIndex].scrollIntoView({ block: 'nearest' });
    e.preventDefault();
  }
  if (e.key === 'ArrowUp') {
    searchResultIndex = Math.max(searchResultIndex - 1, 0);
    items.forEach((item, i) => item.style.background = i === searchResultIndex ? 'var(--bghover)' : '');
    e.preventDefault();
  }
  if (e.key === 'Enter' && searchResultIndex >= 0) {
    goToSearchResult(searchResultIndex);
    e.preventDefault();
  }
}

// Close dropdown when clicking outside
document.addEventListener('click', (e) => {
  if (!e.target.closest('.global-search-wrap')) closeDropdown();
});

// ============================================================
// CROSS-REFERENCE JUMP
// ============================================================
function jumpToRef(temaNum, currentSrc) {
  if (!temaNum) return;
  // Look in tema_map
  const ids = SITE_DATA.tema_map[temaNum] || [];
  if (ids.length === 0) {
    // Try search
    document.getElementById('global-search-input').value = 'TEMA ' + temaNum;
    onGlobalSearch('TEMA ' + temaNum);
    return;
  }
  const targetId = ids[0];
  const src = targetId.startsWith('rg_') ? 'rg' : 'rep';
  const data = src === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  let foundYear, foundSubj;
  for (const [year, subjs] of Object.entries(data)) {
    for (const [subj, teses] of Object.entries(subjs)) {
      if (teses.find(t => t.id === targetId)) { foundYear = year; foundSubj = subj; break; }
    }
    if (foundYear) break;
  }
  if (!foundYear) return;
  switchTab(src);
  setTimeout(() => loadContent(src, foundYear, encodeURIComponent(foundSubj), targetId), 50);
}

// ============================================================
// STATS
// ============================================================
function updateStats() {
  const r = state.read.size; const total = 949;
  const pct = Math.round(r/total*100);
  document.getElementById('stat-read').textContent = r;
  document.getElementById('stat-pct').textContent = pct + '%';
  document.getElementById('fp-count').textContent = `${r} / ${total}`;
  document.getElementById('fp-pct').textContent = pct + '%';
  drawRing(pct);
}
function drawRing(pct) {
  const c = document.getElementById('progress-ring');
  if (!c) return;
  const ctx = c.getContext('2d');
  const cx = 19, cy = 19, r = 15;
  ctx.clearRect(0, 0, 38, 38);
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--border2').trim();
  ctx.lineWidth = 2.5; ctx.stroke();
  if (pct > 0) {
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + Math.PI*2*pct/100);
    ctx.strokeStyle = '#c9a84c'; ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.stroke();
  }
}

// ============================================================
// PROGRESS PANEL
// ============================================================
function buildProgressPanel() {
  const el = document.getElementById('progress-main');
  const total = 949; const r = state.read.size; const pct = Math.round(r/total*100);
  const p1 = SITE_DATA.schedule.phase1.flat();
  const p2 = SITE_DATA.schedule.phase2.flat();
  const p1r = p1.filter(id => state.read.has(id)).length;
  const p2r = p2.filter(id => state.read.has(id)).length;

  let html = `<div class="progress-header"><h2>📅 Cronograma de 60 Dias</h2><p>Plano fragmentado em 2 fases de 30 dias cada</p></div>
  <div class="progress-overview">
    ${overCard(pct+'%','Progresso Total',pct)}
    ${overCard(r,'Teses Lidas',pct)}
    ${overCard(Math.round(p1r/p1.length*100)+'%','Fase 1',Math.round(p1r/p1.length*100))}
    ${overCard(Math.round(p2r/p2.length*100)+'%','Fase 2',Math.round(p2r/p2.length*100))}
    ${overCard(total-r,'Restantes',100-pct,'var(--red),var(--red2)')}
  </div>`;

  html += phaseGrid(SITE_DATA.schedule.phase1, 1, `Repetitivos STJ 2009–2020 + Repercussão Geral STF 2008–2020 · ${p1.length} teses`);
  html += phaseGrid(SITE_DATA.schedule.phase2, 2, `Repetitivos STJ 2021–2026 + Repercussão Geral STF 2021–2026 · ${p2.length} teses`);
  el.innerHTML = html;
}
function overCard(val, label, pct, fillColor) {
  const fill = fillColor || 'var(--gold),var(--gold2)';
  return `<div class="overview-card"><div class="big-num">${val}</div><div class="label">${label}</div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,${fill})"></div></div></div>`;
}
function phaseGrid(sched, phase, desc) {
  let html = `<div class="schedule-title"><span>FASE ${phase} — Dias ${phase===1?'1 a 30':'31 a 60'}</span><span class="phase-label ${phase===2?'p2':''}">FASE ${phase}</span></div>
  <div class="phase-desc">${desc}</div><div class="days-grid">`;
  sched.forEach((dayItems, idx) => {
    const dayNum = phase === 1 ? idx+1 : idx+31;
    const dr = dayItems.filter(id => state.read.has(id)).length;
    const dp = dayItems.length > 0 ? Math.round(dr/dayItems.length*100) : 0;
    const done = dp === 100 && dayItems.length > 0;
    const partial = dp > 0 && !done;
    html += `<div class="day-card ${done?'done':''} ${partial?'partial':''}" onclick="openDayModal(${idx},${phase})">
      ${done ? '<span class="check">✓</span>' : ''}
      <div class="day-num">Dia ${dayNum}</div>
      <div class="day-count">${dr}/${dayItems.length}</div>
      <div class="day-pbar"><div class="day-pfill" style="width:${dp}%"></div></div>
    </div>`;
  });
  return html + `</div>`;
}

// ============================================================
// DAY MODAL
// ============================================================
let modalDay = null, modalPhase = null;
function openDayModal(idx, phase) {
  modalDay = idx; modalPhase = phase;
  const sched = phase === 1 ? SITE_DATA.schedule.phase1 : SITE_DATA.schedule.phase2;
  const dayItems = sched[idx];
  const dayNum = phase === 1 ? idx+1 : idx+31;
  document.getElementById('modal-title').textContent = `Dia ${dayNum} — ${dayItems.length} teses`;
  const body = document.getElementById('modal-body');
  let html = '';
  for (const id of dayItems) {
    const t = findById(id);
    if (!t) continue;
    const isRead = state.read.has(id);
    const src = id.startsWith('rg_') ? '⚖️ STF' : '🏛️ STJ';
    html += `<div class="modal-tese-item ${isRead?'read':''}" id="mitem-${id}" onclick="goToTeseFromModal('${id}')">
      <span class="modal-tese-label">${src} T.${t.tema}</span>
      <span class="modal-tese-text">${t.texto.replace(/<[^>]+>/g,'').slice(0,260)}…</span>
      <button class="modal-check-btn ${isRead?'done':''}" onclick="event.stopPropagation();toggleReadModal('${id}')" title="Marcar lido">✓</button>
    </div>`;
  }
  body.innerHTML = html || '<div class="search-empty">Sem teses neste dia</div>';
  document.getElementById('day-modal').classList.add('open');
}
function closeModal() {
  document.getElementById('day-modal').classList.remove('open');
  buildProgressPanel();
}
function toggleReadModal(id) {
  if (state.read.has(id)) state.read.delete(id); else state.read.add(id);
  saveState(); updateStats();
  const btn = document.querySelector(`#mitem-${id} .modal-check-btn`);
  const item = document.getElementById('mitem-' + id);
  if (btn) btn.className = 'modal-check-btn ' + (state.read.has(id)?'done':'');
  if (item) item.className = 'modal-tese-item ' + (state.read.has(id)?'read':'');
}
function markAllDayRead() {
  const sched = modalPhase === 1 ? SITE_DATA.schedule.phase1 : SITE_DATA.schedule.phase2;
  sched[modalDay].forEach(id => state.read.add(id));
  saveState(); updateStats(); closeModal();
}
function goToTeseFromModal(id) {
  const t = findById(id);
  if (!t) return;
  const src = id.startsWith('rg_') ? 'rg' : 'rep';
  const data = src === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  let foundYear, foundSubj;
  for (const [year, subjs] of Object.entries(data)) {
    for (const [subj, teses] of Object.entries(subjs)) {
      if (teses.find(x => x.id === id)) { foundYear = year; foundSubj = subj; break; }
    }
    if (foundYear) break;
  }
  if (!foundYear) return;
  closeModal();
  switchTab(src);
  setTimeout(() => loadContent(src, foundYear, encodeURIComponent(foundSubj), id), 80);
}

// ============================================================
// UTILS
// ============================================================
function findById(id) {
  const src = id.startsWith('rg_') ? 'rg' : 'rep';
  const data = src === 'rep' ? SITE_DATA.rep : SITE_DATA.rg;
  for (const subjs of Object.values(data)) {
    for (const teses of Object.values(subjs)) {
      const found = teses.find(t => t.id === id);
      if (found) return found;
    }
  }
  return null;
}

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('global-search-input').focus();
  }
});

// ============================================================
// INIT
// ============================================================
function init() {
  buildSidebar('rep');
  buildSidebar('rg');
  updateStats();
  // Open first year
  setTimeout(() => {
    document.querySelector('#sidebar-rep .year-header')?.click();
    document.querySelector('#sidebar-rg .year-header')?.click();
  }, 80);
}
init();
</script>
