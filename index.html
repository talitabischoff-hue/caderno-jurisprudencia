ano à saúde humana para a\n<strong>configuração da conduta delitiva</strong>, **não sendo exigida a efetiva\nocorrência do dano<strong> </strong>nem<strong> a realiz]ação de </strong>perícia\ntécnica,** podendo a comprovação se dar por qualquer meio de prova\nidôneo. ([REsp\n2205709/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202501074005))","refs":["1377"]},{"id":"rep_2025_1192","tema":"1192","texto":"TEMA 1192: O cometimento de crimes de <strong>roubo</strong>\nmediante <strong>uma só conduta e sem desígnios autônomos</strong> contra o\n<strong>patrimônio de diferentes vítimas, ainda que</strong> da <strong>mesma família,</strong>\nconfigura <strong>concurso formal</strong> de crimes. ([REsp\n1960300/GO](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102947550)\n) <strong>(FGV-TJMS-JUIZ/2025)</strong>","refs":["1192"]},{"id":"rep_2025_1194","tema":"1194","texto":"TEMA 1194: 1. A **atenuante genérica da\nconfissão espontânea**, prevista no art. 65, III, d, do Código Penal, é\n<strong>apta a abrandar a pena independentemente</strong> de ter sido <strong>utilizada</strong>\nna formação do <strong>convencimento</strong> do julgador **e mesmo que\nexistam outros elementos suficientes<strong> de prova, </strong>desde que<strong> </strong>não**\ntenha havido <strong>retratação</strong>, [<strong>exceto</strong>, neste <strong>último caso,</strong> que a\n<strong>confissão</strong> tenha servido à <strong>apuração dos fatos;</strong> 2. A]\natenuação <strong>deve ser aplicada</strong> em <strong>menor proporção</strong> e <strong>não poderá</strong>\nser considerada <strong>preponderante no concurso com agravantes</strong> quando o\n<strong>fato confessado</strong> for <strong>tipificado com menor pena</strong>\nou caracterizar circunstância **excludente da\ntipicidade, da ilicitude ou da culpabilidade**\\\". ([REsp\n2001973/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201412731))\n**(JULGADO EM 10/09/2025) (FGV-ENAM 2/2025)\n(FGV-TJMS-JUIZ/2025)**","refs":["1194"]},{"id":"rep_2025_1262","tema":"1262","texto":"TEMA 1262: Na análise das vetoriais da **natureza e da\nquantidade<strong> da substância </strong>entorpecente**, previstas no art. 42 da Lei\nn. 11.343/2006, configura-se <strong>desproporcional</strong> a **majoração da\npena-base<strong> quando a droga apreendida for de </strong>ínfima quantidade**,\n<strong>independentemente de sua natureza.</strong>([REsp\n2003735/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201534675);\n[REsp\n2004455/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201585290))","refs":["1262"]},{"id":"rep_2025_1333","tema":"1333","texto":"TEMA 1333: 1. A <strong>agravante</strong> prevista no art. **61,\nII, f,<strong> do Código Penal é </strong>aplicável às contravenções** penais\npraticadas no contexto de <strong>violência doméstica</strong> contra a mulher,\n<strong>salvo</strong> se houver <strong>previsão diversa pela Lei</strong> das Contravenções\nPenais, por força do que dispõem seu art. 1º e o art. 12 do Código\nPenal. 2. <strong>Não é possível</strong> tal aplicação para a contravenção penal de\n<strong>vias de fato,</strong> prevista no art. 21 da Lei das Contravenções Penais,\nna hipótese de <strong>incidência de seu § 2º</strong>, incluído pela Lei n.\n14.994/2024, por força dos princípios da **especialidade e da proibição\nde bis in idem.** (REsp 2.186.684-MG, REsp 2.185.716-MG, REsp\n2.184.869-MG, REsp 2.185.960-MG)","refs":["1333"]},{"id":"rep_2025_1336","tema":"1336","texto":"TEMA 1336: o <strong>indulto</strong> previsto no Decreto n.\n11.846/2023 <strong>não se aplica ao condenado</strong> por <strong>tráfico de drogas</strong> na\nforma do <strong>caput e §1º do art. 33</strong> da Lei de Drogas, vedação essa que\n<strong>abrange a pena de multa</strong> eventualmente cominada, <strong>salvo</strong> se\n<strong>beneficiado</strong> com o <strong>redutor especial</strong> (art. 33, § 4º, da Lei n.\n11.343/2006). ([REsp\n2195928/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500226961);\n[REsp\n2195927/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500200184))\n\n[","refs":["1336"]},{"id":"rep_2025_1255","tema":"1255","texto":"TEMA 1255: O **delito de falsa identidade é crime\nformal<strong>, que se </strong>consuma<strong> quando o agente </strong>fornece, consciente e\nvoluntariamente<strong>, </strong>dados inexatos** sobre sua real identidade, e,\nportanto, <strong>independe</strong> da ocorrência de <strong>resultado</strong>\nnaturalístico.] ([REsp\n2083968/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302349175))","refs":["1255"]},{"id":"rep_2025_1318","tema":"1318","texto":"TEMA 1318: 1. A **premeditação autoriza a valoração\nnegativa<strong> da circunstância da </strong>culpabilidade** prevista no art. 59 do\nCódigo Penal, <strong>desde que não constitua elementar ou</strong> seja **ínsita ao\ntipo penal<strong> </strong>nem<strong> seja </strong>pressuposto** para a incidência de\ncircunstância <strong>agravante ou qualificadora;</strong>\n\n2\\. A <strong>exasperação</strong> da pena-base pela premeditação **não é\nautomática,<strong> reclamando </strong>fundamentação específica** acerca da maior\nreprovabilidade da conduta no caso concreto. ([REsp\n2174028/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403745760);\n[REsp\n2174008/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403743978))","refs":["1318"]},{"id":"rep_2025_1186","tema":"1186","texto":"TEMA 1186: 1. A condição de **gênero feminino é\nsuficiente<strong> para atrair a aplicabilidade da </strong>Lei Maria da Penha** em\ncasos de <strong>violência doméstica</strong> e familiar, <strong>prevalecendo sobre</strong> a\n<strong>questão etária</strong>. 2. A Lei Maria da Penha <strong>prevalece</strong> quando **suas\ndisposições conflitarem com as de estatutos específicos**, como o da\nCriança e do Adolescente. ([REsp\n2015598/PA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202269500))\n<strong>(FGV-TJTO-JUIZ/2025) (VUNESP-CÂMARA DE CERQUILHO/SP-PROCURADOR/2025)</strong>","refs":["1186"]},{"id":"rep_2025_1277","tema":"1277","texto":"TEMA 1277: É <strong>possível</strong>, conforme o artigo 42 do\nCódigo Penal, o <strong>cômputo</strong> do período de <strong>prisão provisória</strong> na\nanálise dos <strong>requisitos</strong> para a <strong>concessão do indulto</strong> e da\ncomutação previstos nos respectivos decretos. ([REsp\n2069773/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301490066))","refs":["1277"]},{"id":"rep_2025_1274","tema":"1274","texto":"TEMA 1274: O fato de o **visitante cumprir pena\nprivativa<strong> de liberdade em </strong>regime aberto ou em livramento condicional\nnão impede<strong>, por si só, o </strong>direito à visita** em estabelecimento\nprisional. (REsp 2.119.556-DF; REsp 2.109.337-DF)","refs":["1274"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2025_1195","tema":"1195","texto":"TEMA 1195: [O período de <strong>doze meses</strong> a que se\nrefere o art. 4º, I, do Decreto n. 9.246/2017 **caracteriza-se pela não\nocorrência de falta grave**, não se relacionando à data de sua apuração,\n<strong>desde que já instaurado o processo administrativo</strong> disciplinar\ncorrespondente. (][REsp\n2011706/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202031799))","refs":["1195"]},{"id":"rep_2025_1347","tema":"1347","texto":"TEMA 1347: A <strong>regressão cautelar</strong> de regime\nprisional é medida de <strong>caráter provisório</strong> e está **autorizada pelo\npoder geral de cautela** do juízo da execução, podendo ser aplicada,\nmediante <strong>fundamentação idônea, até a apuração definitiva da falta</strong>.\n([REsp\n2166900/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403240643);\n[REsp\n2153215/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402314783);\n[REsp\n2167128/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403257042))\n\n[","refs":["1347"]},{"id":"rep_2025_1269","tema":"1269","texto":"TEMA 1269: No <strong>rito especial</strong> que visa apurar a\n<strong>prática de ato infracional,</strong> além da <strong>audiência de apresentação</strong> do\nadolescente prevista no art. 184 do ECA, aplica-se **subsidiariamente o\nart. 400 do CPP,<strong> de modo que, em acréscimo, é preciso </strong>garantir ao\nadolescente o interrogatório ao final da instrução**. A\n<strong>inobservância</strong> desse procedimento implicará <strong>nulidade</strong> se o\n<strong>prejuízo à autodefesa</strong> for **informado pela parte na primeira\noportunidade<strong> que tiver para se manifestar nos autos, </strong>sob pena de\npreclusão.** O entendimento é aplicável aos feitos com instrução\nencerrada após 3/3/2016. (][REsp\n2088626/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302687998);\n[REsp\n2100005/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202303532798))","refs":["1269"]},{"id":"rep_2025_1278","tema":"1278","texto":"TEMA 1278: Em decorrência dos objetivos da execução\npenal, a <strong>leitura pode resultar na remição de pena,</strong> com fundamento no\nart. 126 da Lei de Execução Penal, <strong>desde que</strong> observados os\n<strong>requisitos</strong> previstos para sua <strong>validação</strong>, <strong>não podendo</strong> ser\nacolhido o <strong>atestado</strong> realizado por **profissional contratado pelo\napenado.** ([REsp\n2121878/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400313735))","refs":["1278"]},{"id":"rep_2025_1258","tema":"1258","texto":"TEMA 1258: 1 - As <strong>regras</strong> postas no **art. 226 do\nCPP são de observância obrigatória<strong> tanto em </strong>sede inquisitorial\nquanto em juízo<strong>, sob </strong>pena de invalidade da prova** destinada a\ndemonstrar a autoria delitiva, em alinhamento com as normas do Conselho\nNacional de Justiça sobre o tema. O <strong>reconhecimento</strong> fotográfico e/ou\npessoal <strong>inválido não poderá servir de lastro</strong> nem a <strong>condenação</strong>\nnem a <strong>decisões</strong> que exijam **menor rigor quanto ao standard\nprobatório<strong>, tais como a </strong>decretação de prisão** preventiva, o\n<strong>recebimento</strong> de <strong>denúncia ou a pronúncia</strong>.\n\n2 - <strong>Deverão ser alinhadas pessoas semelhantes</strong> ao lado do suspeito\npara a realização do reconhecimento pessoal. <strong>Ainda que</strong> a regra do\ninciso II do art. 226 do CPP <strong>admita a mitigação da semelhança</strong> entre\nos suspeitos alinhados quando, justificadamente, não puderem ser\nencontradas pessoas com o mesmo fenótipo, **eventual discrepância\nacentuada<strong> entre as pessoas comparadas </strong>poderá esvaziar a\nconfiabilidade** probatória do reconhecimento feito nessas condições.\n\n3 - O reconhecimento de pessoas <strong>é prova irrepetível</strong>, na medida em\nque um reconhecimento inicialmente falho ou viciado tem o **potencial de\ncontaminar<strong> a memória do reconhecedor, </strong>esvaziando de certeza o\nprocedimento** realizado posteriormente com o intuito de demonstrar a\nautoria delitiva, <strong>ainda que o novo procedimento atenda</strong> os ditames do\nart. 226 do CPP.\n\n4 - <strong>Poderá o magistrado se convencer</strong> da autoria delitiva a partir do\n<strong>exame de provas ou evidências independentes</strong> que não guardem relação\nde causa e efeito com o ato viciado de reconhecimento.\n\n5 - Mesmo o reconhecimento pessoal válido **deve guardar congruência com\nas demais provas** existentes nos autos.\n\n6 - <strong>Desnecessário realizar o procedimento formal de reconhecimento</strong>\nde pessoas, previsto no art. 226 do CPP, quando **não se tratar de\napontamento de indivíduo desconhecido** com base na memória visual de\nsuas características físicas percebidas no momento do crime, mas, sim,\nde mera identificação de pessoa que o depoente já conhecia\nanteriormente<strong>.</strong> ([REsp\n1953602/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102575876);\n[REsp\n1986619/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200457696);\n[REsp\n1987628/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200533925);\n[REsp\n1987651/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200535720))\n(FGV-MPE/ES-PROMOTOR/2025) (FGV-TRF6-JUIZ/2025)","refs":["1258"]},{"id":"rep_2025_1303","tema":"1303","texto":"TEMA 1303: 1. A <strong>confissão</strong> pelo investigado na\n<strong>fase de inquérito policial não constitui exigência</strong> do art. 28-A do\nCódigo de Processo Penal para o <strong>cabimento</strong> de Acordo de Não\nPersecução Penal (<strong>ANPP</strong>), sendo **inválida a negativa de formulação\nda respectiva proposta baseada em sua ausência.** 2. A formalização da\nconfissão para fins do ANPP **pode se dar no momento da assinatura do\nacordo,** perante o próprio órgão ministerial, após a ciência, avaliação\ne aceitação da proposta pelo beneficiado, **devidamente assistido por\ndefesa técnica,** dado o caráter negocial do instituto. (REsp\n2.161.548-BA) (FGV-TJCE-JUIZ/2025)","refs":["1303"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2025_1294","tema":"1294","texto":"TEMA 1294:] O **Decreto 20.910/1932 não dispõe\nsobre a prescrição intercorrente,<strong> </strong>não<strong> podendo ser </strong>utilizado**\ncomo <strong>referência normativa</strong> para o seu <strong>reconhecimento</strong> em\n<strong>processos administrativos</strong> estaduais e municipais, **ainda que por\nanalogia.** (REsp 2.002.589-PR; REsp 2.137.071-MG)\n\n[","refs":["1294"]},{"id":"rep_2025_1387","tema":"1387","texto":"TEMA 1387: O <strong>saque integral do principal</strong> dá\ninício ao **prazo prescricional da pretensão de reparação por falha na\nprestação do serviço,** por saques indevidos, por desfalques, ou por\nausência de aplicação dos rendimentos estabelecidos em conta\nindividualizada do PASEP. (REsp 2.214.879-PE; REsp 2.214.864-PE)]\n\n[","refs":["1387"]},{"id":"rep_2025_1329","tema":"1329","texto":"TEMA 1329:] No âmbito do **procedimento\nadministrativo<strong> para apuração das </strong>infrações<strong> ao </strong>meio ambiente** e\nimposição das respectivas <strong>sanções</strong>, a <strong>intimação por edital</strong> para\napresentação de alegações finais, prevista na redação original do art.\n122, parágrafo único, Decreto 6.514/2008, **somente acarretará\nnulidade<strong> dos atos posteriores </strong>caso a parte demonstre a existência de\nefetivo prejuízo** para a defesa, inclusive no momento prévio ao\nrecolhimento de multa. ([REsp\n2154295/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402374928);\n[REsp\n2163058/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402352636))","refs":["1329"]},{"id":"rep_2025_1308","tema":"1308","texto":"TEMA 1308: A <strong>vedação</strong> de <strong>nova admissão</strong> de\n<strong>professor</strong> substituto **temporário anteriormente contratado, antes de\ndecorridos 24<strong> (vinte e quatro) </strong>meses** do encerramento do contrato\nanterior, contida no art. 9º, III, da Lei 8.745/1993, <strong>não se aplica</strong>\naos contratos realizados por <strong>instituições públicas distintas</strong>. ([REsp\n2136644/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401318403);\n[REsp\n2141105/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401571880))\n(JULGADO EM 13/08/2025)","refs":["1308"]},{"id":"rep_2025_1346","tema":"1346","texto":"TEMA 1346: <strong>Não é admissível o recurso especial</strong> que\ndiscute a <strong>transferência, com base em normativos da ANEEL</strong> (art. 218\nda Resolução Normativa ANEEL n. 414/2010, alterado pela Resolução ANEEL\nn. 479/2012 e sucedido pela Resolução Normativa ANEEL n. 959/2021), **da\nresponsabilidade pela manutenção do sistema de iluminação pública**,\nregistrado como Ativo Imobilizado em Serviço - AIS, pelas distribuidoras\nde energia elétrica aos municípios e ao Distrito Federal. ([REsp\n2174051/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401039646);\n[REsp\n2174052/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401998282))\n(JULGADO EM 13/08/2025)","refs":["1346"]},{"id":"rep_2025_1272","tema":"1272","texto":"TEMA 1272: O <strong>adicional noturno não será devido</strong> ao\n<strong>servidor</strong> da então carreira de Agente Federal de Execução Penal nos\nperíodos de <strong>afastamento</strong>, **ainda que considerados como de efetivo\nexercício**. ([REsp\n1956088/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102649570);\n[REsp\n1972255/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103659031);\n[REsp\n1972258/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103659650);\n[REsp\n1972326/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103601280);\n[REsp\n2041316/R](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203782061)N;\n[REsp\n2033428/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203292322);\n[REsp\n2033429/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203292472);\n[REsp\n2033430/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203292597);\n[REsp\n2033604/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203292170);\n[REsp\n2108872/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304071630);\n[REsp\n2108877/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304071642);\n[REsp\n2108878/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304071666);\n[REsp\n2108882/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304071680);\n[REsp\n2108897/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304071870))\n(JULGADO EM 13/08/2025)","refs":["1272"]},{"id":"rep_2025_1326","tema":"1326","texto":"TEMA 1326: O <strong>prazo prescricional</strong> da pretensão de\n<strong>cobrança</strong> de complementação de <strong>recursos</strong> relativos ao Valor Mínimo\nAnual por Aluno (VMAA), <strong>repassado ao FUNDEB/FUNDEF</strong>, deve ser\n<strong>apurado mês a mês, e não anualmente</strong>, por cuidar de hipótese de\nrelação de <strong>trato sucessivo,</strong> que se renova mensalmente, não havendo\nfalar de prescrição do próprio fundo de direito, mas apenas das parcelas\nrelativas ao quinquênio que precedeu à propositura da ação. ([REsp\n2154735/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402400665);\n[REsp\n2154746/PI](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402401110))\n(JULGADO EM 13/08/2025)","refs":["1326"]},{"id":"rep_2025_1284","tema":"1284","texto":"TEMA 1284: A <strong>vedação ao reexame necessário</strong> da\nsentença de <strong>improcedência</strong> ou de <strong>extinção</strong> do processo **sem\nresolução do mérito**, prevista pelos art.17, § 19º, IV c/c art. 17-C, §\n3º, da <strong>Lei de Improbidade</strong> Administrativa, com redação dada pela Lei\nnº 14.230/2021, <strong>não se aplica</strong> aos <strong>processos em curso</strong>, quando a\n<strong>sentença</strong> for <strong>anterior</strong> à <strong>vigência da Lei 14.230/21.</strong> ([REsp\n2117355/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400046299);\n[REsp\n2118137/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400113719);\n[REsp\n2120300/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400227966))","refs":["1284"]},{"id":"rep_2025_1233","tema":"1233","texto":"TEMA 1233: O <strong>abono de permanência</strong>, dada sua\nnatureza <strong>remuneratória</strong> e <strong>permanente</strong>, **integra a base de\nincidência das verbas** calculadas sobre a remuneração do servidor\npúblico, tais como o <strong>adicional de férias e a gratificação natalina</strong>\n(13º salário). ([REsp\n1993530/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103891228);\n[REsp\n2055836/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300654067))\n\n[","refs":["1233"]},{"id":"rep_2025_1147","tema":"1147","texto":"TEMA 1147: nas ações com **pedido de ressarcimento ao\nsistema único de saúde** de que trata o art. 32 da lei 9.656/1998, é\naplicável o <strong>prazo prescricional de cinco anos</strong> previsto no decreto\n20.910/1932, contado a partir da **notificação da decisão\nadministrativa<strong> que </strong>apurou os valores**]. ([REsp\n1978141/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102257778),\n[REsp\n1978155/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102859747))\n(JULGADO EM 14/05/2025)","refs":["1147"]},{"id":"rep_2025_1293","tema":"1293","texto":"TEMA 1293: [1. <strong>Incide a prescrição intercorrente</strong>\nprevista no art. 1º, § 1º, da Lei 9.873/1999 quando **paralisado o\nprocesso administrativo<strong> de apuração de </strong>infrações aduaneiras,** de\nnatureza <strong>não tributária, por mais de 3 anos.</strong> 2. A **natureza\njurídica do crédito** correspondente à sanção pela infração à legislação\naduaneira é <strong>de direito administrativo (não tributário)</strong> se a norma\ninfringida visa primordialmente ao **controle do trânsito internacional\nde mercadorias ou à regularidade do serviço aduaneir**o, ainda que,\nreflexamente, possa colaborar para a fiscalização do recolhimento dos\ntributos incidentes sobre a operação. 3. Não incidirá o art. 1º, § 1º,\nda Lei 9.873/99 apenas se a obrigação descumprida, conquanto inserida em\nambiente aduaneiro, destinava-se direta e imediatamente à arrecadação ou\nà fiscalização dos tributos incidentes sobre o negócio jurídico\nrealizado]. ([REsp\n2147578/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400058975);\n[REsp\n2147583/SP)](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400109811)","refs":["1293"]},{"id":"rep_2025_1297","tema":"1297","texto":"TEMA 1297: É compatível a aplicação cumulativa da lei\nn. 12.158/2009 e do art. 34 da medida provisória n. 2.215-10/2001 aos\nmilitares oriundos do quadro de taifeiros da aeronáutica na reserva\nremunerada, reformados ou no serviço ativo, cujo ingresso no referido\nquadro se deu até 31/12/1992. ([REsp\n2124412/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400449251);\n[REsp\n2132208/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401045599)\n; [REsp\n2085764/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302469884)\n; [REsp\n2040852/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203734214);\n[REsp\n2009309/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201893264);\n[REsp\n1966548/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103202890))","refs":["1297"]},{"id":"rep_2025_1148","tema":"1148","texto":"TEMA 1148: [As demandas em que o consumidor final\n<strong>discute parcela dos objetivos e parâmetros de cálculo</strong> das quotas\nanuais da conta de desenvolvimento energético - CDE devem ser movidas\n<strong>contra a prestadora de serviços de energia elétrica</strong>, sendo\n<strong>ilegítimas</strong> para a causa a <strong>união e a aneel</strong>, <strong>ainda que</strong> a causa\nde pedir seja a legalidade dos regulamentos expedidos pelo poder\npúblico]. ([REsp\n1955655/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102592245);\n[REsp\n1959623/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102907675);\n[REsp\n1960255/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102945691);\n[REsp\n1964456/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103258418)\n; [REsp\n1956946/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102742051))","refs":["1148"]},{"id":"rep_2025_1286","tema":"1286","texto":"TEMA 1286: [Para os descontos autorizados antes de\n4/8/2022, data da vigência da Medida Provisória n. 1.132/2022,\nconvertida na Lei n. 14.509/2022, não se aplica limite específico para\nas consignações autorizadas em favor de terceiros, devendo ser observada\napenas a regra de que o militar das Forças Armadas não pode receber\nquantia inferior a trinta por cento da sua remuneração ou proventos,\napós os descontos, na forma do art. 14, § 3º, da Medida Provisória n.\n2.215-10/2001]. ([REsp\n2145185/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401805516)\n; [REsp\n2145550/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401829056))\n[]","refs":["1286"]},{"id":"rep_2025_1257","tema":"1257","texto":"TEMA 1257: As disposições da lei 14.230/2021 **são\naplicáveis aos processos em curso,<strong> para </strong>regular** o procedimento da\n<strong>tutela provisória de indisponibilidade de bens</strong>, de modo que as\nm<strong>edidas já deferidas poderão ser reapreciadas</strong> para fins de\n<strong>adequação</strong> à atual redação dada à lei 8.429/1992. ([REsp\n2074601/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301629390);\n[REsp\n2076137/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301834490)\n, [REsp\n2076911/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301740312),\n[REsp\n2078360/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301986729),\n[REsp\n2089767/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302758799))","refs":["1257"]},{"id":"rep_2025_1080","tema":"1080","texto":"TEMA 1080: 1. <strong>Não há direito adquirido</strong> a regime\njurídico relativo à assistência médico-hospitalar própria das forças\narmadas - benefício condicional, de natureza não previdenciária, diverso\nda pensão por morte e não vinculado a esta -, aos pensionistas ou\ndependentes de militares falecidos antes ou depois da vigência da lei\n13.954/2019; 2. A definição legal de \\'rendimentos do trabalho\nassalariado\\', referida no § 4º do art. 50 da lei 6880/1980, na sua\nredação original, inclui as \\'pensões, civis ou militares de qualquer\nnatureza\\', conforme expressamente estabelecido no art. 16, xi, da lei\n4506/1964; 3. A **administração militar tem o poder-dever de realizar a\nfiscalização e verificação periódica da manutenção dos requisitos à\nassistência médico-hospitalar,** nos termos da legislação e do\nregulamento, respeitado o devido processo legal, não se aplicando o\nprazo decadencial do artigo 54 da lei 9784/1999, ante a contrariedade à\nlei e afronta direta aos princípios da legalidade, moralidade e\neficiência, previstos no art. 37, caput, bem como o princípio da\nprobidade administrativa previsto no § 4º, além do art. 5º, ii, da\nconstituição da república; 4. Para aferição da dependência econômica, em\naplicação analógica do art. 198 do estatuto dos servidores públicos (lei\n8.112/1990): não se configura a dependência econômica para fins de\nassistência médico-hospitalar, quando o pretenso usuário perceber\nrendimento do trabalho ou de qualquer outra fonte, inclusive pensão ou\nprovento da aposentadoria, em valor igual ou superior ao salário-mínimo.\n([REsp\n1880238/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000769237)\n, [REsp\n1871942/PE,](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000967864)\n[REsp\n1880246/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000776682),\n[REsp\n1880241/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000769298)\n)","refs":["1080"]},{"id":"rep_2025_1292","tema":"1292","texto":"TEMA 1292: O Reconhecimento de Saberes e Competências\n(RSC), modo especial de cálculo da Retribuição por Titulação (RT), é\nextensível ao servidor do Magistério Federal Básico, Técnico e\nTecnológico aposentado antes da Lei 12.772/2012 e que tenha direito à\nparidade remuneratória constitucional. ([REsp\n2129995/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400867850);\n[REsp\n2129996/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400867898);\n[REsp\n2129997/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400867926))","refs":["1292"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2025_1371","tema":"1371","texto":"TEMA 1371: [1. A <strong>prerrogativa da Administração</strong>\nfazendária de promover o **procedimento administrativo de arbitramento\ndo valor venal** do imóvel transmitido decorre diretamente do Código\nTributário Nacional, em seu art. 148 (norma geral, de aplicação uniforme\nperante todos os entes federados). 2. A **legislação estadual tem plena\nliberdade<strong> para eleger o </strong>critério de apuração da base de cálculo do\nITCMD**. Não obstante, a prerrogativa de instauração do procedimento de\narbitramento, nos casos previstos no art. 148 do CTN, destinado à\napuração do valor do bem transmitido, em substituição ao critério\ninicial que se mostrou inidôneo a esse fim, a viabilizar o lançamento\ntributário, não implica em violação do direito estadual, tampouco pode\nser genericamente suprimida por decisão judicial. 3. O exercício da\n**prerrogativa do arbitramento dá-se pela instauração regular e prévia\nde procedimento individualizado,<strong> apenas quando as </strong>declarações, as\ninformações** ou os documentos apresentados pelo contribuinte,\nnecessários ao lançamento tributário, **mostrarem-se omissos ou não\nmerecerem fé à finalidade a que se destinam,** competindo à\n<strong>administração fazendária comprovar</strong> que a importância então alcançada\nencontra-se <strong>absolutamente fora do valor de mercado</strong>, observada,\n<strong>necessariamente, a ampla defesa e o contraditório</strong>. (][REsp\n2175094/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403803089);\n[REsp\n2213551/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402217793))","refs":["1371"]},{"id":"rep_2025_1304","tema":"1304","texto":"TEMA 1304: [**Não é possível excluir o ICMS, o PIS e a\nCOFINS da base de cálculo do IPI,** a partir do conceito de \\\"valor da\noperação\\\" inserto no art. 47, II, a, do CTN; e no art. 14, II, da Lei\nn. 4.502/1964. (REsp 2.119.311-SC; REsp 2.143.866-SP; REsp\n2.143.997-SP)]","refs":["1304"]},{"id":"rep_2025_1224","tema":"1224","texto":"TEMA 1224: É <strong>possível deduzir, da base de cálcul</strong>o\ndo Imposto de Renda da Pessoa Física - <strong>IRPF</strong>, os **valores vertidos a\ntítulo de contribuições extraordinárias<strong> para a </strong>entidade fechada de\nprevidênci<strong>a complementar, observando-se o </strong>limite de 12%** do total\ndos rendimentos computados na determinação da base de cálculo do imposto\ndevido na declaração de rendimentos, nos termos da Lei Complementar n.\n109/2001 e das Leis n. 9.250/1995 e 9.532/1997. ([REsp\n2043775/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203919642)\n; [REsp\n2050635/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300333797);\n[REsp\n2051367/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300408530))","refs":["1224"]},{"id":"rep_2025_1319","tema":"1319","texto":"TEMA 1319: É <strong>possível a dedução dos juros</strong> sobre\ncapital próprio (JCP) da <strong>base de cálculo do IRPJ e da CSLL</strong>, quando\napurados em <strong>exercício anterior</strong> ao da decisão assemblear que autoriza\no seu pagamento. ([REsp\n2162629/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402950930);\n[REsp\n2162248/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402927188);\n[REsp\n2163735/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403024181);\n[REsp\n2161414/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402873185))","refs":["1319"]},{"id":"rep_2025_1323","tema":"1323","texto":"TEMA 1323: [A adoção da **forma societária de\nresponsabilidade limitada<strong> pela </strong>sociedade uniprofissional não\nconstitui, por si só<strong>, </strong>impedimento<strong> ao regime de </strong>tributação\ndiferenciada<strong> do </strong>ISS** por alíquota fixa, nos termos do art. 9º, §§1º\ne 3º, do Decreto-Lei nº 406/1968, <strong>desde que</strong> observados\n<strong>cumulativamente</strong> os seguintes requisitos: (i) <strong>prestação pessoal</strong>\ndos serviços pelos sócios; (ii) <strong>assunção de responsabilidade</strong> técnica\nindividual; e (iii) <strong>inexistência de estrutura</strong> empresarial que\n<strong>descaracterize</strong> o caráter personalíssimo da atividade.] ([REsp\n2162486/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401448296)\n; [REsp\n2162487/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400791707))\n\n[","refs":["1323"]},{"id":"rep_2025_1350","tema":"1350","texto":"TEMA 1350: <strong>Não é possível</strong> à Fazenda Pública,\n<strong>ainda que</strong> antes da prolação da sentença de embargos, **substituir ou\nemendar<strong> a Certidão de Dívida Ativa (</strong>CDA<strong>) para </strong>incluir,\ncomplementar ou modificar o fundamento legal** do crédito\ntributário.] ([REsp\n2194708/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500310241);\n[REsp\n2194734/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500309981);\n[REsp\n2194706/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500310305)\n)\n\n<strong>TEMA 1273</strong>: [O <strong>prazo decadencial</strong> do art. 23 da Lei\n12.016/2009 <strong>não se aplica</strong> ao mandado de segurança cuja **causa de\npedir<strong> seja a </strong>impugnação de lei ou ato normativo<strong> que </strong>interfira em\nobrigações tributárias sucessivas<strong>, dado o </strong>caráter preventivo** da\nimpetração decorrente da ameaça atual, objetiva e permanente de\naplicação da norma impugnada.] ([REsp\n2103305/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202303718139);\n[REsp\n2109221/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304093390))\n(julgado em 10/09/2025)","refs":["1350","1273"]},{"id":"rep_2025_1342","tema":"1342","texto":"TEMA 1342: A <strong>remuneração</strong> decorrente do **contrato\nde aprendizagem<strong> (art. 428 da CLT) </strong>integra a base de cálculo** da\n<strong>contribuição previdenciária patronal,</strong> da Contribuição do Grau de\nIncidência de Incapacidade Laborativa decorrente dos Riscos Ambientais\ndo Trabalho (GIIL-RAT) e das contribuições a terceiros. ([REsp\n2191479/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403217423);\n[REsp\n2191694/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403542208))","refs":["1342"]},{"id":"rep_2025_1203","tema":"1203","texto":"TEMA 1203: O <strong>oferecimento de fiança bancária</strong> ou de\n<strong>seguro garantia,</strong> desde que corresponda ao **valor atualizado do\ndébito, acrescido de 30%** (trinta por cento), tem o efeito de\n<strong>suspender a exigibilidade</strong> do crédito <strong>não tributário</strong>, **não\npodendo<strong> o credor </strong>rejeitá-lo, salvo<strong> se demonstrar </strong>insuficiência,\ndefeito<strong> formal ou </strong>inidoneidade** da garantia oferecida. ([REsp\n2037787/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202466445);\n[REsp\n2007865/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201767674);\n[REsp\n2050751/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202964994))","refs":["1203"]},{"id":"rep_2025_1248","tema":"1248","texto":"TEMA 1248: Nas <strong>execuções fiscais</strong> fundadas numa\n<strong>única Certidão de Dívida Ativa,</strong> composta por **débitos de exercícios\ndiferentes do mesmo tributo<strong>, a </strong>determinação da alçada,** prevista no\nart. 34, caput e § 1º, da Lei n. 6.830/1980, **deverá considerar o total\nda dívida** constante do título executivo. ([REsp\n2077135/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301966849);\n[REsp\n2077138/R](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301966926)J;\n[REsp\n2077319/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301966724);\n[REsp\n2077461/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301950563))\n<strong>(FGV-TCE/PE-ANALISTA/2025)</strong>","refs":["1248"]},{"id":"rep_2025_1239","tema":"1239","texto":"TEMA 1239: <strong>Não incide</strong> a contribuição ao <strong>PIS</strong> e\na <strong>COFINS</strong> sobre as <strong>receitas advindas da prestação de serviço</strong> e da\n<strong>venda</strong> de <strong>mercadorias nacionais e nacionalizadas</strong>, a pessoas\n<strong>físicas e jurídicas,</strong> no âmbito da <strong>Zona Franca de Manaus.</strong> ([REsp\n2093050/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302426426)\n; [REsp\n2093052/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302472581);\n[REsp\n2152904/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402297147);\n[REsp\n2152381/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402259928);\n[REsp\n2152161/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402244805);\n[AREsp\n2613918/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401208561))","refs":["1239"]},{"id":"rep_2025_1283","tema":"1283","texto":"TEMA 1283: 1) É <strong>necessário</strong> que o **prestador de\nserviços turísticos<strong> esteja </strong>previamente inscrito** no CADASTUR,\nconforme previsto na Lei 11.771/2008, para que possa se **beneficiar da\nalíquota zero<strong> relativa ao </strong>PIS/COFINS, à CSLL e ao IRPJ,** instituído\npelo art. 4º da Lei 14.148/2021 no Programa Emergencial de Retomada do\nSetor de Eventos (PERSE); 2) O c<strong>ontribuinte optante pelo Simples</strong>\nNacional <strong>não pode se beneficiar da alíquota zero</strong> relativa ao\nPIS/COFINS, à CSLL e ao IRPJ, instituída pelo art. 4º da Lei 14.148/2021\nno Programa Emergencial de Retomada do Setor de Eventos (PERSE),\nconsiderando a vedação legal inserta no art. 24, § 1º, da LC 123/2006.\n([REsp\n2126428/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400098796);\n[REsp\n2126436/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400098784);\n[REsp\n2130054/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400865195);\n[REsp\n2138576/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401431190);\n[REsp\n2144064/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401723592);\n[REsp\n2144088/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401730558))","refs":["1283"]},{"id":"rep_2025_1290","tema":"1290","texto":"TEMA 1290: a) nas ações em que empregadores buscam\nrecuperar valores pagos a empregadas gestantes afastadas do trabalho\ndurante a pandemia de covid-19, a **legitimidade passiva ad causam recai\nsobre a fazenda nacional, e não sobre o inss;** b) os valores pagos às\nempregadas gestantes afastadas, inclusive às que não puderam trabalhar\nremotamente, durante a emergência de saúde pública da pandemia de\ncovid-19, possuem **natureza jurídica de remuneração regular, a cargo do\nempregador, não se configurando como salário-maternidade para fins de\ncompensação**. ([REsp\n2160674/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402817147),\n[REsp\n2153347/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402320311))","refs":["1290"]},{"id":"rep_2025_1158","tema":"1158","texto":"TEMA 1158: [O **credor fiduciário, antes da\nconsolidação<strong> da propriedade e da </strong>imissão** na posse no imóvel objeto\nda alienação fiduciária, <strong>não pode ser considerado sujeito passivo</strong> do\n<strong>IPTU</strong>, uma vez que <strong>não se enquadra</strong> em nenhuma das hipóteses\nprevistas no <strong>art. 34 do CT</strong>]<strong>N</strong>. ([REsp\n1949182/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102198666);\n[REsp\n1959212/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102882260);\n[REsp\n1982001/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200170570)\n)","refs":["1158"]},{"id":"rep_2025_1247","tema":"1247","texto":"TEMA 1247: O <strong>creditamento de IPI,</strong> estabelecido no\nart. 11 da Lei n. 9.779/1999,**decorrente da aquisição tributada de\nmatéria-prima, produto intermediário e material de embalagem**\nutilizados na industrialização, **abrange a saída de produtos isentos,\nsujeitos à alíquota zero e imunes**. ([REsp\n1976618/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202100896311);\n[REsp\n1995220/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200961218))","refs":["1247"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2025_1162","tema":"1162","texto":"TEMA 1162: [1. No <strong>regime anterior</strong> à vigência da MP\n871/2019, é <strong>possível a flexibilização do critério econômico</strong> para a\n<strong>concessão do auxílio-reclusão,</strong> <strong>ainda que a renda mensal</strong> do\nsegurado preso, quando do recolhimento à prisão, **supere o valor\nlegalmente fixado como critério de baixa renda,<strong> </strong>desde que o exceda\nem percentual ínfimo.<strong> </strong>2. A partir da vigência da MP 871/2019, não é\npossível a flexibilização** do limite máximo da renda bruta do segurado\npara a obtenção do benefício de auxílio-reclusão, calculado com base na\nmédia aritmética simples dos salários de contribuição apurados nos doze\nmeses anteriores ao mês do recolhimento à prisão, **exceto se o\nExecutivo não promover a correção anual<strong> do seu valor </strong>pelos mesmos\níndices** aplicados aos benefícios do Regime Geral de Previdência\nSocial. (][REsp\n1958361/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102829288);\n[REsp\n1971856/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202100932081);\n[REsp\n1971857/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101940052))","refs":["1162"]},{"id":"rep_2025_1291","tema":"1291","texto":"TEMA 1291: a) O **contribuinte individual não\ncooperado<strong> tem </strong>direito<strong> ao </strong>reconhecimento de tempo de atividade\nespecial<strong> exercido após a Lei n. 9.032/95, </strong>desde que comprove** a\n<strong>exposição</strong> a <strong>agentes nocivos</strong>. b) A <strong>exigência</strong> de\n<strong>comprovação</strong> da <strong>atividade especial</strong> por formulário emitido por\nempresa <strong>não se aplica a contribuintes individuais.</strong> ([REsp\n2163429/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403002701);\n[REsp\n2163998/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403013352))","refs":["1291"]},{"id":"rep_2025_1238","tema":"1238","texto":"TEMA 1238: **Não é possível o cômputo do período de\naviso<strong> prévio indenizado como </strong>tempo de serviço para fins\nprevidenciários.** (REsp 2.068.311-RS; REsp 2.070.015-RS; REsp\n2.069.623-SC)","refs":["1238"]},{"id":"rep_2025_1090","tema":"1090","texto":"TEMA 1090: I - A informação no Perfil Profissiográfico\nPrevidenciário (PPP) sobre a existência de equipamento de proteção\nindividual (EPI) descaracteriza, em princípio, o tempo especial,\nressalvadas as hipóteses excepcionais nas quais, mesmo diante da\ncomprovada proteção, o direito à contagem especial é reconhecido. II -\nIncumbe ao autor da ação previdenciária o ônus de comprovar: (i) a\nausência de adequação ao risco da atividade; (ii) a inexistência ou\nirregularidade do certificado de conformidade; (iii) o descumprimento\ndas normas de manutenção, substituição e higienização; (iv) a ausência\nou insuficiência de orientação e treinamento sobre o uso adequado,\nguarda e conservação; ou (v) qualquer outro motivo capaz de conduzir à\nconclusão da ineficácia do EPI. III - Se a valoração da prova concluir\npela presença de divergência ou de dúvida sobre a real eficácia do EPI,\na conclusão deverá ser favorável ao autor. ([REsp\n2082072/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302207743)\n; [REsp\n1828606/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201902181098);\n[REsp\n2080584/PR;](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302136890)\n[REsp\n2116343/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304552422))","refs":["1090"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2025_1137","tema":"1137","texto":"TEMA 1137: [Nas <strong>execuções cíveis,</strong> submetidas\n<strong>exclusivamente ao Código de Processo Civil,</strong> a adoção judicial de\n<strong>meios executivos atípicos é cabível desde que, cumulativamente</strong>: i)\nsejam <strong>ponderados os princípios da efetividade e da menor onerosidade</strong>\ndo executado; ii) seja realizada de modo **prioritariamente\nsubsidiário;<strong> iii) a decisão contenha </strong>fundamentação adequada às\nespecificidades** do caso; iv) sejam observados os princípios do\n<strong>contraditório, da proporcionalidade, da razoabilidade</strong>, inclusive\nquanto à sua vigência temporal.] ([REsp\n1955539/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102575119);\n[REsp\n1955574/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102576801)\n)","refs":["1137"]},{"id":"rep_2025_1317","tema":"1317","texto":"TEMA 1317: A **extinção dos embargos à execução\nfiscal<strong> em face da </strong>desistência ou da renúncia do direito**\nmanifestada para fins de <strong>adesão a programa de recuperação fiscal</strong> em\nque <strong>já inserida a verba honorária</strong> pela cobrança da dívida pública\n<strong>não enseja nova condenação</strong> em honorários advocatícios. ([REsp\n2158358/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402646011);\n[REsp\n2158602/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402665763))","refs":["1317"]},{"id":"rep_2025_1178","tema":"1178","texto":"TEMA 1178: i) É <strong>vedado</strong> o uso de **critérios\nobjetivos<strong> para o </strong>indeferimento imediato<strong> da </strong>gratuidade**\njudiciária requerida por <strong>pessoa natural;</strong> ii) Verificada a existência\nnos autos de <strong>elementos</strong> aptos a **afastar a presunção de\nhipossuficiência econômica<strong> da pessoa natural, o </strong>juiz deverá**\ndeterminar ao requerente a <strong>comprovação</strong> de sua condição, **indicando\nde modo preciso<strong> as </strong>razões** que justificam tal afastamento, nos\ntermos do art. 99, § 2º, do CPC; iii) <strong>Cumprida a diligência,</strong> a\nadoção de <strong>parâmetros objetivos</strong> pelo magistrado <strong>pode</strong> ser\nrealizada em caráter <strong>meramente suplementar</strong> e <strong>desde que não</strong> sirva\n<strong>como fundamento exclusivo</strong> para o <strong>indeferimento</strong> do pedido de\ngratuidade. ([REsp\n1988687/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200611855);\n[REsp\n1988697/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200611880);\n[REsp\n1988686/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200611590)\n)","refs":["1178"]},{"id":"rep_2025_1309","tema":"1309","texto":"TEMA 1309: [Os **sucessores do servidor falecido\nantes<strong> da propositura da </strong>ação<strong> coletiva </strong>não<strong> </strong>são beneficiados**\npela decisão transitada em julgado que condena ao **pagamento de\ndiferenças, salvo se expressamente contemplados**.] ([REsp\n2144140/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401727220);\n[REsp\n2147137/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401934881))","refs":["1309"]},{"id":"rep_2025_1300","tema":"1300","texto":"TEMA 1300: Nas ações em que o **participante contesta\nsaques em sua conta individualizada do PASEP<strong>, o </strong>ônus de provar**\ncabe: a) ao <strong>participante</strong>, quanto aos saques sob as formas de\n<strong>crédito em conta e de pagamento por Folha de Pagamento</strong>\n(PASEP-FOPAG), por ser fato <strong>constitutivo</strong> de seu direito, na forma do\nart. 373, I, do CPC, sendo <strong>incabível a inversão</strong> (art. 6º, VIII,do\nCDC) ou a <strong>redistribuição</strong> (art. 373, § 1º, do CPC) do ônus da prova;\nb) <strong>ao réu</strong>, quanto aos saques sob a forma de **saque em caixa das\nagências do BB<strong>, por ser fato </strong>extintivo<strong> do </strong>direito do autor,** na\nforma do art. 373, II, do CPC. []([REsp\n2162222/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402921861);\n[REsp\n2162223/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402922923)\n; [REsp\n2162198/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402922757);\n[REsp\n2162323/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402922290))","refs":["1300"]},{"id":"rep_2025_1279","tema":"1279","texto":"TEMA 1279: Nas ações de <strong>busca e apreensão</strong> de\n<strong>bens alienados fiduciariamente</strong>, o prazo de <strong>5 dias</strong> para\n<strong>pagamento da integralidade da dívida pendente,</strong> previsto no art. 3º,\n§ 1º, do Decreto-Lei n. 911/69, começa a fluir **a partir da data da\nexecução da medida liminar.** ([REsp\n2126264/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302390914))","refs":["1279"]},{"id":"rep_2025_1313","tema":"1313","texto":"TEMA 1313: Nas <strong>demandas</strong> em que se pleiteia do\nPoder Público a <strong>satisfação do direito à saúde,</strong> os <strong>honorários</strong>\nadvocatícios são fixados por <strong>apreciação equitativa</strong>, sem aplicação do\nart. 85, § 8º-A, do CPC. ([REsp\n2169102/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403378344);\n[REsp\n2166690/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202403227165))","refs":["1313"]},{"id":"rep_2025_1311","tema":"1311","texto":"TEMA 1311: O <strong>curso do prazo prescricional</strong> da\n<strong>obrigação de pagar quantia certa</strong> pela <strong>fazenda</strong> pública **não\nsuspenso** durante o cumprimento da obrigação de implantar em folha de\npagamento imposta na mesma sentença. ([REsp\n2057984/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300850043);\n[REsp\n2139074/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401458410))\n\nTEMA 1261: I) a **exceção à impenhorabilidade\ndo bem de família<strong> nos casos de </strong>execução de hipoteca sobre o\nimóvel,** oferecido como garantia real pelo casal ou pela entidade\nfamiliar, prevista no art. 3º, V, da Lei n. 8.009/1990, **restringe-se\nàs hipóteses em que a dívida foi constituída em benefício da entidade\nfamiliar<strong>: II) em relação ao ônus da prova, a) </strong>se o bem for dado em\ngarantia real por um dos sócios<strong> de pessoa jurídica, é, em </strong>regra,\nimpenhorável,<strong> cabendo ao </strong>credor o ônus de comprovar que o débito da\npessoa jurídica se reverteu em benefício da entidade familiar**; e b)\ncaso os <strong>únicos sócios</strong> da sociedade sejam os **titulares do imóvel\nhipotecado<strong>, a </strong>regra é da penhorabilidade** do bem de família,\ncompetindo aos <strong>proprietários demonstrar</strong> que o <strong>débito</strong> da pessoa\njurídica <strong>não se reverteu em benefício da entidade familiar.</strong> ([REsp\n2093929/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202303075450);\n[REsp\n2105326/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302688175))\n\n[","refs":["1311","1261"]},{"id":"rep_2025_1265","tema":"1265","texto":"TEMA 1265: Nos casos em que da **Exceção de\nPré-Executividade resultar,<strong> tão somente, a </strong>exclusão do excipiente do\npolo passivo da Execução Fiscal,<strong> os </strong>honorários** advocatícios\ndeverão ser fixados <strong>por apreciação equitativa</strong>, nos moldes do art.\n85, § 8º, do CPC/2015, porquanto **não há como se estimar o proveito\neconômico** obtido com o provimento jurisdicional]. ([REsp\n2097166/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202303338151);\n[REsp\n2109815/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202304129357))\n(JULGADO EM 14/05/2025)","refs":["1265"]},{"id":"rep_2025_1267","tema":"1267","texto":"TEMA 1267: 1. A <strong>decisão do juiz</strong> de primeiro grau\nque **obsta o processamento da apelação viola o § 3º do artigo 1.010 do\nCPC<strong>, caracterizando </strong>usurpação da competência do Tribunal**, o que\n<strong>autoriza o manejo da reclamação</strong> prevista no inciso I do artigo 988\ndo CPC; 2. Na hipótese em que o **juiz da causa negar seguimento à\napelação no âmbito de execução ou de cumprimento de sentença**, também\nserá <strong>cabível agravo de instrumento,</strong> por força do disposto no\nparágrafo único do artigo 1.015 do CPC. ([REsp\n2072867/MA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300569704);\n[REsp\n2072868/MA;](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300569918)\n[REsp\n2072870/MA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300571691))","refs":["1267"]},{"id":"rep_2025_1282","tema":"1282","texto":"TEMA 1282: O <strong>pagamento de indenização</strong> por sinistro\n<strong>não gera</strong> para a <strong>seguradora a sub-rogação</strong> de <strong>prerrogativas</strong>\nprocessuais dos <strong>consumidores</strong>, em especial quanto à competência na\nação regressiva. ([REsp\n2092308/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302967070);\n[REsp\n2092310/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302967450);\n[REsp\n2092311/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302967336))","refs":["1282"]},{"id":"rep_2025_1198","tema":"1198","texto":"TEMA 1198: [Constatados **indícios de litigância\nabusiva, o juiz pode<strong> exigir, de modo </strong>fundamentado** e com\nobservância à <strong>razoabilidade</strong> do caso concreto, a <strong>emenda</strong> da\npetição <strong>inicial</strong> a fim de demonstrar o **interesse de agir e a\nautenticidade da postulação**, respeitadas as regras de distribuição do\nônus da prov]a. ([REsp\n2021665/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202627536))\n<strong>(FGV-TRF5-JUIZ/2025)</strong>\n\n[","refs":["1198"]},{"id":"rep_2025_1131","tema":"1131","texto":"TEMA 1131: Nas ações relacionadas ao tema repetitivo\n928/STJ, a citação válida do Estado do Paraná e da Faculdade Vizivali\ntem o condão de <strong>interromper</strong> a prescrição também em relação à união,\ncom efeitos <strong>retroativos</strong> à data da propositura da ação. Esse\nentendimento aplica-se inclusive aos casos em que a citação da União\ntenha ocorrido após o decurso de cinco anos desde o ajuizamento da\ndemanda, quando essa demora for imputável exclusivamente ao poder\njudiciário, em razão do reconhecimento, no curso do processo, da\nnecessidade de formação de litisconsórcio passivo necessário.]\n([REsp\n1962118/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101657350),\n[REsp\n1976624/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101933756))\n(JULGADO EM 14/05/2025)","refs":["1131"]},{"id":"rep_2025_1201","tema":"1201","texto":"TEMA 1201: 1) O <strong>agravo</strong> interposto contra **decisão\ndo Tribunal de origem, ainda que<strong> com o objetivo de </strong>exaurir a\ninstância recursal<strong> ordinária, a fim de </strong>permitir** a interposição de\n<strong>recurso especial e/ou extraordinário</strong>, quando apresentado **contra\ndecisão baseada em precedente qualificado<strong> oriundo do </strong>STJ ou do STF,\nautoriza<strong> a aplicação da </strong>multa<strong> prevista no </strong>art. 1.021, § 4º,** do\nCPC (revisão do Tema Repetitivo 434/STJ); 2) A <strong>multa</strong> prevista no\nart. 1.021, § 4º, CPC, <strong>não é cabível quando</strong> (i) alegada\nfundamentadamente a <strong>distinção ou a superação do precedente</strong>\nqualificado oriundo do STJ ou do STF ou (ii) a <strong>decisão agravada</strong>\nestiver <strong>amparada</strong> em <strong>julgado</strong> de <strong>tribunal de segundo grau;</strong> 3)\n<strong>Excetuadas as hipóteses</strong> supra, caberá ao **órgão colegiado verificar\na aplicação da multa**, considerando-se as peculiaridades do caso\nconcreto. ([REsp\n2043826/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203929638)\n; [REsp\n2043887/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203940943)\n; [REsp\n2044143/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203929626);\n[REsp\n2006910/PA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201710568)\n) (INFO 857)","refs":["1201"]}]},"2024":{"DIREITO PROCESSUAL PENAL":[{"id":"rep_2024_1165","tema":"1165","texto":"TEMA 1165: [A <strong>decisão</strong> que **defere a progressão de\nregime não tem natureza constitutiva,<strong> senão </strong>declaratória**. O\n<strong>termo inicial</strong> para a progressão de regime deverá ser a **data em que\npreenchidos os requisitos objetivo e subjetivo** descritos no art. 112\nda Lei 7.210, de 11/07/1984 (Lei de Execução Penal), e **não a data em\nque efetivamente foi deferida** a progressão. Essa data deverá ser\ndefinida de forma casuística, fixando-se como **termo inicial o momento\nem que preenchido o último requisito** pendente, seja ele o objetivo ou\no subjetivo. Se por último for preenchido o requisito subjetivo,\nindependentemente da anterior implementação do requisito objetivo, será\naquele (o subjetivo) o marco para fixação da data-base para efeito de\nnova progressão de regime.] ([REsp\n1972187/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103727469);\n[REsp\n1976210/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103855043);\n[REsp\n1973105/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103744332);\n[REsp\n1973589/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103778325);\n[REsp\n1976197/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103854361))","refs":["1165"]},{"id":"rep_2024_1098","tema":"1098","texto":"TEMA 1098: 1 - O Acordo de Não Persecução Penal\nconstitui um <strong>negócio jurídico processual penal</strong> instituído por norma\nque possui <strong>natureza processual,</strong> no que diz respeito à\n**possibilidade de composição entre as partes com o fim de evitar a\ninstauração da ação penal,<strong> e, de outro lado, </strong>natureza material** em\nrazão da **previsão de extinção da punibilidade de quem cumpre os\ndeveres** estabelecidos no acordo (art. 28-A, § 13, do Código de\nProcesso Penal CPP). 2 - Diante da <strong>natureza híbrida</strong> da norma, a ela\n**deve se aplicar o princípio da retroatividade da norma penal\nbenéfica<strong> (art. 5º, XL, da CF), pelo que é </strong>cabível a celebração de\nAcordo<strong> de Não Persecução Penal em casos de </strong>processos em andamento**\nquando da <strong>entrada em vigor da Lei n. 13.964/2019</strong>, m**[esmo se\nausente confissão do réu até aquele momento], desde que** o\n<strong>pedido</strong> tenha sido feito **antes do trânsito em julgado da\ncondenação.<strong> 3 - Nos </strong>processos penais em andamento em 18/09/2024**\n(data do julgamento do HC n. 185.913/DF, pelo Plenário do Supremo\nTribunal Federal), nos quais <strong>seria cabível em tese o ANPP,</strong> mas ele\n<strong>não chegou a ser oferecido</strong> pelo Ministério Público **ou não houve\njustificativa idônea<strong> para o seu não oferecimento, o </strong>Ministério\nPúblico<strong>, agindo </strong>de ofício, a pedido** da defesa ou mediante\n<strong>provocação</strong> do magistrado da causa, <strong>deverá</strong>, na primeira\noportunidade em que falar nos autos, <strong>manifestar-se motivadamente</strong>\nacerca do cabimento ou não do acordo no caso concreto. 4 - Nas\n<strong>investigações ou ações</strong> penais iniciadas <strong>a partir de 18/09/2024</strong>,\nserá **admissível a celebração de ANPP antes do recebimento da\ndenúncia<strong>, ressalvada a </strong>possibilidade** de\npropositura do acordo, <strong>no curso</strong> da ação penal, se for o caso. ([REsp\n1890344/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002091040)\n; [REsp\n1890343/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002090470))\n<strong>(FGV-TRF3-JUIZ/2025) (FGV-TJCE-JUIZ/2025)</strong>","refs":["1098"]},{"id":"rep_2024_1196","tema":"1196","texto":"TEMA 1196: É <strong>válida</strong> a **aplicação retroativa do\npercentual de 50%** (cinquenta por cento), para fins de progressão de\nregime, a <strong>condenado por crime hediondo, com resultado morte,</strong> que\nseja <strong>reincidente genérico,</strong> nos moldes da alteração legal promovida\npela Lei n. 13.964/2019 no art. 112, inc. VI, alínea a, da Lei n.\n7.210/84 (Lei de Execução Penal), bem como a **posterior concessão do\nlivramento condicional,** podendo ser formulado posteriormente com base\nno art. 83, inc. V, do Código Penal, o que **não configura combinação de\nleis** na aplicação retroativa de norma penal material mais benéfica.\n(REsp 2.012.101-MG; REsp 2.012.112-MG; REsp 2.016.358-MG)","refs":["1196"]},{"id":"rep_2024_1214","tema":"1214","texto":"TEMA 1214: [É <strong>obrigatória</strong> a **redução proporcional\nda pena-base<strong> quando o tribunal de segunda instância, em </strong>recurso\nexclusivo da defesa**, afastar circunstância judicial negativa\nreconhecida na sentença. Todavia, **não implica reformatio in pejus a\nmera correção da classificação** de um fato já valorado negativamente\npela sentença para enquadrá-lo como outra circunstância judicial, **nem\no simples reforço de fundamentação** para manter a valoração negativa de\ncircunstância já reputada desfavorável na sentença.] ([REsp\n2058976/M](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300843229);\n[REsp\n2058970/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300842927)\n; [REsp\n2058971/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300843064)\n)","refs":["1214"]},{"id":"rep_2024_1219","tema":"1219","texto":"TEMA 1219: [É <strong>adequada</strong> a aplicação do princípio da\n<strong>fungibilidade</strong> recursal aos casos em que, embora **cabível recurso em\nsentido estrito<strong>, a </strong>parte<strong> impugna a decisão mediante </strong>apelação ou\nvice-versa**, desde que observados a\n<strong>tempestividade</strong> e os demais <strong>pressupostos de admissibilidade</strong> do\nrecurso cabível, na forma do art. 579, caput e parágrafo único, do\nCódigo de Processo Penal. (][REsp\n2082481/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302240163))","refs":["1219"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2024_1101","tema":"1101","texto":"TEMA 1101: [I - Desde que expressamente previstos na\nsentença coletiva que determina a recomposição dos índices\ninflacionários expurgados, **o termo final de incidência de juros\nremuneratórios** sobre a parcela da conta poupança resultante da\nrecomposição do índice expurgado é a **data de encerramento da conta ou\naquela em que passa a ter saldo zero, o que primeiro ocorrer**. II -\nCabe ao <strong>banco depositário a comprovação dessas datas</strong>, sob pena de se\nadotar como termo final a data da citação na ação civil pública que\noriginou o cumprimento de sentença. (REsp 1.877.300-SP; REsp\n1.877.280-SP)]","refs":["1101"]},{"id":"rep_2024_1232","tema":"1232","texto":"TEMA 1232: Nos termos do art. 25 da Lei n.\n12.016/2009, <strong>não se revela cabível</strong> a fixação de honorários de\nsucumbência em cumprimento de sentença proferida em mandado de segurança\nindividual, <strong>ainda que</strong> dela resultem efeitos patrimoniais a serem\nsaldados dentro dos mesmos autos. ([REsp\n2053306/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300492852);\n[REsp\n2053311/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300493243)\n; [REsp\n2053352/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300494847))","refs":["1232"]},{"id":"rep_2024_1234","tema":"1234","texto":"TEMA 1234: [É <strong>ônus do executado</strong> provar que a\n<strong>pequena propriedade rural é explorada pela família</strong> para fins de\nreconhecimento de sua <strong>impenhorabilidade</strong>.] ([REsp\n2080023/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302072019);\n[REsp\n2091805/GO](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302035670))","refs":["1234"]},{"id":"rep_2024_7__IAC_","tema":"7 (IAC)","texto":"TEMA 7 (IAC): : Diante da conexão existente entre as\nações populares que possuem como objeto litigioso a privatização da\nCompanhia Vale do Rio Doce, ainda que sob os mais diversos pretextos\n(conforme se verifica das razões de decidir no CC 19.686/DF, STJ), a\nsuperveniência de sentença transitada em julgado em uma delas (REO\n2002.01.00.034012-6; TRF 1ª Região) possui eficácia de coisa julgada\noponível \\\"erga omnes\\\", nos termos do art. 18 da Lei 4.717/65, motivo\npelo qual a parte dispositiva deve recair sobre todas as ações populares\nque possuem o mesmo objeto. (REsp 1806016/PA e REsp 1806608/PA)","refs":["7"]},{"id":"rep_2024_769","tema":"769","texto":"TEMA 769: I - A <strong>necessidade de esgotamento</strong> das\ndiligências como requisito para a penhora do faturamento **foi\nafastada** após a reforma do CPC/1973 pela Lei n. 11.382/2006. II - No\nregime do CPC/2015, a penhora do faturamento, listada em décimo lugar na\nordem preferencial de bens passíveis de constrição judicial, **poderá\nser deferida após<strong> a </strong>demonstração da inexistência dos bens\nclassificados em posição superior,** ou,\nalternativamente, se houver constatação, pelo juiz, de que **tais bens\nsão de difícil alienação<strong>; finalmente, a </strong>constrição judicial sobre o\nfaturamento empresarial** poderá ocorrer [sem a\nobservância da ordem] de classificação estabelecida em lei,\nse a <strong>autoridade</strong> judicial, conforme as circunstâncias do caso\nconcreto, <strong>assim o entender</strong> (art. 835, § 1º, do CPC/2015),\njustificando-a por decisão devidamente <strong>fundamentada</strong>. III - A penhora\nde faturamento <strong>não pode ser equiparada à constrição</strong> sobre dinheiro.\nIV - Na aplicação do princípio da <strong>menor onerosidade</strong> (art. 805 e\nparágrafo único do CPC/2015; art. 620 do CPC/1973): a) a autoridade\njudicial <strong>deverá estabelecer percentual</strong> que <strong>não inviabilize</strong> o\nprosseguimento das atividades empresariais; e b) a decisão deve se\nreportar aos <strong>elementos probatórios concretos</strong> trazidos pelo devedor,\n<strong>não sendo lícito</strong> à autoridade judicial [empregar o referido\nprincípio em abstrato] ou com base em simples [alegações\ngenéricas] do executado. (REsp 1.835.864-SP; REsp\n1.666.542-SP; REsp 1.835.865-SP)","refs":["769"]},{"id":"rep_2024_1059","tema":"1059","texto":"TEMA 1059: A majoração dos honorários de sucumbência\nprevista no art. 85, § 11, do CPC pr[essupõe que o recurso tenha sido\nintegralmente desprovido ou não conhecido pelo tribunal,\nmonocraticamente ou pelo órgão colegiado compete]nte. [Não se\naplica o art. 85, § 11, do CPC em caso de provimento total ou parcial do\nrecurso], <strong>ainda que</strong> mínima a alteração do resultado do\njulgamento ou limitada a consectários da condenação. (REsp 1865553/PR;\nREsp 1865223/SC e REsp 1864633/RS).","refs":["1059"]},{"id":"rep_2024_1130","tema":"1130","texto":"TEMA 1130: [A <strong>eficácia</strong> do <strong>título</strong> judicial\nresultante de <strong>ação coletiva</strong> promovida por **sindicato de âmbito\nestadual<strong> está </strong>restrita<strong> aos </strong>integrantes da categoria**\nprofissional, filiados ou não, com **domicílio\nnecessário<strong> (art. 76, parágrafo único, do Código Civil) na </strong>base\nterritorial<strong> da entidade sindical </strong>autora e** àqueles\n<strong>em exercício provisório ou em missão em outra localidade</strong>.]\n([REsp\n1966058/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103353514);\n[REsp\n1966059/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103354156);\n[REsp\n1966060/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103354210)\n; [REsp\n1966064/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103354282)\n; [REsp\n1968286/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103353462)\n; [REsp\n1968284/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103354358))\n<strong>(VUNESP-PREF DE ITATIBA/SP-ANALISTA DE PROCURADORIA/2025)</strong>","refs":["1130"]},{"id":"rep_2024_1153","tema":"1153","texto":"TEMA 1153: [A <strong>verba honorária sucumbencial</strong>, a\ndespeito da sua <strong>natureza alimenta</strong>r, <strong>não se enquadra na exceção</strong>\nprevista no § 2º do art. 833 do CPC/2015 (penhora para pagamento de\nprestação alimentícia).] ([REsp\n1954380/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102464105);\n[REsp\n1954382/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102464558))","refs":["1153"]},{"id":"rep_2024_1190","tema":"1190","texto":"TEMA 1190: Na <strong>ausência de impugnação</strong> à pretensão\nexecutória, <strong>não são devidos honorários advocatícios sucumbenciais</strong> em\ncumprimento de sentença contra a Fazenda Pública, <strong>ainda que</strong> o\ncrédito esteja submetido a pagamento por meio de Requisição de Pequeno\nValor - <strong>RPV</strong>. (REsp 2.029.636-SP; REsp 2.029.675-SP; REsp\n2.030.855-SP; REsp 2.031.118-SP) **[(FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024)] (FGV-TJPE-JUIZ/2024)**","refs":["1190"]},{"id":"rep_2024_1193","tema":"1193","texto":"TEMA 1193: O <strong>arquivamento</strong> das **execuções\nfiscais** cujo valor seja inferior ao novo piso fixado no caput do art.\n8º da Lei 12.541/2011, previsto no § 2º do artigo referido (acrescentado\npela Lei 14.195/2021), o qual constitui norma de natureza processual,\nque deve ser aplicada de imediato, **alcança os executivos fiscais em\ncurso,<strong> </strong>ressalvados<strong> os casos em que </strong>concretizada a penhora.**\n([REsp\n2058331/R](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300603733);\n[REsp\n2031023/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203154991);\n[REsp\n2029972/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203139861)\n; [REsp\n2029970/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203112710);\n[REsp\n2030253/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203114830)\n)\n\n\\[Acórdão republicado em 23/10/2024 tendo em vista erro material na\nementa. Vide TEMA 696/STJ (Tese fixada: \\\"Discussão quanto à aplicação\nimediata do art. 8º da Lei nº 12.514/11 (\\\"Os Conselhos não executarão\njudicialmente dívidas referentes a anuidades inferiores a 4 (quatro)\nvezes o valor cobrado anualmente da pessoa física ou jurídica\ninadimplente \\\") às execuções propostas antes de sua entrada em\nvigor\\\").\\]","refs":["1193","696"]},{"id":"rep_2024_1217","tema":"1217","texto":"TEMA 1217: [É <strong>válido</strong> o ato jurídico de\ncancelamento automático de precatórios ou requisições federais de\npequeno valor realizados entre 06/07/2017 (data da publicação da Lei\n13.463/2017) e 06/07/2022 (data da publicação da ata da sessão de\njulgamento da ADI 5.755/DF), nos termos do art. 2º, caput, e § 1º, da\nLei 13.463/2017, desde que caracterizada a inércia do credor em proceder\nao levantamento do depósito pelo prazo legalmente estabelecido (dois\nanos). É ilegal esse mesmo ato se circunstâncias alheias à vontade do\ncredor impediam, ao tempo do cancelamento, o levantamento do valor\ndepositado.] (REsp 2.045.191-DF; REsp 2.045.193-DF)","refs":["1217"]},{"id":"rep_2024_1229","tema":"1229","texto":"TEMA 1229: À luz do **princípio da\ncausalidade,<strong> </strong>não cabe fixação de honorários** advocatícios quando a\n<strong>exceção de pré-executividade é acolhida</strong> para **extinguir a execução\nfiscal<strong> em razão do reconhecimento da </strong>prescrição intercorrente,**\nprevista no art. 40 da Lei n. 6.830/1980. ([REsp\n2046269/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300028820);\n[REsp\n2050597/RO](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203969460);\n[REsp\n2076321/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301424335))\n(RE PENDENTE)","refs":["1229"]},{"id":"rep_2024_1235","tema":"1235","texto":"TEMA 1235: [A <strong>impenhorabilidade</strong> de quantia\n<strong>inferior a 40 salários mínimos</strong> (art. 833, X, do CPC) **não é matéria\nde ordem pública** e não pode ser reconhecida de ofício pelo juiz,\n<strong>devendo ser arguida pelo executado</strong> no primeiro momento em que lhe\ncouber falar nos autos ou em sede de embargos à execução ou impugnação\nao cumprimento de sentença, <strong>sob pena de preclusão</strong>.] ([REsp\n2061973/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301160825);\n[REsp\n2066882/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301319368))","refs":["1235"]},{"id":"rep_2024_1245"
