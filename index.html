,"tema":"1245","texto":"TEMA 1245: Nos termos do art. 535, § 8º, do CPC, é\nadmissível o ajuizamento de <strong>Ação Rescisória</strong> para\n<strong>adequar julgado</strong> realizado antes de 13.05.2021 à modulação de efeitos\nestabelecida no Tema 69/STF - Repercussão Geral. ([REsp\n2054759/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300574482);\n[REsp\n2066696/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301102687))","refs":["69","1245"]},{"id":"rep_2024_1253","tema":"1253","texto":"TEMA 1253: A **extinção do cumprimento de sentença\ncoletiva** proposto pelo legitimado extraordinário, por prescrição\nintercorrente, <strong>não impede</strong> a execução individual do mesmo título.\n(REsp 2078485/PE, REsp 2078989/PE, REsp 2078993/PE e REsp 2079113/PE)","refs":["1253"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2024_986","tema":"986","texto":"TEMA 986: A Tarifa de Uso do Sistema de Transmissão\n(TUST) e/ou a Tarifa de Uso de Distribuição (TUSD), quando lançada na\nfatura de energia elétrica, como encargo a ser suportado diretamente\npelo consumidor final (seja ele livre ou cativo), integra, para os fins\ndo art. 13, § 1º, II, \\'a\\', da LC 87/1996, a base de cálculo do ICMS.\n(REsp 1692023/MT, REsp 1699851/TO, REsp 1734902/SP e REsp 1734946/SP)","refs":["986"]},{"id":"rep_2024_997","tema":"997","texto":"TEMA 997: O estabelecimento de **teto para adesão ao\nparcelamento simplificado**, por constituir medida de gestão e\neficiência na arrecadação e recuperação do crédito público, pode ser\n<strong>feito por ato infralegal,</strong> nos termos do art. 96 do CTN.\n<strong>Excetua-se</strong> a hipótese em que a <strong>lei</strong> em sentido restrito **definir\ndiretamente o valor máximo** e a autoridade administrativa, na\nregulamentação da norma, fixar quantia inferior à estabelecida na lei,\nem prejuízo do contribuinte. (REsp 1.679.536-RN; REsp 1.728.239-SC; REsp\n1.724.834-SC)","refs":["997"]},{"id":"rep_2024_1125","tema":"1125","texto":"TEMA 1125: O ICMS-ST <strong>não compõe</strong> a base de cálculo\nda Contribuição ao PIS e da COFINS devidas pelo contribuinte substituído\nno regime de substituição tributária progressiva. REsp 1896678/RS e REsp\n1958265/SP. (REsp 1.896.678-RS; REsp 1.958.265-SP)\n\n\\[MODULAÇÃO DE EFEITOS: na linha da orientação do Supremo\nTribunal Federal, firmada no julgamento da Tese 69 da repercussão geral,\ne considerando a inexistência de julgados no sentido aqui proposto,\nconforme o panorama jurisprudencial descrito neste voto, impõe-se\nmodular os efeitos desta decisão, a fim de que sua produção ocorra a\npartir da publicação da ata do julgamento no veículo oficial de\nimprensa, ressalvadas as ações judiciais e os procedimentos\nadministrativos em curso. (Acórdão publicado no DJe de 28/02/2024)\n\nEm acórdão publicado no DJe de 26/06/2024, no Recurso Especial n.\n1.958.265/SP, a Primeira Seção, acolheu parcialmente os embargos de\ndeclaração para esclarecer que a modulação dos efeitos da presente tese\nterá como marco 15/03/2017, data do julgamento do Tema 69 do STF.\\]","refs":["69","1125"]},{"id":"rep_2024_1134","tema":"1134","texto":"TEMA 1134: Diante do disposto no art. 130, parágrafo\núnico, do Código Tributário Nacional, é <strong>inválida</strong> a previsão em\nedital de leilão atribuindo <strong>responsabilidade ao arrematante</strong> pelos\n<strong>débitos tributários</strong> que j<strong>á incidiam sobre o imóvel</strong> na data de\nsua alienação. (REsp 1.914.902-SP; REsp 1.944.757-SP; REsp 1.961.835-SP)\n(INFO 829) **(FGV-PREF DE CUIABÁ/MT-AUDITOR FISCAL/2024)\n(FGV-TJSE-JUIZ/2025) (FGV-TRF5-JUIZ/2025)**\n\n\\[[MODULAÇÃO DE EFEITOS: \\\"Nesse cenário, considerando os princípios da\nsegurança jurídica, da proteção da confiança e da isonomia e observadas\nas modulações de efeitos das decisões do Supremo Tribunal Federal e do\nSuperior Tribunal de Justiça (\\...), proponho que, por aplicação\nanalógica do art. 1.035, § 11º, do CPC/2015, a tese repetitiva ora\nfixada seja observada pelos editais de leilão publicizados após a\npublicação da ata de julgamento do presente recurso, ressalvadas as\nações judiciais e/ou pedidos administrativos pendentes de apreciação,\npara os quais a tese se aplica de imediato. **(Acórdão publicado no DJe\nde 24/10/2024)\\]**]","refs":["1134"]},{"id":"rep_2024_1174","tema":"1174","texto":"TEMA 1174: As parcelas relativas ao vale-transporte,\nvale-refeição/alimentação, plano de assistência à saúde (auxílio-saúde,\nodontológico e farmácia), ao Imposto de Renda retido na fonte (IRRF) dos\nempregados e à contribuição previdenciária dos empregados, **descontadas\nna folha de pagamento<strong> do trabalhador, constituem </strong>simples técnica de\narrecadação ou de garantia para recebimento do credor,<strong> e </strong>não\nmodificam<strong> o </strong>conceito de salário ou de salário contribuição**, e,\nportanto, não modificam a <strong>base de cálculo</strong> da contribuição\nprevidenciária patronal, do SAT <strong>e da contribuição de terceiros</strong>. REsp\n2005029/SC, REsp 2005087/PR, REsp 2005289/SC, REsp 2005567/RS, REsp\n2023016/RS, REsp 2027413/PR e REsp 2027411/PR.)\n\nTEMA 1176: São eficazes os pagamentos de FGTS\nrealizados diretamente ao empregado, após o advento da Lei 9.491/1997,\nem decorrência de acordo homologado na Justiça do Trabalho, **[o que não\ndispensa a oportuna comunicação do ato aos órgãos de fiscalização\ncompetentes.]** Assegura-se, no entanto, a cobrança de todas as\nparcelas incorporáveis ao fundo, consistente em multas, correção\nmonetária, juros moratórios e contribuição social, visto que a União\nFederal e a Caixa Econômica Federal não participaram da celebração do\najuste na via laboral, não sendo por ele prejudicadas (art. 506, CPC).\n(REsp 2.003.509-RN; REsp 2.004.215-SP; REsp 2.004.806-SP)\n\n\\[[Embargos de declaração acolhidos para **integrar os esclarecimentos à\ntese adotada** para os efeitos do art. 1.036 do CPC. (Acórdão publicado\nno DJe de 18/9/2024).\\]]","refs":["1174","1176"]},{"id":"rep_2024_1187","tema":"1187","texto":"TEMA 1187: Nos casos de quitação antecipada, parcial\nou total, dos débitos fiscais objeto de parcelamento, conforme previsão\ndo art. 1º da Lei 11.941/2009, o momento de aplicação da redução dos\njuros moratórios <strong>deve ocorrer após a consolidação da dívida,</strong> sobre o\npróprio montante devido originalmente a esse título, [não existindo\namparo legal] para que a exclusão de 100% da multa de mora e\nde ofício implique exclusão proporcional dos juros de mora, [sem que a\nlei assim o tenha definido] de modo expresso. (REsp\n2006663/RS; REsp 2019320/RS e REsp 2021313/RS).","refs":["1187"]},{"id":"rep_2024_1191","tema":"1191","texto":"TEMA 1191: Na sistemática da **substituição tributária\npara frente<strong>, em que o contribuinte substituído </strong>revende a mercadoria\npor preço menor** do que a base de cálculo presumida para o recolhimento\ndo tributo, é <strong>inaplicável a condição prevista no art. 166 do CTN</strong>.\n(REsp 2034975/MG, REsp 2035550/MG e REsp 2034977/MG) (INFO 821)\n<strong>(FGV-SEFAZ/RS-AUDITOR/2025)</strong>\n\n[","refs":["1191"]},{"id":"rep_2024_1223","tema":"1223","texto":"TEMA 1223: A inclusão do **PIS e da Cofins na base de\ncálculo do ICMS<strong> </strong>atende<strong> à </strong>legalidade** nas hipóteses em que a\n<strong>base de cálculo é o valor da operação</strong>, por configurar repasse\neconômico.] ([REsp\n2091202/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302538058);\n[REsp\n2091203/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302520208);\n[REsp\n2091204/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302486709);\n[REsp\n2091205/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302439922))\n[]","refs":["1223"]},{"id":"rep_2024_1226","tema":"1226","texto":"TEMA 1226: a) No regime do Stock Option Plan (art.\n168, § 3º, da Lei n. 6.404/1976), porque revestido de natureza\nmercantil, <strong>não incide o imposto de renda</strong> <strong>pessoa física</strong>/IRPF\nquando da <strong>efetiva aquisição de ações</strong>, junto à companhia outorgante\nda opção de compra, dada a <strong>inexistência de acréscimo patrimonial</strong> em\nprol do optante adquirente.\n\nb\\) <strong>Incidirá o imposto</strong> de renda pessoa física/IRPF, porém, quando o\n<strong>adquirente</strong> de ações no Stock Option Plan vier a <strong>revendê-las</strong> com\napurado ganho de capital. ([REsp\n2069644/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301440349);\n[REsp\n2074564/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301797330)\n)","refs":["1226"]},{"id":"rep_2024_1231","tema":"1231","texto":"TEMA 1231: I. Os <strong>tributos</strong> recolhidos em\n<strong>substituição tributária não integram</strong> o conceito de **custo de\naquisição** previsto no art. 13, do Decreto-Lei n. 1.598/1977; e II. Os\n<strong>valores pagos</strong> pelo contribuinte substituto a título de ICMS-ST **não\ngeram,<strong> no regime não cumulativo, </strong>créditos** para fins de incidência\ndas <strong>contribuições ao PIS/PASEP e COFINS</strong> devidas pelo contribuinte\nsubstituído. (EREsp 1.959.571-RS; REsp 2.072.621-SC; REsp 2.075.758-ES)","refs":["1231"]},{"id":"rep_2024_1237","tema":"1237","texto":"TEMA 1237: Os valores de <strong>juros</strong>, calculados pela\ntaxa SELIC ou outros índices, recebidos em face de **repetição de\nindébito tributário**, na devolução de depósitos judiciais ou nos\npagamentos efetuados decorrentes de obrigações contratuais em atraso,\npor se <strong>caracterizarem como Receita Bruta Operacional</strong>, estão na\n<strong>base de cálculo</strong> das contribuições ao PIS/PASEP e COFINS\n<strong>cumulativas</strong> e, por integrarem o conceito amplo de Receita Bruta, na\nbase de cálculo das contribuições ao PIS/PASEP e COFINS n**ão\ncumulativas.** (REsp 1974197/AM, REsp 2000020/MG e REsp 2006644/MG.)","refs":["1237"]},{"id":"rep_2024_1240","tema":"1240","texto":"TEMA 1240: [O ISS compõe a base de cálculo do IRPJ e\nda CSLL quando apurados na sistemática do lucro presumido.]\n([REsp\n2089298/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302561735);\n[REsp\n2089356/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302740545))","refs":["1240"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2024_1246","tema":"1246","texto":"TEMA 1246: [É <strong>inadmissível</strong> recurso especial\ninterposto para <strong>rediscutir as conclusões do acórdão</strong> recorrido quanto\nao preenchimento, em caso concreto em que se controverte quanto a\nbenefício por incapacidade (aposentadoria por invalidez, auxílio-doença\nou auxílio-acidente), do requisito legal da incapacidade do segurado\npara o exercício de atividade laborativa, seja pela vertente de sua\nexistência, de sua extensão (total ou parcial) e/ou de sua duração\n(temporária ou permanente).] ([REsp\n2082395/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302231694);\n[REsp\n2098629/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203027190))","refs":["1246"]},{"id":"rep_2024_1140","tema":"1140","texto":"TEMA 1140: Para efeito de adequação dos benefícios\nprevidenciários concedidos antes da Constituição Federal aos tetos das\nEmendas Constitucionais n. 20/1998 e 41/2003, no cálculo devem-se\naplicar os limitadores vigentes à época de sua concessão (menor e maior\nvalor teto), utilizando-se o teto do salário de contribuição\nestabelecido em cada uma das emendas constitucionais como maior valor\nteto, e o equivalente à metade daquele salário de contribuição como\nmenor valor teto. (REsp 1957733/RS e REsp 1958465/RS)","refs":["1140"]},{"id":"rep_2024_1170","tema":"1170","texto":"TEMA 1170: A contribuição previdenciária patronal\nincide sobre os valores pagos ao trabalhador a título de décimo terceiro\nsalário proporcional relacionado ao período do aviso prévio indenizado.\n([REsp\n2006644/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201693374)\n; [REsp\n2000020/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201268568)\n; [REsp\n1974197/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103474865)\n)","refs":["1170"]},{"id":"rep_2024_1188","tema":"1188","texto":"TEMA 1188: [A sentença trabalhista **homologatória de\nacordo**, assim como a anotação na CTPS e demais documentos dela\ndecorrentes, **somente será considerada início de prova material\nválida,** conforme o disposto no art. 55, § 3º, da Lei 8.213/91, quando\nhouver nos autos <strong>elementos probatórios contemporâneos</strong> que\n<strong>comprovem</strong> os fatos alegados e sejam aptos a demonstrar o tempo de\nserviço no período que se pretende reconhecer na ação previdenciária,\n<strong>exceto</strong> na hipótese de caso fortuito ou força maior.] ([REsp\n1938265/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101463263);\n[REsp\n2056866/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103028324))","refs":["1188"]},{"id":"rep_2024_1207","tema":"1207","texto":"TEMA 1207: A <strong>compensação</strong> de prestações\nprevidenciárias, recebidas na via administrativa, quando da elaboração\nde cálculos em cumprimento de sentença concessiva de outro benefício,\ncom elas não acumulável, deve ser <strong>feita mês a mês,</strong> no limite, para\ncada competência, do valor correspondente ao título judicial, não\ndevendo ser apurado valor mensal ou final negativo ao beneficiário, de\nmodo a <strong>evitar a execução invertida ou a restituição indevida</strong>. (REsp\n2.039.614-PR; REsp 2.039.616-PR; REsp 2.045.596-RS)","refs":["1207"]},{"id":"rep_2024_1252","tema":"1252","texto":"TEMA 1252: <strong>Incide</strong> a <strong>contribuição</strong>\nprevidenciária patronal sobre o <strong>adicional de insalubridade</strong>, em razão\nda sua <strong>natureza remuneratória</strong>. (REsp 2.050.498-SP; REsp\n2.050.837-SP; REsp 2.052.982-SP)","refs":["1252"]}],"DIREITO DO CONSUMIDOR":[{"id":"rep_2024_1122","tema":"1122","texto":"TEMA 1122: As <strong>concessionárias</strong> de rodovias\n<strong>respondem</strong>, <strong>independentemente</strong> da existência de culpa, pelos danos\noriundos de acidentes causados pela presença de animais domésticos nas\npistas de rolamento, aplicando-se as regras do Código de Defesa do\nConsumidor e da Lei das Concessões. (REsp 1.908.738-SP)","refs":["1122"]},{"id":"rep_2024_1156","tema":"1156","texto":"TEMA 1156: O simples <strong>descumprimento</strong> do prazo\nestabelecido em legislação específica para a prestação de serviço\nbancário <strong>não gera por si só</strong> dano moral in re ipsa.\n(REsp 1962275/GO)","refs":["1156"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2024_16__IAC_","tema":"16 (IAC)","texto":"TEMA 16 (IAC): I - Nos termos dos arts. 1º, parágrafo\núnico, e 2º, caput, da Lei n. 11.343/2006 (Lei de Drogas), não pode ser\nconsiderado proscrito o cânhamo industrial (Hemp), variedade da Cannabis\ncom teor de Tetrahidrocanabinol (THC) inferior a 0,3%, porquanto inapto\nà produção de drogas, assim entendidas substâncias psicotrópicas capazes\nde causar dependência;\n\nII - De acordo com a Convenção Única sobre Entorpecentes (Decreto n.\n54.216/1964) e a Lei n. 11.343/2006 (Lei de Drogas), **compete ao Estado\nbrasileiro estabelecer a política pública atinente ao manejo e ao\ncontrole de todas as variedades da Cannabis,** inclusive o cânhamo\nindustrial (Hemp), <strong>não havendo, atualmente,</strong> previsão legal e\nregulamentar que **autorize seu emprego para fins industriais distintos\ndos medicinais e/ou farmacêuticos,** circunstância que impede a atuação\ndo Poder Judiciário;\n\nIII - À vista da disciplina normativa para os usos médicos e/ou\nfarmacêuticos da Cannabis, as normas expedidas pela Agência Nacional de\nVigilância Sanitária - ANVISA (Portaria SVS/MS n. 344/1998 e RDC n.\n327/2019) proibindo a importação de sementes e o manejo doméstico da\nplanta devem ser interpretadas de acordo com as disposições da Lei n.\n11.343/2006, não alcançando, em consequência, a variedade descrita no\nitem I (cânhamo industrial - Hemp), cujo teor de THC é inferior a 0,3%;\n\nIV - É <strong>lícita</strong> a concessão de **autorização sanitária para plantio,\ncultivo, industrialização e comercializaçã**o do cânhamo industrial\n(Hemp) por **pessoas jurídicas, para fins exclusivamente medicinais e/ou\nfarmacêuticos<strong> atrelados à proteção do </strong>direito à saúde,** observada a\nregulamentação a ser editada pela Agência Nacional de Vigilância\nSanitária - ANVISA e pela União, no âmbito de suas respectivas\natribuições, no prazo de 06 (seis) meses, contados da publicação deste\nacórdão; e\n\nV - Incumbe à Agência Nacional de Vigilância Sanitária - ANVISA e à\nUnião, no exercício da discricionariedade administrativa, avaliar a\nadoção de diretrizes destinadas a obstar o desvio ou a destinação\nindevida das sementes e das plantas (e.g. rastreabilidade genética,\nrestrição do cultivo a determinadas áreas, eventual necessidade de\nplantio indoor ou limitação quantitativa de produção nacional), bem como\npara garantir a idoneidade das pessoas jurídicas habilitadas a exercerem\ntais atividades (e.g. cadastramento prévio, regularidade\nfiscal/trabalhista, ausência de anotações criminais dos responsáveis\ntécnicos/administrativos e demais empregados), sem prejuízo de outras\nmedidas para preservar a segurança na respectiva cadeia produtiva e/ou\ncomercial. ([REsp\n2024250/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202102831))","refs":["16"]},{"id":"rep_2024_1129","tema":"1129","texto":"TEMA 1129: i) O interstício a ser observado na\nprogressão funcional e na promoção de servidores da carreira do Seguro\nSocial é de 12 (doze) meses, nos termos das Leis 10.355/2001,\n10.855/2004, 11.501/2007 e 13.324/2016; ii) É legal a progressão\nfuncional com efeitos financeiros em data distinta à de entrada do\nservidor na carreira (início do exercício funcional); iii) São exigíveis\ndiferenças remuneratórias retroativas decorrentes do reenquadramento dos\nservidores quanto ao período de exercício da função até 1º/1/2017, nos\ntermos do art. 39 da Lei 13.324/2016. ([REsp\n1956378/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102752060);\n[REsp\n1956379/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102752148)\n; [REsp\n1957603/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102806380))","refs":["1129"]},{"id":"rep_2024_1104","tema":"1104","texto":"TEMA 1104: O <strong>direito ao trânsito seguro</strong>, bem como\nos notórios e inequívocos danos materiais e morais coletivos decorrentes\ndo tráfego reiterado, em rodovias, de veículo com excesso de peso,\n**autorizam a imposição de tutela inibitória e a responsabilização\ncivil** do agente infrator. ([REsp\n1908497/RN](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003215737);\n[REsp\n1913392/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003423273))","refs":["1104"]},{"id":"rep_2024_414","tema":"414","texto":"TEMA 414: 1. Nos condomínios formados por **múltiplas\nunidades de consumo<strong> (economias) e um </strong>único hidrômetro** é\nlícita a adoção de metodologia de **cálculo da\ntarifa** devida pela prestação dos serviços de saneamento por meio da\nexigência de uma parcela fixa (\\\"tarifa mínima\\\"),\nconcebida sob a <strong>forma de franquia de consumo</strong> devida por cada uma das\nunidades consumidoras (economias); bem como por meio de uma [segunda\nparcela, variável e eventual,] exigida apenas se o consumo\nreal aferido pelo medidor único do condomínio <strong>exceder a franquia</strong> de\nconsumo de todas as unidades conjuntamente consideradas. 2. Nos\ncondomínios formados por múltiplas unidades de consumo (economias) e um\núnico hidrômetro é <strong>ilegal</strong> a adoção de metodologia de cálculo da\ntarifa devida pela prestação dos serviços de saneamento que,\n<strong>utilizando-se apenas do consumo real global,</strong> considere o condomínio\n<strong>como uma única unidade de consumo</strong> (uma única economia). 3. Nos\ncondomínios formados por múltiplas unidades de consumo (economias) e um\núnico hidrômetro é <strong>ilegal</strong> a adoção de metodologia de cálculo da\ntarifa devida pela prestação dos serviços de saneamento que, a partir de\num hibridismo de regras e conceitos, **dispense cada unidade de consumo\ndo condomínio da tarifa mínim**a exigida a título de franquia de\nconsumo. (REsp 1.937.887-RJ; REsp 1.937.891-RJ) **(FGV-TJSE-JUIZ/2025)\n(FGV-ENAC-2025)**\n\n\\[Modulação de efeitos:\n\nO Ministro Relator Paulo Sérgio Domingues lavrou o acórdão consignando o\nseguinte: (\\...) \\\"8. Evolução substancial da jurisprudência que bem se\namolda à previsão do art. 927, § 3º, do CPC, de modo a autorizar a\nparcial modulação de efeitos do julgamento, a fim de que às prestadoras\ndos serviços de saneamento básico seja declarado lícito modificar o\nmétodo de cálculo da tarifa de água e esgoto nos casos em que, por conta\nde ação revisional de tarifa ajuizada por condomínio, esteja sendo\nadotado o \\\"modelo híbrido\\\". Entretanto, fica vedado, para fins de\nmodulação e em nome da segurança jurídica e do interesse social, que\nsejam cobrados dos condomínios quaisquer valores pretéritos por\neventuais pagamentos a menor decorrentes da adoção do chamado ?modelo\nhíbrido?. 9. Nos casos em que a prestadora dos serviços de saneamento\nbásico tenha calculado a tarifa devida pelos condomínios dotados de\nmedidor único tomando-os como um único usuário dos serviços (uma\neconomia apenas), mantém-se o dever de modificar o método de cálculo da\ntarifa, sem embargo, entretanto, do direito do condomínio de ser\nressarcido pelos valores pagos a maior e autorizando-se que a\nrestituição do indébito seja feita pelas prestadoras por meio de\ncompensação entre o montante restituível com parcelas vincendas da\nprópria tarifa de saneamento devida pelo condomínio, até integral\nextinção da obrigação, respeitado o prazo prescricional. Na restituição\ndo indébito, modulam-se os efeitos do julgamento de modo a afastar a\ndobra do art. 42, parágrafo único, do CDC, à compreensão de que a\ndinâmica da evolução jurisprudencial relativa ao tema conferiu certa\nescusabilidade à conduta da prestadora dos serviços.\\\" (\\...)\\]","refs":["414"]},{"id":"rep_2024_1102","tema":"1102","texto":"TEMA 1102: a) É <strong>possível</strong> a **comprovação de\ntransação administrativ**a, relativa ao pagamento da vantagem de 286%,\npor meio de fichas financeiras ou documento expedido pelo Sistema\nIntegrado de Administração de Recursos Humanos - SIAPE, conforme o art.\n7º, § 2º, da MP 2.169- 43/2001, **apenas em relação a acordos firmados\nem momento posterior à vigência dessa norma**.\n\nb\\) Quando **não for localizado o instrumento de transação devidamente\nhomologado<strong>, e buscando </strong>impedir o enriquecimento ilícito**, os\nvalores recebidos administrativamente, a título de 28,86%, demonstrados\npor meio dos documentos expedidos pelo SIAPE, devem ser **deduzidos do\nvalor apurado, com as atualizações pertinentes**. (REsp 1.925.176-PA;\nREsp 1.925.194-RO; REsp 1.925.190-DF)\n\n\\[[A Primeira Seção acolheu, em parte, embargos de declaração para sanar\na omissão apontada quanto à adoção do marco temporal da vigência da MP\n1.962-33, de 21/12/2000 (RESP n. 1925194 / RO, acórdão publicado no DJe\nde 26/6/2024), para fixar a tese jurídica: \\\"I) É possível a comprovação\nde transação administrativa, relativa ao pagamento da vantagem de\n28,86%, por meio de fichas financeiras ou documento expedido pelo\nSistema Integrado de Administração de Recursos Humanos - SIAPE, conforme\nart. 7º, § 2º, da MP 1.962-33/2000, reproduzida na vigente MP 2.169-\n43/2001, apenas em relação a acordos firmados posteriormente à sua\nvigência. II) Quando não for localizado o instrumento de transação\ndevidamente homologado, e buscando impedir o enriquecimento ilícito, os\nvalores recebidos administrativamente, a título de 28,86%, demonstrados\npor meio dos documentos expedidos pelo SIAPE, devem ser deduzidos da\nquantia apurada, com as atualizações pertinentes\\\".\\]]","refs":["1102"]},{"id":"rep_2024_1127","tema":"1127","texto":"TEMA 1127: É <strong>ilegal menor de 18 anos</strong> antecipar a\nconclusão de sua educação básica submetendo-se ao sistema de **avaliação\ndiferenciado** oferecido pelos Centros de Educação de Jovens e\nAdultos-CEJAs, <strong>ainda que</strong> o intuito seja obter o diploma de ensino\nmédio para matricular-se em curso superior. (REsp 1835864/SP e REsp\n1835865/SP)\n\n\\[MODULAÇÃO DE EFEITOS:\n\nModula-se os efeitos do julgado para manter a consequência\ndas decisões judiciais que autorizaram menor de 18 (dezoito) anos que\nnão tenha concluído a educação básica se submeter ao sistema de\navaliação diferenciado de jovens e adultos [proferidas até a data da\npublicação do acórdão.]\n\nEmbargos de declaração parcialmente acolhidos para integrar os\nesclarecimentos à tese adotada para os efeitos do art. 1.036 do CPC.\n(Acórdão publicado no DJe de 16/9/2024)\\]","refs":["1127"]},{"id":"rep_2024_1079","tema":"1079","texto":"TEMA 1079: i) o art. 1° do Decreto-Lei 1.861/1981 (com\na redação dada pelo DL 1.867/1981) definiu que as contribuições devidas\nao Sesi, ao Senai, ao Sesc e ao Senac incidem até o limite máximo das\ncontribuições previdenciárias; ii) especificando o limite máximo das\ncontribuições previdenciárias, o art. 4°, parágrafo único, da\nsuperveniente Lei 6.950/1981, também especificou o teto das\ncontribuições parafiscais em geral, devidas em favor de terceiros,\nestabelecendo-o em 20 vezes o maior salário mínimo vigente; e iii) o\nart. 1°, inciso I, do Decreto-Lei 2.318/1986, expressamente revogou a\nnorma específica que estabelecia teto limite para as contribuições\nparafiscais devidas ao Sesi, ao Senai, ao Sesc e ao Senac, assim como o\nseu art. 3° expressamente revogou o teto limite para as contribuições\nprevidenciárias; iv) portanto, a partir da entrada em vigor do art. 1°,\n1, do Decreto-Lei 2.318/1986, as contribuições destinadas ao Sesi, ao\nSenai, ao Sesc e ao Senac não estão submetidas ao teto de vinte\nsalários. (REsp 1898532/CE e REsp 1905870/PR.)","refs":["1079"]},{"id":"rep_2024_1213","tema":"1213","texto":"TEMA 1213: [Para fins de indisponibilidade de bens, há\n<strong>solidariedade entre os corréus</strong> da Ação de Improbidade\nAdministrativa, de modo que a **constrição deve recair sobre os bens de\ntodos eles<strong>, sem divisão em quota-parte, </strong>limitando-se o somatório**\nda medida ao <strong>quantum determinado pelo juiz,</strong> sendo **defeso que o\nbloqueio<strong> corresponda ao débito </strong>total em relação a cada um**.]\n([REsp\n1955440/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102560866)\n; [REsp\n1955300/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102536939);\n[REsp\n1955957/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102633246);\n[REsp\n1955116/AM](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102436641))\n<strong>(FGV-ENAM 2/2024)</strong>","refs":["1213"]}],"DIREITO PENAL":[{"id":"rep_2024_1249","tema":"1249","texto":"TEMA 1249: I - As medidas protetivas de urgência\n(MPUs) têm <strong>natureza jurídica de tutela inibitória</strong> e sua vigência\n**não se subordina à existência (atual ou vindoura) de boletim de\nocorrência, inquérito policial, processo cível ou criminal**. II - A\nduração das MPUs vincula-se à <strong>persistência da situação de risco</strong> à\nmulher, razão pela qual devem ser fixadas por prazo **temporalmente\nindeterminado<strong>; III - Eventual reconhecimento de causa de </strong>[extinção\nde punibilidade, arquivamento do inquérito policial ou absolvição do\nacusado não origina, necessariamente, a extinção da medida\nprotetiva]** de urgência, máxime pela possibilidade de\npersistência da situação de risco ensejadora da concessão da medida.\nIV - <strong>Não</strong> se submetem a <strong>prazo obrigatório de revisão periódica,</strong>\nmas <strong>devem</strong> ser <strong>reavaliadas</strong> pelo magistrado, **de ofício ou a\npedido<strong> do interessado, quando constatado </strong>concretamente** o\n<strong>esvaziamento da situação de risco</strong>. A revogação deve **sempre ser\nprecedida de contraditório,** com as oitivas da vítima e do suposto\nagressor. Em caso de <strong>extinção</strong> da medida, a **ofendida deve ser\ncomunicada,** nos termos do art. 21 da Lei n. 11.340/2006. (REsp\n2.070.717-MG; REsp 2.070.857-MG; REsp 2.070.863-MG; REsp 2.071.109-MG)\n(INFO 836) **(FGV-SEFAZ/RS-AUDITOR/2025) (FGV-TJSC-JUIZ/2025)\n(FGV-DPE/PE-DEFENSOR/2025)**","refs":["1249"]},{"id":"rep_2024_1259","tema":"1259","texto":"TEMA 1259: A <strong>majorante do art. 40, inciso IV,</strong> da\nLei n. 11.343/2006 aplica-se quando há <strong>nexo finalístico</strong> entre o uso\nda arma e o tráfico de drogas, sendo a arma usada para garantir o\nsucesso da atividade criminosa, hipótese em que o **crime de porte ou\nposse ilegal de arma é absorvido** pelo tráfico. Do contrário, o delito\nprevisto no Estatuto do Desarmamento é considerado crime autônomo, em\nconcurso material com o tráfico de drogas.","refs":["1259"]},{"id":"rep_2024_1215","tema":"1215","texto":"TEMA 1215: Nos crimes <strong>contra a dignidade sexual,</strong>\nnão configura bis in idem a **aplicação simultânea da\nagravante genérica do art. 61, II, \\\"f\\\"<strong>, e da </strong>majorante específica\ndo art. 226, II,<strong> ambos do Código Penal, [</strong>salvo<strong> quando </strong>presente\napenas a relação de autoridade** do agente sobre a vítima, hipótese na\nqual **[deve ser aplicada tão somente a causa de\naumento]**.] ([REsp\n2038833/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203620938);\n[REsp\n2048768/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300190781);\n[REsp\n2049969/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300264373))\n<strong>(FGV-TJSE-JUIZ/2025) (FGV-ENAM/2025)</strong>","refs":["1215"]},{"id":"rep_2024_931","tema":"931","texto":"TEMA 931: O <strong>inadimplemento</strong> da pena de multa, após\ncumprida a pena privativa de liberdade ou restritiva de direitos, **não\nobsta<strong> a extinção da punibilidade, ante a alegada </strong>hipossuficiência**\ndo condenado, [salvo se diversamente entender o juiz\ncompetente, em decisão suficientemente motivada, que\nindique concretamente a [possibilidade de pagamento da sanção\npecuniária].] ([REsp\n2090454/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302819745)\n; [REsp\n1519777/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201500539441);\n[REsp\n1785383/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201803271835);\n[REsp\n1785861/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201803290297);\n[REsp\n2024901/S](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202810712)P)\n<strong>(FGV-TJSC-JUIZ/2025)</strong> **(FGV-DPE/PE-DEFENSOR/2025)\n(FGV-TRF1-JUIZ/2025)**\n\n\\[ATENÇÃO: O Tema 931/STJ passou por [três\nprocedimentos de Revisão:]\n\n**Tese fixada nos REsps n. 1.785.861/SP e 1.785.383/SP, acórdãos\npublicados no DJe de 30/11/2021, que se propõe a revisar:**\n\n\\\"Na hipótese de condenação concomitante a pena privativa de liberdade e\nmulta, o inadimplemento da sanção pecuniária, pelo condenado que\ncomprovar impossibilidade de fazê-lo, não obsta o reconhecimento da\nextinção da punibilidade.\\\"\n\n**Tese fixada nos REsps n. 1.785.861/SP e 1.785.383/SP, acórdãos\npublicados no DJe de 2/12/2020 (reafirmação de jurisprudência):**\n\n\\\"Na hipótese de condenação concomitante a pena privativa de liberdade e\nmulta, o inadimplemento da sanção pecuniária obsta o reconhecimento da\nextinção da punibilidade.\\\"\n\n**Tese fixada no REsp n. 1.519.777/SP, acórdão publicado no DJe de\n10/9/2015:**\n\n\\\"Nos casos em que haja condenação a pena privativa de liberdade e\nmulta, cumprida a primeira (ou a restritiva de direitos que\neventualmente a tenha substituído), o inadimplemento da sanção\npecuniária não obsta o reconhecimento da extinção da punibilidade.\\\"\\]","refs":["931"]},{"id":"rep_2024_1197","tema":"1197","texto":"TEMA 1197: A aplicação da agravante do art. 61, inc.\nII, alínea f, do Código Penal, <strong>em conjunto</strong> com as disposições da\n<strong>Lei Maria da Penha</strong> (Lei n. 11.340/2006), **não configura bis in\nide**m. ([REsp\n2027794/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202968621)\n; [REsp\n2026129/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202879290)\n; [REsp\n2029515/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203065208)\n)","refs":["1197"]},{"id":"rep_2024_1218","tema":"1218","texto":"TEMA 1218: A <strong>reiteração</strong> da conduta delitiva\n<strong>obsta</strong> a aplicação do [princípio da insignificância ao crime de\ndescaminho] - <strong>independentemente</strong> do valor do tributo não\nrecolhido -, <strong>ressalvada</strong> a possibilidade de, no caso concreto, se\nconcluir que a medida é socialmente recomendável. A\ncontumácia pode ser aferida a partir de procedimentos penais e fiscais\npendentes de definitividade, sendo <strong>inaplicável</strong> o prazo previsto no\nart. 64, I, do CP, incumbindo ao julgador avaliar o lapso temporal\ntranscorrido desde o último evento delituoso à luz dos princípios da\nproporcionalidade e razoabilidade. ([[REsp\n2.083.701]](https://processo.stj.jus.br/processo/julgamento/eletronico/documento/mediado/?documento_tipo=integra&documento_sequencial=231456189&registro_numero=202301726014&peticao_numero=&publicacao_data=20240305&formato=PDF)/SP;\n[REsp\n2091651/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202301939234);\n[REsp\n2091652/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302026800))","refs":["1218"]}],"DIREITO CIVIL":[{"id":"rep_2024_1200","tema":"1200","texto":"TEMA 1200: [O <strong>prazo prescricional</strong> para propor ação\nde petição de herança <strong>conta-se da abertura da sucessão</strong>, cuja\nfluência [não é impedida, suspensa ou interrompida pelo ajuizamento de\nação de reconhecimento de filiação], <strong>independentemente</strong>\ndo seu trânsito em julgado.] (REsp 2.029.809-MG; REsp\n2.034.650-SP) (FGV-DPE/PE-DEFENSOR/2025)","refs":["1200"]}]},"2023":{"DIREITO PENAL":[{"id":"rep_2023_1168","tema":"1168","texto":"TEMA 1168: Os tipos penais trazidos nos arts. 241-A e\n241-B do Estatuto da Criança e do Adolescente são <strong>autônomos</strong>, com\nverbos e condutas distintas, sendo que o crime do art. 241- B não\nconfigura fase normal, tampouco meio de execução para o crime do art.\n241-A, o que possibilita o reconhecimento de concurso material de\ncrimes.(REsp 1.970.216/SP, 1.971.049/SP e 1.976.855/MS)","refs":["1168"]},{"id":"rep_2023_1171","tema":"1171","texto":"TEMA 1171: A utilização de simulacro de arma\n<strong>configura</strong> a elementar grave ameaça do tipo penal do roubo,\nsubsumindo à hipótese legal que veda a substituição da pena. (REsp\n1994182/RJ). (INFO 799) (CESPE-PCPE-DELEGADO/2024)\n**[(VUNESP-MPRJ-PROMOTOR/2024) (FGV-TJRR-ANALISTA/2024)\n(FGV-TRT24-ANALISTA/2025) (FGV-TJSC-JUIZ/2025)]**","refs":["1171"]},{"id":"rep_2023_1172","tema":"1172","texto":"TEMA 1172: A <strong>reincidência específica</strong> como único\nfundamento só justifica o agravamento da pena em fração <strong>mais gravosa</strong>\nque 1/6 em <strong>casos excepcionais</strong> e mediante detalhada fundamentação\nbaseada em dados concretos do caso. ([REsp\n2003716/R](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201526193)S)\n\n<strong>TEMA 1189</strong>: A vedação constante do art. 17 da Lei n.\n11.340/2006 (Lei Maria da Penha) <strong>obsta</strong> a imposição, nos casos de\nviolência doméstica e familiar contra a mulher, de pena de multa\nisoladamente, **ainda que prevista de forma autônoma no preceito\nsecundário** do tipo penal imputado. ([REsp\n2049327/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300215286)\n) (INFO 779)","refs":["1189","1172"]},{"id":"rep_2023_1202","tema":"1202","texto":"TEMA 1202: No crime de estupro de vulnerável, é\n<strong>possível</strong> a aplicação da <strong>fração máxima</strong> de majoração prevista no\nart. 71, caput, do Código Penal, ainda que não haja a delimitação\nprecisa do número de atos sexuais praticados, <strong>desde que</strong> o longo\nperíodo de tempo e a recorrência das condutas permita concluir que houve\n<strong>7 (sete) ou mais repetições.</strong> (REsps 2.029.482-RJ e REsp\n2.050.195-RJ) <strong>(FGV-MPGO-PROMOTOR/2024)</strong>","refs":["1202"]},{"id":"rep_2023_1208","tema":"1208","texto":"TEMA 1208: A <strong>reincidência</strong> pode ser admitida pelo\njuízo das execuções penais para análise da concessão de benefícios,\n<strong>ainda que</strong> não reconhecida pelo juízo que prolatou a sentença\ncondenatória. ([REsp\n2055920/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300611140);\n[REsp\n2049870/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300256816))\n(VUNESP-MPRJ-PROMOTOR/2024)","refs":["1208"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2023_1114","tema":"1114","texto":"TEMA 1114: O interrogatório do réu é o <strong>último ato</strong>\nda instrução criminal. A inversão da ordem prevista no\nart. 400 do CPP [tangencia somente à oitiva das testemunhas e não ao\ninterrogatório]. O eventual reconhecimento da nulidade se\nsujeita à preclusão, na forma do art. 571, I e II, do CPP, e à\ndemonstração do prejuízo para o réu. (REsp 1.933.759-PR; REsp\n1.946.472-PR) <strong>(FGV-PCSC-PSICÓLOGO/2024)</strong>","refs":["1114"]},{"id":"rep_2023_1167","tema":"1167","texto":"TEMA 1167: A audiência prevista no art. 16 da Lei\n11.340/2006 tem por objetivo [confirmar a retratação, não a\nrepresentação], e [não pode ser designada de ofício pelo\njuiz]. Sua <strong>realização somente é necessária caso haja</strong>\nmanifestação do desejo da vítima de se retratar trazida aos autos antes\ndo recebimento da denúncia. ([REsp\n1977547/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103948148)\n; [REsp\n1964293/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103239601))\n(VUNESP-MPRJ-PROMOTOR/2024)","refs":["1167"]},{"id":"rep_2023_1206","tema":"1206","texto":"TEMA 1206: A simples falta de assinatura do perito\nencarregado pela lavratura do laudo toxicológico definitivo **constitui\nmera irregularidade** e não tem o condão de anular a prova\npericial na hipótese de existirem **outros elementos que comprovem a sua\nautenticidade,** notadamente quando o expert estiver devidamente\nidentificado e for constatada a existência de substância ilícita. ([REsp\n2048440/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300175210);\n[REsp\n2048645/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300175194);\n[REsp\n2048422/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202300174604)\n) <strong>(VUNESP-MPRJ-PROMOTOR/2024)</strong>","refs":["1206"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2023_1150","tema":"1150","texto":"TEMA 1150: i) o Banco do Brasil possui **legitimidade\npassiva** ad causam para figurar no polo passivo de demanda na qual se\ndiscute eventual falha na prestação do serviço quanto a conta vinculada\nao Pasep, saques indevidos e desfalques, além da ausência de aplicação\ndos rendimentos estabelecidas pelo Conselho Diretor do referido\nprograma; ii) a pretensão ao ressarcimento dos danos havidos em razão\ndos desfalques em conta individual vinculada ao Pasep se submete ao\nprazo prescricional decenal previsto pelo artigo 205 do Código Civil; e\niii) o <strong>termo inicial</strong> para a contagem do prazo prescricional é o\n<strong>dia em que o titular, comprovadamente, toma ciência dos desfalques</strong>\nrealizados na conta individual vinculada ao Pasep. ([REsp\n1895936/TO](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002419697)\n; [REsp\n1895941/TO](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002422382)\n; [REsp\n1951931/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102353366))","refs":["1150"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2023_0733","tema":"0733","texto":"TEMA 0733: [A eficácia da Lei 4.870/1965, que previa a\nsistemática de tabelamento de preços promovida pelo IAA, findou em\n31/01/1991, em virtude da publicação, em 01/02/1991, da Medida\nProvisória 295, de 31/01/1991, posteriormente convertida na Lei 8.178,\nde 01/03/1991,\\* que instituiu nova política nacional de congelamento de\npreços. \\[O tema discutiu a aferição de prejuízo experimentado pelas\nempresas do setor sucroalcooleiro, em razão do tabelamento de preços\nestabelecido pelo Governo Federal por intermédio da Lei\n4.870/65.\\]]","refs":["0733"]},{"id":"rep_2023_1149","tema":"1149","texto":"TEMA 1149: A Lei 9.969/1998 não prevê a\nobrigatoriedade de inscrição de técnico ou treinador de tênis nos\nConselhos de Educação Física, nem estabelece a exclusividade do\ndesempenho de tal função aos profissionais regulamentados pela referida\nnorma, quando as atividades desenvolvidas pelo técnico ou treinador de\ntênis restrinjam-se às táticas do esporte em si e não se confundam com\npreparação física, limitando-se à transmissão de conhecimentos de\ndomínio comum decorrentes de sua própria experiência em relação ao\nreferido desporto, o que torna dispensável a graduação específica em\nEducação Física. ([REsp\n1959824/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102918734);\n[REsp\n1963805/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103176583);\n[REsp\n1966023/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103163380)\n)\n\n<strong>TEMA 1179</strong>: Os Conselhos Seccionais da Ordem dos\nAdvogados do Brasil <strong>não podem</strong> instituir e cobrar anuidade das\nsociedades de advogados. ([REsp\n2014023/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202171264);\n[REsp\n2015612/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202270629))","refs":["1179","1149"]},{"id":"rep_2023_1199","tema":"1199","texto":"TEMA 1199: Nos procedimentos de demarcação de terrenos\nde marinha, é válido o ato jurídico de chamamento de interessados certos\nou incertos à participação colaborativa com a Administração formalizado\nexclusivamente por meio de edital, desde que o ato tenha sido praticado\nno período de 31/05/2007 até 28/03/2011, em que produziu efeitos\njurídicos a alteração legislativa do art. 11 do Decreto-lei 9.760/46\npromovida pelo art. 5º da Lei 11.481/2007. ([REsp\n2015301/MA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202202250737);\n[REsp\n2036429/MA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203445271)\n)","refs":["1199"]}],"DIREITO CIVIL":[{"id":"rep_2023_1132","tema":"1132","texto":"TEMA 1132: Em ação de <strong>busca e apreensão</strong> fundada em\ncontratos garantidos com alienação fiduciária (art. 2º, § 2º, do\nDecreto-Lei n. 911/1969), para a comprovação da mora, é <strong>suficiente</strong> o\nenvio de notificação <strong>extrajudicial</strong> ao devedor no endereço indicado\nno instrumento contratual, <strong>dispensando-se a prova do recebimento,</strong>\nquer seja pelo próprio destinatário, quer por terceiros. ([REsp\n1951888/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102384997);\n[REsp\n1951662/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102385113))\n**(FGV-TJAP-ANALISTA JUDICIÁRIO-EXECUÇÃO DE MANDADOS/2024)\n(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)\n(FGV-EPE-ADVOGADO/2024)**","refs":["1132"]}],"DIREITO AMBIENTAL":[{"id":"rep_2023_1159","tema":"1159","texto":"TEMA 1159: A validade das <strong>multas</strong> administrativas\npor infração ambiental, previstas na Lei n. 9.605/1998, <strong>independe</strong> da\nprévia aplicação da <strong>penalidade de advertência.</strong> ([REsp\n1984746/AL](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200334147);\n[REsp\n1993783/PA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200867108)\n) <strong>(FGV-PREF DE VITÓRIA/ES-PROCURADOR/2024)</strong>","refs":["1159"]}],"DIREITO DO CONSUMIDOR":[{"id":"rep_2023_1069","tema":"1069","texto":"TEMA 1069: (i) É de cobertura <strong>obrigatória</strong> pelos\nplanos de saúde a **cirurgia plástica de caráter reparador ou\nfuncional<strong> indicada pelo </strong>médico assistente**, em paciente\npós-cirurgia bariátrica, visto ser parte decorrente do tratamento da\nobesidade mórbida. (ii) Havendo <strong>dúvidas justificadas e razoáveis</strong>\nquanto ao caráter eminentemente estético da cirurgia plástica indicada\nao paciente pós cirurgia bariátrica, a operadora de plano de saúde\n<strong>pode se utilizar do procedimento da junta médica,</strong> formada para\ndirimir a divergência técnico assistencial, desde que arque com os\nhonorários dos respectivos profissionais e sem prejuízo do exercício do\ndireito de ação pelo beneficiário, em caso de parecer desfavorável à\nindicação clínica do médico assistente, ao qual não se vincula o\njulgador. ([REsp\n1870834/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201902867821);\n[REsp\n1872321/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202001008780))\n<strong>(VUNESP-MPRO-PROMOTOR/2024)</strong>","refs":["1069"]},{"id":"rep_2023_1112","tema":"1112","texto":"TEMA 1112: (i) na modalidade de contrato de seguro de\nvida coletivo, cabe exclusivamente ao estipulante,\nmandatário legal e único sujeito que tem vínculo anterior com os membros\ndo grupo segurável (estipulação própria), a obrigação de prestar\ninformações prévias aos potenciais segurados acerca das condições\ncontratuais quando da formalização da adesão, incluídas as cláusulas\nlimitativas e restritivas de direito previstas na apólice mestre, e (ii)\nnão se incluem, no âmbito da matéria afetada, as causas originadas de\nestipulação imprópria e de falsos estipulantes, visto que as apólices\ncoletivas nessas figuras devem ser consideradas apólices individuais, no\nque tange ao relacionamento dos segurados com a sociedade seguradora.\n([REsp\n1874811/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202001151016)\n; [REsp\n1874788/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202001150740))","refs":["1112"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2023_1164","tema":"1164","texto":"TEMA 1164: <strong>Incide</strong> a contribuição previdenciária a\ncargo do empregador sobre o auxílio alimentação pago em pecúnia. ([REsp\n1995437/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200969743);\n[REsp\n2004478/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200251305))","refs":["1164"]},{"id":"rep_2023_1184","tema":"1184","texto":"TEMA 1184: (i) a regra da irretratabilidade da opção\npela Contribuição Previdenciária sobre Receita Bruta (CPRB) prevista no\n§ 13 do art. 9º da Lei 12.546/2011 destina-se apenas ao beneficiário do\nregime, e não à Administração; e (ii) a revogação da escolha de\ntributação da contribuição previdenciária pelo sistema da CPRB, trazida\npela Lei 13.670/2018, não feriu direitos do contribuinte, tendo em vista\nque foi respeitada a anterioridade nonagesimal. ([REsp\n1902610/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002810687)\n; [REsp\n1901638/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002732478)\n)","refs":["1184"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2023_1160","tema":"1160","texto":"TEMA 1160: O IR e a CSLL incidem sobre a\ncorreção monetária das aplicações financeiras, porquanto estas se\ncaracterizam legal e contabilmente como Receita Bruta, na condição de\nReceitas Financeiras componentes do Lucro Operacional. ([REsp\n1986304/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200450877)\n; [REsp\n1996013/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201010943);\n[REsp\n1996014/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201010931);\n[REsp\n1996685/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201058467)\n; [REsp\n1996784/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202201071150))\n\n<strong>TEMA 1182:</strong> 1. Impossível excluir os benefícios fiscais\nrelacionados ao ICMS, - tais como redução de base de cálculo, redução de\nalíquota, isenção, diferimento, entre outros - da base de cálculo do\nIRPJ e da CSLL, salvo quando atendidos os requisitos previstos em lei\n(art. 10, da Lei Complementar n. 160/2017 e art. 30, da Lei n.\n12.973/2014), não se lhes aplicando o entendimento firmado no ERESP\n1.517.492/PR que excluiu o crédito presumido de ICMS das bases de\ncálculo do IRPJ e da CSLL. 2. Para a exclusão dos benefícios fiscais\nrelacionados ao ICMS, - tais como redução de base de cálculo, redução de\nalíquota, isenção, diferimento, entre outros - da base de cálculo do\nIRPJ e da CSLL não deve ser exigida a demonstração de concessão como\nestímulo à implantação ou expansão de empreendimentos econômicos. 3.\nConsiderando que a Lei Complementar 160/2017 incluiu os §§ 4º e 5º ao\nart. 30 da Lei 12.973/2014 sem, entretanto, revogar o disposto no seu §\n2º, a dispensa de comprovação prévia, pela empresa, de que a subvenção\nfiscal foi concedida como medida de estímulo à implantação ou expansão\ndo empreendimento econômico não obsta a Receita Federal de proceder ao\nlançamento do IRPJ e da CSSL se, em procedimento fiscalizatório, for\nverificado que os valores oriundos do benefício fiscal foram utilizados\npara finalidade estranha à garantia da viabilidade do empreendimento\neconômico. ([REsp\n1987158/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202200488090);\n[REsp\n1945110/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101909931)\n)","refs":["1160","1182"]}]},"2022":{"DIREITO PENAL":[{"id":"rep_2022_585","tema":"585","texto":"TEMA 585: É <strong>possível</strong>, na segunda fase da\ndosimetria da pena, a <strong>compensação integral</strong> da atenuante da confissão\nespontânea com a agravante da reincidência, seja ela **específica ou\nnão.<strong> [Todavia, nos casos de </strong>multirreincidência**, deve ser\nreconhecida a <strong>preponderância</strong> da agravante prevista no art. 61, I, do\nCódigo Penal, sendo <strong>admissível a sua compensação proporcional</strong> com a\natenuante da confissão espontânea, em estrito atendimento aos princípios\nda <strong>individualização da pena e da proporcionalidade</strong>.] ([REsp\n1947845/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102097725);\n[REsp\n1341370/MT](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201201809099);\n[REsp\n1931145/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202100961299))\n<strong>(FGV-TJES-JUIZ/2023)</strong> **(FGV-TJSC-JUIZ/2022) (FGV-TJMT-JUIZ/2024)\n(FGV-TRF3-JUIZ/2025) (FGV-TJSC-JUIZ/2025)**\n\n<strong>TEMA 1060</strong>: A <strong>desobediência</strong> à ordem legal de\nparada, emanada por agentes públicos em contexto de **policiamento\nostensivo**, para a prevenção e repressão de crimes, constitui conduta\npenalmente <strong>típica</strong>, prevista no art. 330 do Código Penal Brasileiro.\n([REsp\n1859933/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000225649))\n(CESPE-PCPE-DELEGADO/2024) (FGV-TJGO-JUIZ-2023)","refs":["1060","585"]},{"id":"rep_2022_1087","tema":"1087","texto":"TEMA 1087: A causa de aumento prevista no § 1° do art.\n155 do Código Penal (prática do crime de furto no período noturno) **não\nincide** no crime de furto na sua forma qualificada (§ 4°). ([REsp\n1888756/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002014981);\n[REsp\n1890981/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002140433);\n[REsp\n1891007/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002133733))\n(INFO 738) **(FGV-TJPE-JUIZ/2022) (CESPE-PCPE-DELEGADO/2024)\n(FGV-TJMT-JUIZ/2024) (FGV-TJMS-JUIZ/2023)**","refs":["1087"]},{"id":"rep_2022_1100","tema":"1100","texto":"TEMA 1100: O <strong>acórdão condenatório</strong> de que trata o\ninciso IV do art. 117 do Código Penal <strong>interrompe</strong> a prescrição,\ninclusive quando confirmatório de sentença condenatória,\nseja <strong>mantendo, reduzindo ou aumentando</strong> a pena anteriormente imposta.\n([REsp\n1920091/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202100328971)\n; [REsp\n1930130/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003416524)\n) <strong>(FGV-TJGO-JUIZ/2023) (FGV-DPE/PE-DEFENSOR/2025)</strong>\n\n<strong>TEMA 1106</strong>: **Sobrevindo condenação por pena\nprivativa** de liberdade no curso da execução de pena restritiva de\ndireitos, as penas serão objeto de unificação, com a\n<strong>reconversão</strong> da pena alternativa em privativa de liberdade,\n<strong>ressalvada</strong> a possibilidade de cumprimento <strong>simultâneo</strong> aos\napenados em regime aberto e <strong>vedada</strong> a unificação automática **nos\ncasos em que a condenação substituída por pena alternativa é\nsuperveniente<strong>. </strong>(FGV-TJPR-JUIZ/2023) (FGV-DPERJ-DEFENSOR/2023)**","refs":["1100","1106"]},{"id":"rep_2022_1155","tema":"1155","texto":"TEMA 1155: 1) O **período de recolhimento obrigatório\nnoturno<strong> e </strong>nos dias de folga,** por comprometer o status libertatis\ndo acusado, <strong>deve ser reconhecido como período a ser detraído</strong> da pena\nprivativa de liberdade e da medida de segurança, em homenagem aos\nprincípios da <strong>proporcionalidade e do non bis in idem.</strong> 2) O\n<strong>monitoramento</strong> eletrônico associado, atribuição do Estado, **não é\ncondição indeclinável** para a detração dos períodos de submissão a\nessas medidas cautelares, não se justificando distinção de tratamento ao\ninvestigado ao qual não é determinado e disponibilizado o aparelhamento.\n3) As horas de recolhimento domiciliar noturno e nos dias de folga\ndevem ser convertidas em dias para contagem da detração da\npena. Se no cômputo total remanescer [período menor que vinte e quatro\nhoras, essa fração de dia deverá ser desprezada]. ([REsp\n1977135/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103921805))\n(CESPE-DPEAC-DEFENSOR/2024) (FGV-TJMS-JUIZ/2023)","refs":["1155"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2022_1070","tema":"1070","texto":"TEMA 1070: Após o advento da Lei 9.876/99, e para fins\nde cálculo do benefício de aposentadoria, no caso do exercício de\natividades concomitantes pelo segurado, o salário-de-contribuição deverá\nser composto da soma de todas as contribuições previdenciárias por ele\nvertidas ao sistema, respeitado o teto previdenciário.\n\n<strong>TEMA 1103</strong>: As contribuições previdenciárias **não\nrecolhidas no momento oportuno<strong> sofrerão o </strong>acréscimo de multa e de\njuros** apenas quando o período a ser indenizado for posterior à edição\nda Medida Provisória n.º 1.523/1996 (convertida na Lei n.º 9.528/1997).","refs":["1103","1070"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2022_981","tema":"981","texto":"TEMA 981: O <strong>redirecionamento</strong> da execução fiscal,\nquando fundado na <strong>dissolução irregular</strong> da pessoa jurídica executada\nou na presunção de sua ocorrência, [pode ser autorizado contra o sócio\nou o terceiro não sócio,] com poderes de administração [na\ndata em que configurada ou presumida a dissolução\nirregular], <strong>ainda que</strong> não tenha exercido poderes de\ngerência quando ocorrido o fato gerador do tributo não adimplido,\nconforme art. 135, III, do CTN. ([REsp\n1645333/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603209856);\n[REsp\n1643944/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603209921);\n[REsp\n1645281/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603210003))\n(INFO 738) **(FGV/2023) (FGV/2022 - 2 VEZES) (FGV-PREF DE SÃO JOSÉ DOS\nCAMPOS-TÉC TRIBUTÁRIO/2024) (FGV-PREF DE SÃO JOSÉ DOS\nCAMPOS-ANALISTA/2024) (FGV-TCEPA-AUDITOR/2024) (FGV-PREF DE\nMACAÉ/RJ-PROCURADOR/2024) (FGV-SMF/RJ-FISCAL DE RENDAS/2023)\n(FGV-TRF3-JUIZ/2025) (FGV-SEFAZ/PR-AUDITOR/2025)**\n\n\\[Diferente do tema 962, em que o sócio ou terceiro não sócio, ainda que\ncom poderes de gerência, se retira REGULARMENTE e NÃO DEU CAUSA à\ndissolução irregular\\]","refs":["962","981"]},{"id":"rep_2022_994","tema":"994","texto":"TEMA 994: É <strong>constitucional</strong> a inclusão do Imposto\nSobre Circulação de Mercadorias e Serviços - ICMS na base de cálculo da\nContribuição Previdenciária sobre a Receita Bruta - CPRB. ([REsp\n1638772/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201603027650);\n[REsp\n1624297/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201602339734);\n[REsp\n1629001/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201602557003))","refs":["994"]},{"id":"rep_2022_1113","tema":"1113","texto":"TEMA 1113: a) a base de cálculo do ITBI **é o valor do\nimóvel transmitido em condições normais de mercado,** não estando\nvinculada à base de cálculo do IPTU, que nem sequer pode ser utilizada\ncomo piso de tributação; b) o valor da transação declarado pelo\ncontribuinte goza da **presunção de que é condizente com o valor de\nmercado<strong>, que somente pode ser afastada pelo fisco mediante a r</strong>egular\ninstauração de processo administrativo próprio** (art. 148 do CTN); c) o\nMunicípio <strong>não pode</strong> <strong>arbitrar previamente</strong> a base de cálculo do\nITBI com respaldo em valor de referência por ele estabelecido\nunilateralmente. **(FGV-TJSE-ATIVIDADE NOTARIAL E DE\nREGISTRO/2023) (FGV-CÂMARA DE FORTALEZA-ADVOGADO/2024) (CESPE-PREF DE\nCUIABÁ-PROCURADOR/2024) (FGV-TJSC-JUIZ/2025)**","refs":["1113"]},{"id":"rep_2022_1074","tema":"1074","texto":"TEMA 1074: No <strong>arrolamento sumário,</strong> a homologação\nda partilha ou da adjudicação, bem como a expedição do formal de\npartilha e da carta de adjudicação, [não se condicionam ao prévio\nrecolhimento do imposto de transmissão causa mortis],\ndevendo ser <strong>comprovado</strong>, todavia, o <strong>pagamento</strong> dos tributos\nrelativos aos bens do <strong>espólio</strong> e às suas rendas, a teor dos arts.\n659, § 2º, do CPC/2015 e 192 do CTN. (REsp 1.896.526-DF)\n**(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023) (FGV-ENAM\nMANAUS/2024)**","refs":["1074"]}],"DIREITO ADMINISTRATIVO":[{"id":"rep_2022_1075","tema":"1075","texto":"TEMA 1075: É ilegal o ato de **não\nconcessão** de progressão funcional de servidor público, quando\natendidos todos os requisitos legais, a despeito de superados os limites\norçamentários previstos na Lei de Responsabilidade Fiscal, referentes a\ngastos com pessoal de ente público, tendo em vista que a progressão é\ndireito subjetivo do servidor público, decorrente de determinação legal,\nestando compreendida na exceção prevista no inciso I do parágrafo único\ndo art. 22 da Lei Complementar 101/2000.\n\n<strong>TEMA 1086</strong>: Presente a redação original do art. 87, §\n2º, da Lei n. 8.112/1990, bem como a dicção do art. 7º da Lei n.\n9.527/1997, o servidor federal inativo, **sob pena de enriquecimento\nilícito** da Administração e independentemente de prévio requerimento\nadministrativo, faz j[us à conversão em pecúnia de licença-prêmio por\nele não fruída] durante sua atividade funcional, nem contada\nem dobro para a aposentadoria, revelando-se prescindível, a tal\ndesiderato, a comprovação de que a licença-prêmio não foi gozada por\nnecessidade do serviço. <strong>(FGV/2022)</strong>\n\n<strong>TEMA 1088</strong>: O militar de carreira ou temporário - este\núltimo antes da alteração promovida pela Lei 13.954/2019 -,\ndiagnosticado como portador do vírus HIV, tem direito à reforma ex\nofficio por incapacidade definitiva para o serviço ativo das Forças\nArmadas, independentemente do grau de desenvolvimento da Síndrome de\nImunodeficiência Adquirida - SIDA/AIDS, porém, sem a remuneração\ncalculada com base no soldo correspondente ao grau hierárquico\nimediatamente superior ao que possuía na ativa, se não estiver\nimpossibilitado total e permanentemente para qualquer trabalho, na forma\ndo art. 110, § 1º, da Lei 6.880/80.","refs":["1075","1086","1088"]},{"id":"rep_2022_1108","tema":"1108","texto":"TEMA 1108: A contratação de **servidores públicos\ntemporários** sem concurso público, mas baseada em legislação local,\npor si só, não configura a <strong>improbidade</strong> administrativa\nprevista no art. 11 da Lei n. 8.429/1992, por estar ausente o elemento\nsubjetivo (dolo) necessário para a configuração do ato de improbidade\nviolador dos princípios da administração pública.\n<strong>(FGV-SMF/RJ-ANALISTA/2023)</strong>\n\n<strong>TEMA 1135</strong>: É possível ao servidor que já usufruiu o\nprimeiro período de férias, após cumprida a exigência de 12 (doze) meses\nde exercício, usufruir as férias seguintes no mesmo ano civil, dentro do\nperíodo aquisitivo ainda em curso, nos termos do § 1º do art. 77 da Lei\n8.112/1990. ([REsp\n1954503/PE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102539340)\n; [REsp\n1907638/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003172992)\n; [[REsp\n1908022/CE]](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003171820)\n; [REsp\n1907153/CE](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202003142941))\n<strong>(FGV-TRF1-JUIZ/2023)</strong>","refs":["1108","1135"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rep_2022_12__IAC_","tema":"12 (IAC)","texto":"TEMA 12 (IAC): [a) É <strong>presumido</strong>, em regra, o\n<strong>rateio em partes iguais</strong> do **numerário mantido em conta\n<strong>]</strong>corrente conjunta solidária** [quando inexistente previsão\nlegal ou contratual de responsabilidade solidária dos correntistas pelo\npagamento de dívida imputada a um deles.]\n\n[b) <strong>Não será possível a penhora da integralidade do saldo</strong> existente\nem conta conjunta solidária no âmbito de execução movida por pessoa\n(física ou jurídica) distinta da instituição financeira mantenedora,\nsendo franqueada aos cotitulares e ao exequente a oportunidade de\ndemonstrar os valores que integram o patrimônio de cada um, a fim de\nafastar a presunção relativa de rateio. (][REsp\n1610844/BA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201601057876))\n<strong>(FGV-TJRN-OFICIAL DE JUSTIÇA/2023)</strong>\n\n<strong>TEMA 1012</strong>: O bloqueio de ativos financeiros do\nexecutado via sistema BACENJUD, em caso de concessão de parcelamento\nfiscal, seguirá a seguinte orientação: (i) será levantado o bloqueio se\na concessão é anterior à constrição; e (ii) fica mantido o bloqueio se a\nconcessão ocorre em momento posterior à constrição, ressalvada, nessa\nhipótese, a possibilidade excepcional de substituição da penhora online\npor fiança bancária ou seguro garantia, diante das peculiaridades do\ncaso concreto, mediante comprovação irrefutável, a cargo do executado,\nda necessidade de aplicação do princípio da menor onerosidade. ([REsp\n1756406/PA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201801950090);\n[REsp\n1703535/PA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201702641549);\n[REsp\n1696270/M](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201702251778)G)","refs":["12","1012"]},{"id":"rep_2022_1015","tema":"1015","texto":"TEMA 1015: 1. Pedido de Homologação de Acordo firmado\nentre KIRTON BANK S.A. (nova denominação de HSBC BANK BRASIL S.A - BANCO\nMÚLTIPLO - sucessor parcial do BANCO BAMERINDUS S.A) e BANCO SISTEMA\nS.A. (nova denominação da massa liquidanda do BANCO BAMERINDUS S.A.). 2.\nConquanto o presente negócio jurídico processual se apresente perante os\npeticionantes como, efetivamente, um acordo, em sua projeção para os\ninteressados qualificados, em especial para o Estado-Juiz, o instrumento\ndescortina-se como \\\"Pacto de Não Judicialização dos Conflitos\\\",\nnegócio processual que, após homologado sob o rito dos recursos\nrepetitivos, é apto a gerar norma jurídica de eficácia parcialmente erga\nomnes e vinculante (CPC, art. 927, III). 3. Homologa-se o acordo\nentabulado entre KIRTON BANK S.A. (nova denominação de HSBC BANK BRASIL\nS.A - BANCO MÚLTIPLO - sucessor parcial do BANCO BAMERINDUS S.A) e BANCO\nSISTEMA S.A. (nova denominação da massa liquidanda do BANCO BAMERINDUS\nS.A.), como \\\"Pacto de Não Judicialização dos Conflitos\\\", com: a)\ndesistência de todos os recursos acerca da legitimidade passiva para\nresponderem pelos encargos advindos de expurgos inflacionários relativos\nà cadernetas de poupança mantidas perante o extinto Banco Bamerindus\nS/A, em decorrência de sucessão empresarial parcial havida entre as\ninstituições financeiras referidas; b) os compromissos assumidos pelos\npactuantes de: b.1) não mais litigarem recorrerem ou questionarem em\njuízo, perante terceiros, especialmente consumidores, suas legitimidades\npassivas, passando tal discussão a ser restrita às próprias instituições\nfinanceiras pactuárias, sem afetar os consumidores; b.2) encerrarem a\ncontrovérsia jurídica da presente macrolide, com parcial desistência dos\nrecursos; b.3) conferir-se ao Pacto ora homologado, nos moldes do regime\ndos recursos repetitivos, eficácia erga omnes e efeito vinculante\nvertical. 4. Acordo homologado, como \\\"Pacto de Não Judicialização dos\nConflitos\\\", com homologação da desistência parcial do respectivo\nrecurso especial, ficando os demais aspectos do recurso encaminhados\npara julgamento do caso concreto, sem afetação. ([REsp\n1362038/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300122392);\n[REsp\n1361869/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300117501))","refs":["1015"]},{"id":"rep_2022_1076","tema":"1076","texto":"TEMA 1076: i) A fixação dos honorários por apreciação\nequitativa não é permitida quando os valores da\ncondenação, da causa ou o proveito econômico da demanda forem\nelevados. É obrigatória nesses casos a observância dos\npercentuais previstos nos §§ 2º ou 3º do artigo 85 do CPC - a depender\nda presença da Fazenda Pública na lide -, os quais serão\nsubsequentemente calculados sobre o valor: (a) da condenação; ou (b) do\nproveito econômico obtido; ou (c) do valor atualizado da causa. ii)\nApenas se admite arbitramento de honorários por equidade quando, havendo\nou não condenação: (a) o proveito econômico obtido pelo vencedor for\ninestimável ou irrisório; ou (b) o valor da causa for muito baixo.","refs":["1076"]},{"id":"rep_2022_677","tema":"677","texto":"TEMA 677: [Na execução, o depósito efetuado a título\nde garantia do juízo ou decorrente da penhora de ativos financeiros\n<strong>não isenta</strong> o devedor do pagamento dos consectários de sua mora,\nconforme previstos no título executivo, devendo-se, quando da efetiva\nentrega do dinheiro ao credor, deduzir do montante final devido o saldo\nda conta judicial.] ([REsp\n1820963/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201901714955);\n[REsp\n1348640/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201202140503);\n[REsp\n1388095/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201300008102))","refs":["677"]}],"DIREITO CIVIL":[{"id":"rep_2022_1065","tema":"1065","texto":"TEMA 1065: O marco inicial e o prazo de vigência\nprevistos no parágrafo único do art. 40 da LPI [não são\naplicáveis] às patentes depositadas na forma estipulada pelo\nart. 229, parágrafo único, dessa mesma lei (patentes mailbox)","refs":["1065"]},{"id":"rep_2022_1085","tema":"1085","texto":"TEMA 1085: São lícitos os <strong>descontos</strong>\nde parcelas de empréstimos bancários comuns em conta-corrente, **ainda\nque<strong> utilizada para recebimento de salários</strong>, desde que** previamente\nautorizados pelo mutuário e enquanto esta autorização perdurar, [não\nsendo aplicável], por analogia, a limitação prevista no § 1º\ndo art. 1º da Lei n. 10.820/2003, que disciplina os empréstimos\nconsignados em folha de pagamento. (REsp 1.863.973-SP)\n**(FGV-ALTO-PROCURADOR/2024) (FGV-DPERS-ANALISTA/2023)\n(FGV-TRF1-JUIZ/2025)**\n\n\\[Art. 1º, §1º, lei 10.820/03: § 1º O desconto mencionado neste artigo\ntambém poderá incidir sobre verbas rescisórias devidas pelo empregador,\nse assim previsto no respectivo contrato de empréstimo, financiamento,\ncartão de crédito ou arrendamento mercantil, <strong>até o limite de 40%</strong>\n(quarenta por cento), <strong>sendo 35%</strong> (trinta e cinco por cento)\ndestinados exclusivamente a empréstimos, financiamentos e arrendamentos\nmercantis <strong>e 5%</strong> (cinco por cento) destinados exclusivamente à\namortização de despesas contraídas por meio de cartão de crédito\nconsignado ou à utilização com a finalidade de saque por meio de cartão\nde crédito consignado.\\]\n\n<strong>TEMA 1091</strong>: É válida a penhora do bem de\nfamília de fiador apontado em contrato de locação de imóvel, seja\nresidencial, seja comercial, nos termos do inciso VII do art. 3º da Lei\nn. 8.009/1990.","refs":["1085","1091"]},{"id":"rep_2022_1111","tema":"1111","texto":"TEMA 1111: (i) o infortúnio qualificado como acidente\nde trabalho pode também ser caracterizado como sinistro coberto pelo\nseguro obrigatório (DPVAT), desde que estejam presentes seus elementos\nconstituintes: acidente causado por veículo automotor terrestre, dano\npessoal e relação de causalidade, e (ii) os sinistros que envolvem\nveículos agrícolas passíveis de transitar pelas vias públicas terrestres\nestão cobertos pelo seguro obrigatório (DPVAT). ([REsp\n1936665/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101350570);\n[REsp\n1937399/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202101403497))\n(INFO 751)","refs":["1111"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rep_2022_1120","tema":"1120","texto":"TEMA 1120: Nada obstante a interpretação restritiva\nque deve ser conferida ao art. 126, §4º, da LEP, os princípios da\nindividualização da pena, da dignidade da pessoa humana, da isonomia e\nda fraternidade, ao lado da teoria da derrotabilidade da norma e da\nsituação excepcionalíssima da pandemia de covid-19, impõem o cômputo do\nperíodo de restrições sanitárias como de e[fetivo estudo ou\ntrabalho] em favor dos presos que já estavam trabalhando ou\nestudando e se viram impossibilitados de continuar seus afazeres\nunicamente em razão do estado pandêmico. ([REsp\n1953607/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202102579184)\n)\n\n<strong>TEMA 1139</strong>: É vedada a utilização de\ninquéritos e/ou ações penais em curso para impedir a aplicação do art.\n33, § 4.º, da Lei n. 11.343/06. ([REsp\n1977027/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103866757)\n; [REsp\n1977180/PR](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103921312))\n<strong>(FGV-TJPE/2022) (VUNESP-TJSP-JUIZ/2024)</strong>","refs":["1139","1120"]}],"DIREITO DO CONSUMIDOR":[{"id":"rep_2022_1095","tema":"1095","texto":"TEMA 1095: [Em contrato de compra e venda de imóvel\ncom garantia de alienação fiduciária **devidamente registrado em\ncartório,** a resolução do pacto, na hipótese de inadimplemento do\ndevedor, devidamente constituído em mora, deverá observar a forma\nprevista na Lei nº 9.514/97, por se tratar de legislação específica,\n<strong>afastando-se,</strong> por conseguinte, a aplicação d**o Código de Defesa do\nConsumidor.<strong> (REsp 1891498-SP).] </strong>(VUNESP-MPRO-PROMOTOR/2024)**","refs":["1095"]}],"DIREITO AMBIENTAL":[{"id":"rep_2022_13__IAC_","tema":"13 (IAC)","texto":"TEMA 13 (IAC): [A) O direito de acesso à informação\nambiental brasileiro compreende:]\n\n[i) o <strong>dever de publicação,</strong> na internet, dos documentos ambientais\ndetidos pela Administração não sujeitos a sigilo **(transparência\nativa);**]\n\n[ii) o <strong>direito de</strong> qualquer pessoa e entidade de <strong>requerer</strong> acesso\na informações ambientais específicas não publicadas **(transparência\npassiva**); e]\n\n[iii) <strong>direito a requerer</strong> a produção de **informação ambiental não\ndisponível<strong> para a Administração (</strong>transparência reativa);**]\n\n[B) Presume-se a obrigação do Estado em favor da transparência\nambiental, sendo ônus da Administração justificar seu descumprimento,\nsempre sujeita a controle judicial, nos seguintes termos:]\n\n[i) na transparência ativa, demonstrando razões administrativas\nadequadas para a opção de não publicar;]\n\n[ii) na transparência passiva, de enquadramento da informação nas razões\nlegais e taxativas de sigilo;e]\n\n[iii) na transparência ambiental reativa, da irrazoabilidade da\npretensão de produção da informação inexistente;]\n\n[C) O <strong>regime registral brasileiro admite a averbação</strong> de informações\n<strong>facultativas</strong> de interesse ao imóvel, inclusive ambientais.]\n\n[D) O Ministério Público pode requerer diretamente ao oficial de\nregistro competente a averbação de informações alusivas a suas funções\ninstitucionais.]\n\n([REsp\n1857098/MS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000064028))\n**(FGV-TRF1/2023) (FGV/2023 - DUAS VEZES) (FGV/2022)\n(VUNESP-MPRO-PROMOTOR/2024) (FGV-TJSC-JUIZ/2024.2)\n(VUNESP-TJSP-JUIZ/2024)**","refs":["13"]}]},"2021":{"DIREITO ADMINISTRATIVO":[{"id":"rep_2021_1028","tema":"1028","texto":"TEMA 1028: O exercício da advocacia, mesmo em causa\nprópria, é incompatível com as atividades desempenhadas\npor servidor ocupante de cargo público de agente de trânsito, nos termos\ndo art. 28, V, da Lei 8.906/94.","refs":["1028"]},{"id":"rep_2021_1043","tema":"1043","texto":"TEMA 1043: O proprietário do veículo apreendido em\nrazão de infração de transporte irregular de madeira [não titulariza\ndireito público subjetivo] de ser nomeado fiel depositário\ndo bem, as providências dos arts. 105 e 106 do Decreto Federal n.\n6.514/2008 competindo ao alvedrio da Administração Pública, em\nfundamentado juízo de oportunidade e de conveniência.","refs":["1043"]},{"id":"rep_2021_1055","tema":"1055","texto":"TEMA 1055: É possível a inclusão do valor de eventual\nmulta civil na medida de indisponibilidade de bens decretada na ação de\nimprobidade administrativa, inclusive naquelas demandas ajuizadas com\nesteio na alegada prática de conduta prevista no art. 11 da Lei\n8.429/1992, tipificador da ofensa aos princípios nucleares\nadministrativos. ([OBS: julgado superado pelo novo art. 16, § 10, da\nLIA, inserido pela Lei nº 14.230/21.)]\n\n<strong>TEMA 1089</strong>: Na <strong>ação civil pública</strong> por ato de\n<strong>improbidade</strong> administrativa é <strong>possível</strong> o <strong>prosseguimento</strong> da\ndemanda para pleitear o <strong>ressarcimento</strong> do dano ao erário, **ainda\nque<strong> sejam declaradas </strong>prescritas as demais sanções** previstas no\nart. 12 da Lei 8.429/92.","refs":["1089","1055"]},{"id":"rep_2021_1097","tema":"1097","texto":"TEMA 1097: [Em se tratando de **multa aplicada às\npessoas jurídicas proprietárias de veículo<strong>, fundamentada na </strong>ausência\nde indicação do condutor infrator,** é obrigatório observar a dupla\nnotificação: a primeira que se refere à autuação da infração e a segunda\nsobre a aplicação da penalidade, conforme estabelecido nos arts. 280,\n281 e 282 do CTB.] ([REsp\n1925456/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202000273310))","refs":["1097"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2021_878","tema":"878","texto":"TEMA 878: 1.) Regra geral, <strong>os juros de mora</strong>\npossuem natureza de <strong>lucros cessantes</strong>, o que permite a incidência do\nImposto de Renda - Precedentes: REsp. n.º 1.227.133 - RS, REsp. n.\n1.089.720 - RS e REsp. n.º 1.138.695 - SC; 2.) Os juros de mora\ndecorrentes do pagamento em atraso de verbas alimentares a pessoas\nfísicas escapam
