dido administrativo não deverá\nimplicar a extinção do feito; (b) caso o INSS já tenha apresentado\ncontestação de mérito, está caracterizado o interesse em agir pela\nresistência à pretensão; e (c) as demais ações que não se enquadrem nos\nitens (a) e (b) serão sobrestadas e baixadas ao juiz de primeiro grau,\nque deverá intimar o autor a dar entrada no pedido administrativo em até\n30 dias, sob pena de extinção do processo por falta de interesse em\nagir. Comprovada a postulação administrativa, o juiz intimará o INSS\npara se manifestar acerca do pedido em até 90 dias. Se o pedido for\nacolhido administrativamente ou não puder ter o seu mérito analisado\ndevido a razões imputáveis ao próprio requerente, extingue-se a ação. Do\ncontrário, estará caracterizado o interesse em agir e o feito deverá\nprosseguir;V -- Em <strong>todos os casos acima</strong> -- itens (a), (b) e (c) --,\n**tanto a análise administrativa quanto a judicial deverão levar em\nconta a data do início da ação como data de entrada do requerimento**,\npara todos os efeitos legais. (RE 631240)","refs":["0350"]},{"id":"rg_2014_0737","tema":"0737","texto":"TEMA 0737: É <strong>inconstitucional</strong> norma que\n<strong>vincula</strong> pensões e proventos de aposentadoria de servidores públicos\nefetivos a subsídios de agentes políticos. (RE 759518)","refs":["0737"]},{"id":"rg_2014_0728","tema":"0728","texto":"TEMA 0728: São <strong>constitucionais</strong> os índices de\ncorreção monetária adotados pelo INSS para reajustar os benefícios\nprevidenciários nos anos de 1997, 1999, 2000, 2001, 2002 e 2003. (ARE\n808107)","refs":["0728"]},{"id":"rg_2014_0166","tema":"0166","texto":"TEMA 0166: É <strong>inconstitucional</strong> a contribuição\nprevidenciária prevista no art. 22, IV, da Lei 8.212/1991, com redação\ndada pela Lei 9.876/1999, que incide sobre o valor bruto da nota fiscal\nou fatura referente a serviços prestados por cooperados por intermédio\nde cooperativas de trabalho. (RE 595838)","refs":["0166"]}],"DIREITO DO TRABALHO":[{"id":"rg_2014_0528","tema":"0528","texto":"TEMA 0528: O art. 384 da CLT, em relação ao período\nanterior à edição da Lei n. 13.467/2017, foi recepcionado pela\nConstituição Federal de 1988, aplicando-se a todas as mulheres\ntrabalhadoras. (RE 658312)","refs":["0528"]},{"id":"rg_2014_0608","tema":"0608","texto":"TEMA 0608: O prazo prescricional aplicável à cobrança\nde valores não depositados no Fundo de Garantia por Tempo de Serviço\n(FGTS) é <strong>quinquenal,</strong> nos termos do art. 7º, XXIX, da Constituição\nFederal. (ARE 709212) <strong>(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)</strong>","refs":["0608"]},{"id":"rg_2014_0514","tema":"0514","texto":"TEMA 0514: I - A **ampliação de jornada de trabalho\nsem alteração da remuneração<strong> do servidor consiste em </strong>violação** da\nregra constitucional da irredutibilidade de vencimentos; II - No caso\nconcreto, o § 1º do art. 1º do Decreto estadual 4.345, de 14 de\nfevereiro de 2005, do Estado do Paraná não se aplica aos servidores\nelencados em seu caput que, antes de sua edição, estavam legitimamente\nsubmetidos a carga horária semanal inferior a quarenta horas. (ARE\n660010)","refs":["0514"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2014_0277","tema":"0277","texto":"TEMA 0277: I - A eventual inconstitucionalidade de\ndesvinculação de receita de contribuições sociais <strong>não acarreta</strong> a\ndevolução ao contribuinte do montante correspondente ao percentual\ndesvinculado, pois a tributação não seria inconstitucional ou ilegal,\núnica hipótese autorizadora da repetição do indébito tributário; II -\n<strong>Não é inconstitucional</strong> a desvinculação, ainda que parcial, do\nproduto da arrecadação das contribuições sociais instituídas pelo art.\n76 do ADCT, seja em sua redação original, seja naquela resultante das\nEmendas Constitucionais 27/2000, 42/2003, 56/2007, 59/2009 e 68/2011.\n(RE 566007)","refs":["0277"]},{"id":"rg_2014_0323","tema":"0323","texto":"TEMA 0323: A receita auferida pelas cooperativas de\ntrabalho decorrentes dos atos (negócios jurídicos) firmados com\nterceiros se insere na materialidade da contribuição ao PIS/PASEP. (RE\n599362)","refs":["0323"]},{"id":"rg_2014_0177","tema":"0177","texto":"TEMA 0177: São <strong>legítimas</strong> as alterações\nintroduzidas pela Medida Provisória 1.858/1999, no que revogou a isenção\nda COFINS e da contribuição para o PIS concedidas às sociedades\ncooperativas. (RE 598085)","refs":["0177"]},{"id":"rg_2014_0368","tema":"0368","texto":"TEMA 0368: O Imposto de Renda incidente sobre verbas\nrecebidas acumuladamente <strong>deve observar</strong> o regime de competência,\naplicável a alíquota correspondente ao valor recebido mês a mês, e não a\nrelativa ao total satisfeito de uma única vez. (RE 614406)","refs":["0368"]},{"id":"rg_2014_0299","tema":"0299","texto":"TEMA 0299: A <strong>redução</strong> da base de cálculo de ICMS\n<strong>equivale à isenção parcial,</strong> o que acarreta a [anulação\nproporcional] de crédito relativo às operações anteriores,\n<strong>salvo</strong> disposição em lei estadual em sentido contrário. (RE 635688)","refs":["0299"]},{"id":"rg_2014_0644","tema":"0644","texto":"TEMA 0644: A <strong>imunidade tributária recíproca</strong>\nreconhecida à Empresa Brasileira de Correios e Telégrafos --- ECT\n<strong>alcança</strong> o IPTU incidente sobre [imóveis de sua propriedade e por ela\nutilizados,] não se podendo estabelecer, a priori, nenhuma\ndistinção entre os imóveis afetados ao serviço postal e aqueles afetados\nà atividade econômica. (RE 773992) <strong>(FGV-TRF1-JUIZ/2023)</strong>","refs":["0644"]},{"id":"rg_2014_0615","tema":"0615","texto":"TEMA 0615: É <strong>inconstitucional</strong> a cobrança de ICMS\npelo Estado de destino, com fundamento no Protocolo ICMS 21/2011 do\nCONFAZ, nas operações interestaduais de venda de mercadoria ou bem\nrealizadas de forma não presencial a **consumidor final não contribuinte\ndo imposto**. (RE 680089)","refs":["0615"]},{"id":"rg_2014_0297","tema":"0297","texto":"TEMA 0297: <strong>Não incide</strong> o ICMS na operação de\narrendamento mercantil internacional, <strong>salvo</strong> na hipótese de\nantecipação da opção de compra, quando configurada a transferência da\ntitularidade do bem. (RE 540829)","refs":["0297"]},{"id":"rg_2014_0084","tema":"0084","texto":"TEMA 0084: É <strong>formalmente inconstitucional,</strong> por\nofensa ao artigo 146, inciso III, alínea \"a\", da Constituição Federal, o\n§ 2º do artigo 14 da Lei nº 4.502/1964, com a redação dada pelo artigo\n15 da Lei nº 7.798/1989, no ponto em que prevê a inclusão de d[escontos\nincondicionais] na base de cálculo do Imposto sobre Produtos\nIndustrializados -- IPI, em descompasso com a disciplina\nda matéria no artigo 47, inciso II, alínea \"a\", do Código Tributário\nNacional. (RE 567935)","refs":["0084"]},{"id":"rg_2014_0224","tema":"0224","texto":"TEMA 0224: A imunidade tributária recíproca **não\nexonera** o sucessor das obrigações tributárias relativas aos fatos\njurídicos tributários ocorridos antes da sucessão. (RE\n599176) **(FGV-ENAM MANAUS/2024) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["0224"]},{"id":"rg_2014_0721","tema":"0721","texto":"TEMA 0721: São <strong>inconstitucionais</strong> a instituição e a\ncobrança de <strong>taxas</strong> por emissão ou <strong>remessa de carnês/guias</strong> de\nrecolhimento de tributos. (RE 789218) **(FGV-TJMS-ANALISTA\nJUDICIÁRIO/2024) (FGV-TJAP-JUIZ/2022) (FGV-PREF DE\nMACAÉ/RJ-PROCURADOR/2024)**\n\n\\[Na ementa: (\\...) 1. A emissão de guia de recolhimento de tributos é\n<strong>de interesse exclusivo da Administração</strong>, sendo mero instrumento de\narrecadação, **não envolvendo a prestação de um serviço público ao\ncontribuinte.** (\\...)\\]","refs":["0721"]},{"id":"rg_2014_0432","tema":"0432","texto":"TEMA 0432: A <strong>imunidade</strong> tributária prevista no art.\n195, § 7º, da Constituição Federal <strong>abrange</strong> a contribuição para o\nPIS. (RE 636941)","refs":["0432"]},{"id":"rg_2014_0278","tema":"0278","texto":"TEMA 0278: I - A contribuição para o PIS está sujeita\nao princípio da <strong>anterioridade nonagesimal</strong> previsto no art. 195, §\n6º, da Constituição Federal; II - Nos casos em que a majoração de\nalíquota tenha sido estabelecida somente na conversão de medida\nprovisória em lei, a contribuição apenas poderá ser exigida após noventa\ndias da publicação da lei de conversão. (RE 568503)","refs":["0278"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2014_0018","tema":"0018","texto":"TEMA 0018: Os <strong>honorários</strong> advocatícios incluídos na\ncondenação ou destacados do montante principal devido ao credor\n<strong>consubstanciam verba de natureza alimentar</strong> cuja satisfação ocorrerá\ncom a expedição de precatório ou requisição de pequeno valor, observada\nordem especial restrita aos créditos dessa natureza. (RE 564132)","refs":["0018"]},{"id":"rg_2014_0511","tema":"0511","texto":"TEMA 0511: É <strong>constitucionalmente vedada</strong> a\n<strong>compensação unilateral</strong> de débitos em proveito exclusivo da Fazenda\nPública <strong>ainda que</strong> os valores envolvidos não estejam sujeitos ao\nregime de precatórios, mas apenas à sistemática da requisição de pequeno\nvalor. (RE 657686)","refs":["0511"]},{"id":"rg_2014_0136","tema":"0136","texto":"TEMA 0136: <strong>Não cabe</strong> ação rescisória quando o\njulgado estiver em <strong>harmonia</strong> com o entendimento firmado pelo Plenário\ndo <strong>Supremo</strong> à época da formalização do acórdão rescindendo, **ainda\nque** ocorra posterior superação do precedente. (RE 590809)\n**(FGV-DPERJ-DEFENSOR/2023) (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["0136"]},{"id":"rg_2014_0148","tema":"0148","texto":"TEMA 0148: A interpretação do § 4º do art. 100,\nalterado e hoje § 8º do art. 100 da Constituição da República, permite o\npagamento dos débitos em execução nos casos de litisconsórcio\nfacultativo. (RE 568645)","refs":["0148"]},{"id":"rg_2014_0471","tema":"0471","texto":"TEMA 0471: Com fundamento no art. 127 da Constituição\nFederal, o Ministério Público está <strong>legitimado</strong> a promover a tutela\ncoletiva de direitos individuais homogêneos, **mesmo de natureza\ndisponível,** quando a lesão a tais direitos, visualizada em seu\nconjunto, em forma coletiva e impessoal, <strong>transcender</strong> a esfera de\ninteresses puramente particulares, passando a comprometer relevantes\ninteresses sociais. (RE 631111) <strong>(FGV-TRF1-OFICIAL DE JUSTIÇA/2024)</strong>","refs":["0471"]},{"id":"rg_2014_0082","tema":"0082","texto":"TEMA 0082: I -- A previsão estatutária genérica **não\né suficiente** para legitimar a atuação, em Juízo, de associações na\ndefesa de direitos dos filiados, sendo <strong>indispensável</strong> autorização\nexpressa, <strong>ainda que</strong> deliberada em assembleia, nos termos do artigo\n5º, inciso XXI, da Constituição Federal;II -- As balizas subjetivas do\ntítulo judicial, formalizado em ação proposta por associação, são\ndefinidas pela representação no processo de conhecimento, limitada a\nexecução aos associados apontados na inicial. (RE 573232)","refs":["0082"]}]},"2013":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2013_0024","tema":"0024","texto":"TEMA 0024: I - O art. 37, XIV, da Constituição\nFederal, na redação dada pela Emenda Constitucional 19/98, é\n<strong>autoaplicável</strong>; II - Não há direito adquirido a regime jurídico,\nnotadamente à forma de composição da remuneração de servidores públicos,\nobservada a garantia da irredutibilidade de vencimentos. (RE 563708)\n<strong>(FGV-SMF/RJ-FISCAL DE RENDAS/2023)</strong>","refs":["0024"]},{"id":"rg_2013_0473","tema":"0473","texto":"TEMA 0473: <strong>Não encontra amparo constitucional</strong> a\npretensão de acumular, no cargo de magistrado ou em qualquer outro, a\nvantagem correspondente a \"quintos\", a que o titular fazia jus quando no\nexercício de cargo diverso. (RE 587371)","refs":["0473"]},{"id":"rg_2013_0005","tema":"0005","texto":"TEMA 0005: I - Ao editar a Lei 8.880/1994, a União\nlegislou sobre o sistema monetário e exerceu a sua competência prevista\nno art. 22, VI, da Constituição de 1988. Assim, qualquer lei, seja ela\nestadual ou municipal, que discipline a conversão da moeda Cruzeiro Real\nem URV no que tange à remuneração de seus servidores de uma forma\nincompatível com a prevista na Lei nº 8.880/94 será inconstitucional,\nmormente quando acarretar redução de vencimentos; II - O término da\nincorporação, na remuneração do servidor, do percentual devido em razão\nda ilegalidade na conversão de Cruzeiros Reais em URV deve ocorrer no\nmomento em que a carreira do servidor passa por uma restruturação\nremuneratória. (RE 561836)","refs":["0005"]},{"id":"rg_2013_0351","tema":"0351","texto":"TEMA 0351: A Gratificação de Desempenho do Plano Geral\nde Cargos do Poder Executivo --- GDPGPE, prevista na Lei nº 11.357/2006,\nestende-se aos inativos e pensionistas, no patamar de oitenta pontos,\naté o implemento da avaliação dos servidores em atividade. (RE 631389)","refs":["0351"]},{"id":"rg_2013_0335","tema":"0335","texto":"TEMA 0335: <strong>Inexiste direito</strong> dos candidatos em\nconcurso público à <strong>prova de segunda chamada</strong> nos teste de **aptidão\nfísica<strong>, </strong>salvo** contrária disposição editalícia, em razão de\ncircunstâncias pessoais, ainda que de caráter fisiológico ou de força\nmaior, mantida a validade das provas de segunda chamada realizadas até\n15/5/2013, em nome da segurança jurídica. (RE 630733)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0335"]},{"id":"rg_2013_0530","tema":"0530","texto":"TEMA 0530: É <strong>lícito</strong> ao impetrante <strong>desistir</strong> da\nação de mandado de segurança, <strong>independentemente</strong> de aquiescência da\nautoridade apontada como coatora ou da entidade estatal interessada ou,\nainda, quando for o caso, dos litisconsortes passivos necessários, a\nqualquer momento antes do término do julgamento, **mesmo após eventual\nsentença concessiva do 'writ' constitucional,** não se aplicando, em tal\nhipótese, a norma inscrita no art. 267, § 4º, do CPC/1973. (RE 669367)","refs":["0530"]},{"id":"rg_2013_0646","tema":"0646","texto":"TEMA 0646: O estabelecimento de <strong>limite de idade</strong>\npara inscrição em concurso público apenas é legítimo **quando\njustificado** pela natureza das atribuições do cargo a ser preenchido.\n(ARE 678112)","refs":["0646"]},{"id":"rg_2013_0312","tema":"0312","texto":"TEMA 0312: É <strong>inconstitucional</strong>, por omissão\nparcial, o parágrafo único do art. 34 da Lei 10.741/2003 (Estatuto do\nIdoso). (RE 580963)","refs":["0312"]},{"id":"rg_2013_0027","tema":"0027","texto":"TEMA 0027: É <strong>inconstitucional</strong> o § 3º do artigo 20\nda Lei 8.742/1993, que estabelece a renda familiar mensal per capita\ninferior a um quarto do salário mínimo [como requisito\nobrigatório] para concessão do benefício assistencial de\nprestação continuada previsto no artigo 203, V, da Constituição. (RE\n567985)","refs":["0027"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2013_0311","tema":"0311","texto":"TEMA 0311: São inconstitucionais o § 1º do artigo 30\nda Lei nº 7.730/1989 e o artigo 30 da Lei nº 7.799/1989. (RE 221142)","refs":["0311"]},{"id":"rg_2013_0171","tema":"0171","texto":"TEMA 0171: Após a Emenda Constitucional 33/2001, é\n<strong>constitucional</strong> a incidência de ICMS sobre operações de\n<strong>importação</strong> efetuadas por pessoa, física ou jurídica, que não se\ndedica habitualmente ao comércio ou à prestação de serviços. (RE 439796)","refs":["0171"]},{"id":"rg_2013_0693","tema":"0693","texto":"TEMA 0693: A <strong>imunidade</strong> tributária prevista no art.\n150, VI, c, da CF/88 <strong>aplica-se</strong> aos bens imóveis, temporariamente\nociosos, de propriedade das instituições de educação e de assistência\nsocial sem fins lucrativos que atendam os requisitos legais. (RE 767332)","refs":["0693"]},{"id":"rg_2013_0692","tema":"0692","texto":"TEMA 0692: A Anotação de Responsabilidade Técnica,\ninstituída pela Lei 6.496/1977, cobrada pelos Conselhos Regionais de\nEngenharia, Arquitetura e Agronomia, tem natureza jurídica de taxa,\nsendo, portanto, necessária a observância do princípio da legalidade\ntributária previsto no art. 150, I, da Constituição Federal. (ARE\n748445)","refs":["0692"]},{"id":"rg_2013_0688","tema":"0688","texto":"TEMA 0688: É <strong>constitucional</strong> a incidência do ISS\nsobre a prestação de serviços de r**egistros públicos, cartorários e\nnotariais**, devidamente previstos em legislação tributária municipal.\n(RE 756915) <strong>(FGV-ENAC/2025)</strong>","refs":["0688"]},{"id":"rg_2013_0682","tema":"0682","texto":"TEMA 0682: <strong>Inexiste</strong>, na Constituição Federal de\n1988, <strong>reserva de iniciativa para leis de natureza tributária,</strong>\ninclusive para as que concedem renúncia fiscal. (ARE 743480)\n**(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2023) (FGV-ENAM 2/2024)\n(FGV-PCMG-DELEGADO/2025) (FGV-TJES-JUIZ/2023)**\n\n\\[A questão do enam 2 trazia alternativa afirmando que a criação de\ndeterminada contribuição era reserva de iniciativa do presidente da\nrepública\\]","refs":["0682"]},{"id":"rg_2013_0211","tema":"0211","texto":"TEMA 0211: A <strong>majoração</strong> do valor venal dos imóveis\npara efeito da cobrança de IPTU <strong>não prescinde</strong> da edição de lei em\nsentido formal, exigência que somente se pode afastar quando a\natualização não excede os índices inflacionários anuais de correção\nmonetária. (RE 648245)","refs":["0211"]},{"id":"rg_2013_0209","tema":"0209","texto":"TEMA 0209: A contribuição para o Finsocial, incidente\nsobre o faturamento das empresas, não está abrangida pela imunidade\nobjetiva prevista no art. 150, VI, d, da Constituição Federal de 1988,\nanterior art. 19. III, d, da Carta de 1967/1969. (RE 628122)","refs":["0209"]},{"id":"rg_2013_0450","tema":"0450","texto":"TEMA 0450: É <strong>devida</strong> correção monetária no período\ncompreendido entre a data de elaboração [do cálculo da\nrequisição] de pequeno valor -- RPV e [sua\nexpedição] para pagamento. (ARE 638195)","refs":["0450"]},{"id":"rg_2013_0329","tema":"0329","texto":"TEMA 0329: É <strong>inconstitucional</strong> a incidência da\ncontribuição ao PIS e da COFINS sobre a receita decorrente da variação\ncambial positiva obtida nas operações de exportação de produtos. (RE\n627815)","refs":["0329"]},{"id":"rg_2013_0283","tema":"0283","texto":"TEMA 0283: É <strong>inconstitucional</strong> a incidência da\ncontribuição ao PIS e da COFINS não cumulativas sobre os valores\nrecebidos por empresa exportadora em razão da transferência a terceiros\nde créditos de ICMS. (RE 606107)","refs":["0283"]},{"id":"rg_2013_0645","tema":"0645","texto":"TEMA 0645: O Ministério Público **não possui\nlegitimidade a**tiva ad causam para, em ação civil pública, deduzir em\njuízo pretensão de natureza tributária em defesa dos contribuintes, que\nvise questionar a constitucionalidade/legalidade de tributo. (ARE\n694294)","refs":["0645"]},{"id":"rg_2013_0227","tema":"0227","texto":"TEMA 0227: A contribuição destinada ao Serviço\nBrasileiro de Apoio às Micro e Pequenas Empresas - Sebrae **possui\nnatureza de contribuição de intervenção no domínio econômico<strong> e </strong>[não\nnecessita] de edição de lei complementar** para ser\ninstituída. (RE 635682) **(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(FGV-SEFAZ/MT-FISCAL DE TRIBUTOS/2023)<strong> </strong>(FGV-TRF3-JUIZ/2025)**","refs":["0227"]},{"id":"rg_2013_0537","tema":"0537","texto":"TEMA 0537: O art. 74 da MP 2.158-35 aplica-se às\nempresas nacionais controladoras de pessoas jurídicas sediadas em países\nde tributação favorecida ou desprovidos de controles societários e\nfiscais adequados, sendo inconstitucional o parágrafo único do mesmo\ndispositivo legal, o qual não incide sobre os lucros apurados até\n31.12.2001. (RE 611586)","refs":["0537"]},{"id":"rg_2013_0001","tema":"0001","texto":"TEMA 0001: É <strong>inconstitucional</strong> a parte do art. 7º,\nI, da Lei 10.865/2004 que acresce à base de cálculo da denominada\nPIS/COFINS-Importação o valor do ICMS incidente no desembaraço aduaneiro\ne o valor das próprias contribuições. (RE 559937)","refs":["0001"]},{"id":"rg_2013_0235","tema":"0235","texto":"TEMA 0235: Os serviços prestados pela Empresa\nBrasileira de Correios e Telégrafos - ECT, inclusive aqueles em que a\nempresa não age em regime de monopólio, **estão abrangidos pela\nimunidade tributária recíproca** (CF, art. 150, VI,a e §§ 2º e 3º). (RE\n601392) <strong>(FGV-CÂMARA MUN DE SP-PROCUR. LEGISL/2024)</strong> **(FGV-SEFAZ/MT-\nFISCAL DE TRIBUTOS/2023)**","refs":["0235"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2013_0635","tema":"0635","texto":"TEMA 0635: É assegurada ao servidor público inativo a\n<strong>conversão de férias não gozadas</strong>, ou de outros direitos de natureza\nremuneratória, em indenização pecuniária, dada a responsabilidade\nobjetiva da Administração Pública em virtude da vedação ao\nenriquecimento sem causa. Obs.: após a oposição de embargos de\ndeclaração o STF decidiu permitir o processamento do recurso\nextraordinário para julgar a questão em relação aos servidores públicos\nem atividade. (ARE 721001) <strong>(FGV-TJPE-JUIZ/2024)</strong>","refs":["0635"]},{"id":"rg_2013_0439","tema":"0439","texto":"TEMA 0439: Desde que mantida a irredutibilidade, **não\ntem** o servidor inativo, embora aposentado na última classe da carreira\nanterior, o <strong>direito de perceber</strong> proventos correspondentes aos da\núltima classe da nova carreira, reestruturada por lei superveniente. (RE\n606199)","refs":["0439"]},{"id":"rg_2013_0131","tema":"0131","texto":"TEMA 0131: A Empresa Brasileira de Correios e\nTelégrafos - ECT tem o <strong>dever jurídico de motivar</strong>, em ato formal, a\ndemissão de seus empregados. (RE 589998) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0131"]}],"DIREITO ELEITORAL":[{"id":"rg_2013_0680","tema":"0680","texto":"TEMA 0680: A partir das eleições de 2014, inclusive, o\n<strong>Ministério Público Eleitoral tem legitimidade</strong> para recorrer da\ndecisão que julga o pedido de registro de candidatura, ainda que não\ntenha apresentado impugnação. (ARE 728188) **(FGV-MPGO-PROMOTOR/2024)\n(VUNESP-TJSP-JUIZ/2023)**","refs":["0680"]}],"DIREITO PENAL":[{"id":"rg_2013_0169","tema":"0169","texto":"TEMA 0169: I -- É <strong>inadmissível</strong> a aplicação da\ncausa de <strong>diminuição</strong> prevista no art. 33, § 4º, da Lei 11.343/2006 à\npena relativa à condenação por crime cometido na vigência da Lei\n6.368/1976; II -- <strong>Não é possível a conjugação</strong> de partes mais\nbenéficas das referidas normas, para criar-se uma terceira lei, sob pena\nde [violação aos princípios da legalidade e da separação de\nPoderes]; III -- O juiz, contudo, deverá, no caso concreto,\navaliar qual das mencionadas leis é mais favorável ao réu e aplicá-la em\nsua integralidade. (RE 600817) <strong>(FGV-TCEPA-AUDITOR/2024)</strong>","refs":["0169"]},{"id":"rg_2013_0113","tema":"0113","texto":"TEMA 0113: O art. 25 da Lei de Contravenções Penais\n(Decreto-lei 3.688/1941) n<strong>ão foi recepcionado</strong> pela Constituição de\n1988, por [violar os princípios da dignidade da pessoa\nhumana] (CF, art. 1º, III) e da isonomia (CF,\nart. 5º, caput e I). (RE 583523)","refs":["0113"]},{"id":"rg_2013_0650","tema":"0650","texto":"TEMA 0650: É <strong>incabível</strong> a aplicação <strong>retroativa</strong>\ndo art. 30 da Lei 10.826/2003, inserido pela Medida Provisória 417/2008,\npara extinguir a punibilidade do delito de posse de arma de fogo de uso\npermitido cometido antes da sua entrada em vigor. (RE 768494)","refs":["0650"]},{"id":"rg_2013_0059","tema":"0059","texto":"TEMA 0059: A Lei nº 11.464/07, que majorou o tempo\nnecessário para progressão no cumprimento da pena, <strong>não se aplica</strong> a\nsituações jurídicas que retratem crime hediondo ou equiparado cometido\nem momento anterior à respectiva vigência. (RE 579167)","refs":["0059"]},{"id":"rg_2013_0114","tema":"0114","texto":"TEMA 0114: Surge <strong>harmônico</strong> com o princípio\nconstitucional da individualização da pena o <strong>inciso I do artigo 61</strong>\ndo Código Penal, no que prevê, como agravante, a reincidência. (RE\n453000) <strong>(FGV-TJMT-JUIZ/2024)</strong>","refs":["0114"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2013_0313","tema":"0313","texto":"TEMA 0313: I -- <strong>Inexiste prazo decadencial</strong> para a\nconcessão inicial do benefício previdenciário;II -- Aplica-se o prazo\ndecadencial de <strong>dez anos para a revisão</strong> de benefícios concedidos,\ninclusive os anteriores ao advento da Medida Provisória 1.523/1997,\nhipótese em que a contagem do prazo deve iniciar-se em 1º de agosto de\n1997. (RE 626489)","refs":["0313"]},{"id":"rg_2013_0334","tema":"0334","texto":"TEMA 0334: Para o cálculo da renda mensal inicial,\ncumpre observar o quadro mais favorável ao beneficiário, pouco\nimportando o decesso remuneratório ocorrido em data posterior ao\nimplemento das condições legais para a aposentadoria, respeitadas a\ndecadência do direito à revisão e a prescrição quanto às prestações\nvencidas. (RE 630501)","refs":["0334"]},{"id":"rg_2013_0190","tema":"0190","texto":"TEMA 0190: Compete à <strong>Justiça comum</strong> o processamento\nde demandas ajuizadas contra entidades privadas de previdência com o\npropósito de obter complementação de aposentadoria, mantendo-se na\nJustiça Federal do Trabalho, até o trânsito em julgado e correspondente\nexecução, todas as causas dessa espécie em que houver sido proferida\nsentença de mérito até 20/2/2013. (RE 586453)","refs":["0190"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2013_0154","tema":"0154","texto":"TEMA 0154: Qualquer decisão do Poder Judiciário que\n<strong>rejeite denúncia, que impronuncie ou absolva, sumariamente,</strong> os réus\nou, ainda, que ordene a <strong>extinção</strong>, em sede de \"habeas corpus\", de\n<strong>procedimentos penais</strong> [não transgride o monopólio constitucional da\nação penal pública] (CF, art. 129, I) <strong>nem ofende</strong> os\npostulados do juiz natural (CF, art. 5º, inciso LIII) e da soberania do\nveredicto do Júri (CF, art. 5º, inciso XXXVIII, \"c\"). (RE 593443)","refs":["0154"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2013_0549","tema":"0549","texto":"TEMA 0549: A prerrogativa processual da Fazenda\nPública Federal de receber intimações pessoais, nos termos do art. 17 da\nLei 10.910/2004, <strong>não tem aplicação</strong> no âmbito do procedimento dos\nJuizados Especiais Federais. (ARE 648629)","refs":["0549"]}]},"2012":{"DIREITO ELEITORAL":[{"id":"rg_2012_0564","tema":"0564","texto":"TEMA 0564: I - O art. 14, § 5º, da Constituição deve\nser interpretado no sentido de que a **proibição da segunda reeleição é\nabsoluta** e torna inelegível para determinado cargo de Chefe do Poder\nExecutivo o cidadão que <strong>já exerceu dois mandatos consecutivos</strong>\n(reeleito uma única vez) em cargo da mesma natureza, ainda que em ente\nda Federação diverso;II - As decisões do Tribunal Superior Eleitoral -\nTSE que, no curso do pleito eleitoral ou logo após o seu encerramento,\nimpliquem mudança de jurisprudência não têm aplicabilidade imediata. (RE\n637485/RJ) **(FGV-TJMS-JUIZ/2023) (FGV-CÂMARA MUN DE SP-PROC/2024)\n(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023)\n(VUNESP-TJSP-JUIZ/2023)**","refs":["0564"]}],"DIREITO PENAL":[{"id":"rg_2012_0626","tema":"0626","texto":"TEMA 0626: É <strong>inconstitucional</strong> a **vedação à\nconversão** da pena privativa de liberdade em restritiva de direitos,\nprevista nos artigos 33, § 4º, e 44, caput, da Lei 11.343/2006. (ARE\n663261)","refs":["0626"]},{"id":"rg_2012_0453","tema":"0453","texto":"TEMA 0453: O foro especial por prerrogativa de função\n<strong>não se estende</strong> a magistrados aposentados. (RE 549560)\n(VUNESP-MPRJ-PROMOTOR/2024)","refs":["0453"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2012_0013","tema":"0013","texto":"TEMA 0013: É <strong>inconstitucional</strong> o art. 13 da Lei\n8.620/1993, na parte em que estabelece que os sócios de empresas por\ncotas de responsabilidade limitada respondem <strong>solidariamente</strong>, com\nseus bens pessoais, por débitos junto à Seguridade Social. (RE 562276)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0013"]},{"id":"rg_2012_0572","tema":"0572","texto":"TEMA 0572: Compete à <strong>Justiça comum estadual</strong>\nprocessar e julgar causas alusivas à parcela do imposto de renda retido\nna fonte pertencente ao Estado-membro, porque **ausente o interesse da\nUnião**. (RE 684169)","refs":["0572"]},{"id":"rg_2012_0518","tema":"0518","texto":"TEMA 0518: Nos termos da Súmula 732 do STF, é\nconstitucional a cobrança da contribuição do salário-educação. (RE\n660933)","refs":["0518"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2012_0594","tema":"0594","texto":"TEMA 0594: As regras dos parágrafos 4º e 5º do artigo\n40 da Constituição Federal, na redação anterior à EC 20/1998, não se\naplicam ao servidor submetido ao regime da Consolidação das Leis do\nTrabalho que se aposentou ou faleceu antes do advento da Lei nº\n8.112/1990. (RE 627294)","refs":["0594"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2012_0565","tema":"0565","texto":"TEMA 0565: É <strong>possível</strong> a exclusão, em processo\nadministrativo, de policial militar que comete faltas disciplinares,\n<strong>independentemente</strong> do curso de ação penal instaurada em razão da\nmesma conduta. (ARE 691306)","refs":["0565"]},{"id":"rg_2012_0191","tema":"0191","texto":"TEMA 0191: É <strong>constitucional</strong> o art. 19-A da Lei\n8.036/1990, que dispõe ser devido o depósito do Fundo de Garantia do\nTempo de Serviço - FGTS na conta de trabalhador cujo contrato com a\nAdministração Pública seja declarado nulo por ausência de prévia\naprovação em concurso público, desde que mantido o direito ao salário.\n(RE 596478)","refs":["0191"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2012_0116","tema":"0116","texto":"TEMA 0116: É <strong>inconstitucional</strong> o art. 29-C da Lei\n8.036/1990, introduzido pelo art. 9º da MP 2.164-41/2001, que veda a\ncondenação em honorários advocatícios nas ações entre o FGTS e os\ntitulares de contas vinculadas, bem como naquelas em que figuram os\nrespectivos representantes ou substitutos processuais. (RE 581160)","refs":["0116"]},{"id":"rg_2012_0054","tema":"0054","texto":"TEMA 0054: I - A Gratificação de Desempenho de\nAtividade de Ciência e Tecnologia -- GDACT, instituída pela Medida\nProvisória 2.048/2000, apesar de originalmente concebida como\ngratificação pro labore faciendo, teve caráter geral e foi estendida aos\ninativos até a sua regulamentação pelo Decreto 3.762/2001, quando passou\na constituir gratificação paga em razão do efetivo exercício de cargo;\nII - É constitucional o art. 60-A acrescentado pela Lei 10.769/2003 à MP\n2.229- 43/2001, dado que não implicou redução indevida, visto que, após\no Decreto 3.762/2001, deixou de existir o direito dos inativos à\npercepção da GDACT nas mesmas condições em que concedida aos servidores\nem atividade. (RE 572884)","refs":["0054"]}]},"2011":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2011_0087","tema":"0087","texto":"TEMA 0087: As vendas inadimplidas <strong>não podem</strong> ser\nexcluídas da base de cálculo da contribuição ao PIS e da COFINS, visto\nque <strong>integram a receita da pessoa jurídica</strong>. (RE 586482)","refs":["0087"]},{"id":"rg_2011_0063","tema":"0063","texto":"TEMA 0063: O crédito-prêmio de IPI, incentivo fiscal\nde natureza setorial instituído pelo art. 1º do Decreto-Lei 491/1969,\ndeixou de vigorar em 5/10/1990 ante a ausência de sua confirmação por\nlei no prazo de dois anos após a publicação da Constituição de 1988,\nconforme definido no § 1º do art. 41 do Ato das Disposições\nConstitucionais Transitórias - ADCT. (RE 561485)","refs":["0063"]},{"id":"rg_2011_0004","tema":"0004","texto":"TEMA 0004: É <strong>inconstitucional</strong> o art. 4º, segunda\nparte, da Lei Complementar 118/2005, de modo que, para os tributos\nsujeitos a homologação, o novo prazo de 5 anos para a repetição ou\ncompensação de indébito aplica-se tão somente às ações ajuizadas após o\ndecurso da vacatio legis de 120 dias, ou seja, a partir de 9 de junho de\n2005. (RE 566621)","refs":["0004"]},{"id":"rg_2011_0302","tema":"0302","texto":"TEMA 0302: É <strong>constitucional</strong> a substituição\ntributária prevista no art. 31 da Lei 8.212/1991, com redação dada pela\nLei 9.711/98, que determinou a retenção de 11% do valor bruto da nota\nfiscal ou fatura de prestação de serviço. (RE 603191)","refs":["0302"]},{"id":"rg_2011_0202","tema":"0202","texto":"TEMA 0202: É <strong>inconstitucional</strong> a contribuição, a\nser recolhida pelo empregador rural pessoa física, incidente sobre a\nreceita bruta proveniente da comercialização de sua produção, prevista\nno art. 25 da Lei 8.212/1991, com a redação dada pelo art. 1º da Lei\n8.540/1992. (RE 596177)","refs":["0202"]},{"id":"rg_2011_0412","tema":"0412","texto":"TEMA 0412: A Empresa Brasileira de Infraestrutura\nAeroportuária - <strong>INFRAERO</strong>, <strong>empresa pública</strong> prestadora de serviço\npúblico, <strong>faz jus à imunidade recíproca</strong> prevista no art. 150, VI, a,\nda Constituição Federal. (ARE 638315)","refs":["0412"]},{"id":"rg_2011_0408","tema":"0408","texto":"TEMA 0408: É <strong>compatível</strong> com a Constituição o art.\n34 da Lei 6.830/1980, que afirma incabível apelação em casos de execução\nfiscal cujo valor seja inferior a 50 ORTN. (ARE 637975)","refs":["0408"]},{"id":"rg_2011_0094","tema":"0094","texto":"TEMA 0094: É <strong>constitucional</strong> a Emenda\nConstitucional nº 29, de 2000, no que estabeleceu a possibilidade de\nprevisão legal de <strong>alíquotas progressivas para o IPTU</strong> de acordo com o\nvalor do imóvel.","refs":["0094"]},{"id":"rg_2011_0214","tema":"0214","texto":"TEMA 0214: I - É <strong>constitucional</strong> a inclusão do\nvalor do Imposto sobre Circulação de Mercadorias e Serviços - **ICMS na\nsua própria base de cálculo<strong>; II - É </strong>legítima<strong> a </strong>utilização**, por\nlei, da taxa <strong>SELIC</strong> como índice de atualização de débitos\ntributários; III- <strong>Não é confiscatória</strong> a <strong>multa</strong> moratória no\npatamar de <strong>20%.</strong> (RE 582461) <strong>(FGV-TJMT-JUIZ/2024)</strong>","refs":["0214"]},{"id":"rg_2011_0216","tema":"0216","texto":"TEMA 0216: O ICMS <strong>não incide</strong> sobre alienação de\nsalvados de sinistro pelas seguradoras. (RE 588149)","refs":["0216"]},{"id":"rg_2011_0107","tema":"0107","texto":"TEMA 0107: A Emenda Constitucional 10/1996,\nespecialmente quanto ao inciso III do art. 72 do ADCT, é um novo texto e\nveicula nova norma, não sendo mera prorrogação da Emenda Constitucional\nde Revisão 1/1994, devendo, portanto, observância ao princípio da\nanterioridade nonagesimal, porquanto majorou a alíquota da CSLL para as\npessoas jurídicas referidas no § 1º do art. 22 da Lei nº 8.212/1991. (RE\n587008)","refs":["0107"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2011_0414","tema":"0414","texto":"TEMA 0414: Compete à <strong>Justiça Comum Estadual</strong> julgar\nas <strong>ações acidentárias</strong> que, propostas pelo <strong>segurado contra</strong> o\nInstituto Nacional do Seguro Social (<strong>INSS</strong>), visem à [prestação de\nbenefícios relativos a acidentes] de trabalho. (RE 638483)","refs":["0414"]},{"id":"rg_2011_0305","tema":"0305","texto":"TEMA 0305: Compete à <strong>Justiça comum estadual</strong>\nprocessar e julgar as <strong>ações de cobrança</strong> ou os feitos executivos de\nhonorários advocatícios arbitrados em favor de advogado dativo em ações\ncíveis e criminais. (RE 607520)","refs":["0305"]},{"id":"rg_2011_0380","tema":"0380","texto":"TEMA 0380: O art. 17 do ADCT <strong>alcança</strong> as situações\njurídicas cobertas pela coisa julgada. (RE 600658)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0380"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2011_0241","tema":"0241","texto":"TEMA 0241: O Exame, inicialmente previsto no artigo\n48, inciso III, da Lei nº 4.215/63 e hoje no artigo 8º, inciso IV, da\nLei nº 8.906/94, mostra-se <strong>consentâneo com a Constituição Federal</strong>.\nCom ela é compatível a prerrogativa conferida à Ordem dos Advogados do\nBrasil para aplicação do exame de suficiência relativo ao acesso à\nadvocacia. (RE 603583)","refs":["0241"]},{"id":"rg_2011_0162","tema":"0162","texto":"TEMA 0162: É <strong>inconstitucional</strong> a percepção\n<strong>cumulativa de duas pensões</strong> estatutárias pela <strong>morte</strong> de **servidor\naposentado que reingressara** no serviço público, por meio de concurso,\nantes da edição da EC 20/1998 e falecera após o seu advento. (RE 584388)","refs":["0162"]},{"id":"rg_2011_0448","tema":"0448","texto":"TEMA 0448: É <strong>incompatível</strong> com a Constituição a\nextensão, aos policiais militares inativos e pensionistas, do adicional\nde insalubridade instituído pela Lei Complementar 432/1985 do Estado de\nSão Paulo. (RE 642682)","refs":["0448"]},{"id":"rg_2011_0447","tema":"0447","texto":"TEMA 0447: É compatível com a Constituição a extensão,\naos servidores públicos inativos e pensionistas, dos critérios de\ncálculo da Gratificação de Desempenho de Atividade\nTécnico-Administrativa do Meio Ambiente -- GDAMB estabelecidos para os\nservidores públicos em atividade. (ARE 642827)","refs":["0447"]},{"id":"rg_2011_0440","tema":"0440","texto":"TEMA 0440: A redução da Gratificação Especial de\nRetorno à Atividade - GERA não implica violação ao princípio da\nirredutibilidade de vencimentos, se o ingresso ou o reingresso aos\nquadros do Corpo Voluntário de Militares Estaduais Inativos (CVMI) se\ndeu após a edição da Lei Estadual 10.916/1997. (ARE 637607)","refs":["0440"]},{"id":"rg_2011_0435","tema":"0435","texto":"TEMA 0435: É <strong>compatível</strong> com a Constituição a\naplicabilidade imediata do art. 1º-F da Lei 9.494/97, com alteração pela\nMedida Provisória nº 2.180-35/2001, ainda que em relação às ações\najuizadas antes de sua entrada em vigor. (AI 842063)","refs":["0435"]},{"id":"rg_2011_0434","tema":"0434","texto":"TEMA 0434: É <strong>compatível</strong> com a Constituição lei\nespecífica que altera o cálculo da Gratificação por Produção\nSuplementar - GPS, desde que não haja redução da remuneração na sua\ntotalidade. (RE 596542)","refs":["0434"]},{"id":"rg_2011_0431","tema":"0431","texto":"TEMA 0431: É <strong>incompatível</strong> com a Constituição norma\nque institui contribuição à saúde incidente sobre o valor de proventos e\npensões de servidores públicos, no interregno das Emendas\nConstitucionais 20/1998 e 41/2003. (AI 831223)","refs":["0431"]},{"id":"rg_2011_0430","tema":"0430","texto":"TEMA 0430: É <strong>incompatível</strong> com a Constituição **lei\nmunicipal<strong> que </strong>impõe** sanção mais gravosa que a prevista no Código\nde Trânsito Brasileiro, por extrapolar a competência\nlegislativa do município. (ARE 639496)","refs":["0430"]},{"id":"rg_2011_0411","tema":"0411","texto":"TEMA 0411: É <strong>incompatível</strong> com a Constituição o\nreconhecimento às [entidades paraestatais dos privilégios\nprocessuais] concedidos à Fazenda Pública em execução de\npagamento de quantia em dinheiro. (AI 841548)","refs":["0411"]},{"id":"rg_2011_0410","tema":"0410","texto":"TEMA 0410: É <strong>compatível</strong> com a Constituição a\nextensão, aos servidores públicos inativos, dos critérios de cálculo da\nGratificação de Desempenho de Atividade Técnico-Administrativa e de\nSuporte -- GDPGTAS estabelecidos para os servidores públicos em\natividade. (RE 633933)","refs":["0410"]},{"id":"rg_2011_0409","tema":"0409","texto":"TEMA 0409: É <strong>compatível</strong> com a Constituição a\nextensão, aos servidores públicos inativos, dos critérios de cálculo da\nGratificação de Desempenho da Carreira da Previdência, Saúde e Trabalho\n--- GDPST estabelecidos para os servidores públicos em atividade. (RE\n631880)","refs":["0409"]},{"id":"rg_2011_0121","tema":"0121","texto":"TEMA 0121: <strong>Não foi recepcionada</strong> pela Constituição\nda República de 1988 a expressão \"nos regulamentos da Marinha, do\nExército e da Aeronáutica\" do art. 10 da Lei 6.880/1980, dado que apenas\nlei pode definir os requisitos para ingresso nas Forças Armadas,\nnotadamente o requisito de idade, nos termos do art. 142, § 3º, X, da\nConstituição de 1988. Descabe, portanto, a regulamentação por outra\nespécie normativa, ainda que por delegação legal. (RE 600885)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0121"]}],"DIREITO PENAL":[{"id":"rg_2011_0478","tema":"0478","texto":"TEMA 0478: O princípio constitucional da\n<strong>autodefesa</strong> (art. 5º, LXIII, da CF/88) <strong>não alcança</strong> aquele que\natribui <strong>falsa identidade</strong> perante autoridade policial com o intento\nde ocultar maus antecedentes, sendo, portanto, típica a conduta\npraticada pelo agente (art. 307 do CP). (RE 640139)\n<strong>(FGV-TJAP-ANALISTA JUD/2024)</strong>","refs":["0478"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2011_0138","tema":"0138","texto":"TEMA 0138: Ao Estado é <strong>facultada</strong> a revogação de\natos que repute ilegalmente praticados; porém, se de tais\natos já tiverem decorrido efeitos concretos, seu\n<strong>desfazimento</strong> deve ser precedido de **regular processo\nadministrativo.** (RE 594296)","refs":["0138"]},{"id":"rg_2011_0161","tema":"0161","texto":"TEMA 0161: O candidato aprovado em concurso público\n<strong>dentro do número de vagas</strong> previsto no edital possui **direito\nsubjetivo à nomeação**. (RE 598099)","refs":["0161"]},{"id":"rg_2011_0253","tema":"0253","texto":"TEMA 0253: Sociedades de economia mista que\n<strong>desenvolvem atividade econômica</strong> em regime\nconcorrencial <strong>não se beneficiam</strong> do regime de\nprecatórios, previsto no art. 100 da Constituição da República. (RE\n599628)","refs":["0253"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2011_0088","tema":"0088","texto":"TEMA 0088: Em razão do caráter contributivo do regime\ngeral de previdência (CF/1988, art. 201, caput), o art. 29, § 5º, da Lei\nnº 8.213/1991 <strong>não se aplica</strong> à transformação de auxílio-doença em\naposentadoria por invalidez, mas apenas a aposentadorias por invalidez\nprecedidas de períodos de auxílio-doença intercalados com intervalos de\natividade, sendo válido o art. 36, § 7º, do Decreto nº 3.048/1999, mesmo\napós a Lei nº 9.876/1999. (RE 583834)","refs":["0088"]},{"id":"rg_2011_0388","tema":"0388","texto":"TEMA 0388: É <strong>inviável a aplicação retroativa</strong> da\nmajoração prevista na Lei nº 9.032/1995 aos benefícios de\nauxílio-acidente concedidos em data anterior à sua vigência. (RE 613033)","refs":["0388"]}],"DIREITO DO TRABALHO":[{"id":"rg_2011_0242","tema":"0242","texto":"TEMA 0242: Compete à <strong>Justiça do Trabalho</strong> processar\ne julgar as ações de indenização por danos morais e patrimoniais\ndecorrentes de **acidentes de trabalho propostas por empregado contra\nempregador,** inclusive as propostas pelos sucessores do trabalhador\nfalecido, <strong>salvo</strong> quando a sentença de mérito for anterior à\npromulgação da EC nº 45/04, hipótese em que, até o trânsito em julgado e\na sua execução, a competência continuará a ser da Justiça Comum. (RE\n600091)","refs":["0242"]}],"DIREITO ELEITORAL":[{"id":"rg_2011_0387","tema":"0387","texto":"TEMA 0387: A Lei Complementar 135/2010 **não é\naplicável** às eleições gerais de 2010, em face do princípio da\n<strong>anterioridade eleitoral</strong> (art. 16 da Constituição Federal). (RE\n633703)","refs":["0387"]}],"DIREITO CIVIL":[{"id":"rg_2011_392","tema":"392","texto":"TEMA 392: I - É <strong>possível a repropositura</strong> de ação\nde investigação de paternidade, quando anterior demanda idêntica, entre\nas mesmas partes, foi julgada improcedente, por falta de provas, em\nrazão da parte interessada não dispor de condições econômicas para\nrealizar o exame de DNA e o Estado não ter custeado a produção dessa\nprova; II - <strong>Deve ser relativizada a coisa julgada</strong> estabelecida em\nações de investigação de paternidade em que **não foi possível\ndeterminar-se<strong> a efetiva existência de </strong>vínculo genético** a unir as\npartes, em decorrência da n<strong>ão realização do exame de DNA,</strong> meio de\nprova que pode fornecer segurança quase absoluta quanto à existência de\ntal vínculo. ([RE\n363889](https://portal.stf.jus.br/processos/detalhe.asp?incidente=2072456))\n<strong>(FGV-SEFAZ/RS-AUDITOR/2025)</strong>","refs":["392"]}]},"2010":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2010_0115","tema":"0115","texto":"TEMA 0115: Não foi fixada tese de repercussão geral,\nvisto que a decisão de mérito do RE 580.264 vale apenas para o caso\nconcreto, em razão de suas peculiaridades. (RE 580264)\n\n(OBS: Recurso extraordinário em que se discute, à luz dos artigos 6º;\n145, § 1º; 150, VI, a, e § 2º; e 196, da Constituição Federal, a\naplicação, ou não, da imunidade recíproca a sociedades de economia mista\nque prestam serviços de saúde exclusivamente pelo Sistema Único de Saúde\n-- SUS, e assim sendo, sem pagamento por parte dos usuários.)","refs":["0115"]},{"id":"rg_2010_0109","tema":"0109","texto":"TEMA 0109: <strong>Lei estadual</strong> autorizadora da não\ninscrição em dívida ativa e do não ajuizamento de débitos de pequeno\nvalor é <strong>insuscetível de aplicação a Município</strong> e, consequentemente,\n<strong>não serve de fundamento</strong> para a extinção das execuções fiscais que\npromova, sob pena de violação à sua competência tributária. (RE 591033)\n<strong>(FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)</strong>","refs":["0109"]},{"id":"rg_2010_0212","tema":"0212","texto":"TEMA 0212: É <strong>inconstitucional</strong> a incidência do\nImposto sobre Serviços de Qualquer Natureza- ISS sobre operações de\n<strong>locação de bens móveis</strong>, d[issociada da prestação de\nserviços]. (RE 626706)","refs":["0212"]},{"id":"rg_2010_0052","tema":"0052","texto":"TEMA 0052: A <strong>imunidade</strong> tributária prevista no art.\n149, § 2º, I, da Constituição Federal é restrita às contribuições\nsociais e de intervenção no domínio econômico incidentes sobre as\nreceitas decorrentes de exportação. Não contempla, assim, a CPMF, cuja\nhipótese de incidência --- movimentações financeiras --- não se confunde\ncom receitas. (RE 566259)","refs":["0052"]},{"id":"rg_2010_0008","tema":"0008","texto":"TEMA 0008: A Contribuição Social sobre o Lucro Líquido\n-- CSLL <strong>incide</strong> sobre o l<strong>ucro decorrente das exportações.</strong> A\nimunidade prevista no artigo 149, § 2º, inciso I, da Constituição\nFederal, com a redação dada pela Emenda Constitucional nº 33/2001, não o\nalcança. (RE 564413) <strong>(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2024)</strong>","refs":["0008"]},{"id":"rg_2010_0217","tema":"0217","texto":"TEMA 0217: É <strong>constitucional taxa de renovação</strong> de\nfuncionamento e localização municipal, **desde que\nefetivo<strong> o exercício do </strong>poder de polícia**, demonstrado pela\nexistência de órgão e estrutura competentes para o respectivo exercício.\n(RE 588322) **(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(FGV-PCMG-DELEGADO/2025)**","refs":["0217"]},{"id":"rg_2010_0261","tema":"0261","texto":"TEMA 0261: É <strong>inconstitucional</strong> a cobrança de\n<strong>taxa</strong>, espécie tributária, <strong>pelo uso de espaços</strong> públicos dos\nmunicípios por <strong>concessionárias</strong> prestadoras do serviço público de\nfornecimento de <strong>energia elétrica.</strong> (RE 581947)","refs":["0261"]},{"id":"rg_2010_0055","tema":"0055","texto":"TEMA 0055: I - Os Estados membros possuem competência\napenas para a instituição de contribuição voltada ao custeio do regime\nde previdência de seus servidores. <strong>Falece-lhes</strong>, portanto,\n<strong>competência</strong> para a <strong>criação de contribuição</strong> ou qualquer outra\nespécie tributária destinada ao <strong>custeio</strong> de serviços médicos,\nhospitalares, farmacêuticos e odontológicos prestados aos seus\nservidores; II - Não há óbice constitucional à prestação, pelos Estados,\nde serviços de saúde a seus servidores, desde que a adesão a esses\n\\\"planos\\\"seja facultativa. (RE 573540) <strong>(VUNESP-TJRJ-JUIZ/2023)</strong>","refs":["0055"]},{"id":"rg_2010_0092","tema":"0092","texto":"TEMA 0092: <strong>Não viola</strong> o art. 167, IV, da\nConstituição Federal lei estadual que, ao prever o aumento da alíquota\ndo Imposto sobre Circulação de Mercadorias e Serviços -- ICMS, impõe ao\nChefe do Executivo a <strong>divulgação da aplicação dos recursos</strong>\nprovenientes desse aumento. (RE 585535) **(FGV-CÂMARA DE\nFORTALEZA-CONSULTOR LEGISL/2024)**","refs":["0092"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2010_0132","tema":"0132","texto":"TEMA 0132: O art. 78 do Ato das Disposições\nConstitucionais Transitórias possui a mesma mens legis que o art. 33\ndesse Ato, razão pela qual, uma vez calculado o precatório pelo valor\nreal do débito, acrescido de juros legais, não há mais falar em\nincidência desses nas parcelas anuais, iguais e sucessivas em que é\nfracionado, desde que adimplidas a tempo e corrigidas monetariamente.\n(RE 590751)","refs":["0132"]},{"id":"rg_2010_0026","tema":"0026","texto":"TEMA 0026: O inciso I do artigo 1º da Lei complementar\n51/1985 foi recepcionado pela Constituição Federal de 1988. (RE 567110)","refs":["0026"]},{"id":"rg_2010_0340","tema":"0340","texto":"TEMA 0340: Estende-se o reajuste de 28,86% aos\nservidores militares contemplados com índices inferiores pelas Leis\n8.622/1993 e 8.627/1993, já que se trata de revisão geral dos servidores\npúblicos, observadas, entretanto, as compensações dos reajustes\nconcedidos e a limitação temporal da Medida Provisória 2.131/2000, atual\nMedida Provisória 2.215-10/2001. (RE 584313)","refs":["0340"]},{"id":"rg_2010_0282","tema":"0282","texto":"TEMA 0282: A eficácia do inciso XI do artigo 37 da\nConstituição Federal, decorrente da redação da Emenda Constitucional nº\n19/1998, <strong>condiciona-se à fixação do subsídio,</strong> mediante **lei de\niniciativa conjunta** do Presidente da República, do Presidente do\nSupremo, do Presidente da Câmara e do Presidente do Senado, persistindo\na vigência do texto primitivo da Carta, no que definido o teto por\nPoder, consideradas as esferas federal e estadual. (RE 424053)","refs":["0282"]},{"id":"rg_2010_0339","tema":"0339","texto":"TEMA 0339: O art. 93, IX, da Constituição Federal\nexige que o acórdão ou decisão sejam fundamentados, **ainda que\nsucintamente, sem determinar,<strong> contudo, o </strong>exame pormenorizado** de\ncada uma das alegações ou provas. (AI 791292)\n<strong>(FGV-DPERJ-DEFENSOR/2023) (FGV-TRF3-JUIZ/2025)</strong>","refs":["0339"]},{"id":"rg_2010_0272","tema":"0272","texto":"TEMA 0272: Compete aos <strong>Municípios</strong> legislar sobre\nassuntos de interesse local, notadamente sobre a definição do **tempo\nmáximo de espera** de clientes em filas de instituições bancárias. (RE\n610221)","refs":["0272"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2010_0343","tema":"0343","texto":"TEMA 0343: É <strong>devida</strong> a <strong>devolução</strong> aos\npensionistas e inativos, perante o Juízo competente para a execução, da\ncontribuição previdenciária indevidamente recolhida no período entre a\nEC 20/1998 e a EC 41/2003, sob pena de enriquecimento ilícito do ente\nestatal. (RE 580871)","refs":["0343"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2010_0058","tema":"0058","texto":"TEMA 0058: É <strong>vedado</strong> o <strong>fracionamento</strong> do valor\nde <strong>precatório</strong> em execução de sentença, com o objetivo de efetuar o\npagamento das custas processuais por meio de requisição de pequeno valor\n(RPV). (RE 592619)","refs":["0058"]},{"id":"rg_2010_0294","tema":"0294","texto":"TEMA 0294: Cabe o julgamento monocrático no âmbito dos\nJuizados Especiais<strong>, desde que possível sua revisão</strong> pelo Órgão\nColegiado. (RE 612359)","refs":["0294"]},{"id":"rg_2010_0056","tema":"0056","texto":"TEMA 0056: O Ministério Público <strong>tem legitimidade</strong>\npara propor <strong>ação civil pública</strong> com o objetivo de anular Termo de\nAcordo de Regime Especial --- TARE firmado entre o Poder Público e\ncontribuinte, em face da legitimação ad causam que o texto\nconstitucional lhe confere para defender o erário. (RE 576155)","refs":["0056"]}],"DIREITO CIVIL":[{"id":"rg_2010_0295","tema":"0295","texto":"TEMA 0295: É <strong>constitucional</strong> a **penhora de bem de\nfamília<strong> pertencente a </strong>fiador<strong> de c</strong>ontrato de locação,** em\nvirtude da compatibilidade da exceção prevista no art. 3°, VII, da Lei\n8.009/1990 com o direito à moradia consagrado no art. 6° da Constituição\nFederal, com redação da EC 26/2000. (RE 612360) (VER TEMA 1127)","refs":["1127","0295"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2010_0338","tema":"0338","texto":"TEMA 0338: A exigência do <strong>exame psicotécnico</strong> em\nconcurso <strong>depende</strong> de previsão em lei e no edital, e deve seguir\ncritérios objetivos. (AI 758533)","refs":["0338"]}]},"2009":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2009_0125","tema":"0125","texto":"TEMA 0125: É <strong>constitucional</strong> a incidência do\nImposto sobre Serviços de Qualquer Natureza - <strong>ISS</strong> sobre as operações\nde <strong>arrendamento mercantil</strong> (leasing financeiro). (RE 592905)","refs":["0125"]},{"id":"rg_2009_0091","tema":"0091","texto":"TEMA 0091: O <strong>prazo nonagesimal</strong> previsto no art.\n150, III, c, da Constituição Federal somente deve ser utilizado nos\ncasos de <strong>criação ou majoração</strong> de tributos, <strong>não</strong> nas situações,\ncomo a prevista na Lei paulista 11.813/04, de **simples prorrogação de\nalíquota** já aplicada anteriormente. (RE 584100)","refs":["0091"]},{"id":"rg_2009_0053","tema":"0053","texto":"TEMA 0053: É <strong>compatível</strong> com a Constituição Federal\na norma infraconstitucional que atribui a órgão integrante do Poder\nExecutivo da União a <strong>faculdade de alterar as alíquotas</strong> do Imposto de\nExportação. (RE 570680)","refs":["0053"]},{"id":"rg_2009_0095","tema":"0095","texto":"TEMA 0095: É <strong>constitucional</strong> a majoração da\nalíquota da Cofins de 2% para 3%, instituída no artigo 8º da Lei nº\n9.718/1998. (RE 527602)","refs":["0095"]},{"id":"rg_2009_0051","tema":"0051","texto":"TEMA 0051: A Emenda Constitucional 42/2003 **não\nintroduziu** aumento de alíquota para cobrança da CPMF e, portanto, não\nviolou o princípio da anterioridade nonagesimal. (RE 566032)","refs":["0051"]},{"id":"rg_2009_0049","tema":"0049","texto":"TEMA 0049: O direito do contribuinte de utilizar-se de\ncrédito relativo a valores pagos a título de Imposto sobre Produtos\nIndustrializados -- IPI, oriundo da aquisição de matéria-prima a ser\nempregada em produto final beneficiado pela isenção ou tributado à\nalíquota zero, somente surgiu com a Lei nº 9.779/1999, **não se\nmostrando possível a aplicação retroativa** da norma. (RE 562980)","refs":["0049"]},{"id":"rg_2009_0046","tema":"0046","texto":"TEMA 0046: É <strong>constitucional</strong> a cobrança dos\nencargos instituídos pela Lei 10.438/2002, os quais não possuem natureza\ntributária, mas de tarifa ou preço público. (RE 576189)","refs":["0046"]},{"id":"rg_2009_0044","tema":"0044","texto":"TEMA 0044: O serviço de iluminação pública **não\npode** ser remunerado mediante taxa. (RE 573675)\n\n\\[I - Lei que restringe os contribuintes da COSIP aos consumidores de\nenergia elétrica do município não ofende o princípio da isonomia, ante a\nimpossibilidade de se identificar e tributar todos os beneficiários do\nserviço de iluminação pública. II - **[A progressividade da alíquota,\nque resulta do rateio do custo da iluminação pública entre os\nconsumidores de energia elétrica, não afronta o princípio da capacidade\ncontributiva]**. III - Tributo de caráter sui generis, que\nnão se confunde com um imposto, porque sua receita se destina a\nfinalidade específica, nem com uma taxa, por não exigir a\ncontraprestação individualizada de um serviço ao contribuinte. IV -\nExação que, ademais, se amolda aos princípios da razoabilidade e da\nproporcionalidade. V - Recurso extraordinário conhecido e improvido.\\]\n\n<strong>(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)</strong>","refs":["0044"]},{"id":"rg_2009_0155","tema":"0155","texto":"TEMA 0155: É <strong>inconstitucional</strong> a <strong>lei municipal</strong>\nque tenha estabelecido, antes da Emenda Constitucional\n29/2000, <strong>alíquotas progressivas para o IPTU</strong>, salvo\nse destinada a assegurar o cumprimento da função social da propriedade\nurbana. (AI 712743)","refs":["0155"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2009_0240","tema":"0240","texto":"TEMA 0240: <strong>Inexiste nulidade</strong> pela <strong>ausência</strong>, em\noitiva de testemunha por carta precatória, de <strong>réu preso</strong> que não\nmanifestou expressamente intenção de participar da audiência. (RE\n602543)","refs":["0240"]},{"id":"rg_2009_0238","tema":"0238","texto":"TEMA 0238: A <strong>homologação</strong> da transação penal\nprevista no artigo 76 da Lei 9.099/1995 **não faz coisa julgada\nmaterial** e, descumpridas suas cláusulas, [retoma-se a\nsituação anterior,] possibilitando-se ao Ministério Público\na <strong>continuidade da persecução</strong> penal mediante oferecimento de denúncia\nou requisição de inquérito policial. (RE 602072)","refs":["0238"]},{"id":"rg_2009_0237","tema":"0237","texto":"TEMA 0237: É <strong>lícita</strong> a prova consistente em\n<strong>gravação ambiental</strong> realizada por um dos interlocutores\nsem conhecimento do outro. (RE 583937) []<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0237"]}],"DIREITO PENAL":[{"id":"rg_2009_0239","tema":"0239","texto":"TEMA 0239: É <strong>inadmissível</strong> a **extinção da\npunibilidade** em virtude da decretação da prescrição \\\"em perspectiva,\nprojetada ou antecipada\\\", isto é, com base em previsão da **pena que\nhipoteticamente seria aplicada**, independentemente da existência ou\nsorte do processo criminal. (RE 602527)","refs":["0239"]},{"id":"rg_2009_0158","tema":"0158","texto":"TEMA 0158: Circunstância atenuante genérica **não\npode<strong> conduzir à </strong>redução da pena abaixo do mínimo** legal. (RE\n597270)","refs":["0158"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2009_0030","tema":"0030","texto":"TEMA 0030: I - O direito individual às férias é\nadquirido após o período de doze meses trabalhados, sendo **devido o\npagamento do terço constitucional independente do exercício desse\ndireito<strong>; II - A ausência de previsão legal </strong>não pode restringir** o\ndireito ao pagamento do terço constitucional aos servidores exonerados\nde cargos comissionados que não usufruíram férias. (RE 570908)","refs":["0030"]},{"id":"rg_2009_0128","tema":"0128","texto":"TEMA 0128: Cabe ao respectivo **Tribunal Regional\nFederal dirimir conflitos** de competência entre Juizado Especial e\nJuízo Federal de primeira instância que pertençam a uma mesma Seção\nJudiciária. (RE 590409)","refs":["0128"]},{"id":"rg_2009_0172","tema":"0172","texto":"TEMA 0172: Membro do Ministério Público possui direito\na concorrer à nova eleição a ser reeleito, nos termos do art. 14, § 5º\nda Constituição Federal, desde que já ocupe cargo eletivo à época do\nadvento da EC 45/2004. (RE 597994)","refs":["0172"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2009_0130","tema":"0130","texto":"TEMA 0130: A responsabilidade civil das pessoas\njurídicas de direito privado prestadoras de serviço público é\n<strong>objetiva</strong> relativamente a <strong>terceiros usuários e não usuários</strong> do\nserviço, segundo decorre do art. 37, § 6º, da Constituição Federal. (RE\n591874) (INFO 557) **(FGV-TJSC-JUIZ/2022) (FGV-TJPE-JUIZ/2024) (FGV-PREF\nDE CUIABÁ/MT-AUDITOR FISCAL/2024) (FGV-TCE/RR-ANALISTA/2025)**","refs":["0130"]},{"id":"rg_2009_0139","tema":"0139","texto":"TEMA 0139: Os servidores que ingressaram no serviço\npúblico antes da EC 41/2003, mas que se aposentaram após a referida\nemenda, <strong>possuem direito à paridade</strong> remuneratória e à integralidade\nno cálculo de seus proventos, <strong>desde que</strong> observadas as regras de\ntransição especificadas nos arts. 2º e 3º da EC 47/2005. (RE 590260)","refs":["0139"]},{"id":"rg_2009_0041","tema":"0041","texto":"TEMA 0041: I - <strong>Não há direito adquirido</strong> a regime\njurídico, <strong>desde que</strong> respeitado o princípio constitucional da\n<strong>irredutibilidade</strong> de vencimentos; II - A Lei complementar 203/2001,\ndo Estado do Rio Grande do Norte, no ponto que alterou a forma de\ncálculo de gratificações e, consequentemente, a composição da\nremuneração de servidores públicos, não ofende a Constituição da\nRepública de 1988, por dar cumprimento ao princípio da irredutibilidade\nda remuneração. (RE 563965)","refs":["0041"]}],"DIREITO EMPRESARIAL":[{"id":"rg_2009_0090","tema":"0090","texto":"TEMA 0090: Compete ao <strong>juízo comum falimentar</strong>\nprocessar e julgar a execução dos <strong>créditos trabalhistas</strong> no caso de\nempresa em fase de recuperação judicial. (RE 583955)","refs":["0090"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2009_0165","tema":"0165","texto":"TEMA 0165: A revisão de pensão por morte e demais\nbenefícios, constituídos antes da entrada em vigor da Lei 9.032/1995,\n<strong>não pode</strong> ser realizada com base em novo coeficiente de cálculo\nestabelecido no referido diploma legal. (RE 597389)","refs":["0165"]},{"id":"rg_2009_0089","tema":"0089","texto":"TEMA 0089: Segundo decorre do art. 201, IV, da\nConstituição Federal, a <strong>renda do segurado preso</strong> é a que deve ser\nutilizada como <strong>parâmetro para a concessão do auxílio-reclusão</strong> e não\na de seus dependentes. (RE 587365)","refs":["0089"]},{"id":"rg_2009_0153","tema":"0153","texto":"TEMA 0153: A fixação da GDATA e da GDASST em relação\naos servidores inativos deve obedecer aos critérios a que estão\nsubmetidos os servidores em atividade de acordo com a sucessão de leis\nde regência. (RE 597154)","refs":["0153"]},{"id":"rg_2009_0067","tema":"0067","texto":"TEMA 0067: A Gratificação de Desempenho de Atividade\nde Seguridade Social e do Trabalho -GDASST deve ser estendida aos\ninativos nas mesmas condições em que concedida aos servidores em\natividade, ou seja, no valor de 60 (sessenta) pontos, a partir do\nadvento da Medida Provisória 198/2004, convertida na Lei 10.971/2004,\nque alterou a sua base de cálculo. Isso porque, embora de natureza pro\nlabore faciendo, a falta de regulamentação das avaliações de desempenho\ntransmudou a GDASST em uma gratificação de natureza genérica, extensível\naos servidores inativos. (RE 572052)","refs":["0067"]}]},"2008":{"DIREITO PROCESSUAL PENAL":[{"id":"rg_2008_0050","tema":"0050","texto":"TEMA 0050: O artigo 118, § 3º, do Regimento Interno do\nSuperior Tribunal Militar --- que prevê que o resultado do julgamento de\nagravo interposto perante aquela Corte será certificado nos autos pela\nSecretaria do Tribunal Pleno --- não pode implicar a ausência de\nlavratura do acórdão, sob pena de afronta às garantias constitucionais\nda motivação e da publicidade dos pronunciamentos judiciais. (RE 575144)","refs":["0050"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2008_0048","tema":"0048","texto":"TEMA 0048: A Constituição da República **não oferece\nguarida<strong> à possibilidade de o Governador do Distrito Federal </strong>criar\ncargos e reestruturar órgãos<strong> públicos por meio de simples </strong>decreto**.\n(RE 577025)","refs":["0048"]},{"id":"rg_2008_0147","tema":"0147","texto":"TEMA 0147: Durante o período previsto no parágrafo 1º\ndo artigo 100 (redação original e redação da EC 30/2000) da\nConstituição<strong>, não incidem juros de mora</strong> sobre os precatórios que\nnele sejam pagos. (RE 591085)","refs":["0147"]},{"id":"rg_2008_0060","tema":"0060","texto":"TEMA 0060: É <strong>ilícita</strong> a prisão civil de depositário\ninfiel, qualquer que seja a modalidade de depósito. (RE 466343)","refs":["0060"]},{"id":"rg_2008_0142","tema":"0142","texto":"TEMA 0142: Os artigos 7º, IV, e 39, § 3º (redação da\nEC 19/1998), da Constituição referem-se ao total da remuneração\npercebida pelo servidor público. (RE 582019)","refs":["0142"]},{"id":"rg_2008_0141","tema":"0141","texto":"TEMA 0141: O cálculo de gratificações e outras\nvantagens do servidor público <strong>não incide</strong> sobre o abono utilizado\npara se atingir o salário mínimo. (RE 572921)","refs":["0141"]},{"id":"rg_2008_0098","tema":"0098","texto":"TEMA 0098: A norma do § 3º do artigo 192 da\nConstituição, revogada pela Emenda Constitucional nº 40/2003, que\nlimitava a taxa de juros reais a 12% ao ano, tinha sua aplicação\ncondicionada à edição de lei complementar. (RE 582650)","refs":["0098"]},{"id":"rg_2008_0025","tema":"0025","texto":"TEMA 0025: Salvo nos casos previstos na Constituição,\no <strong>salário mínimo não pode</strong> ser usado como **indexador de base de\ncálculo** de vantagem de servidor público ou de empregado, nem ser\nsubstituído por decisão judicial. (RE 565714)","refs":["0025"]},{"id":"rg_2008_0015","tema":"0015","texto":"TEMA 0015: <strong>Não viola</strong> a Constituição o\nestabelecimento de remuneração <strong>inferior ao salário mínimo</strong> para as\npraças prestadoras de serviço militar inicial. (RE 570177)\n<strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0015"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2008_0146","tema":"0146","texto":"TEMA 0146: I - A taxa cobrada <strong>exclusivamente</strong> em\nrazão dos serviços públicos de [coleta, remoção e tratamento ou\ndestinação de lixo] ou resíduos provenientes de imóveis\n<strong>não viola</strong> o artigo 145, II, da Constituição Federal;\nII - A taxa cobrada em razão dos serviços de conservação e\nlimpeza de logradouros e bens públicos ofende o art.\n145, II, da Constituição Federal; III - É <strong>constitucional</strong> a adoção,\nno cálculo do valor de taxa, de **um ou mais elementos da base de\ncálculo própria de determinado imposto<strong>, </strong>desde que** não haja\nintegral identidade entre uma base e outra. (RE 576321)\n[]**(FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(CESPE-SEBRAE-ANALISTA/2024) (FGV-SEFAZ/RS-AUDITOR/2025)\n(FGV-DPE/PE-DEFENSOR/2025)**","refs":["0146"]},{"id":"rg_2008_0071","tema":"0071","texto":"TEMA 0071: É <strong>legítima</strong> a revogação da isenção\nestabelecida no art. 6º, II, da Lei Complementar 70/1991 pelo art. 56 da\nLei 9.430/1996, dado que a LC 70/1991 **é apenas formalmente\ncomplementar, mas materialmente ordinária** com relação aos dispositivos\nconcernentes à contribuição social por ela instituída. (RE 377457)\n<strong>(FGV-PREF DE MACAÉ/RJ-PROCURADOR/2024)</strong>\n\n\\[A assertiva declarou que é constitucional: [a lei ordinária que trata\nda revogação de isenção de COFINS que foi originalmente concedida por\nmeio de lei complementar.\\]]","refs":["0071"]},{"id":"rg_2008_0110","tema":"0110","texto":"TEMA 0110: É <strong>inconstitucional</strong> a ampliação da base\nde cálculo da contribuição ao PIS e da COFINS prevista no art. 3º, § 1º,\nda Lei 9.718/98. (RE 585235)","refs":["0110"]},{"id":"rg_2008_0042","tema":"0042","texto":"TEMA 0042: A retenção da parcela do ICMS\nconstitucionalmente devida aos municípios, a pretexto de concessão de\nincentivos fiscais, configura **indevida interferência do Estado no\nsistema constitucional de repartição** de receitas tributárias. (RE\n572762) <strong>(FGV-ENAM/2025)</strong>","refs":["0042"]},{"id":"rg_2008_0003","tema":"0003","texto":"TEMA 0003: São <strong>inconstitucionais</strong> o parágrafo único\ndo artigo 5º do Decreto-Lei 1.569/1977 e os artigos 45 e 46 da Lei\n8.212/1991, que tratam de prescrição e decadência de crédito tributário.\n(RE 559943)","refs":["0003"]},{"id":"rg_2008_0002","tema":"0002","texto":"TEMA 0002: I - Normas relativas à **prescrição e\ndecadência<strong> em matéria tributária são </strong>reservadas à lei\ncomplementar**; II - São inconstitucionais o parágrafo único do artigo\n5º do Decreto-Lei 1.569/1977 e os artigos 45 e 46 da Lei 8.212/1991. (RE\n560626)","refs":["0002"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2008_0017","tema":"0017","texto":"TEMA 0017: Compete à <strong>Justiça estadual</strong> julgar\ncausas entre **consumidor e concessionária de serviço público de\ntelefonia**, quando a ANATEL não seja litisconsorte passiva necessária,\nassistente, nem opoente. (RE 571572)","refs":["0017"]}],"DIREITO ELEITORAL":[{"id":"rg_2008_0061","tema":"0061","texto":"TEMA 0061: A dissolução da sociedade ou do vínculo\nconjugal, no curso do mandato, <strong>não afasta</strong> a inelegibilidade prevista\nno § 7º do artigo 14 da Constituição Federal. (RE 568596)","refs":["0061"]}],"DIREITO DO TRABALHO":[{"id":"rg_2008_0036","tema":"0036","texto":"TEMA 0036: A competência da Justiça do Trabalho\nprevista no art. 114, VIII, da Constituição Federal alcança somente a\nexecução das contribuições previdenciárias relativas ao objeto da\ncondenação constante das sentenças que proferir, não abrangida a\nexecução de contribuições previdenciárias atinentes ao vínculo de\ntrabalho reconhecido na decisão, mas sem condenação ou acordo quanto ao\npagamento das verbas salariais que lhe possam servir como base de\ncálculo. (RE 569056)","refs":["0036"]},{"id":"rg_2008_0074","tema":"0074","texto":"TEMA 0074: Compete à Justiça do Trabalho o julgamento\ndas ações de interdito proibitório em que se busca garantir o livre\nacesso de funcionários e de clientes às agências bancárias interditadas\nem decorrência de movimento grevista. (RE 579648)","refs":["0074"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2008_0070","tema":"0070","texto":"TEMA 0070: Na sistemática de cálculo dos benefícios\nprevidenciários, <strong>não é lícito</strong> ao segurado conjugar as vantagens do\nnovo sistema com aquelas aplicáveis ao anterior, porquanto inexiste\ndireito adquirido a determinado regime jurídico. (RE 575089)","refs":["0070"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2008_0043","tema":"0043","texto":"TEMA 0043: Compete à <strong>Justiça comum</strong> processar e\njulgar causas instauradas entre o Poder Público e seus servidores\nsubmetidos a regime especial disciplinado por lei local editada antes da\nConstituição Federal de 1988, com fundamento no artigo 106 da\nConstituição de 1967, na redação que lhe deu a Emenda Constitucional\n1/1969. (RE 573202)","refs":["0043"]},{"id":"rg_2008_0066","tema":"0066","texto":"TEMA 0066: A vedação ao nepotismo <strong>não exige</strong> a\nedição de lei formal para coibir a prática, dado que essa proibição\ndecorre diretamente dos princípios contidos no art. 37, caput, da\nConstituição Federal. (RE 579951)","refs":["0066"]},{"id":"rg_2008_0040","tema":"0040","texto":"TEMA 0040: A cobrança de taxa de matrícula nas\nuniversidades públicas <strong>viola</strong> o disposto no art. 206, IV, da\nConstituição Federal. (RE 500171) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0040"]}]}},"rep":{"2026":{"DIREITO PREVIDENCIÁRIO":[{"id":"rep_2026_1081","tema":"1081","texto":"TEMA 1081: A <strong>demanda previdenciária</strong> cujo <strong>valor</strong>\nda condenação seja aferível por <strong>simples cálculos aritméticos</strong>, com\nbase nos <strong>parâmetros</strong> fixados na **sentença, deve ser dispensada da\nremessa necessária<strong> quando for </strong>possível estimar<strong> que </strong>não excederá\no limite previsto** no art. 496, § 3º, I, do Código de Processo Civil.\n([REsp\n1882236/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202001612560);\n[REsp\n1893709/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002274523);\n[REsp\n1894666/SC](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002341080))","refs":["1081"]}],"DIREITO TRIBUTÁRIO":[{"id":"rep_2026_1385","tema":"1385","texto":"TEMA 1385: Na <strong>execução fiscal</strong>, a <strong>fiança</strong>\nbancária ou o <strong>seguro</strong> garantia oferecido em <strong>garantia</strong> de execução\nde <strong>crédito tributário</strong> não é recusável por\n<strong>inobservância</strong> à <strong>ordem legal</strong> da penhora. (REsp 2.193.673-SC; REsp\n2.203.951-SC)","refs":["1385"]},{"id":"rep_2026_1390","tema":"1390","texto":"TEMA 1390: A <strong>base de cálculo</strong> das <strong>contribuições</strong>\nao INCRA, salário-educação, DPC, FAER, SENAR, SEST, SENAT, SESCOOP,\nSEBRAE, APEX-Brasil e ABDI **não é limitada a 20 (vinte) vezes o maior\nsalário-mínimo** vigente no país (art. 4º, parágrafo único, da Lei n.\n6.950/1981). (REsp 2.187.625-RJ; REsp 2.187.646-CE; REsp 2.188.421-SC;\nREsp 2.185.634-RS)","refs":["1390"]}]},"2025":{"DIREITO CIVIL":[{"id":"rep_2025_1288","tema":"1288","texto":"TEMA 1288: a) **antes da entrada em vigor da Lei n.\n13.465/2017,<strong> nas situações em que já </strong>consolidada a propriedade e\npurgada a mora** nos termos do art. 34 do Decreto-Lei n. 70/1966 (ato\njurídico perfeito), impõe-se o <strong>desfazimento do ato de consolidação</strong>,\ncom a consequente <strong>retomada do contrato de financiamento</strong> imobiliário;\ne b) a partir da entrada <strong>em vigor da Lei n. 13.465/2017</strong>, nas\nsituações em que <strong>consolidada a propriedade</strong>, mas **não purgada a\nmora<strong>, é </strong>assegurado<strong> ao devedor fiduciante </strong>tão somente o exercício\ndo direito de preferência** previsto no § 2º-B do art. 27 da Lei n.\n9.514/1997.] ([REsp\n2126726/SP](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202400639787))","refs":["1288"]},{"id":"rep_2025_1251","tema":"1251","texto":"TEMA 1251: [Reconhecido judicialmente o **direito à\nindenização por danos morais<strong> decorrentes de </strong>perseguição política**\nsofrida durante a <strong>ditadura militar,</strong> os <strong>juros</strong> de mora devem\nincidir <strong>a partir do evento danoso</strong>, nos termos da Súmula\n54/STJ.] ([REsp\n2032021/RS](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202203221614))","refs":["1251"]},{"id":"rep_2025_1368","tema":"1368","texto":"TEMA 1368: [O <strong>art. 406 Código Civil</strong> de 2002, antes\nda entrada em vigor da Lei n° 14.905/2024, <strong>deve ser interpretado</strong> no\nsentido de que é a **SELIC a taxa de juros de mora aplicável às dívidas\nde natureza civil,** por ser esta a taxa em vigor para a atualização\nmonetária e a mora no pagamento de impostos devidos à Fazenda\nNacional.] ([REsp\n2199164/PR)](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202500618396)","refs":["1368"]},{"id":"rep_2025_1173","tema":"1173","texto":"TEMA 1173: O <strong>corretor de imóveis</strong>, pessoa física ou\njurídica, <strong>não é</strong>, normalmente, **responsável por danos causados ao\nconsumidor,<strong> em razão do </strong>descumprimento<strong>, pela </strong>construtora ou\nincorporadora,** de obrigações relativas ao empreendimento imobiliário,\nprevistas no contrato de promessa de compra e venda, <strong>salvo</strong> se\ndemonstrado: (i) <strong>envolvimento do corretor nas atividades</strong> de\nincorporação e construção; (ii) que o corretor **integra o mesmo grupo\neconômico<strong> da incorporadora ou construtora; ou (iii) haver </strong>confusão\nou desvio patrimonial** das responsáveis pela construção em benefício do\ncorretor. ([REsp\n2008542/RJ](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=201903102640);\n[REsp\n2008545/DF](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202103285072))","refs":["1173"]},{"id":"rep_2025_1268","tema":"1268","texto":"TEMA 1268: A <strong>eficácia preclusiva</strong> da coisa julgada\n<strong>impede</strong> o ajuizamento de <strong>nova ação</strong> para pleitear a\n<strong>restituição</strong> de quantia paga a título de <strong>juros</strong> remuneratórios\nincidentes sobre tarifas bancárias <strong>declaradas ilegais ou abusivas</strong> em\nação anterior. ([REsp\n2145391/PB](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401819755)\n; [REsp\n2148576/PB](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402023378)\n; [REsp\n2148588/PB](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402024882);\n[REsp\n2148794/PB](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202402036849)\n)","refs":["1268"]},{"id":"rep_2025_1099","tema":"1099","texto":"TEMA 1099: [<strong>Prescrição decenal</strong> (art. 205, CC/2002)\nda pretensão de <strong>restituição</strong> dos <strong>valores</strong> pagos a título de\n<strong>comissão de corretagem</strong>, quando o <strong>pedido de repetição</strong> dirigido\ncontra a incorporadora/construtora tiver por fundamento a **resolução do\ncontrato em virtude de atraso** na entrega do imóvel, contando-se o\nprazo **desde a data em que o adquirente tiver ciência da recusa da\nrestituição integral** das parcelas pagas.] ([REsp\n1897867/C](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202002539170)E)","refs":["1099"]},{"id":"rep_2025_1306","tema":"1306","texto":"TEMA 1306: A técnica da **fundamentação por referência\n(per relacione) é permitida desde que** o julgador, ao reproduzir\ntrechos de decisão anterior (documentos e/ou pareceres) **como razões de\ndecidir, enfrente, ainda que<strong> de forma </strong>sucinta<strong>, as </strong>novas questões\nrelevantes<strong> para o julgamento do processo, </strong>dispensada** a análise\n<strong>pormenorizada</strong> de cada uma das alegações ou provas. 2. o **§ 3º. do\nartigo 1.021, do cpc<strong> </strong>não impede a reprodução dos fundamentos** da\ndecisão agravada como razões de decidir pela negativa de provimento de\nagravo interno <strong>quando a parte deixa de apresentar argumento novo</strong>\npara ser apreciado pelo colegiado. ([REsp\n2148059/MA](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202401990934))\n<strong>(FGV-TCE/PE-ANALISTA/2025)</strong>","refs":["1306"]}],"DIREITO PENAL":[{"id":"rep_2025_1236","tema":"1236","texto":"TEMA 1236: A <strong>remição de pena</strong> em razão do **estudo\na distância<strong> - EAD demanda a </strong>prévia integração da instituição ao\nProjeto Político-Pedagógico<strong> - PPP </strong>da unidade** ou sistema prisional,\n<strong>não bastando</strong> o necessário <strong>credenciamento</strong> da instituição junto ao\n<strong>MEC</strong>, observando-se a **comprovação de frequência e realização das\natividades** determinadas\\\" ([REsp\n2085556/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302453751);\n[REsp\n2086269/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302514276);\n[REsp\n2087212/MG](https://ww2.stj.jus.br/processo/pesquisa/?tipoPesquisa=tipoPesquisaNumeroRegistro&termo=202302595385))\n\n[","refs":["1236"]},{"id":"rep_2025_1377","tema":"1377","texto":"TEMA 1377: O **tipo previsto na primeira parte do\ncaput do artigo 54<strong> da Lei nº 9.605/1998 possui </strong>natureza formal**,\nsendo <strong>suficiente a potencialidade</strong> de d
