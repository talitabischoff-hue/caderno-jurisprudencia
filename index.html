ia da realização de\nplebiscit**o, conforme se determina no § 4º do art. 18 da Constituição\nda República, <strong>não foi afastada</strong> pelo art. 96, inserido no Ato das\nDisposições Constitucionais Transitórias da Constituição da República\npela Emenda Constitucional n. 57/2008, sendo [ilegítimo o município\nocupante para cobrar o Imposto sobre a Propriedade Predial e Territorial\nUrbana - IPTU nos territórios indevidamente incorporados].\n\n<strong>TEMA 0415:</strong> <strong>Não há reserva de lei complementar</strong> para\no repasse do PIS e COFINS ao usuário de serviços públicos concedidos,\ntais como telefonia e energia elétrica, cobrado nas respectivas faturas.\n<strong>(FGV/2022)</strong>","refs":["0415","0400"]},{"id":"rg_2019_0382","tema":"0382","texto":"TEMA 0382: A **postergação do direito do contribuinte\ndo ICMS de usufruir de novas hipóteses de creditamento**, por não\nrepresentar aumento do tributo, **não se sujeita à anterioridade\nnonagesimal** prevista no art. 150, III, c, da Constituição.\n<strong>(FGV/2022)</strong>\n\n<strong>TEMA 0298:</strong> É <strong>constitucional</strong> a sistemática estabelecida no artigo\n3º, inciso I, da Lei 8.200/1991 para a compensação tributária decorrente\nda correção monetária das demonstrações financeiras de pessoas jurídicas\nno ano-base 1990.\n\n<strong>TEMA 0117:</strong> É <strong>constitucional</strong> a [limitação do\ndireito de compensação] de prejuízos fiscais do IRPJ e da\nbase de cálculo negativa da CSLL.","refs":["0382","0298","0117"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2019_0137","tema":"0137","texto":"TEMA 0137: É <strong>compatível</strong> com a Constituição da\nRepública de 1988 a ampliação para 30 (trinta) dias do prazo de oposição\nde embargos à execução pela Fazenda Pública.","refs":["0137"]},{"id":"rg_2019_0850","tema":"0850","texto":"TEMA 0850: O Ministério Público tem <strong>legitimidade</strong>\npara a propositura de ação civil pública em defesa de direitos sociais\nrelacionados ao FGTS. (RE 643978) **(FGV/2024) (FGV-SMF/RJ-FISCAL DE\nRENDAS/2023) (FGV-TRF3-JUIZ/2025)**","refs":["0850"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2019_0839","tema":"0839","texto":"TEMA 0839: No exercício do seu poder de autotutela,\n<strong>poderá a Administração Pública</strong> rever os atos de concessão de anistia\na cabos da Aeronáutica com fundamento na Portaria nº 1.104/1964, quando\nse comprovar a ausência de ato com motivação exclusivamente política,\nassegurando-se ao anistiado, em procedimento administrativo, o devido\nprocesso legal e a não devolução das verbas já recebidas. (RE 817338)","refs":["0839"]},{"id":"rg_2019_0576","tema":"0576","texto":"TEMA 0576: O processo e julgamento de prefeito\nmunicipal por crime de responsabilidade (Decreto-lei 201/67) **não\nimpede** sua responsabilização por atos de improbidade administrativa\nprevistos na Lei 8.429/1992, em virtude da autonomia das instâncias. (RE\n976566) <strong>(FGV/2024)</strong> (**FGV-ALPR-PROCURADOR/2024) (CESPE-PREF\nCACHOEIRO DE ITAPEMIRIM-PROCURADOR/2024)\n(VUNESP-PGESP-PROCURADOR/2024)**\n\n**\\[obs: a questão da prova de procurador da ALPR tratava de secretário\nmunicipal, mas creio que a justificativa do erro é essa tese, já que se\npara o prefeito não há impedimento, obviamente, para o secretário também\nnão haverá.\\]**","refs":["0576"]},{"id":"rg_2019_0777","tema":"0777","texto":"TEMA 0777: O Estado responde, <strong>objetivamente</strong>, pelos\n<strong>atos dos tabeliães e registradores</strong> oficiais que, no exercício de\nsuas funções, causem dano a terceiros, assentado o **dever de\nregresso** contra o responsável, nos casos de [dolo ou\nculpa], sob pena de improbidade administrativa. (RE 842846)\n(INFO 932) **(FGV/2023) (FGV-TJSE-ATIV NOTARIAL E DE REGISTRO/2023)\n(FGV-TJSC-JUIZ/2022) (FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(VUNESP-TJAL-TITULAR DE SERVIÇOS DE NOTAS E DE REGISTRO/2023)**","refs":["0777"]}],"DIREITO CIVIL":[{"id":"rg_2019_0932","tema":"0932","texto":"TEMA 0932: O artigo 927, parágrafo único, do Código\nCivil é compatível com o artigo 7º, XXVIII, da Constituição Federal,\n[sendo constitucional a responsabilização objetiva do empregador por\ndanos decorrentes de acidentes de trabalho], nos casos\nespecificados em lei, ou quando a atividade normalmente desenvolvida,\npor sua natureza, apresentar exposição habitual a risco especial, com\npotencialidade lesiva e implicar ao trabalhador ônus maior do que aos\ndemais membros da coletividade. (RE 828040) **(FGV-JUIZ DO\nTRABALHO/2023)**","refs":["0932"]}],"DIREITO PENAL":[{"id":"rg_2019_0370","tema":"0370","texto":"TEMA 0370: A <strong>suspensão</strong> de direitos políticos\nprevista no art. 15, inc. III, da Constituição Federal <strong>aplica-se</strong> no\ncaso de [substituição da pena privativa de liberdade pela\nrestritiva] de direitos. (RE 601182) **(FGV-CÂMARA DOS\nDEPUTADOS-CONSULTOR/2023) (FGV-TJSC-JUIZ/2024)**","refs":["0370"]}]},"2018":{"DIREITO TRIBUTÁRIO":[{"id":"rg_2018_0884","tema":"0884","texto":"TEMA 0884: Os **bens e direitos que integram o\npatrimônio do fundo** vinculado ao Programa de Arrendamento\nResidencial - <strong>PAR</strong>, criado pela Lei 10.188/2001, **beneficiam-se da\nimunidade tributária** prevista no art. 150, VI, a, da Constituição\nFederal. (RE 928902) **(FGV-TJSE-ATIVIDADE NOTARIAL E DE\nREGISTRO/2023)**\n\n<strong>TEMA 0665</strong>: São <strong>constitucionais</strong> a alíquota e a base\nde cálculo da contribuição ao PIS, previstas no art. 72, V, do ADCT,\ndestinada à composição do Fundo Social de Emergência, nas redações da\nECR 1/94 e das EC 10/96 e 17/97, observados os princípios da\nanterioridade nonagesimal e da irretroatividade tributária. (RE 578846)","refs":["0665","0884"]},{"id":"rg_2018_0470","tema":"0470","texto":"TEMA 0470: É <strong>constitucional</strong> a contribuição\nadicional de 2,5% (dois e meio por cento) sobre a folha de salários\ninstituída para as instituições financeiras e assemelhadas pelo art. 3º,\n§ 2º, da Lei 7.787/1989, mesmo considerado o período anterior à Emenda\nConstitucional 20/1998.","refs":["0470"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2018_1009","tema":"1009","texto":"TEMA 1009: No caso de declaração de **nulidade de\nexame psicotécnico** previsto em lei e em edital, é\nindispensável a realização de nova avaliação, com\ncritérios objetivos, para prosseguimento no certame.","refs":["1009"]},{"id":"rg_2018_0057","tema":"0057","texto":"TEMA 0057: É <strong>constitucional</strong> a previsão legal que\nassegure, na hipótese de transferência ex officio de servidor, a\nmatrícula em instituição pública, se inexistir instituição congênere à\nde origem. (RE 601580) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0057"]},{"id":"rg_2018_0897","tema":"0897","texto":"TEMA 0897: São <strong>imprescritíveis</strong> as ações de\nressarcimento ao erário fundadas na prática de <strong>ato doloso</strong> tipificado\nna Lei de Improbidade Administrativa. (RE 852475)\n**(FGV-ENAM-MANAUS/2024) (FGV-TCEBA-AUDITOR/2023)\n(VUNESP-MPRJ-PROMOTOR/2024) (FGV-MPE/RJ-ANALISTA/2025)**","refs":["0897"]},{"id":"rg_2018_0984","tema":"0984","texto":"TEMA 0984: O Supremo Tribunal Federal **veda o aumento\nde vencimentos pelo Poder Judiciário com base no princípio da\nisonomia,** na equiparação salarial ou a pretexto da revisão geral\nanual, não sendo devida, portanto, a extensão do maior reajuste\nconcedido pela Lei estadual nº 7.622/2000 aos soldos de toda a categoria\ndos policiais militares do Estado da Bahia, dispensada a devolução de\nvalores eventualmente recebidos de boa-fé até a data de conclusão do\npresente julgamento no Plenário Virtual desta Corte. (RE 976610)","refs":["0984"]}],"DIREITO PENAL":[{"id":"rg_2018_0907","tema":"0907","texto":"TEMA 0907: A regra que prevê o crime do art. 305 do\nCódigo de Trânsito Brasileiro (Lei nº 9.503/97) é <strong>constitucional</strong>,\nposto não infirmar o princípio da não incriminação,\ngarantido o direito ao silêncio e <strong>ressalvadas</strong> as hipóteses de\nexclusão da tipicidade e da antijuridicidade.","refs":["0907"]}],"DIREITO CONSTITUCIONAL":[{"id":"rg_2018_0561","tema":"0561","texto":"TEMA 0561: O Ministério Público é <strong>parte legítima</strong>\npara o ajuizamento de ação coletiva que visa anular ato administrativo\nde aposentadoria que importe em lesão ao patrimônio público.\n<strong>(FGV/2024)</strong>\n\n<strong>TEMA 0739</strong>: É <strong>nula</strong> a decisão de órgão fracionário\nque se recusa a aplicar o art. 94, II, da Lei 9.472/1997, sem observar a\ncláusula de reserva de Plenário (CF, art. 97), observado o art. 949 do\nCódigo de Processo Civil.","refs":["0561","0739"]},{"id":"rg_2018_0497","tema":"0497","texto":"TEMA 0497: A incidência da estabilidade prevista no\nart. 10, inc. II, do ADCT, somente exige a anterioridade da gravidez à\ndispensa sem justa causa.","refs":["0497"]},{"id":"rg_2018_0822","tema":"0822","texto":"TEMA 0822: <strong>Não existe direito público subjetivo</strong> do\naluno ou de sua família ao <strong>ensino domiciliar,</strong> inexistente na\nlegislação brasileira. (RE 888815) **(VUNESP-MPERO-PROMOTOR/2024)\n(FGV-PREF SÃO JOSÉ DOS CAMPOS-SP/2023) (FGV-TJSC-JUIZ/2024.2)**","refs":["0822"]},{"id":"rg_2018_0262","tema":"0262","texto":"TEMA 0262: O Ministério Público é <strong>parte legítima</strong>\npara ajuizamento de ação civil pública que vise o **fornecimento de\nremédios** a portadores de certa doença.","refs":["0262"]},{"id":"rg_2018_0983","tema":"0983","texto":"TEMA 0983: I - O termo inicial do pagamento\ndiferenciado das gratificações de desempenho entre servidores ativos e\ninativos é o da <strong>data da homologação do resultado das avaliações,</strong>\napós a conclusão do primeiro ciclo; II - A redução, após a homologação\ndo resultado das avaliações, do valor da gratificação de desempenho paga\naos inativos e pensionistas <strong>não configura ofensa</strong> ao princípio da\nirredutibilidade de vencimentos.","refs":["0983"]},{"id":"rg_2018_0345","tema":"0345","texto":"TEMA 0345: É <strong>constitucional</strong> o ressarcimento\nprevisto no art. 32 da Lei 9.656/98, o qual é aplicável aos\nprocedimentos médicos, hospitalares ou ambulatoriais custeados pelo SUS\ne posteriores a 1.9.1998, assegurados o **contraditório e a ampla\ndefesa**, no âmbito administrativo, em todos os marcos jurídicos. (RE\n597064)","refs":["0345"]}],"DIREITO ELEITORAL":[{"id":"rg_2018_0860","tema":"0860","texto":"TEMA 0860: A condenação por abuso de poder econômico\nou político em ação de investigação judicial eleitoral transitada em\njulgado, ex vi do art. 22, XIV, da Lei Complementar n. 64/90, em sua\nredação primitiva, é apta a atrair a incidência da inelegibilidade do\nart. 1º, inciso I, alínea d, na redação dada pela Lei Complementar n.\n135/2010, aplicando-se a todos os processos de registro de candidatura\nem trâmite.","refs":["0860"]}]},"2017":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2017_0484","tema":"0484","texto":"TEMA 0484: 1) Tribunais de Justiça podem exercer\ncontrole <strong>abstrato</strong> de constitucionalidade de <strong>leis municipais</strong>\nutilizando como parâmetro normas da Constituição Federal, <strong>desde que</strong>\nse trate de normas de reprodução obrigatória pelos Estados; e 2) O art.\n39, § 4º, da Constituição Federal não é <strong>incompatível</strong> com o pagamento\nde terço de férias e décimo terceiro salário. (RE 650898) **(FGV/2023)\n(FGV-CÂMARA MUN DE SP-PROCURADOR/2024) [(FGV-TCEPA-AUDITOR/2024)\n(VUNESP-TJSP-TITULAR DE SERVIÇOS DE NOTAS/2024)]\n(FGV-TJES-JUIZ/2023) (FGV-TJSC-ANALISTA JURÍDICO/2024)\n(FGV-TJAP-JUIZ/2022 [(FGV-ENAM 2/2024) (FGV-PREF DE\nMACAÉ/RJ-PROCURADOR/2024)] (FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024) (FGV-ENAC/2025) (FGV-DPE/PE-DEFENSOR/2025)**","refs":["0484"]},{"id":"rg_2017_0544","tema":"0544","texto":"TEMA 0544: A <strong>justiça comum,</strong> federal ou estadual,\n<strong>é competente</strong> para julgar a <strong>abusividade de greve</strong> de servidores\npúblicos celetistas da Administração pública direta, autarquias e\nfundações públicas. (RE 846854) <strong>(FGV-TRF3-JUIZ/2025)</strong>\n\n<strong>TEMA 0571:</strong> <strong>Não se aplica</strong> a aposentadoria\ncompulsória prevista no artigo 40, parágrafo 1º, inciso II, da\nConstituição Federal **aos titulares de serventias judiciais não\nestatizadas<strong>, </strong>desde que** não sejam ocupantes de cargo público\nefetivo e não recebam remuneração proveniente dos cofres públicos. (RE\n647827) <strong>(FGV-TJSE-ATIV NOTARIAL E DE REGISTRO/2023)</strong>","refs":["0571","0544"]},{"id":"rg_2017_0535","tema":"0535","texto":"TEMA 0535: A garantia constitucional da gratuidade de\nensino <strong>não obsta</strong> a cobrança por universidades públicas de\nmensalidade em cursos de <strong>especialização</strong>. (RE 597854)\n**(FGV-TJSE-ATIVIDADE NOTARIAL E DE REGISTRO/2023) (FGV-CÂMARA DOS\nDEPUTADOS-ANALISTA/2024) (FGV-DPE/PE-DEFENSOR/2025)**","refs":["0535"]},{"id":"rg_2017_0947","tema":"0947","texto":"TEMA 0947: O <strong>organismo internacional</strong> que tenha\ngarantida a imunidade de jurisdição em tratado firmado pelo Brasil e\ninternalizado na ordem jurídica brasileira <strong>não pode</strong> ser demandado em\njuízo, <strong>salvo</strong> em caso de renúncia expressa a essa imunidade. (RE\n1034840) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0947"]},{"id":"rg_2017_0946","tema":"0946","texto":"TEMA 0946: Os Ministérios Públicos dos Estados e do\nDistrito Federal <strong>têm legitimidade</strong> para propor e atuar em recursos e\nmeios de impugnação de decisões judiciais em trâmite no STF e no STJ,\noriundos de processos de sua atribuição, sem prejuízo da atuação do\nMinistério Público Federal. (RE 985392)","refs":["0946"]},{"id":"rg_2017_0045","tema":"0045","texto":"TEMA 0045: A execução provisória de obrigação de fazer\nem face da Fazenda Pública <strong>não atrai</strong> o regime constitucional dos\nprecatórios. (RE 573872) <strong>(FGV-TRF5-JUIZ/2025)</strong>","refs":["0045"]},{"id":"rg_2017_0754","tema":"0754","texto":"TEMA 0754: Os efeitos financeiros das revisões de\naposentadoria concedidas com base no art. 6º-A da Emenda Constitucional\nnº 41/2003, introduzido pela Emenda Constitucional nº 70/2012, somente\nse produzirão a partir da data de sua promulgação (30.3.2012). (RE\n924456)","refs":["0754"]},{"id":"rg_2017_0541","tema":"0541","texto":"TEMA 0541: 1 - O exercício do direito de greve, sob\nqualquer forma ou modalidade, é **vedado aos policiais civis e a todos\nos servidores públicos que atuem diretamente na área de segurança\npública**. 2 - É obrigatória a participação do Poder Público em mediação\ninstaurada pelos órgãos classistas das carreiras de segurança pública,\nnos termos do art. 165 do CPC, para vocalização dos interesses da\ncategoria. (ARE 654432) <strong>(FGV-PCSC/2024)</strong> **(CESPE-PCPE-AGENTE DE\nPOLÍCIA/2024)**","refs":["0541"]},{"id":"rg_2017_0377","tema":"0377","texto":"TEMA 0377: Nos casos autorizados constitucionalmente\nde acumulação de cargos, empregos e funções, a incidência do art. 37,\ninciso XI, da Constituição Federal pressupõe **consideração de cada um\ndos vínculo<strong>s formalizados, </strong>afastada** a observância do [teto\nremuneratório quanto ao somatório] dos ganhos do agente\npúblico. (A mesma tese foi fixada para o Tema 384) (RE 612975)\n<strong>(FGV-ENAM/2024) (FGV-ENAM-MANAUS/2024)</strong>","refs":["0377","384"]},{"id":"rg_2017_0384","tema":"0384","texto":"TEMA 0384: Nos casos autorizados constitucionalmente\nde acumulação de cargos, empregos e funções, a incidência do art. 37,\ninciso XI, da Constituição Federal pressupõe **consideração de cada um\ndos vínculos<strong> formalizados, </strong>afastada** a observância do [teto\nremuneratório quanto ao somatório] dos ganhos do agente\npúblico. (A mesma tese foi fixada para o Tema 377). (RE 602043)\n<strong>(FGV-ENAM/2024) (FGV-ENAM-MANAUS/2024)</strong>","refs":["0384","377"]},{"id":"rg_2017_0173","tema":"0173","texto":"TEMA 0173: Os <strong>estrangeiros residentes</strong> no País são\nbeneficiários da assistência social prevista no artigo\n203, inciso V, da Constituição Federal, uma vez atendidos os requisitos\nconstitucionais e legais. (RE 587970)","refs":["0173"]},{"id":"rg_2017_0754","tema":"0754","texto":"TEMA 0754: Os efeitos financeiros das\nrevisões de aposentadoria concedidas com base no art. 6º-A da Emenda\nConstitucional nº 41/2003, introduzido pela Emenda Constitucional nº\n70/2012, somente se produzirão a partir da data de sua\npromulgação (30.3.2012). (RE 924456)","refs":["0754"]},{"id":"rg_2017_0020","tema":"0020","texto":"TEMA 0020: A contribuição social a cargo do empregador\n<strong>incide</strong> sobre ganhos habituais do empregado, quer anteriores ou\nposteriores à Emenda Constitucional nº 20/1998. (RE 565160)","refs":["0020"]},{"id":"rg_2017_0032","tema":"0032","texto":"TEMA 0032: A <strong>lei complementar</strong> é forma <strong>exigível</strong>\npara a d**efinição do modo beneficente de atuação das entidades de\nassistência social** contempladas pelo art. 195, § 7º, da CF,\nespecialmente no que se refere à instituição de contrapartidas a serem\npor elas observadas. (RE 566622)","refs":["0032"]},{"id":"rg_2017_0365","tema":"0365","texto":"TEMA 0365: Considerando que é <strong>dever do Estado</strong>,\nimposto pelo sistema normativo, manter em seus presídios os **padrões\nmínimos de humanidade** previstos no ordenamento jurídico, é de sua\nresponsabilidade, nos termos do art. 37, § 6º, da Constituição, a\nobrigação de ressarcir os danos, inclusive morais,\ncomprovadamente causados aos detentos em decorrência da falta ou\ninsuficiência das condições legais de encarceramento. (RE 580252)","refs":["0365"]}],"DIREITO DO CONSUMIDOR":[{"id":"rg_2017_0210","tema":"0210","texto":"TEMA 0210: Nos termos do art. 178 da Constituição da\nRepública, as <strong>normas e os tratados internacionais</strong> limitadores da\nresponsabilidade das transportadoras aéreas de passageiros,\nespecialmente as Convenções de Varsóvia e Montreal, **têm prevalência em\nrelação ao Código de Defesa do Consumidor.** O presente entendimento\n<strong>não se aplica às hipóteses de danos extrapatrimoniais.</strong> (ARE 766.618\nED/SP) (INFO 1119)\n\n\\[Tese anterior: Nos termos do art. 178 da Constituição da República, as\nnormas e os tratados internacionais limitadores da responsabilidade das\ntransportadoras aéreas de passageiros, especialmente as Convenções de\nVarsóvia e Montreal, têm <strong>prevalência</strong> em relação ao Código de Defesa\ndo Consumidor.\\] ([RE\n636331](https://portal.stf.jus.br/processos/detalhe.asp?incidente=4040813)**)\n(FGV-TJPR/2021) (CESPE-TJDTF-JUIZ/2023) (FGV-TJSC-JUIZ/2024)\n(VUNESP-MPRO-PROMOTOR/2024) (FGV-TJSC-JUIZ/2025) (FGV-TRF1-JUIZ/2025)**","refs":["0210"]}],"DIREITO CIVIL":[{"id":"rg_2017_0498","tema":"0498","texto":"TEMA 0498: É <strong>inconstitucional</strong> a distinção de\nregimes sucessórios entre cônjuges e companheiros prevista no art. 1.790\ndo CC/2002, devendo ser aplicado, tanto nas hipóteses de casamento\nquanto nas de união estável, o regime do art. 1.829 do CC/2002. (A mesma\ntese foi fixada para o Tema 809). (RE 646721)","refs":["0498","809"]},{"id":"rg_2017_0809","tema":"0809","texto":"TEMA 0809: É <strong>inconstitucional</strong> a distinção de\nregimes sucessórios entre cônjuges e companheiros prevista no art. 1.790\ndo CC/2002, devendo ser aplicado, tanto nas hipóteses de casamento\nquanto nas de união estável, o regime do art. 1.829 do CC/2002. (A mesma\ntese foi fixada para o Tema 498). (RE 878694) **(FGV-TJMG/2022) (+ UMA\nVEZ FGV/2022) (VUNESP-MPSP-PROMOTOR/2023)**","refs":["0809","498"]}],"DIREITO PENAL":[{"id":"rg_2017_0972","tema":"0972","texto":"TEMA 0972: É <strong>inconstitucional</strong> a fixação ex lege,\ncom base no art. 2º, § 1º, da Lei 8.072/1990, do regime inicial fechado,\ndevendo o julgador, quando da condenação, ater-se aos\nparâmetros previstos no artigo 33 do Código Penal. (ARE 1052700)\n(VUNESP-TJSP-JUIZ/2024)","refs":["0972"]},{"id":"rg_2017_0959","tema":"0959","texto":"TEMA 0959: É <strong>inconstitucional</strong> a expressão \\\"e\nliberdade provisória\\\", constante do caput do artigo 44 da Lei nº\n11.343/2006. (RE 1038925) <strong>(VUNESP-MPRJ-PROMOTOR/2024)</strong>","refs":["0959"]},{"id":"rg_2017_0647","tema":"0647","texto":"TEMA 0647: É <strong>possível</strong> o confisco de **todo e\nqualquer bem de valor econômico** apreendido em decorrência do tráfico\nde drogas, sem a necessidade de se perquirir a\nhabitualidade, reiteração do uso do bem para tal\nfinalidade, a sua modificação para dificultar a descoberta do local do\nacondicionamento da droga ou qualquer outro requisito além daqueles\nprevistos expressamente no art. 243, parágrafo único, da Constituição\nFederal. (RE 638491)","refs":["0647"]},{"id":"rg_2017_0937","tema":"0937","texto":"TEMA 0937: Os crimes previstos na Lei nº 8.137/1990\n<strong>não violam</strong> o disposto no art. 5º, inc. LXVII, da Constituição da\nRepública. (ARE 999425)","refs":["0937"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2017_0965","tema":"0965","texto":"TEMA 0965: Para a concessão da aposentadoria especial\nde que trata o art. 40, § 5º, da Constituição, conta-se o tempo de\nefetivo exercício, pelo professor, da docência e das atividades de\ndireção de unidade escolar e de coordenação e assessoramento pedagógico,\ndesde que em estabelecimentos de educação infantil ou de ensino\nfundamental e médio. (RE 1039644)","refs":["0965"]},{"id":"rg_2017_0403","tema":"0403","texto":"TEMA 0403: É <strong>compatível</strong> com a Constituição Federal\na previsão legal que exija o transcurso de 24 (vinte e quatro) meses,\ncontados do término do contrato, antes de nova admissão de professor\ntemporário anteriormente contratado. (RE 635648)","refs":["0403"]},{"id":"rg_2017_0454","tema":"0454","texto":"TEMA 0454: A nomeação tardia de candidatos aprovados\nem concurso público, por meio de ato judicial, à qual atribuída eficácia\nretroativa, <strong>não gera</strong> direito às promoções ou progressões funcionais\nque alcançariam houvesse ocorrido, a tempo e modo, a nomeação. (RE\n629392)","refs":["0454"]},{"id":"rg_2017_0246","tema":"0246","texto":"TEMA 0246: O <strong>inadimplemento</strong> dos encargos\ntrabalhistas dos empregados do contratado **não transfere\nautomaticamente** ao Poder Público contratante a responsabilidade pelo\nseu pagamento, seja em caráter solidário ou subsidiário, nos termos do\nart. 71, § 1º, da Lei nº 8.666/93. (RE 760931)","refs":["0246"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2017_0810","tema":"0810","texto":"TEMA 0810: 1) O art. 1º-F da Lei nº 9.494/97, com a\nredação dada pela Lei nº 11.960/09, na parte em que disciplina os juros\nmoratórios aplicáveis a condenações da Fazenda Pública, é\ninconstitucional ao incidir sobre débitos oriundos de relação\njurídico-tributária, aos quais devem ser aplicados os mesmos juros de\nmora pelos quais a Fazenda Pública remunera seu crédito tributário, em\nrespeito ao princípio constitucional da isonomia (CRFB, art. 5º, caput);\nquanto às condenações oriundas de relação jurídica não-tributária, a\nfixação dos juros moratórios segundo o índice de remuneração da\ncaderneta de poupança é constitucional, permanecendo hígido, nesta\nextensão, o disposto no art. 1º-F da Lei nº 9.494/97 com a redação dada\npela Lei nº 11.960/09; e 2) O art. 1º-F da Lei nº 9.494/97, com a\nredação dada pela Lei nº 11.960/09, na parte em que disciplina a\natualização monetária das condenações impostas à Fazenda Pública segundo\na remuneração oficial da caderneta de poupança, revela-se\ninconstitucional ao impor restrição desproporcional ao direito de\npropriedade (CRFB, art. 5º, XXII), uma vez que não se qualifica como\nmedida adequada a capturar a variação de preços da economia, sendo\ninidônea a promover os fins a que se destina. (RE 870947)","refs":["0810"]},{"id":"rg_2017_0948","tema":"0948","texto":"TEMA 0948: A Contribuição Sindical Rural, instituída\npelo Decreto-Lei 1.166/1971, foi recepcionada pela ordem constitucional\nvigente e não configura hipótese de bitributação. (RE 883542)","refs":["0948"]},{"id":"rg_2017_0691","tema":"0691","texto":"TEMA 0691: <strong>Incide</strong> contribuição previdenciária\nsobre os rendimentos pagos aos exercentes de mandato eletivo,\ndecorrentes da prestação de serviços à União, a estados e ao Distrito\nFederal ou a municípios, após o advento da Lei nº 10.887/2004, desde que\nnão vinculados a regime próprio de previdência. (RE 626837)","refs":["0691"]},{"id":"rg_2017_0034","tema":"0034","texto":"TEMA 0034: É <strong>constitucional</strong> a previsão em lei\nordinária que introduz a sistemática da não-cumulatividade a COFINS dado\nque observa os princípios da legalidade, isonomia, capacidade\ncontributiva global e não-confisco. (RE 570122)","refs":["0034"]},{"id":"rg_2017_0016","tema":"0016","texto":"TEMA 0016: A <strong>segurança pública,</strong> presentes a\nprevenção e o combate a incêndios, faz-se, no campo da [atividade\nprecípua], pela unidade da Federação, e, porque **serviço\nessencial,<strong> tem como a viabilizá-la a arrecadação de impostos, </strong>[não\ncabendo ao Município]** a criação de taxa para tal fim. (RE\n643247) **(FGV-ENAM/2024) (FGV-CÂMARA DOS DEPUTADOS-ANALISTA/2024)\n(CESPE-SEBRAE-ANALISTA/2024)**","refs":["0016"]},{"id":"rg_2017_0437","tema":"0437","texto":"TEMA 0437: <strong>Incide</strong> o IPTU, considerado imóvel de\npessoa jurídica de direito público <strong>cedido</strong> a pessoa jurídica de\ndireito privado, devedora do tributo. (RE 601720) **(FGV-PREF SÃO JOSÉ\nDOS CAMPOS- TEC TRIBUTÁRIO/2024)<strong> (</strong>FGV-PREF ABREU LIMA/PE-TÉCNICO DE\nCONTROLE INTERNO/2024) (FGV-SMF/RJ-FISCAL DE RENDAS/2023)**","refs":["0437"]},{"id":"rg_2017_0385","tema":"0385","texto":"TEMA 0385: A <strong>imunidade recíproca</strong>, prevista no art.\n150, VI, a, da Constituição <strong>não se estende</strong> a empresa privada\narrendatária de imóvel público, quando seja ela [exploradora de\natividade econômica com fins lucrativos]. Nessa hipótese é\nconstitucional a cobrança do IPTU pelo Município. (RE\n594015) **(FGV-CÂMARA DOS DEPUTADOS-CONSULTOR/2024) [(FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024)]**","refs":["0385"]},{"id":"rg_2017_0080","tema":"0080","texto":"TEMA 0080: Surge <strong>constitucional</strong>, sob o ângulo do\ncaráter seletivo, em função da essencialidade do produto e\ndo tratamento isonômico, o artigo 2º da Lei nº 8.393/1991, a revelar\nalíquota máxima de Imposto sobre Produtos Industrializados - IPI de 18%,\nassegurada isenção, quanto aos contribuintes situados na área de atuação\nda Superintendência de Desenvolvimento do Nordeste - SUDENE e da\nSuperintendência de Desenvolvimento da Amazônia - SUDAM, e autorização\npara redução de até 50% da alíquota, presentes contribuintes situados\nnos Estados do Espírito Santo e do Rio de Janeiro. (RE 592145)","refs":["0080"]},{"id":"rg_2017_0069","tema":"0069","texto":"TEMA 0069: O ICMS <strong>não compõe</strong> a base de cálculo\npara a incidência do PIS e da COFINS. (RE 574706)\n\n\\[[O Tribunal, por maioria, acolheu, em parte, os embargos de\ndeclaração, **para modular os efeitos do julgado cuja produção haverá de\nse dar após 15.3.2017** - data em que julgado o RE nº 574.706 e fixada a\ntese com repercussão geral \\\"O ICMS não compõe a base de cálculo para\nfins de incidência do PIS e da COFINS\\\" -, ressalvadas as ações\njudiciais e administrativas protocoladas até a data da sessão em que\nproferido o julgamento.\\]]","refs":["0069"]},{"id":"rg_2017_0593","tema":"0593","texto":"TEMA 0593: A <strong>imunidade tributária</strong> constante do\nart. 150, VI, d, da CF/88 <strong>aplica-se</strong> ao livro eletrônico (e-book),\n<strong>inclusive</strong> aos suportes exclusivamente utilizados para fixá-lo. (RE\n330817) <strong>(FGV-PREF DE CUIABÁ/MT-AUDITOR FISCAL/2024)</strong>","refs":["0593"]},{"id":"rg_2017_0259","tema":"0259","texto":"TEMA 0259: A imunidade da alínea d do inciso VI do\nartigo 150 da Constituição Federal <strong>alcança</strong> componentes eletrônicos\ndestinados, <strong>exclusivamente</strong>, a integrar unidade didática com\nfascículos. (RE 595676)","refs":["0259"]},{"id":"rg_2017_0342","tema":"0342","texto":"TEMA 0342: A <strong>imunidade</strong> tributária subjetiva\naplica-se a seus beneficiários na posição de **contribuinte de direito,\nmas não na de simples contribuinte de fato**, sendo\nirrelevante para a verificação da existência do\nbeneplácito constitucional a repercussão econômica do tributo envolvido.\n(RE 608872) **(FGV-TJAP-JUIZ/2022) (FGV-TRF1-JUIZ/2023)\n(FGV-MPU-ANALISTA/2025)**","refs":["0342"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2017_0499","tema":"0499","texto":"TEMA 0499: A <strong>eficácia subjetiva</strong> da coisa julgada\nformada a partir de <strong>ação coletiva, de rito ordinário,</strong> ajuizada por\nassociação civil na defesa de interesses dos associados, **somente\nalcança os filiados<strong>, </strong>[residentes no âmbito da\njurisdição]** do órgão julgador, que o fossem em [momento\nanterior ou até a data da propositura da demanda],\nconstantes da relação jurídica juntada à inicial do processo de\nconhecimento. (RE 612043) <strong>(VUNESP-MPRO-PROMOTOR/2024)</strong>","refs":["0499"]},{"id":"rg_2017_0877","tema":"0877","texto":"TEMA 0877: Os pagamentos devidos, em razão de\npronunciamento judicial, pelos Conselhos de Fiscalização **não se\nsubmetem<strong> ao regime de precatórios. (RE 938837) </strong>(FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024)**","refs":["0877"]},{"id":"rg_2017_0669","tema":"0669","texto":"TEMA 0669: É <strong>constitucional</strong> formal e materialmente\na contribuição social do empregador rural pessoa física,\ninstituída pela Lei 10.256/2001, [incidente sobre a receita\nbruta] obtida com a comercialização de sua produção. (RE\n718874)","refs":["0669"]},{"id":"rg_2017_0355","tema":"0355","texto":"TEMA 0355: É <strong>válida</strong> a <strong>penhora</strong> em bens de\npessoa jurídica de direito privado, realizada anteriormente à sucessão\ndesta pela União, <strong>não devendo</strong> a execução prosseguir mediante\nprecatório. (RE 693112)","refs":["0355"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2017_0648","tema":"0648","texto":"TEMA 0648: Compete à <strong>Justiça Federal</strong> processar e\njulgar o <strong>crime ambiental de caráter transnacional</strong> que envolva\n[animais silvestres, ameaçados de extinção e espécimes exóticas ou\nprotegidas] por compromissos internacionais assumidos pelo\nBrasil. (RE 835558) <strong>(FGV-TJGO-RESIDENTE/2025)</strong>","refs":["0648"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2017_0930","tema":"0930","texto":"TEMA 0930: Os benefícios concedidos entre 05.10.1988 e\n05.04.1991 (período do buraco negro) não estão, em tese, excluídos da\npossibilidade de readequação segundo os tetos instituídos pelas EC´s nº\n20/1998 e 41/2003, a ser aferida caso a caso, conforme os parâmetros\ndefinidos no julgamento do RE 564.354, em regime de repercussão geral.\n(RE 937595)","refs":["0930"]}]},"2016":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2016_0531","tema":"0531","texto":"TEMA 0531: A administração pública <strong>deve</strong> proceder\nao desconto dos dias de paralisação decorrentes do exercício do direito\nde greve pelos servidores públicos, em virtude da suspensão do vínculo\nfuncional que dela decorre, permitida a compensação em caso de acordo. O\ndesconto será, contudo, incabível se ficar demonstrado que a greve foi\nprovocada por conduta ilícita do Poder Público. (RE 693456)\n<strong>(FGV/2024)</strong>","refs":["0531"]},{"id":"rg_2016_0835","tema":"0835","texto":"TEMA 0835: Para os fins do art. 1º, inciso I, alínea\n\\\"g\\\", da Lei Complementar 64, de 18 de maio de 1990, alterado pela Lei\nComplementar 135, de 4 de junho de 2010, a apreciação das contas de\nprefeitos, tanto as de governo quanto as de gestão, será exercida pelas\nCâmaras Municipais, com o auxílio dos Tribunais de Contas competentes,\ncujo parecer prévio [somente deixará de prevalecer por decisão de 2/3\ndos vereadores]. (RE 848826) **(FGV/2023) (FGV/2024)\n(FGV-CÂMARA MUN DE SP-ANALISTA/2024) (FGV-TJGO-JUIZ/2023)\n(FGV-TCEPA-AUDITOR/2024) (FGV-TJAP-JUIZ/2022)**","refs":["0835"]},{"id":"rg_2016_0592","tema":"0592","texto":"TEMA 0592: Em caso de <strong>inobservância</strong> do seu dever\nespecífico de proteção previsto no art. 5º, inciso XLIX, da Constituição\nFederal, o <strong>Estado é responsável pela morte de detento</strong>. (RE 841526)","refs":["0592"]},{"id":"rg_2016_0763","tema":"0763","texto":"TEMA 0763: 1. Os servidores ocupantes de cargo\n<strong>exclusivamente em comissão</strong> não se submetem à regra da [aposentadoria\ncompulsória] prevista no art. 40, § 1º, II, da Constituição\nFederal, a qual **atinge apenas os ocupantes de cargo de provimento\nefetivo,** inexistindo, também, qualquer idade limite para fins de\nnomeação a cargo em comissão; 2. Ressalvados impedimentos de ordem\ninfraconstitucional, <strong>não há óbice constitucional</strong> a que o servidor\nefetivo aposentado compulsoriamente permaneça no cargo comissionado que\njá desempenhava ou a que seja nomeado para cargo de livre nomeação e\nexoneração, uma vez que não se trata de continuidade ou criação de\nvínculo efetivo com a Administração. (RE 786540)","refs":["0763"]},{"id":"rg_2016_0394","tema":"0394","texto":"TEMA 0394: 1) - Reconhecido o direito à anistia\npolítica, a falta de cumprimento de requisição ou determinação de\nprovidências por parte da União, por intermédio do órgão competente, no\nprazo previsto nos arts. 12, § 4º, e 18, caput e parágrafo único, da Lei\nnº 10.599/02, caracteriza ilegalidade e violação de direito líquido e\ncerto; 2) - Havendo rubricas no orçamento destinadas ao pagamento das\nindenizações devidas aos anistiados políticos e não demonstrada a\nausência de disponibilidade de caixa, a União há de promover o pagamento\ndo valor ao anistiado no prazo de 60 dias; 3) - Na ausência ou na\ninsuficiência de disponibilidade orçamentária no exercício em curso,\ncumpre à União promover sua previsão no projeto de lei orçamentária\nimediatamente seguinte. (RE 553710)","refs":["0394"]},{"id":"rg_2016_0921","tema":"0921","texto":"TEMA 0921: É <strong>vedada</strong> a <strong>cumulação tríplice</strong> de\nvencimentos e/ou proventos, ainda que a investidura nos cargos públicos\ntenha ocorrido anteriormente à EC 20/1998. (ARE 848993)","refs":["0921"]},{"id":"rg_2016_0917","tema":"0917","texto":"TEMA 0917: <strong>Não usurpa competência privativa</strong> do\nChefe do Poder Executivo lei que, <strong>embora crie despesa</strong> para a\nAdministração, <strong>não trata da sua estrutura ou da atribuição</strong> de seus\nórgãos <strong>nem do regime jurídico</strong> de servidores públicos (art. 61, § 1º,\nII,\\\"a\\\", \\\"c\\\" e \\\"e\\\", da Constituição Federal). (ARE 878911)\n**(FGV-ALTO-ANALISTA LEGIS-TÉC JURÍD/2024) (FGV-TJAP-JUIZ/2022)\n(FGV-TJES-JUIZ/2023) (FGV-AL/MA-ADVOGADO/2023) (FGV-ENAM/2025)**","refs":["0917"]},{"id":"rg_2016_0915","tema":"0915","texto":"TEMA 0915: <strong>Não é devida</strong> aos servidores do Poder\nJudiciário do Estado do Rio de Janeiro a extensão do reajuste concedido\npela Lei nº 1.206/1987, dispensando-se a devolução das verbas\neventualmente recebidas até 01º.09.2016 (data da conclusão deste\njulgamento). (ARE 909437)","refs":["0915"]},{"id":"rg_2016_0838","tema":"0838","texto":"TEMA 0838: Editais de concurso público <strong>não podem</strong>\nestabelecer <strong>restrição</strong> a pessoas com tatuagem, <strong>salvo</strong> situações\nexcepcionais em razão de conteúdo que viole valores constitucionais. (RE\n898450)","refs":["0838"]},{"id":"rg_2016_0479","tema":"0479","texto":"TEMA 0479: No atual estágio do conhecimento\ncientífico, que indica ser incerta a existência de efeitos nocivos da\nexposição ocupacional e da população em geral a campos elétricos,\nmagnéticos e eletromagnéticos gerados por sistemas de energia elétrica,\n<strong>não existem impedimentos</strong>, por ora, a que sejam adotados os\nparâmetros propostos pela Organização Mundial de Saúde, conforme\nestabelece a Lei nº 11.934/2009. (RE 627189)","refs":["0479"]},{"id":"rg_2016_0888","tema":"0888","texto":"TEMA 0888: É <strong>legítimo</strong> o pagamento do abono de\npermanência previsto no art. 40, § 19, da Constituição Federal ao\nservidor público que opte por permanecer em atividade após o\npreenchimento dos requisitos para a concessão da aposentadoria\nvoluntária especial (art. 40, § 4º, da Carta Magna). (ARE 954408)","refs":["0888"]},{"id":"rg_2016_0509","tema":"0509","texto":"TEMA 0509: A comprovação do <strong>triênio</strong> de atividade\njurídica exigida para o ingresso no cargo de juiz substituto, nos termos\ndo inciso I do art. 93 da Constituição Federal, deve ocorrer no\n<strong>momento da inscrição definitiva</strong> no concurso público. (RE 655265)\n<strong>(FGV-CÂMARA DOS DEPUTADOS- CONSULTOR/2023)</strong>","refs":["0509"]},{"id":"rg_2016_0782","tema":"0782","texto":"TEMA 0782: Os prazos da licença adotante <strong>não podem</strong>\nser inferiores aos prazos da licença gestante, o mesmo valendo para as\nrespectivas prorrogações. Em relação à licença adotante, **não é\npossível fixar prazos diversos** em função da idade da criança adotada.\n(RE 778889) **[(CESPE-DPEAC-DEFENSOR/2024) (FGV-TJAP-JUIZ/2022)\n(FGV-ENAM 2/2024)]**","refs":["0782"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2016_0201","tema":"0201","texto":"TEMA 0201: É <strong>devida</strong> a restituição da diferença do\nImposto sobre Circulação de Mercadorias e Serviços (ICMS) **pago a\nmais** no regime de substituição tributária para a frente se a base de\ncálculo efetiva da operação for inferior à presumida. (RE 593849)\n<strong>(FGV-ALPR-PROCURADOR/2024) (FGV-SEFAZ/RS-AUDITOR/2025)</strong>","refs":["0201"]},{"id":"rg_2016_0653","tema":"0653","texto":"TEMA 0653: É <strong>constitucional</strong> a concessão regular de\n<strong>incentivos, benefícios e isenções</strong> fiscais relativos ao Imposto de\nRenda e Imposto sobre Produtos Industrializados por parte da União em\nrelação ao Fundo de Participação de Municípios e respectivas quotas\ndevidas às Municipalidades. (RE 705423) **[(FGV-CÂMARA DE\nFORTALEZA-CONSULTOR/2024)] (FGV-PREF DE CUIABÁ/MT-AUDITOR\nFISCAL/2024)**","refs":["0653"]},{"id":"rg_2016_0827","tema":"0827","texto":"TEMA 0827: O Imposto sobre Circulação de Mercadorias e\nServiços (ICMS) <strong>incide</strong> sobre a tarifa de assinatura básica mensal\ncobrada pelas prestadoras de serviços de telefonia,\n<strong>independentemente</strong> da franquia de minutos concedida ou não ao\nusuário. (RE 912888)","refs":["0827"]},{"id":"rg_2016_0581","tema":"0581","texto":"TEMA 0581: As operadoras de planos de saúde r**ealizam\nprestação de serviço sujeita ao Imposto sobre Serviços de Qualquer\nNatureza** - ISSQN, previsto no art. 156, III, da CRFB/88. (RE 651703)","refs":["0581"]},{"id":"rg_2016_0540","tema":"0540","texto":"TEMA 0540: É <strong>inconstitucional</strong>, por <strong>ofensa</strong> ao\nprincípio da <strong>legalidade tributária,</strong> lei que delega aos conselhos de\nfiscalização de profissões regulamentadas a competência de fixar ou\nmajorar, sem parâmetro legal, o valor das contribuições de interesse das\ncategorias profissionais e econômicas, usualmente cobradas sob o título\nde anuidades, vedada, ademais, a atualização desse valor pelos conselhos\nem percentual superior aos índices legalmente previstos. (RE 704292)","refs":["0540"]},{"id":"rg_2016_0894","tema":"0894","texto":"TEMA 0894: A contribuição ao PIS só pode ser exigida,\nna forma estabelecida pelo art. 2º da EC 17/1997, após decorridos\nnoventa dias da data da publicação da referida emenda constitucional.\n(RE 848353)","refs":["0894"]},{"id":"rg_2016_0891","tema":"0891","texto":"TEMA 0891: É <strong>inconstitucional</strong> o art. 1º da Lei\n9.960/2000, que instituiu a Taxa de Serviços Administrativos - TSA, por\nnão definir de forma específica o fato gerador da exação. (ARE 957650)\n<strong>(FGV-TCE/PI-AUDITOR/2025) (FGV-TRF1-JUIZ/2023)</strong>\n\n\\[Ementa: TRIBUTÁRIO. RECURSO EXTRAORDINÁRIO COM AGRAVO.\n<strong>SUPERINTENDÊNCIA DA ZONA FRANCA DE MANAUS (SUFRAMA).</strong> COBRANÇA DA\nTAXA DE SERVIÇOS ADMINISTRATIVOS, INSTITUÍDA PELO ART. 1º DA LEI\n9.960/00. INCONSTITUCIONALIDADE. 1. É inconstitucional o art. 1º da Lei\n9.960/00, que instituiu a Taxa de Serviços Administrativos (TSA), por\nnão definir de forma específica o fato gerador da exação. 2. Agravo\nconhecido para negar provimento ao recurso extraordinário, com o\nreconhecimento da repercussão geral do tema e a reafirmação da\njurisprudência sobre a matéria.\\]","refs":["0891"]},{"id":"rg_2016_0204","tema":"0204","texto":"TEMA 0204: É constitucional a previsão legal de\ndiferenciação de alíquotas em relação às contribuições previdenciárias\nincidentes sobre a folha de salários de instituições financeiras ou de\nentidades a elas legalmente equiparáveis, após a edição da Emenda\nConstitucional nº 20/1998. (RE 598572)","refs":["0204"]},{"id":"rg_2016_0225","tema":"0225","texto":"TEMA 0225: I - O art. 6º da Lei Complementar 105/01\n<strong>não ofende</strong> o direito ao sigilo bancário, pois realiza a igualdade em\nrelação aos cidadãos, por meio do princípio da capacidade contributiva,\nbem como estabelece requisitos objetivos e o translado do dever de\nsigilo da esfera bancária para a fiscal;II - A Lei 10.174/01 não atrai a\naplicação do princípio da irretroatividade das leis tributárias, tendo\nem vista o caráter instrumental da norma, nos termos do artigo 144, §\n1º, do CTN. (RE 601314)","refs":["0225"]},{"id":"rg_2016_0102","tema":"0102","texto":"TEMA 0102: É <strong>constitucional</strong> o art. 1º, IV, da Lei\n8.033/1990, uma vez que a incidência de IOF sobre o negócio jurídico de\ntransmissão de títulos e valores mobiliários, tais como ações de\ncompanhias abertas e respectivas bonificações, encontra respaldo no art.\n153, V, da Constituição Federal, **sem ofender os princípios tributários\nda anterioridade e da irretroatividade,** nem demandar a reserva de lei\ncomplementar. (RE 583712)","refs":["0102"]},{"id":"rg_2016_0643","tema":"0643","texto":"TEMA 0643: <strong>Incide</strong> o imposto de produtos\nindustrializados na importação de veículo automotor por pessoa natural,\n<strong>ainda que</strong> não desempenhe atividade empresarial e o faça para uso\npróprio. (RE 723651)","refs":["0643"]}],"DIREITO PENAL":[{"id":"rg_2016_0925","tema":"0925","texto":"TEMA 0925: A execução provisória de acórdão penal\ncondenatório proferido em grau recursal, ainda que sujeito a recurso\nespecial ou extraordinário, não compromete o princípio constitucional da\npresunção de inocência afirmado pelo artigo 5º, inciso LVII, da\nConstituição Federal. (ARE 964246)","refs":["0925"]},{"id":"rg_2016_0423","tema":"0423","texto":"TEMA 0423: I - A **falta de estabelecimento penal\nadequado não autoriza** a manutenção do condenado em regime prisional\n<strong>mais gravoso;</strong> II - Os juízes da execução penal poderão avaliar os\nestabelecimentos destinados aos regimes semiaberto e aberto, para\nqualificação como adequados a tais regimes. São aceitáveis\nestabelecimentos que não se qualifiquem como \"colônia agrícola,\nindustrial\" (regime semiaberto) ou \"casa de albergado ou estabelecimento\nadequado\" (regime aberto) (art. 33, §1º, alíneas \"b\" e \"c\"); III -\nHavendo <strong>déficit de vagas, deverá</strong> determinar-se: (i) a [saída\nantecipada] de sentenciado no regime com falta de vagas;\n(ii) a liberdade eletronicamente monitorada ao sentenciado\nque sai antecipadamente ou é posto em prisão domiciliar por falta de\nvagas; (iii) o cumprimento de penas restritivas de direito\ne/ou estudo ao sentenciado que progride ao regime aberto.\nAté que sejam estruturadas as medidas alternativas propostas, poderá ser\ndeferida a prisão domiciliar ao sentenciado. (RE 641320)","refs":["0423"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2016_0399","tema":"0399","texto":"TEMA 0399: A expropriação prevista no art. 243 da\nConstituição Federal <strong>pode ser afastada, desde que</strong> o proprietário\ncomprove que não incorreu em culpa, ainda que \\\"in vigilando\\\" ou \\\"in\neligendo\\\". (RE 635336) <strong>(FGV-TJAP-JUIZ/2022)</strong>","refs":["0399"]}],"DIREITO DO TRABALHO":[{"id":"rg_2016_0928","tema":"0928","texto":"TEMA 0928: Compete à Justiça do Trabalho processar e\njulgar ações relativas às verbas trabalhistas referentes ao período em\nque o servidor mantinha vínculo celetista com a Administração, antes da\ntransposição para o regime estatutário. (ARE 1001075)","refs":["0928"]},{"id":"rg_2016_0916","tema":"0916","texto":"TEMA 0916: A contratação por <strong>tempo determinado</strong>\npara atendimento de necessidade <strong>temporária de excepcional</strong> interesse\npúblico realizada em <strong>desconformidade</strong> com os preceitos do art. 37,\nIX, da Constituição Federal n[ão gera quaisquer efeitos jurídicos\nválidos em relação aos servidores contratado]s, com\n<strong>exceção</strong> do direito à percepção dos salários referentes ao período\ntrabalhado e, nos termos do art. 19-A da Lei 8.036/1990, ao levantamento\ndos depósitos efetuados no Fundo de Garantia do Tempo de Serviço - FGTS.\n(RE 765320) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0916"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2016_0503","tema":"0503","texto":"TEMA 0503: No âmbito do Regime Geral de Previdência\nSocial - RGPS, <strong>somente lei</strong> pode criar benefícios e vantagens\nprevidenciárias, não havendo, por ora, previsão legal do direito à\n\\'desaposentação\\' ou à 'reaposentação', sendo constitucional a regra do\nart. 18, § 2º, da Lei nº 8.213/91. (RE 661256)","refs":["0503"]}],"DIREITO CIVIL":[{"id":"rg_2016_0622","tema":"0622","texto":"TEMA 0622: A paternidade socioafetiva, declarada ou\nnão em registro público, <strong>não impede</strong> o reconhecimento do vínculo de\nfiliação concomitante baseado na origem biológica, com os efeitos\njurídicos próprios. (RE 898060) **(VUNESP-MPRO-PROMOTOR/2024)\n(VUNESP-TJRJ-JUIZ/2023) (VUNESP-MPSP-PROMOTOR/2023)**","refs":["0622"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2016_0258","tema":"0258","texto":"TEMA 0258: Compete à <strong>Justiça Federal</strong> processar e\njulgar ações em que a Ordem dos Advogados do Brasil, quer mediante o\nConselho Federal, quer seccional, figure na relação processual. (RE\n595332)","refs":["0258"]},{"id":"rg_2016_0666","tema":"0666","texto":"TEMA 0666: É <strong>prescritível</strong> a ação de reparação de\ndanos à Fazenda Pública decorrente de ilícito civil. (RE 669069)\n**(FGV-ALPR-ANALISTA LEGISLATIVO/2024) (VUNESP-MPRJ-PROMOTOR/2024)\n(FGV-TRF3-JUIZ/2025)**","refs":["0666"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2016_0613","tema":"0613","texto":"TEMA 0613: 1. É <strong>constitucional</strong> a citação por\n<strong>hora certa,</strong> prevista no art. 362, do Código de Processo Penal. 2. A\nocultação do réu para ser citado infringe cláusulas constitucionais do\ndevido processo legal e <strong>viola</strong> as garantias constitucionais do\n<strong>acesso à justiça e da razoável duração do processo</strong>. (RE 635145)","refs":["0613"]}]},"2015":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2015_0815","tema":"0815","texto":"TEMA 0815: Preenchidos os requisitos do art. 183 da\nConstituição Federal, o reconhecimento do direito à usucapião especial\nurbana <strong>não pode ser obstado p</strong>or legislação infraconstitucional que\nestabeleça módulos urbanos na respectiva área em que situado o imóvel\n(dimensão do lote). (RE 422349) **(FGV-PROC-CÂMARA MUNICIPAL DE SP/2024)\n(CESPE-PREF DE MOSSORÓ/RN-PROCURADOR/2024) (VUNESP-MPSP-PROMOTOR/2023)**","refs":["0815"]},{"id":"rg_2015_0223","tema":"0223","texto":"TEMA 0223: É <strong>inconstitucional</strong>, por afrontar a\niniciativa privativa do Chefe do Poder Executivo, a **normatização de\ndireitos dos servidores públicos em lei orgânica** do Município. (RE\n590829) **(FGV-JUIZ DO TRABALHO/2023) (FGV/2022) (FGV-CÂMARA DOS\nDEPUTADOS-CONSULTOR/2023)**","refs":["0223"]},{"id":"rg_2015_0579","tema":"0579","texto":"TEMA 0579: É <strong>constitucional</strong> a regra que <strong>veda</strong>,\nno âmbito do Sistema Único de Saúde, a internação em acomodações\nsuperiores, bem como o atendimento diferenciado por médico do próprio\nSistema Único de Saúde, ou por médico conveniado, [mediante o\npagamento] da diferença dos valores correspondentes. (RE\n581488) <strong>(FGV-CÂMARA DOS DEP-ANALISTA/2023)</strong>","refs":["0579"]},{"id":"rg_2015_0348","tema":"0348","texto":"TEMA 0348: Os municípios com **mais de vinte mil\nhabitantes** e o Distrito Federal podem legislar sobre programas e\nprojetos específicos de ordenamento do espaço urbano por meio de leis\nque sejam compatíveis com as diretrizes fixadas no plano diretor. (RE\n607940)","refs":["0348"]},{"id":"rg_2015_0856","tema":"0856","texto":"TEMA 0856: I - É <strong>desnecessária</strong> a submissão à regra\nda reserva de plenário quando a decisão judicial estiver fundada em\njurisprudência do Plenário ou em Súmula deste Supremo Tribunal\nFederal;II - É <strong>inconstitucional</strong> a restrição ilegítima ao livre\nexercício de atividade econômica ou profissional, quando imposta como\nmeio de cobrança indireta de tributos. (ARE 914045)","refs":["0856"]},{"id":"rg_2015_0781","tema":"0781","texto":"TEMA 0781: As hipóteses de <strong>inelegibilidade</strong>\nprevistas no art. 14, § 7º, da Constituição Federal, inclusive quanto ao\nprazo de seis meses, <strong>são aplicáveis</strong> às eleições suplementares. (RE\n843455) **(FGV-TJSC-JUIZ/2024.2) [(VUNESP-TJSP-JUIZ/2024)\n(VUNESP-TJSP-JUIZ/2023)]**","refs":["0781"]},{"id":"rg_2015_0821","tema":"0821","texto":"TEMA 0821: A utilização do salário mínimo como base de\ncálculo do valor de pensão alimentícia <strong>não viola</strong> a Constituição\nFederal. (ARE 842157)","refs":["0821"]},{"id":"rg_2015_0733","tema":"0733","texto":"TEMA 0733: A decisão do Supremo Tribunal Federal\ndeclarando a constitucionalidade ou a inconstitucionalidade de preceito\nnormativo <strong>não produz a automática</strong> reforma ou rescisão das decisões\nanteriores que tenham adotado entendimento diferente. Para que tal\nocorra, será <strong>indispensável</strong> a interposição de <strong>recurso próprio</strong> ou,\nse for o caso, a propositura de ação rescisória própria, nos termos do\nart. 485 do CPC, observado o respectivo prazo decadencial (CPC, art.\n495). (RE 730462) **(FGV/2022) (FGV-TRF1-ANALISTA/2024) (FGV-ENAM\n2/2024) (FGV-PREF DE CUIABÁ/MT-AUDITOR FISCAL/2024)\n(FGV-TRT24-ANALISTA/2025)**","refs":["0733"]},{"id":"rg_2015_0806","tema":"0806","texto":"TEMA 0806: É <strong>vedada</strong> a equiparação remuneratória\nentre militares das Forças Armadas e policiais e bombeiros militares do\nDistrito Federal, visto que a Constituição Federal de 1988, em seu art.\n37, XIII, coíbe a vinculação ou equiparação de quaisquer espécies\nremuneratórias no âmbito do serviço público. (ARE 665632)","refs":["0806"]},{"id":"rg_2015_0639","tema":"0639","texto":"TEMA 0639: Subtraído o montante que exceder o teto e o\nsubteto previsto no art. 37, inciso XI, da Constituição, tem-se o valor\npara base de cálculo para a incidência do imposto de renda e da\ncontribuição previdenciária. (RE 675978)","refs":["0639"]},{"id":"rg_2015_0793","tema":"0793","texto":"TEMA 0793: Os entes da federação, em decorrência da\ncompetência comum, são <strong>solidariamente responsáveis</strong> nas demandas\nprestacionais na área da <strong>saúde</strong>, e diante dos critérios\nconstitucionais de descentralização e hierarquização, compete à\nautoridade judicial direcionar o cumprimento conforme as regras de\nrepartição de competências e determinar o ressarcimento a quem suportou\no ônus financeiro. (RE 855178) **(FGV-ALPR-ADVOGADO/2024)\n(FGV-ALMA-CONSULTOR/2023)**","refs":["0793"]},{"id":"rg_2015_0469","tema":"0469","texto":"TEMA 0469: Nos <strong>limites da circunscrição</strong> do\nmunicípio e <strong>havendo pertinência</strong> com o exercício do mandato,\ngarante-se a <strong>imunidade</strong> ao vereador. (RE 600063)","refs":["0469"]},{"id":"rg_2015_0033","tema":"0033","texto":"TEMA 0033: Os requisitos de <strong>relevância e urgência</strong>\nprevistos no art. 62 da Constituição Federal estão presentes na Medida\nProvisória 2.170-36/2001, que autoriza a capitalização de juros com\nperiodicidade inferior a um ano nas operações realizadas pelas\ninstituições integrantes do Sistema Financeiro Nacional. (RE 592377)","refs":["0033"]}],"DIREITO PROCESSUAL PENAL":[{"id":"rg_2015_0184","tema":"0184","texto":"TEMA 0184: O Ministério Público dispõe de\n**competência para promover, por autoridade própria, e por prazo\nrazoável, investigações<strong> de natureza penal, </strong>desde que** respeitados\nos direitos e garantias que assistem a qualquer indiciado ou a qualquer\npessoa sob investigação do Estado, observadas, sempre, por seus agentes,\nas hipóteses de reserva constitucional de jurisdição e, também, as\nprerrogativas profissionais de que se acham investidos, em nosso País,\nos Advogados (Lei 8.906/1994, art. 7º, notadamente os incisos I, II,\nIII, XI, XIII, XIV e XIX), sem prejuízo da possibilidade -- sempre\npresente no Estado democrático de Direito -- do permanente controle\njurisdicional dos atos, necessariamente documentados (Súmula Vinculante\n14), praticados pelos membros dessa Instituição. (RE 593727)\n<strong>(FGV-DPERJ-DEFENSOR/2023)</strong>","refs":["0184"]},{"id":"rg_2015_0811","tema":"0811","texto":"TEMA 0811: I - O ajuizamento da ação penal privada\n<strong>pode ocorrer</strong> após o decurso do prazo legal, sem que seja oferecida\ndenúncia, ou promovido o arquivamento, ou requisitadas diligências\nexternas ao Ministério Público. Diligências internas à instituição são\nirrelevantes; II - A conduta do Ministério Público posterior ao\nsurgimento do direito de queixa não prejudica sua propositura. Assim, o\noferecimento de denúncia, a promoção do arquivamento ou a requisição de\ndiligências externas ao Ministério Público, posterior ao decurso do\nprazo legal para a propositura da ação penal <strong>não afastam</strong> o direito\nde queixa. Nem mesmo a ciência da vítima ou da família quanto a tais\ndiligências afasta esse direito, por não representar concordância com a\nfalta de iniciativa da ação penal pública. (ARE 859251)","refs":["0811"]}],"DIREITO ELEITORAL":[{"id":"rg_2015_0781","tema":"0781","texto":"TEMA 0781: As hipóteses de inelegibilidade previstas\nno art. 14, § 7º, da Constituição Federal, inclusive quanto ao prazo de\nseis meses, são aplicáveis às eleições suplementares.\n<strong>(VUNESP-TJSP/2023)</strong>","refs":["0781"]},{"id":"rg_2015_0367","tema":"0367","texto":"TEMA 0367: A Lei Complementar 135/2010 não é aplicável\nàs eleições gerais de 2010, em face do princípio da [anterioridade\neleitoral] (art. 16 da Constituição Federal). (RE 631102)","refs":["0367"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2015_0472","tema":"0472","texto":"TEMA 0472: É <strong>constitucional</strong> a atribuição às\nguardas municipais do exercício de <strong>poder de polícia</strong> de trânsito,\n<strong>inclusive</strong> para imposição de <strong>sanções</strong> administrativas legalmente\nprevistas. (RE 658570) **(FGV-TJSE-ATIVIDADE NOTARIAL E DE\nREGISTRO/2023) (CESPE-PREF CACHOEIRO DE ITAPEMIRIM/2024)**","refs":["0472"]},{"id":"rg_2015_0220","tema":"0220","texto":"TEMA 0220: É <strong>lícito</strong> ao Judiciário impor à\nAdministração Pública <strong>obrigação de fazer,</strong> consistente na promoção de\nmedidas ou na execução de obras emergenciais em estabelecimentos\nprisionais para dar **efetividade ao postulado da dignidade da pessoa\nhumana<strong> e assegurar aos detentos o respeito à sua </strong>integridade física\ne moral,** nos termos do que preceitua o art. 5º, XLIX, da Constituição\nFederal, não sendo oponível à decisão o argumento da reserva do possível\nnem o princípio da separação dos poderes. (RE 592581)","refs":["0220"]},{"id":"rg_2015_0784","tema":"0784","texto":"TEMA 0784: O surgimento de **novas vagas ou a abertura\nde novo concurso** para o mesmo cargo, durante o prazo de validade do\ncertame anterior, <strong>não gera automaticamente o direito à nomeação</strong> dos\ncandidatos aprovados fora das vagas previstas no edital,\nressalvadas as hipóteses de preterição **arbitrária e\nimotivada** por parte da administração, caracterizada por comportamento\ntácito ou expresso do Poder Público capaz de revelar a inequívoca\nnecessidade de nomeação do aprovado durante o período de validade do\ncertame, a ser demonstrada de forma cabal pelo candidato. Assim, o\n<strong>direito subjetivo</strong> à nomeação do candidato aprovado em concurso\npúblico exsurge nas seguintes hipóteses: I -- Quando a aprovação ocorrer\n<strong>dentro do número de vagas</strong> dentro do edital; II -- Quando houver\n<strong>preterição na nomeação</strong> por não observância da ordem de\nclassificação; III -- Quando surgirem <strong>novas vagas</strong>, **ou for aberto\nnovo concurso d<strong>urante a validade do certame anterior, </strong>e ocorrer a\npreterição** de candidatos de forma arbitrária e imotivada por parte da\nadministração nos termos acima. (RE 837311) **(VUNESP-CÂMARA DE\nCAMPINAS-ASSESSOR JURÍDICO/2024) (FGV-TJAP-JUIZ/2022)**","refs":["0784"]},{"id":"rg_2015_0483","tema":"0483","texto":"TEMA 0483: É <strong>legítima</strong> a publicação, inclusive em\nsítio eletrônico mantido pela Administração Pública, dos nomes dos seus\nservidores e do valor dos correspondentes vencimentos e vantagens\npecuniárias. (ARE 652777)","refs":["0483"]}],"DIREITO PROCESSUAL CIVIL":[{"id":"rg_2015_0873","tema":"0873","texto":"TEMA 0873: <strong>Não viola</strong> o art. 100, § 8º, da\nConstituição Federal a execução individual de sentença condenatória\ngenérica proferida contra a Fazenda Pública em ação coletiva visando à\ntutela de direitos individuais homogêneos. (ARE 925754)","refs":["0873"]},{"id":"rg_2015_0135","tema":"0135","texto":"TEMA 0135: Aplica-se o § 1º do art. 511 do Código de\nProcesso Civil para dispensa de porte de remessa e retorno ao exonerar o\nseu respectivo recolhimento por parte do INSS. (RE 594116)","refs":["0135"]},{"id":"rg_2015_0607","tema":"0607","texto":"TEMA 0607: A Defensoria Pública <strong>tem legitimidade</strong>\npara a propositura de ação civil pública que vise a promover a tutela\njudicial de direitos difusos ou coletivos de que sejam titulares, em\ntese, pessoas necessitadas. (RE 733433) **(FGV-ALPR-ANALISTA\nLEGISL/2024) (FGV-DATAPREV-ADVOGADO/2024)**","refs":["0607"]},{"id":"rg_2015_0831","tema":"0831","texto":"TEMA 0831: O pagamento dos valores devidos pela\nFazenda Pública entre a data da impetração do mandado de segurança e a\nefetiva implementação da ordem concessiva **deve observar o regime de\nprecatórios** previsto no artigo 100 da Constituição Federal. (RE\n889173)","refs":["0831"]}],"DIREITO TRIBUTÁRIO":[{"id":"rg_2015_0168","tema":"0168","texto":"TEMA 0168: É <strong>inconstitucional</strong> a [aplicação\nretroativa] de lei que majora a alíquota incidente sobre o\nlucro proveniente de operações incentivadas ocorridas no passado,\n<strong>ainda que</strong> no mesmo ano-base, tendo em vista que o fato gerador se\nconsolida no momento em que ocorre cada operação de exportação, à luz da\nextrafiscalidade da tributação na espécie. (RE 592396)","refs":["0168"]},{"id":"rg_2015_0226","tema":"0226","texto":"TEMA 0226: Declarada **inconstitucional a\nprogressividade<strong> de alíquota tributária, é </strong>devido o tributo calculado\npela alíquota mínima** correspondente, de acordo com a destinação do\nimóvel. (RE 602347)","refs":["0226"]},{"id":"rg_2015_0844","tema":"0844","texto":"TEMA 0844: O princípio da <strong>não cumulatividade</strong> [não\nassegura direito de crédito presumido de IPI] para o\ncontribuinte adquirente de insumos não tributados, isentos ou sujeitos à\nalíquota zero. (RE 398365)","refs":["0844"]},{"id":"rg_2015_0830","tema":"0830","texto":"TEMA 0830: Somente <strong>lei em sentido formal</strong> pode\ninstituir o regime de recolhimento do ICMS por estimativa. (RE 632265)","refs":["0830"]},{"id":"rg_2015_0582","tema":"0582","texto":"TEMA 0582: O habeas data é a **garantia constitucional\nadequada** para a obtenção, pelo próprio contribuinte, dos [dados\nconcernentes ao pagamento de tributos c]onstantes de\nsistemas informatizados de apoio à arrecadação dos órgãos da\nadministração fazendária dos entes estatais. (RE 673707)\n<strong>(CESPE-DPEAC-DEFENSOR/2024) (FGV-TRF3-JUIZ/2025)</strong>","refs":["0582"]}],"DIREITO PENAL":[{"id":"rg_2015_0371","tema":"0371","texto":"TEMA 0371: Reveste-se de <strong>legitimidade jurídica</strong> a\nconcessão, pelo Presidente da República, do benefício constitucional do\nindulto (CF, art. 84, XII), que traduz expressão do poder de graça do\nEstado, mesmo se se tratar de indulgência destinada a favorecer pessoa\nque, em razão de sua inimputabilidade ou semi-imputabilidade, sofre\nmedida de segurança, <strong>ainda que</strong> de caráter pessoal e detentivo. (RE\n628658)","refs":["0371"]},{"id":"rg_2015_0393","tema":"0393","texto":"TEMA 0393: Compete à <strong>Justiça Federal</strong> processar e\njulgar os <strong>crimes</strong> consistentes em <strong>disponibilizar ou adquirir</strong>\nmaterial pornográfico, <strong>acessível transnacionalmente</strong>, envolvendo\ncriança ou adolescente, quando praticados por meio da rede mundial de\ncomputadores (arts. 241, 241-A e 241-B da Lei nº 8.069/1990). (RE\n628624) <strong>(VUNESP-MPERO-PROMOTOR/2024)</strong>","refs":["0393"]},{"id":"rg_2015_0187","tema":"0187","texto":"TEMA 0187: As <strong>consequências jurídicas extra penais</strong>\nprevistas no art. 91 do Código Penal são decorrentes de sentença penal\ncondenatória. Tal <strong>não ocorre,</strong> portanto, quando há **transação\npenal** (art. 76 da Lei 9.099/1995), cuja sentença tem natureza\nmeramente <strong>homologatória</strong>, sem qualquer juízo sobre a responsabilidade\ncriminal do aceitante. As consequências geradas pela transação penal são\nessencialmente aquelas estipuladas por modo consensual no respectivo\ninstrumento de acordo. (RE 795567)","refs":["0187"]},{"id":"rg_2015_0184","tema":"0184","texto":"TEMA 0184: O Ministério Público dispõe de\n<strong>competência</strong> para promover, por autoridade própria, e por **prazo\nrazoável,<strong> investigações de natureza penal, </strong>desde que** respeitados\nos direitos e garantias que assistem a qualquer indiciado ou a qualquer\npessoa sob investigação do Estado, observadas, sempre, por seus agentes,\nas hipóteses de reserva constitucional de jurisdição e, também, as\nprerrogativas profissionais de que se acham investidos, em nosso País,\nos Advogados (Lei 8.906/1994, art. 7º, notadamente os incisos I, II,\nIII, XI, XIII, XIV e XIX), <strong>sem prejuízo</strong> da possibilidade -- sempre\npresente no Estado democrático de Direito -- do permanente **controle\njurisdicional** dos atos, necessariamente documentados (Súmula\nVinculante 14), praticados pelos membros dessa Instituição. (RE 593727)","refs":["0184"]}],"DIREITO CIVIL":[{"id":"rg_2015_0349","tema":"0349","texto":"TEMA 0349: É <strong>constitucional</strong> o § 1º do artigo 1.361\ndo Código Civil no que revela a possibilidade de ter-se como constituída\na propriedade fiduciária de veículos com o registro do contrato na\nrepartição competente para o licenciamento do bem. (RE 611639)","refs":["0349"]},{"id":"rg_2015_0815","tema":"0815","texto":"TEMA 0815: Preenchidos os requisitos do art. 183 da\nConstituição Federal, o reconhecimento do direito à usucapião especial\nurbana <strong>não pode</strong> ser obstado por legislação infraconstitucional que\nestabeleça módulos urbanos na respectiva área em que situado o imóvel\n(dimensão do lote). (RE 422349)","refs":["0815"]}],"DIREITO DO TRABALHO":[{"id":"rg_2015_0853","tema":"0853","texto":"TEMA 0853: Compete à <strong>Justiça do Trabalho</strong> processar\ne julgar demandas visando a obter prestações de natureza trabalhista,\najuizadas contra órgãos da Administração Pública por servidores que\ningressaram em seus quadros, **sem concurso público, antes do advento da\nCF/88,** sob regime da Consolidação das Leis do Trabalho - CLT. (ARE\n906491)","refs":["0853"]},{"id":"rg_2015_0152","tema":"0152","texto":"TEMA 0152: A <strong>transação extrajudicial</strong> que importa\nrescisão do contrato de trabalho, em razão de adesão voluntária do\nempregado a plano de dispensa incentivada, [enseja quitação ampla e\nirrestrita] de todas as parcelas objeto do contrato de\nemprego, caso essa condição tenha constado expressamente do acordo\ncoletivo que aprovou o plano, bem como dos demais instrumentos\ncelebrados com o empregado. (RE 590415)","refs":["0152"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2015_0396","tema":"0396","texto":"TEMA 0396: Os pensionistas de servidor falecido\nposteriormente à EC 41/2003 têm direito à paridade com servidores em\natividade (EC 41/2003, art. 7º), caso se enquadrem na regra de transição\nprevista no art. 3º da EC 47/2005. Não tem, contudo, direito à\nintegralidade (CF, art. 40, § 7º, inciso I). (RE 603580)","refs":["0396"]}],"DIREITO AMBIENTAL":[{"id":"rg_2015_0145","tema":"0145","texto":"TEMA 0145: O <strong>município é competente</strong> para legislar\nsobre o meio ambiente com a União e o Estado, no limite do seu interesse\nlocal e desde que tal regramento seja harmônico com a disciplina\nestabelecida pelos demais entes federados (art. 24, VI, c/c 30, I e II,\nda Constituição Federal). (RE 586224)","refs":["0145"]}]},"2014":{"DIREITO CONSTITUCIONAL":[{"id":"rg_2014_0738","tema":"0738","texto":"TEMA 0738: É <strong>incompatível</strong> com a Constituição a\nexigência de inscrição na Ordem dos Músicos do Brasil, bem como de\npagamento de anuidade, para o exercício da profissão. (RE 795467)\n<strong>(FGV-JUIZ DO TRABALHO/2023)</strong>","refs":["0738"]},{"id":"rg_2014_0031","tema":"0031","texto":"TEMA 0031: É <strong>inconstitucional</strong> o uso de meio\nindireto coercitivo para pagamento de tributo -- \"sanção\npolítica\" --, tal qual ocorre com a exigência, pela Administração\nTributária, de fiança, garantia real ou fidejussória como condição para\n<strong>impressão de notas fiscais</strong> de contribuintes com débitos tributários.\n(RE 565048) <strong>(FGV/2022)</strong>","refs":["0031"]},{"id":"rg_2014_0029","tema":"0029","texto":"TEMA 0029: Leis que tratam dos casos de vedação a\nnepotismo <strong>não são</strong> de iniciativa exclusiva do Chefe do Poder\nExecutivo. (RE 570392)","refs":["0029"]},{"id":"rg_2014_0279","tema":"0279","texto":"TEMA 0279: Os procuradores federais têm o direito às\nférias de 30 dias, por força do que dispõe o art. 5º da Lei 9.527/1997,\nporquanto não recepcionados com natureza de leis complementares o art.\n1º da Lei 2.123/1953 e o art. 17, parágrafo único, da Lei 4.069/1962.\n(RE 602381)","refs":["0279"]},{"id":"rg_2014_0771","tema":"0771","texto":"TEMA 0771: São <strong>constitucionais</strong> as alterações\nprocedidas pelo art. 8º da Lei 11.482/2007 no art. 3º da Lei 6.194/1974,\nque ensejaram a redução dos valores das indenizações pagas a título de\nseguro obrigatório por danos pessoais causados por veículos automotores\nde via terrestre (DPVAT). (ARE 704520)","refs":["0771"]},{"id":"rg_2014_0480","tema":"0480","texto":"TEMA 0480: O teto de retribuição estabelecido pela\nEmenda Constitucional 41/03 possui <strong>eficácia imediata,</strong> submetendo às\nreferências de valor máximo nele discriminadas todas as verbas de\nnatureza remuneratória percebidas pelos servidores públicos da União,\nEstados, Distrito Federal e Municípios, <strong>ainda que</strong> adquiridas de\nacordo com regime legal anterior. Os valores que ultrapassam os limites\nestabelecidos para cada nível federativo na Constituição Federal\nconstituem excesso cujo pagamento não pode ser reclamado com amparo na\ngarantia da irredutibilidade de vencimentos. (RE 609381)","refs":["0480"]},{"id":"rg_2014_0522","tema":"0522","texto":"TEMA 0522: A imposição de restrições, por legislação\nlocal, à contagem recíproca do tempo de contribuição na administração\npública e na atividade privada para fins de concessão de aposentadoria\nviola o art. 202, § 2º, da Constituição Federal, com redação anterior à\nEC 20/98. (RE 650851)","refs":["0522"]},{"id":"rg_2014_0494","tema":"0494","texto":"TEMA 0494: A sentença que reconhece ao trabalhador ou\nservidor o direito a determinado percentual de acréscimo remuneratório\n<strong>deixa de ter eficácia</strong> a partir da superveniente incorporação\ndefinitiva do referido percentual nos seus ganhos. (RE 596663)","refs":["0494"]},{"id":"rg_2014_0308","tema":"0308","texto":"TEMA 0308: A Constituição de 1988 comina de nulidade\nas contratações de pessoal pela Administração Pública sem a observância\ndas normas referentes à indispensabilidade da prévia aprovação em\nconcurso público (CF, art. 37, § 2º), **não gerando, essas contratações,\nquaisquer efeitos jurídicos válidos** em relação aos empregados\ncontratados, a não ser o direito à percepção dos salários referentes ao\nperíodo trabalhado e, nos termos do art. 19-A da Lei 8.036/90, ao\nlevantamento dos depósitos efetuados no Fundo de Garantia por Tempo de\nServiço - FGTS. (RE 705140)","refs":["0308"]},{"id":"rg_2014_0652","tema":"0652","texto":"TEMA 0652: É <strong>inconstitucional</strong> a nomeação, pelo\nChefe do Executivo, de membro do Ministério Público especial para\npreenchimento de cargo vago de Conselheiro de Tribunal de Contas local\nquando se tratar de vaga reservada à escolha da Assembleia Legislativa,\ndevendo-se observar a regra constitucional de [divisão\nproporcional] das indicações entre os Poderes Legislativo e\nExecutivo. (RE 717424)","refs":["0652"]},{"id":"rg_2014_0524","tema":"0524","texto":"TEMA 0524: A concessão de aposentadoria de servidor\npúblico por invalidez com proventos integrais <strong>exige</strong> que a doença\nincapacitante esteja prevista em <strong>rol taxativo</strong> da legislação de\nregência. (RE 656860)","refs":["0524"]},{"id":"rg_2014_0156","tema":"0156","texto":"TEMA 0156: I - As vantagens remuneratórias **legítimas\ne de caráter geral** conferidas a determinada categoria, carreira ou,\nindistintamente, a servidores públicos, por serem vantagens genéricas,\nsão <strong>extensíveis</strong> aos servidores inativos e pensionistas;II - Nesses\ncasos, a extensão alcança os servidores que tenham ingressado no serviço\npúblico antes da publicação das Emendas Constitucionais 20/1998 e\n41/2003 e se aposentado ou adquirido o direito à aposentadoria antes da\nEC 41/2003;III - Com relação àqueles servidores que se aposentaram após\na EC 41/2003, deverão ser observados os requisitos estabelecidos na\nregra de transição contida no seu art. 7º, em virtude da extinção da\nparidade integral entre ativos e inativos contida no art. 40, § 8º, da\nCF para os servidores que ingressaram no serviço público após a\npublicação da referida emenda;IV - Por fim, com relação aos servidores\nque ingressaram no serviço público antes da EC 41/2003 e se aposentaram\nou adquiriram o direito à aposentadoria após a sua edição, é necessário\nobservar a incidência das regras de transição fixadas pela EC 47/2005, a\nqual estabeleceu efeitos retroativos à data de vigência da EC 41/2003,\nconforme decidido nos autos do RE 590.260/SP, Plenário, Rel. MIN.\nRICARDO LEWANDOWSKI, julgado em 24/6/2009. (RE 596962)","refs":["0156"]},{"id":"rg_2014_0374","tema":"0374","texto":"TEMA 0374: A regra prevista no § 2º do art. 109 da\nConstituição Federal também se aplica às ações movidas em face de\nautarquias federais. (RE 627709) <strong>(FGV-TRF3-JUIZ/2025)</strong>","refs":["0374"]},{"id":"rg_2014_0755","tema":"0755","texto":"TEMA 0755: É <strong>vedado</strong> o fracionamento da execução\npecuniária contra a Fazenda Pública para que uma parte seja paga antes\ndo trânsito em julgado, por meio de Complemento Positivo, e outra depois\ndo trânsito, mediante Precatório ou Requisição de Pequeno Valor. (ARE\n723307)","refs":["0755"]},{"id":"rg_2014_0748","tema":"0748","texto":"TEMA 0748: É <strong>constitucional</strong> o art. 31 da Lei\n8.880/1994, que prevê indenização adicional equivalente a 50% da última\nremuneração recebida na hipótese de demissão imotivada de empregado\ndurante a vigência da Unidade Real de Valor (URV). (RE 806190)","refs":["0748"]},{"id":"rg_2014_0727","tema":"0727","texto":"TEMA 0727: Compete ao Supremo Tribunal Federal julgar\nmandado de injunção referente à omissão quanto à edição da lei\ncomplementar prevista no art. 40, § 4º, da Constituição de 1988. (RE\n797905)","refs":["0727"]},{"id":"rg_2014_0724","tema":"0724","texto":"TEMA 0724: As promoções dos anistiados se restringem\nao quadro a que pertencia o militar na ativa. (ARE 799908)","refs":["0724"]},{"id":"rg_2014_0722","tema":"0722","texto":"TEMA 0722: Compete à <strong>justiça federal comum</strong>\nprocessar e julgar mandado de segurança quando a autoridade apontada\ncomo <strong>coatora for autoridade federa</strong>l, considerando-se como tal também\nos dirigentes de pessoa jurídica de direito privado investidos de\ndelegação concedida pela União. (RE 726035)","refs":["0722"]},{"id":"rg_2014_0376","tema":"0376","texto":"TEMA 0376: É <strong>constitucional</strong> a regra inserida no\nedital de concurso público, denominada <strong>cláusula de barreira</strong>, com o\nintuito de selecionar apenas os candidatos mais bem classificados para\nprosseguir no certame. (RE 635739)","refs":["0376"]}],"DIREITO ELEITORAL":[{"id":"rg_2014_0678","tema":"0678","texto":"TEMA 0678: A Súmula Vinculante 18 do STF (\"A\ndissolução da sociedade ou do vínculo conjugal, no curso do mandato, não\nafasta a inelegibilidade prevista no § 7º do artigo 14 da Constituição\nFederal\") **não se aplica aos casos de extinção do vínculo conjugal pela\nmorte de um dos cônjuges<strong> (RE 758461). </strong>(FGV/2022) (FGV-SENADO\nFEDERAL-CONSULTOR/2022) (FGV-TJSC-JUIZ/2022)\n(VUNESP-TJSP-JUIZ/2024) (FGV-PREF DE\nVITÓRIA/ES-PROCURADOR/2024)**","refs":["0678"]}],"DIREITO PENAL":[{"id":"rg_2014_0129","tema":"0129","texto":"TEMA 0129: A existência de inquéritos policiais ou de\nações penais sem trânsito em julgado <strong>não pode</strong> ser considerada como\n<strong>maus antecedentes</strong> para fins de dosimetria da pena. (RE 591054)\n(VUNESP-TJSP-JUIZ/2024)","refs":["0129"]},{"id":"rg_2014_0713","tema":"0713","texto":"TEMA 0713: Os crimes de lesão corporal praticados\ncontra a <strong>mulher</strong> no âmbito doméstico e familiar são de **ação penal\npública incondicionada**. (ARE 773765)","refs":["0713"]},{"id":"rg_2014_0712","tema":"0712","texto":"TEMA 0712: As circunstâncias da natureza e da\nquantidade da droga apreendida <strong>devem</strong> ser levadas em consideração\napenas em uma das fases do cálculo da pena. (ARE 666334)","refs":["0712"]}],"DIREITO ADMINISTRATIVO":[{"id":"rg_2014_0664","tema":"0664","texto":"TEMA 0664: O termo inicial do pagamento diferenciado\ndas gratificações de desempenho entre servidores ativos e inativos é o\nda data da homologação do resultado das avaliações, após a conclusão do\nprimeiro ciclo de avaliações, não podendo a Administração retroagir os\nefeitos financeiros a data anterior. (RE 662406)","refs":["0664"]},{"id":"rg_2014_0314","tema":"0314","texto":"TEMA 0314: É <strong>inconstitucional</strong> a exigência de\ndepósito prévio como requisito de admissibilidade de recurso\nadministrativo. (RE 601235)","refs":["0314"]},{"id":"rg_2014_0569","tema":"0569","texto":"TEMA 0569: Os serviços sociais autônomos integrantes\ndo denominado Sistema \\\"S\\\" **não estão submetidos à exigência de\nconcurso público** para contratação de pessoal, nos moldes do art. 37,\nII, da Constituição Federal. (RE 789874)","refs":["0569"]},{"id":"rg_2014_0602","tema":"0602","texto":"TEMA 0602: Os servidores aposentados e pensionistas do\nextinto DNER <strong>fazem jus</strong> aos efeitos financeiros decorrentes do\nenquadramento de servidores ativos que, provindos deste órgão, passaram\na gozar dos benefícios e vantagens resultantes do Plano Especial de\nCargos do DNIT, instituído pela Lei 11.171/2005. (RE 677730)","refs":["0602"]},{"id":"rg_2014_0612","tema":"0612","texto":"TEMA 0612: Nos termos do art. 37, IX, da Constituição\nFederal, para que se considere válida a **contratação temporária de\nservidores públicos**, é preciso que: a) os casos\nexcepcionais <strong>estejam previstos em lei</strong>; b) o\nprazo de contratação seja predeterminado; c)\na necessidade seja temporária; d) o interesse público seja\nexcepcional; e) a contratação seja\nindispensável, sendo <strong>vedada</strong> para os serviços\nordinários permanentes do Estado que estejam sob o espectro das\ncontingências normais da Administração. (RE 658026)\n<strong>(FGV-SES-MT-ADVOGADO/2024)</strong>","refs":["0612"]}],"DIREITO PREVIDENCIÁRIO":[{"id":"rg_2014_0555","tema":"0555","texto":"TEMA 0555: I - O direito à aposentadoria especial\npressupõe a <strong>efetiva exposição</strong> do trabalhador a agente nocivo à sua\nsaúde, de modo que, se o EPI for realmente [capaz de\nneutralizar] a nocividade não haverá respaldo constitucional\nà aposentadoria especial; II - Na hipótese de exposição do trabalhador a\nruído acima dos limites legais de tolerância, a declaração do\nempregador, no âmbito do Perfil Profissiográfico Previdenciário (PPP),\nno sentido da eficácia do Equipamento de Proteção Individual -- EPI, não\ndescaracteriza o tempo de serviço especial para aposentadoria. (ARE\n664335)","refs":["0555"]},{"id":"rg_2014_0344","tema":"0344","texto":"TEMA 0344: <strong>Incide</strong> contribuição previdenciária\nsobre as parcelas pagas a título de participação nos lucros no período\nque antecede a entrada em vigor da Medida Provisória 794/1994, que\nregulamentou o art. 7º, XI, da Constituição Federal de 1988. (RE 569441)","refs":["0344"]},{"id":"rg_2014_0772","tema":"0772","texto":"TEMA 0772: É <strong>vedada</strong> a conversão de tempo de\nserviço especial em comum na função de magistério após a EC 18/1981.\n(ARE 703550)","refs":["0772"]},{"id":"rg_2014_0350","tema":"0350","texto":"TEMA 0350: I - A concessão de benefícios\nprevidenciários <strong>depende de requerimento</strong> do interessado, **não se\ncaracterizando ameaça ou lesão a direito<strong> </strong>antes** de sua\napreciação e indeferimento pelo INSS, **ou se excedido\no prazo legal para sua análise.** É bem de ver, no entanto, que a\nexigência de <strong>prévio requerimento não se confunde com o exaurimento</strong>\ndas vias administrativas;II -- A exigência de <strong>prévio requerimento</strong>\nadministrativo **não deve prevalecer quando o entendimento da\nAdministração for notória e reiteradamente contrário** à postulação do\nsegurado;III -- Na hipótese de pretensão de revisão, restabelecimento ou\nmanutenção de benefício anteriormente concedido, considerando que o INSS\ntem o dever legal de conceder a prestação mais vantajosa possível, o\npedido poderá ser formulado diretamente em juízo -- salvo se depender da\nanálise de matéria de fato ainda não levada ao conhecimento da\nAdministração --, uma vez que, nesses casos, a conduta do INSS já\nconfigura o não acolhimento ao menos tácito da pretensão;IV -- Nas ações\najuizadas antes da conclusão do julgamento do RE 631.240/MG (03/09/2014)\nque não tenham sido instruídas por prova do prévio requerimento\nadministrativo, nas hipóteses em que exigível, será observado o\nseguinte: (a) caso a ação tenha sido ajuizada no âmbito de Juizado\nItinerante, a ausência de anterior pe
